<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Éco-Consultant · Formation en ligne</title>
<style>body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#F2F3EC;color:#141414}#ld{min-height:100vh;display:grid;place-items:center;text-align:center;padding:16px}#ld b{display:block;color:#E56618;font-size:20px;margin-bottom:6px}</style>
</head><body><div id="ld"><div><b>Éco-Consultant</b>Chargement de la formation…</div></div>
<script>
/* Chargeur : le site (figé sur un commit du dépôt) vient de GitHub ; jsDelivr seulement en secours
   (jsDelivr refuse les dépôts de plus de 50 Mo). Nouvelle version = changer SHA puis redéployer ce fichier. */
(function(){
  var SHA='2bb66c00618421bc01534e5743789ae8cc744bb6';
  var RAW='https://raw.githubusercontent.com/peurpeuse/eco-propriete-eco-consultant-module1/'+SHA+'/v3/';
  var CDN='https://cdn.jsdelivr.net/gh/peurpeuse/eco-propriete-eco-consultant-module1@'+SHA+'/v3/';
  var BASE=RAW;
  function one(b,u,n){return fetch(b+u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();}).catch(function(e){if(n>0)return new Promise(function(res){setTimeout(res,1200)}).then(function(){return one(b,u,n-1)});throw e;});}
  function get(u){return one(RAW,u,2).catch(function(){return one(CDN,u,1);});}
  get('index.html').then(function(html){
    var doc=new DOMParser().parseFromString(html,'text/html');
    var b=document.createElement('base');b.href=BASE;document.head.appendChild(b);
    document.title=doc.title;
    [].forEach.call(doc.head.querySelectorAll('style,link'),function(n){document.head.appendChild(document.importNode(n,true));});
    var scripts=[].map.call(doc.querySelectorAll('script[src]'),function(s){return s.getAttribute('src');});
    [].forEach.call(doc.querySelectorAll('script'),function(s){s.remove();});
    document.body.innerHTML=doc.body.innerHTML;
    return scripts.reduce(function(p,src){return p.then(function(){return get(src).then(function(code){var s=document.createElement('script');s.text=code;document.body.appendChild(s);});});},Promise.resolve());
  }).catch(function(){document.getElementById('ld').innerHTML='<div><b>Éco-Consultant</b>Le chargement a échoué. Recharge la page.</div>';});
})();
</script></body></html>
