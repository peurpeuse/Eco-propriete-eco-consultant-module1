<title>Validation Éco-Consultant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Mise en page : une carte à la fois, barre d'actions collée en bas, progression en 39 graduations aux couleurs DPE ; prompteur plein écran */
:root{
  --bg:#F3F7F4; --surface:#FFFFFF; --sunk:#E8F0EB; --line:#D5E2DA;
  --fg:#16241C; --muted:#56675D; --green:#1A7A44; --green-d:#0F5A31; --green-s:#E1F1E7;
  --orange:#E07A00; --orange-s:#FFF0DD; --red:#C62828;
  --prompt-bg:#0D1511; --prompt-fg:#F2F7F4;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1612; --surface:#16211B; --sunk:#1D2A23; --line:#2B3C33;
  --fg:#E6F0EA; --muted:#9DB0A5; --green:#3DBA74; --green-d:#7FD6A3; --green-s:#173527;
  --orange:#FFA347; --orange-s:#3A2814; --red:#FF7A70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1612; --surface:#16211B; --sunk:#1D2A23; --line:#2B3C33;
  --fg:#E6F0EA; --muted:#9DB0A5; --green:#3DBA74; --green-d:#7FD6A3; --green-s:#173527;
  --orange:#FFA347; --orange-s:#3A2814; --red:#FF7A70; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:17px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-direction:column;gap:8px;padding-block:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;color:var(--green-d);letter-spacing:-.01em;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.02em}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.ticks{display:grid;grid-template-columns:repeat(39,1fr);gap:2px;height:10px}
.ticks span{border-radius:2px;background:var(--sunk);cursor:pointer}
.ticks span.on{background:var(--c)}
.ticks span.fix{background:repeating-linear-gradient(45deg,var(--c) 0 3px,transparent 3px 6px)}
.ticks span.cur{outline:2px solid var(--fg);outline-offset:1px}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{color:var(--fg)}
button{font:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.chip:hover{border-color:var(--green)}
.chip.sel{background:var(--green);border-color:var(--green);color:#fff}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
main .wrap{padding-block:20px 190px;display:flex;flex-direction:column;gap:16px}
.banner{border-radius:var(--r);padding:12px 16px;font-size:15px;background:var(--orange-s);border:1px solid var(--line)}
.sess{border-radius:var(--r);padding:10px 16px;font-size:15px;background:var(--green-s);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:20px;border-top:6px solid var(--c,var(--green))}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dpe{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.sec p{margin:0}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pt{display:flex;gap:6px}
.pt button{border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:3px 10px;font-size:14px;font-weight:700}
.pt button.ok.on{background:var(--green);border-color:var(--green);color:#fff}
.pt button.fix.on{background:var(--orange);border-color:var(--orange);color:#fff}
.pnote{width:100%;min-height:60px}
.muted{color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--sunk);color:var(--fg)}
.tag.exp{background:var(--orange-s)}
.tag.mine{background:var(--orange);color:#fff}
ol,ul{margin:0;padding-left:22px}
li{margin:2px 0}
.ed{position:relative;border-radius:8px;padding:4px 6px;margin:-4px -6px}
.ed:hover{background:var(--sunk)}
.ed .eb{border:0;background:none;color:var(--green-d);font-weight:700;font-size:14px;padding:0 0 0 6px;cursor:pointer}
.ed.chg{background:var(--orange-s)}
.ed del{color:var(--muted);display:block;font-size:14px}
.ed .new{display:block}
.ans{color:var(--green-d);font-weight:600;display:block}
details{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
details>summary{cursor:pointer;padding:10px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details>summary::after{content:"＋";color:var(--muted)}
details[open]>summary::after{content:"－"}
details .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:52px 1fr;gap:10px}
.seg .tc{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:14px;padding-top:2px}
.seg .os{font-size:14px;color:var(--muted);margin-top:4px}
.points{background:var(--orange-s);border-color:transparent}
.seg.now{background:var(--green-s);border-radius:8px;box-shadow:0 0 0 6px var(--green-s)}
.tcb{border:0;background:none;font-weight:700;color:var(--green-d);padding:2px 0 0;font-size:14px;font-variant-numeric:tabular-nums;text-align:left}
.vwrap{background:var(--surface);padding-bottom:6px;z-index:2}
.vwrap video{width:100%;aspect-ratio:16/9;border-radius:10px;background:#000;display:block}
@media (min-width:700px){.vwrap{position:sticky;top:118px}.vwrap video{max-width:400px}}
.tag.ok{background:var(--green-s);color:var(--green-d)}
.tag.cf{background:var(--orange);color:#fff}
.alt{border-left:3px solid var(--line);padding:2px 0 2px 8px;margin-top:6px;font-size:15px}
.alt.won{border-color:var(--green);background:var(--green-s)}
.alt .by{font-size:13px;font-weight:700;color:var(--muted);display:block}
.ask{background:var(--sunk);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.ask.forme{outline:2px solid var(--orange)}
.ask .rep{border-left:3px solid var(--green);padding-left:8px}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:3px 10px;font-size:14px;font-weight:600}
.mini.sel{background:var(--green);border-color:var(--green);color:#fff}
.edtools{display:flex;gap:4px 12px;flex-wrap:wrap}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.watch{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--green-d);text-decoration:none;border:2px solid var(--green);border-radius:10px;padding:8px 14px;background:var(--surface)}
.team{display:flex;flex-direction:column;gap:10px}
.who{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.who img{width:32px;height:32px;border-radius:50%}
.st{font-weight:700}
.st.ok{color:var(--green-d)} .st.fix{color:var(--orange)}
.note{white-space:pre-wrap;font-size:15px}
.edl{font-size:14px;border-left:3px solid var(--orange);padding-left:8px;margin-top:4px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.acts{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.big{border-radius:12px;padding:14px 16px;font-weight:700;font-size:17px;border:2px solid transparent}
.yes{background:var(--green);color:#fff}
.yes:hover{background:var(--green-d)}
.no{background:var(--surface);color:var(--fg);border-color:var(--orange)}
.no:hover{background:var(--orange-s)}
.nav{display:flex;justify-content:space-between;gap:8px;align-items:center}
.link{background:none;border:0;color:var(--muted);font-weight:600;padding:4px 2px}
.link:hover{color:var(--fg)}
textarea{width:100%;min-height:90px;font:inherit;font-size:16px;border-radius:10px;border:2px solid var(--orange);padding:10px;background:var(--surface);color:var(--fg);resize:vertical}
.mine{font-size:14px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(112px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:12;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
.drawer{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end}
.drawer .pane{background:var(--surface);width:min(440px,100%);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px 16px;display:flex;flex-direction:column;gap:14px}
.drawer h3{font-family:var(--display);margin:6px 0 0;font-size:16px;display:flex;gap:8px;align-items:center}
.row{display:grid;grid-template-columns:18px 44px 1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:8px;padding:6px;color:var(--fg)}
.row:hover{background:var(--sunk)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.ok{background:var(--green);border-color:var(--green)} .dot.fix{background:var(--orange);border-color:var(--orange)}
.row .n{font-weight:700;font-variant-numeric:tabular-nums}
.row .t{font-size:15px;min-width:0}
.row .k{font-size:13px;color:var(--muted)}
.roles{display:flex;flex-wrap:wrap;gap:8px}
.plan{display:flex;flex-direction:column;gap:6px;padding:0;list-style:none}
.plan li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
/* prompteur */
.prompt{position:fixed;inset:0;z-index:20;background:var(--prompt-bg);color:var(--prompt-fg);display:flex;flex-direction:column}
.prompt .pbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid rgba(255,255,255,.15)}
.prompt .clock{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.prompt .clock small{font-family:var(--body);font-size:14px;opacity:.7;margin-left:8px}
.prompt .pbtn{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--prompt-fg);border-radius:999px;padding:8px 14px;font-weight:700}
.prompt .pbtn.go{background:#2EA56E;border-color:#2EA56E}
.prompt .scroller{flex:1;overflow:hidden;position:relative}
.prompt .roll{position:absolute;left:0;right:0;top:0;padding:40vh max(24px,env(safe-area-inset-right,0px)) 60vh max(24px,env(safe-area-inset-left,0px));max-width:900px;margin:0 auto;font-size:clamp(26px,4.4vw,42px);line-height:1.45;font-weight:600}
.prompt .roll .ptc{font-size:16px;opacity:.55;display:block;margin-top:28px;font-variant-numeric:tabular-nums}
.prompt .guide{position:absolute;left:0;right:0;top:38%;height:3px;background:rgba(46,165,110,.6);pointer-events:none}
.prompt .pfoot{padding:8px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.15)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
/* ---- logos ---- */
.logos{display:flex;align-items:center;gap:10px;color:var(--fg)}
.lg-ep{height:26px;width:auto;display:block}
.lg-ec{height:20px;width:auto;display:block}
.lg-x{color:var(--muted);font-size:13px;font-weight:700}
.lg-ec.d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-ec.l{display:none}:root:not([data-theme="light"]) .lg-ec.d{display:block}}
:root[data-theme="dark"] .lg-ec.l{display:none} :root[data-theme="dark"] .lg-ec.d{display:block}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .ttl{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:700;letter-spacing:.01em}
.ib{display:none}
/* ---- barre d'action compacte, une seule ligne ---- */
.bar .wrap{padding-block:10px;gap:8px}
.row1{display:grid;grid-template-columns:48px 1fr 56px 48px;gap:8px;align-items:stretch}
.sq{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;font-size:20px;font-weight:700;min-height:52px;display:flex;align-items:center;justify-content:center}
.sq:disabled{opacity:.35}
.sq.no{border:2px solid var(--orange)}
.yes{min-height:52px;line-height:1.2}
.yes small{display:block;font-size:13px;font-weight:600;opacity:.9}
main .wrap{padding-block:16px 110px}
.hint{font-size:13px;color:var(--muted);text-align:center}
/* ---- revalidation : seulement ce qui a changé ---- */
.diff{display:flex;flex-direction:column;gap:12px}
.dif{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.dif .where{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dif del{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--red)}
.dif ins{text-decoration:none;background:var(--green-s);border-radius:6px;padding:2px 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.draftmark{font-size:13px;font-weight:700;color:var(--orange)}
/* ---- vidéo flottante quand on fait défiler ---- */
.vwrap{position:static !important;aspect-ratio:16/9;max-width:none}
.vwrap video{max-width:none !important;height:100%;object-fit:contain}
.vwrap.float video{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(118px + env(safe-area-inset-top,0px));bottom:auto;width:min(46vw,300px);height:auto;aspect-ratio:16/9;z-index:8;box-shadow:0 8px 28px rgba(0,0,0,.35);border-radius:10px}
.toast{top:auto;bottom:calc(90px + env(safe-area-inset-bottom,0px))}
/* ---- mise en production ---- */
.prod{border:2px solid var(--green);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--green-s)}
.prod.wait{border-color:var(--line);background:var(--bg)}
.prod h2{display:flex;gap:8px;align-items:center}
.chk{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:15px}
.chk li::before{content:"✓ ";color:var(--green-d);font-weight:700}
.chk li.no::before{content:"• ";color:var(--orange)}
.go{background:var(--green);color:#fff;border:0}
.pstate{font-weight:700}
.tag.prod{background:var(--green);color:#fff}
.chip.go{background:var(--green);border-color:var(--green);color:#fff}
.chip.go:hover{background:var(--green-d)}
/* ---- réinitialisation ---- */
.reset{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.danger{background:var(--surface);color:var(--red);border:2px solid var(--red);border-radius:12px;padding:10px 14px;font-weight:700}
.danger.full{background:var(--red);color:#fff}
.tag.rv{background:var(--orange-s);color:var(--fg)}
.dif .eb{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);color:var(--green-d);font-weight:700;font-size:14px;min-height:40px;cursor:pointer}
/* ---- journal ---- */
.jl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.jl li{border-bottom:1px solid var(--line);padding:8px 2px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.jl .jt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.jl .jw{font-weight:700}
.jl .jx{display:flex;flex-direction:column;gap:2px;font-size:14px;border-left:3px solid var(--line);padding-left:8px}
.jl del{color:var(--muted)} .jl ins{text-decoration:none;background:var(--green-s);border-radius:4px;padding:0 3px}
.jday{font-family:var(--display);font-weight:600;font-size:15px;margin:10px 0 2px;color:var(--muted)}
.jf{display:flex;gap:6px;flex-wrap:wrap}
/* ---- téléphone ---- */
@media (max-width:600px){
  body{font-size:17px}
  header .wrap{padding-block:8px;gap:6px}
  .top{flex-wrap:nowrap;align-items:center;gap:8px}
  .brand{flex:1;min-width:0}
  .brand .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbtns{flex-wrap:nowrap;gap:6px}
  .toast{font-size:15px;padding:8px 14px;border-radius:14px;max-width:min(320px,calc(100% - 32px));text-align:center}
  .lg-ep{height:22px} .lg-ec{height:16px}
  .brand .ttl{font-size:13px}
  .hbtns .chip{padding:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:18px}
  .hbtns .chip .tx{display:none} .ib{display:inline}
  .count{font-size:13px}
  main .wrap{padding-block:12px 100px;gap:12px}
  .card{padding:16px 14px;gap:18px;border-radius:12px}
  h1{font-size:26px}
  .shead{flex-direction:column;align-items:stretch;gap:8px}
  .pt{display:grid;grid-template-columns:1fr 1fr}
  .pt button{min-height:44px;font-size:15px}
  .edtools{gap:6px}
  .lt{display:none}
  .ed .eb,.alt .eb{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);min-height:40px;margin-top:6px;white-space:nowrap}
  .edtools{flex-direction:row;flex-wrap:wrap;align-items:center}
  .vwrap.float video{top:calc(100px + env(safe-area-inset-top,0px))}
  .seg{grid-template-columns:1fr;gap:4px}
  .seg .tc,.tcb{padding:0}
  .tcb{min-height:36px}
  details>summary{padding:12px 14px;min-height:48px;align-items:center}
  .plan li{flex-direction:column;gap:2px}
  .rowbtns>.big,.rowbtns>.chip{flex:1 1 100%;min-height:48px}
  .sess{font-size:14px;padding:8px 12px}
  textarea{font-size:16px}
  .yes small{display:none}
}
</style>

<header><div class="wrap">

          var names = ids.length && user ? user.profiles(ids).then(function (ps) { ids.forEach(function (u) { NAMES[u] = (ps[u] && ps[u].name) || ""; }); }).catch(function () {}) : Promise.resolve();
          if (first) {
            first = false;
            names.then(function () {
              var p = lsGet("evp:" + uid);
              if (p && mine.role && ITEMS[p.idx] && ITEMS[p.idx].id === p.id) {
                open(p.idx); setTimeout(function () { window.scrollTo(0, p.y || 0); }, 60);
                toast("Tu en étais là : " + label(ITEMS[p.idx]));
              } else render();
            });
          }
          else names.then(function () {
            renderTicks();
            if (view !== "item") return;
            var old = $("teamSec"); if (old) old.replaceWith(teamBlock(ITEMS[idx]));
            document.querySelectorAll(".prod").forEach(function (b) { if (b._draw) b._draw(); });
            // met à jour les passages sans toucher à ceux où tu es en train d'écrire
            document.querySelectorAll(".ed").forEach(function (b) { if (b._draw && !b.contains(document.activeElement) && !b.querySelector("textarea")) b._draw(); });
          });
        }, function () { db = null; render(); });
      });
    });
  }
})();
</script>
