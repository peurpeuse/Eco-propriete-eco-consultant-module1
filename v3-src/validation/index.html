<title>Validation Éco-Consultant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Mise en page : une carte à la fois, barre d'actions collée en bas, progression en 39 graduations aux couleurs DPE */
:root{
  --bg:#F3F7F4; --surface:#FFFFFF; --sunk:#E8F0EB; --line:#D5E2DA;
  --fg:#16241C; --muted:#56675D; --green:#1A7A44; --green-d:#0F5A31; --green-s:#E1F1E7;
  --orange:#E07A00; --orange-s:#FFF0DD; --red:#C62828; --red-s:#FCE6E4;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1612; --surface:#16211B; --sunk:#1D2A23; --line:#2B3C33;
  --fg:#E6F0EA; --muted:#9DB0A5; --green:#3DBA74; --green-d:#7FD6A3; --green-s:#173527;
  --orange:#FFA347; --orange-s:#3A2814; --red:#FF7A70; --red-s:#3A1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1612; --surface:#16211B; --sunk:#1D2A23; --line:#2B3C33;
  --fg:#E6F0EA; --muted:#9DB0A5; --green:#3DBA74; --green-d:#7FD6A3; --green-s:#173527;
  --orange:#FFA347; --orange-s:#3A2814; --red:#FF7A70; --red-s:#3A1A18; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:17px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-direction:column;gap:8px;padding-block:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;color:var(--green-d);letter-spacing:-.01em}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.02em}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.ticks{display:grid;grid-template-columns:repeat(39,1fr);gap:2px;height:10px}
.ticks span{border-radius:2px;background:var(--sunk);position:relative;cursor:pointer;border:0;padding:0}
.ticks span.on{background:var(--c)}
.ticks span.fix{background:repeating-linear-gradient(45deg,var(--c) 0 3px,transparent 3px 6px)}
.ticks span.cur{outline:2px solid var(--fg);outline-offset:1px}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{color:var(--fg)}
button{font:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.chip:hover{border-color:var(--green)}
.chip.sel{background:var(--green);border-color:var(--green);color:#fff}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
main .wrap{padding-block:20px 170px;display:flex;flex-direction:column;gap:16px}
.banner{border-radius:var(--r);padding:12px 16px;font-size:15px;background:var(--orange-s);color:var(--fg);border:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:18px;border-top:6px solid var(--c,var(--green))}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dpe{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 6px}
.sec{display:flex;flex-direction:column;gap:6px;min-width:0}
.sec p{margin:0}
.muted{color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--sunk);color:var(--fg)}
.tag.exp{background:var(--orange-s);color:var(--fg)}
.tag.ok{background:var(--green-s)}
ol,ul{margin:0;padding-left:22px}
li{margin:2px 0}
.qa li b{display:block}
.qa .ans{color:var(--green-d);font-weight:600}
details{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
details>summary{cursor:pointer;padding:10px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details>summary::after{content:"＋";color:var(--muted)}
details[open]>summary::after{content:"－"}
details .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:52px 1fr;gap:10px}
.seg .tc{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:14px;padding-top:2px}
.seg .os{font-size:14px;color:var(--muted);margin-top:4px}
.points{background:var(--orange-s);border-color:transparent}
.watch{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--green-d);text-decoration:none;border:2px solid var(--green);border-radius:10px;padding:8px 14px;width:fit-content}
.team{display:flex;flex-direction:column;gap:8px}
.who{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.who img{width:32px;height:32px;border-radius:50%}
.who .st{font-weight:700}
.who .st.ok{color:var(--green-d)} .who .st.fix{color:var(--orange)}
.who .note{white-space:pre-wrap;font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{border-radius:12px;padding:14px 16px;font-weight:700;font-size:17px;border:2px solid transparent}
.yes{background:var(--green);color:#fff}
.yes:hover{background:var(--green-d)}
.no{background:var(--surface);color:var(--fg);border-color:var(--orange)}
.no:hover{background:var(--orange-s)}
.nav{display:flex;justify-content:space-between;gap:8px}
.link{background:none;border:0;color:var(--muted);font-weight:600;padding:4px 2px}
.link:hover{color:var(--fg)}
textarea{width:100%;min-height:90px;font:inherit;font-size:16px;border-radius:10px;border:2px solid var(--orange);padding:10px;background:var(--surface);color:var(--fg);resize:vertical}
.mine{font-size:14px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(112px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:8;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
.drawer{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end}
.drawer .pane{background:var(--surface);width:min(440px,100%);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px 16px;display:flex;flex-direction:column;gap:14px}
.drawer h3{font-family:var(--display);margin:6px 0 0;font-size:16px;display:flex;gap:8px;align-items:center}
.row{display:grid;grid-template-columns:18px 44px 1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:8px;padding:6px;color:var(--fg)}
.row:hover{background:var(--sunk)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.ok{background:var(--green);border-color:var(--green)} .dot.fix{background:var(--orange);border-color:var(--orange)}
.row .n{font-weight:700;font-variant-numeric:tabular-nums}
.row .t{font-size:15px;min-width:0}
.row .k{font-size:13px;color:var(--muted)}
.roles{display:flex;flex-wrap:wrap;gap:8px}
.end{text-align:left}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-width:480px){.card{padding:16px}.big{font-size:16px;padding:12px}}
</style>

<header><div class="wrap">
  <div class="top">
    <div class="brand">Validation de la formation<small>Éco-Consultant · 5 modules, 34 capsules</small></div>
    <div class="hbtns"><button class="chip" id="roleBtn" type="button">Mon rôle</button><button class="chip" id="sumBtn" type="button">Sommaire</button></div>
  </div>
  <div class="ticks" id="ticks" aria-label="Progression"></div>
  <div class="count" id="count">Chargement du contenu…</div>
</div></header>

<main><div class="wrap" id="main">
  <div class="card"><p class="muted">Chargement des modules et des capsules à valider…</p></div>
</div></main>

<div class="bar" id="bar" hidden><div class="wrap">
  <div id="fixBox" hidden>
    <label for="note" class="mine">Qu'est-ce qu'il faut corriger ? (minutage, n° de question, texte exact…)</label>
    <textarea id="note" placeholder="Ex. : 03:25, remplacer « coefficient 2,3 » par « coefficient 2,3 jusqu'au 31/12/2025 ». Source : arrêté du 13/08/2025."></textarea>
  </div>
  <div class="acts" id="acts">
    <button class="big yes" id="yesBtn" type="button">✓ Je valide</button>
    <button class="big no" id="noBtn" type="button">✏️ À corriger</button>
  </div>
  <div class="nav"><button class="link" id="prevBtn" type="button">← Précédent</button><span class="mine" id="mine"></span><button class="link" id="skipBtn" type="button">Passer →</button></div>
</div></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var ROLES = [["DIR", "Décideur"], ["FORM", "Formateur"], ["JUR", "Juriste / notaire"], ["TECH", "Technique bâtiment"], ["FIN", "Financement"], ["VID", "Vidéo"]];
  var ROLE_NAME = {}; ROLES.forEach(function (r) { ROLE_NAME[r[0]] = r[1]; });
  var DATA = null, ITEMS = [], idx = 0;
  var db = null, user = null, uid = null, readOnly = false;
  var mine = { role: "", items: {} };      // mes décisions
  var team = {};                            // uid -> {role, items}
  var writing = Promise.resolve();
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") e.textContent = attrs[k];
      else if (k === "class") e.className = attrs[k];
      else if (k === "style") e.setAttribute("style", attrs[k]);
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function toast(t) { var x = $("toast"); x.textContent = t; x.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { x.classList.remove("show"); }, 1800); }
  function label(it) { return it.kind === "module" ? "Module " + it.mod : "Capsule " + it.id; }
  function myState(id) { var d = mine.items[id]; return d ? d.s : ""; }
  function done() { return ITEMS.filter(function (it) { return myState(it.id); }).length; }
  function nextOpen(from) {
    for (var i = from + 1; i < ITEMS.length; i++) if (!myState(ITEMS[i].id)) return i;
    for (var j = 0; j <= from && j < ITEMS.length; j++) if (!myState(ITEMS[j].id)) return j;
    return -1;
  }

  /* ---------- en-tête : progression ---------- */
  function renderTicks() {
    var t = $("ticks"); t.textContent = "";
    ITEMS.forEach(function (it, i) {
      var s = myState(it.id);
      var b = el("span", { role: "button", tabindex: "0", title: label(it) + " · " + it.title, "aria-label": label(it), style: "--c:" + it.color,
        class: (s === "ok" ? "on" : s === "fix" ? "fix" : "") + (i === idx ? " cur" : "") });
      b.addEventListener("click", function () { go(i); });
      b.addEventListener("keydown", function (e) { if (e.key === "Enter") go(i); });
      t.appendChild(b);
    });
    var n = done(), fix = ITEMS.filter(function (it) { return myState(it.id) === "fix"; }).length;
    var c = $("count"); c.textContent = "";
    c.appendChild(el("b", { text: n + " / " + ITEMS.length }));
    c.appendChild(document.createTextNode(" traités par toi" + (fix ? " · " + fix + " à corriger" : "") + (mine.role ? " · rôle : " + ROLE_NAME[mine.role] : "")));
    $("roleBtn").textContent = mine.role ? ROLE_NAME[mine.role] : "Mon rôle";
  }

  /* ---------- contenu d'un élément ---------- */
  function sec(title, kids, id) { var d = el("div", { class: "sec" }, [el("h2", { text: title })].concat(kids)); if (id) d.id = id; return d; }
  function list(tag, arr) { return el(tag, null, arr.map(function (x) { return el("li", { text: x }); })); }

  function moduleBody(it) {
    return [
      sec("Point de départ → ce que l'apprenant produit", [el("p", { text: it.entry + " → " + it.exit })]),
      sec(it.capsules.length + " capsules", [el("ol", null, it.capsules.map(function (c) {
        return el("li", null, [c[0] + " · " + c[1], c[2] ? el("span", { class: "tag", text: "IA", style: "margin-left:6px" }) : null]); }))]),
      sec("Cas pratique de fin de module", [
        el("p", null, [el("b", { text: it.case.title }), " · " + (it.case.min || "?") + " min"]),
        el("details", null, [el("summary", { text: "Lire l'énoncé et la grille de notation" }), el("div", { class: "in" }, [
          el("p", { text: it.case.brief || "" }),
          el("p", null, [el("b", { text: "Livrable : " }), it.case.deliverable || ""]),
          list("ul", it.case.criteria.map(function (c) { return c[0] + " (" + c[1] + " pts)"; }))])])]),
      sec("Rappels après le module", [list("ul", it.reminders.map(function (r) { return r[0].replace("J", "J+") + " · " + (r[1] || ""); }))])
    ];
  }
  function capsuleBody(it) {
    var k = [];
    k.push(sec("Objectif", [el("p", { text: it.objective })]));
    var vid = [el("p", null, [el("b", { text: "Accroche : " }), it.hook || ""]),
      el("p", { class: "muted", text: it.script.length + " segments · " + it.words + " mots · ≈ " + String(it.min).replace(".", ",") + " min" })];
    if (it.video) vid.push(el("a", { class: "watch", href: DATA.site + "/#c" + it.id.replace(".", "-"), target: "_blank", rel: "noopener", text: "▶ Regarder la vidéo sur le site" }));
    else vid.push(el("p", null, [el("span", { class: "tag", text: "Vidéo pas encore tournée" }), " Tu valides le script : la vidéo sera produite ensuite."]));
    vid.push(el("details", null, [el("summary", { text: "Lire le script complet de Seb" }), el("div", { class: "in" }, it.script.map(function (s) {
      return el("div", { class: "seg" }, [el("div", { class: "tc", text: s[0] }), el("div", null, [el("p", { text: s[1] }), s[2] ? el("p", { class: "os", text: "À l'écran : " + s[2] }) : null])]); }))]));
    k.push(sec("① La vidéo", vid));
    k.push(sec("② Le quiz (" + it.quiz.length + " questions)", [el("details", null, [el("summary", { text: "Voir les questions et les bonnes réponses" }),
      el("div", { class: "in" }, [el("ol", { class: "qa" }, it.quiz.map(function (q) { return el("li", null, [el("b", { text: q[0] }), el("span", { class: "ans", text: "✓ " + q[1] })]); }))])])]));
    k.push(sec("③ La fiche PDF", [el("p", null, [el("b", { text: it.fiche[0] })]), el("p", { class: "muted", text: it.fiche[1].join(" · ") })]));
    k.push(sec("④ L'exercice", [el("p", null, [el("b", { text: it.exo[0] }), " · " + (it.exo[1] || "?") + " min" + (it.ia ? " · avec l'IA" : "")]),
      el("details", null, [el("summary", { text: "Voir la consigne et les étapes" }), el("div", { class: "in" }, [el("p", { text: it.exo[2] }), list("ol", it.exo[3])])])]));
    k.push(sec("⑤ Le livrable", [el("p", null, [el("b", { text: it.livrable[0] }), " · " + it.livrable[1]]), list("ul", it.livrable[2])]));
    if (it.points) k.push(el("details", { class: "points" }, [el("summary", { text: "Points à vérifier par les experts (" + it.experts.join(", ") + ")" }), el("div", { class: "in" }, [el("p", { text: it.points })])]));
    return k;
  }

  function teamBlock(it) {
    var ids = Object.keys(team).filter(function (u) { return team[u].items && team[u].items[it.id]; });
    var box = el("div", { class: "team" });
    if (!ids.length) { box.appendChild(el("p", { class: "muted", text: "Personne n'a encore donné son avis sur cet élément." })); return sec("L'avis de l'équipe", [box], "teamSec"); }
    var draw = function (ps) {
      box.textContent = "";
      ids.forEach(function (u) {
        var d = team[u].items[it.id], p = (ps && ps[u]) || {};
        box.appendChild(el("div", { class: "who" }, [el("img", { src: p.avatarUrl || "", alt: "" }), el("div", null, [
          el("div", null, [el("b", { text: (p.isMe ? "Toi" : (p.name || "Quelqu'un")) }), team[u].role ? " · " + ROLE_NAME[team[u].role] : "", " · ",
            el("span", { class: "st " + d.s, text: d.s === "ok" ? "✓ validé" : "✏️ à corriger" })]),
          d.note ? el("div", { class: "note", text: d.note }) : null])]));
      });
    };
    draw(null);
    if (user) user.profiles(ids).then(draw);
    return sec("L'avis de l'équipe", [box], "teamSec");
  }

  function render() {
    var m = $("main"); m.textContent = "";
    if (!ITEMS.length) return;
    if (!mine.role && uid && !readOnly) { renderRole(); return; }
    if (idx < 0) { renderEnd(); return; }
    var it = ITEMS[idx];
    if (readOnly) m.appendChild(el("div", { class: "banner", text: "Tu peux lire, mais pas valider : demande au propriétaire de te donner l'accès « Contributeur » à cette page." }));
    if (!db) m.appendChild(el("div", { class: "banner", text: "Tes choix ne peuvent pas être enregistrés ici (connexion indisponible). Ouvre la page depuis claude.ai, connecté à ton compte." }));
    var head = [el("div", { class: "kicker" }, [el("span", { class: "dpe" }), "Module " + it.mod + " · " + (idx + 1) + " / " + ITEMS.length,
      it.kind === "capsule" ? el("span", { class: "tags" }, it.experts.map(function (x) { return el("span", { class: "tag exp", text: "Relecture " + x }); })) : el("span", { class: "tag", text: "Vue d'ensemble du module" })]),
      el("h1", { text: (it.kind === "module" ? "" : it.id + " · ") + it.title })];
    var card = el("article", { class: "card", style: "--c:" + it.color }, head.concat(it.kind === "module" ? moduleBody(it) : capsuleBody(it)).concat([teamBlock(it)]));
    m.appendChild(card);
    $("bar").hidden = false;
    var s = myState(it.id);
    $("mine").textContent = s === "ok" ? "✓ Tu as validé" : s === "fix" ? "✏️ Tu as demandé une correction" : "";
    $("fixBox").hidden = true; $("note").value = (mine.items[it.id] && mine.items[it.id].note) || "";
    $("noBtn").textContent = "✏️ À corriger";
    $("yesBtn").disabled = $("noBtn").disabled = readOnly;
    renderTicks();
  }
  function refresh() {
    renderTicks();
    var old = $("teamSec");
    if (old && idx >= 0 && ITEMS[idx]) old.replaceWith(teamBlock(ITEMS[idx]));
  }

  function renderRole() {
    $("bar").hidden = true;
    var roles = el("div", { class: "roles" }, ROLES.map(function (r) {
      return el("button", { class: "chip" + (mine.role === r[0] ? " sel" : ""), type: "button", text: r[1], onclick: function () { setRole(r[0]); } }); }));
    $("main").appendChild(el("article", { class: "card" }, [
      el("div", { class: "kicker", text: "Avant de commencer" }),
      el("h1", { text: "Qui es-tu dans l'équipe ?" }),
      el("p", { text: "Tu vas voir les 5 modules et les 34 capsules, un par un. Pour chacun : « Je valide » ou « À corriger ». Tu passes tout seul au suivant, et tu peux t'arrêter quand tu veux : tu reprendras là où tu en étais." }),
      roles,
      el("p", { class: "muted", text: "Ton rôle s'affiche à côté de tes avis, pour que l'équipe sache qui a validé quoi." })]));
    renderTicks();
  }
  function renderEnd() {
    $("bar").hidden = true;
    var fix = ITEMS.filter(function (it) { return myState(it.id) === "fix"; });
    $("main").appendChild(el("article", { class: "card end" }, [
      el("div", { class: "kicker", text: "Terminé" }),
      el("h1", { text: "Tu as tout passé en revue. Merci !" }),
      el("p", { text: (ITEMS.length - fix.length) + " éléments validés, " + fix.length + " à corriger. Claude lit tes remarques, applique les corrections et lance les vidéos des capsules validées." }),
      fix.length ? sec("Tes demandes de correction", [el("ul", null, fix.map(function (it) {
        return el("li", null, [el("button", { class: "link", type: "button", text: label(it) + " · " + it.title, onclick: function () { go(ITEMS.indexOf(it)); } })]); }))]) : null,
      el("button", { class: "chip", type: "button", text: "Revoir depuis le début", onclick: function () { go(0); } })]));
    renderTicks();
  }

  /* ---------- sommaire ---------- */
  function openSummary() {
    var pane = el("div", { class: "pane", role: "dialog", "aria-label": "Sommaire" });
    var close = function () { d.remove(); };
    var d = el("div", { class: "drawer", onclick: function (e) { if (e.target === d) close(); } }, [pane]);
    pane.appendChild(el("div", { class: "top" }, [el("b", { class: "brand", text: "Sommaire" }), el("button", { class: "chip", type: "button", text: "Fermer", onclick: close })]));
    pane.appendChild(el("div", { class: "legend" }, [el("span", null, [el("i", { style: "background:var(--green)" }), "validé par toi"]), el("span", null, [el("i", { style: "background:var(--orange)" }), "à corriger"]), el("span", null, [el("i", { style: "border:2px solid var(--line)" }), "pas encore vu"])]));
    var cur = 0;
    ITEMS.forEach(function (it, i) {
      if (it.mod !== cur) { cur = it.mod; pane.appendChild(el("h3", { style: "--c:" + it.color }, [el("span", { class: "dpe" }), "Module " + it.mod])); }
      var s = myState(it.id);
      var others = Object.keys(team).filter(function (u) { return u !== uid && team[u].items && team[u].items[it.id]; });
      var nfix = others.filter(function (u) { return team[u].items[it.id].s === "fix"; }).length;
      pane.appendChild(el("button", { class: "row", type: "button", onclick: function () { close(); go(i); } }, [
        el("span", { class: "dot " + s }), el("span", { class: "n", text: it.kind === "module" ? "M" + it.mod : it.id }),
        el("span", { class: "t", text: it.title }),
        el("span", { class: "k", text: others.length ? others.length + " avis" + (nfix ? " · " + nfix + " ✏️" : "") : "" })]));
    });
    document.body.appendChild(d);
  }

  /* ---------- enregistrement ---------- */
  function save() {
    if (!db || !uid) return Promise.resolve();
    var body = JSON.parse(JSON.stringify(mine));
    writing = writing.then(function () { return db.doc("avis/" + uid).set(body); }).catch(function (e) {
      if (e && e.code === "invalid_argument") { readOnly = true; render(); }
      else toast("Enregistrement impossible pour l'instant. Réessaie dans un instant.");
    });
    return writing;
  }
  function decide(s, note) {
    var it = ITEMS[idx];
    mine.items[it.id] = { s: s, note: note || "", at: new Date().toISOString() };
    team[uid || "moi"] = mine;
    save();
    toast((s === "ok" ? "✓ Validé · " : "✏️ Correction notée · ") + label(it));
    go(nextOpen(idx));
  }
  function setRole(r) { mine.role = r; if (uid) team[uid] = mine; save(); render(); }
  function go(i) { idx = i; render(); window.scrollTo(0, 0); }

  $("yesBtn").addEventListener("click", function () { decide("ok"); });
  $("noBtn").addEventListener("click", function () {
    var box = $("fixBox");
    if (box.hidden) { box.hidden = false; $("noBtn").textContent = "Enregistrer et continuer"; $("note").focus(); return; }
    var n = $("note").value.trim();
    if (!n) { $("note").focus(); toast("Écris ce qu'il faut corriger"); return; }
    decide("fix", n);
  });
  $("skipBtn").addEventListener("click", function () { go(Math.min(ITEMS.length - 1, (idx < 0 ? 0 : idx) + 1)); });
  $("prevBtn").addEventListener("click", function () { go(Math.max(0, (idx < 0 ? ITEMS.length : idx) - 1)); });
  $("sumBtn").addEventListener("click", openSummary);
  $("roleBtn").addEventListener("click", function () { if (uid && !readOnly) { $("main").textContent = ""; renderRole(); } });

  /* ---------- démarrage ---------- */
  fetch("data.json").then(function (r) { return r.json(); }).then(function (d) {
    DATA = d; ITEMS = d.items; idx = 0; renderTicks(); render(); connect();
  }).catch(function () { $("main").textContent = ""; $("main").appendChild(el("div", { class: "banner", text: "Le contenu n'a pas pu se charger. Recharge la page." })); });

  function connect() {
    if (!window.claude || !window.claude.use) return;
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (r) {
      db = r[0]; user = r[1];
      if (!user) return;
      return user.id().then(function (id) {
        uid = id;
        if (!db || !uid) { render(); return; }
        user.can("data.write").then(function (w) { if (w === false) { readOnly = true; render(); } });
        var first = true;
        db.collection("avis").onSnapshot(function (snap) {
          var t = {};
          snap.docs.forEach(function (doc) { if (doc.exists) t[doc.id] = doc.data(); });
          if (t[uid] && !snap.metadata.hasPendingWrites) mine = JSON.parse(JSON.stringify(t[uid]));
          if (!mine.items) mine.items = {};
          t[uid] = mine; team = t;
          if (first) { first = false; idx = nextOpen(-1); render(); }
          else refresh();
        }, function () { db = null; render(); });
      });
    });
  }
})();
</script>
