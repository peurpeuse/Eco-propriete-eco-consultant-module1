<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Validation Éco-Consultant</title>
<style>body{margin:0;font:17px system-ui,sans-serif;background:#F3F7F4;color:#16241C;display:flex;min-height:100vh;align-items:center;justify-content:center}</style></head>
<body><p id="ld">Chargement de la page de validation…</p>
<script>
/* Chargeur : la page (figée sur un commit du dépôt) vient de GitHub ; l'API reste sur ce site Vercel.
   Pour publier une nouvelle version : changer SHA puis redéployer ce seul fichier. */
var SHA = "dd9ea92017ad6c9a4fb5a0f9d8e0d0c42ed27537";
var RAW = "https://raw.githubusercontent.com/peurpeuse/eco-propriete-eco-consultant-module1/" + SHA + "/validation-site/";
var CDN = "https://cdn.jsdelivr.net/gh/peurpeuse/eco-propriete-eco-consultant-module1@" + SHA + "/validation-site/";
function get(u) { return fetch(u).then(function (r) { if (!r.ok) throw r.status; return r.text(); }); }
get(RAW + "index.html").catch(function () { return get(CDN + "index.html"); }).then(function (t) {
  t = t.replace("<head>", '<head><base href="' + RAW + '"><script>window.EV_DATA_URL = "' + RAW + 'data.json";<\/script>');
  document.open(); document.write(t); document.close();
}).catch(function () { document.getElementById("ld").textContent = "La page n'a pas pu se charger. Vérifie ta connexion puis recharge."; });
</script></body></html>
