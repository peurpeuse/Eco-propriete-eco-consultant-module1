<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Éco-Consultant · Formation en ligne</title>
<style>
@font-face{font-family:"Lato";src:url(fonts/lato-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Lato";src:url(fonts/lato-400i.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Lato";src:url(fonts/lato-700.woff2) format("woff2");font-weight:700 900;font-style:normal;font-display:swap}
/* Layout : page de cours type plateforme MOOC (bandeau + sections) ; vue d'apprentissage = barre latérale du plan + contenu de l'élément */
:root{
  --g:#1A7A44; --g-d:#0F5A31; --g-l:#2EA56E; --g-s:#E3F2E9; --g-t:#F3FAF6;
  --o:#FF8D16; --o-d:#B85A00; --o-s:#FFF1E0;
  --ink:#1F1F1F; --muted:#5B6560; --line:#E1E5E2; --paper:#FFFFFF; --page:#FFFFFF; --sunk:#F5F7F6;
  --ok:#1F8A4C; --ok-s:#E3F4EA; --ko:#C62828; --ko-s:#FCE6E4; --warn-s:#FFF3D6; --warn:#6B4A00;
  --m1:#E2231A; --m2:#F08A00; --m3:#D9AD00; --m4:#7DB534; --m5:#2FA84F;
  --side:320px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font:16px/1.55 "Lato","Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--g-d)}
:focus-visible{outline:3px solid #1A73E8;outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0 0 .8em}
svg.i{width:18px;height:18px;flex:0 0 auto;vertical-align:middle}
/* Top bar */
.top{position:sticky;top:0;z-index:30;height:60px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top .logo{height:24px;width:auto;cursor:pointer}
.top .ct{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid var(--line);padding-left:14px;color:var(--muted)}
.top .pg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.ring{width:30px;height:30px}
.tb{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.tb:hover{background:var(--sunk)}
@media (max-width:700px){.top .ct,.top .pg span{display:none}}
/* Buttons */
.btn{border:0;border-radius:6px;padding:11px 20px;font-weight:700;display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;font-size:15px}
.btn.p{background:var(--g);color:#fff}.btn.p:hover{background:var(--g-d)}
.btn.s{background:var(--paper);color:var(--g-d);border:1px solid var(--g)}
.btn.s:hover{background:var(--g-t)}
.btn.o{background:var(--o);color:#1A1A1A}
.btn.ghost{background:none;color:var(--g-d);padding:8px 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;background:var(--sunk);white-space:nowrap}
.chip.ia{background:var(--o);color:#1A1A1A}.chip.ok{background:var(--ok-s);color:var(--ok)}.chip.wait{background:var(--warn-s);color:var(--warn)}
.muted{color:var(--muted)}
/* ---------- Landing ---------- */
.hero{background:linear-gradient(120deg,#E9F5EE 0%,#F7FBF8 60%,#FFF4E6 100%);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;padding-top:36px;padding-bottom:36px;align-items:center}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.hero .side{display:none}}
.crumb{font-size:13px;color:var(--muted);margin-bottom:10px}
.hero h1{font-size:clamp(28px,4vw,42px);font-weight:900;margin-bottom:12px}
.hero .lead{font-size:17px;color:#33403A;max-width:62ch}
.inst{display:flex;align-items:center;gap:10px;margin:16px 0 20px;font-size:14.5px}
.inst img{width:40px;height:40px;border-radius:50%;background:var(--o-s)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--paper);margin-top:-1px}
.facts>div{padding:16px 18px;border-right:1px solid var(--line);min-width:0}
.facts>div:last-child{border-right:0}
.facts b{display:block;font-size:17px}
.facts span{font-size:13px;color:var(--muted)}
@media (max-width:760px){.facts{grid-template-columns:1fr 1fr}.facts>div:nth-child(2){border-right:0}.facts>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.side .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 6px 24px rgba(15,90,49,.08)}
.tabsbar{border-bottom:1px solid var(--line);position:sticky;top:60px;background:var(--paper);z-index:20}
.tabsbar .wrap{display:flex;gap:24px;overflow-x:auto}
.tabsbar a{display:block;padding:14px 2px;font-weight:700;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
.tabsbar a.on{color:var(--ink);border-color:var(--g)}
.sec{padding:34px 0;border-bottom:1px solid var(--line)}
.sec h2{font-size:24px;font-weight:900;margin-bottom:16px}
.learn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px;border:1px solid var(--line);border-radius:10px;padding:20px}
@media (max-width:760px){.learn{grid-template-columns:1fr}}
.learn div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.learn svg{color:var(--g)}
.skills{display:flex;flex-wrap:wrap;gap:8px}
.skills span{background:var(--sunk);border-radius:6px;padding:6px 12px;font-size:14px}
.details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:760px){.details{grid-template-columns:1fr 1fr}}
.details div{border:1px solid var(--line);border-radius:10px;padding:14px}
.details b{display:block;margin-bottom:2px}
.mods{display:flex;flex-direction:column;gap:12px}
.mod{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.mod>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px 18px 0}
.mod>summary::-webkit-details-marker{display:none}
.mod .bar6{align-self:stretch;background:var(--mc)}
.mod h3{font-size:19px;font-weight:900}
.mod .meta{font-size:13.5px;color:var(--muted);margin-top:4px}
.mod .chev{transition:transform .2s}
.mod[open] .chev{transform:rotate(180deg)}
.mod .body{padding:0 20px 18px 26px;border-top:1px solid var(--line)}
.mod .io{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
@media (max-width:640px){.mod .io{grid-template-columns:1fr}}
.mod .io div{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px}
.ilist{list-style:none;margin:0;padding:0}
.ilist li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.ilist li .k{font-size:12.5px;color:var(--muted);white-space:nowrap}
.inst2{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:start}
.inst2 img{width:96px;border-radius:50%;background:var(--o-s)}
/* ---------- Learn view ---------- */
.lv{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - 60px)}
.nav{border-right:1px solid var(--line);background:var(--paper);position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.nav .nh{padding:16px 16px 10px;font-size:13px;color:var(--muted)}
.nav .nh b{display:block;color:var(--ink);font-size:15px}
.ng{border-top:1px solid var(--line)}
.ng>button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:12px 14px 12px 0;font-weight:900;font-size:14.5px}
.ng>button:focus-visible{outline:3px solid #1A73E8}
.ng .mbar{align-self:stretch;background:var(--mc)}
.ng .msub{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.ng ul{list-style:none;margin:0;padding:0 0 8px}
.ng .cap{padding:8px 14px 2px 18px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.it{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;width:100%;padding:7px 14px 7px 18px;font-size:14px;line-height:1.35;border-left:4px solid transparent}
.it:hover{background:var(--sunk)}
.it:focus-visible{outline:3px solid #1A73E8;outline-offset:-3px}
.it.on{background:var(--g-t);border-left-color:var(--g);font-weight:700}
.it .st{width:20px;height:20px;border-radius:50%;border:2px solid #B9C2BD;display:grid;place-items:center;margin-top:1px}
.it.done .st{background:var(--g);border-color:var(--g)}
.it.done .st::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it small{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
.it small svg{width:14px;height:14px}
.main{min-width:0;padding:22px clamp(16px,4vw,48px) 60px}
.main .inner{max-width:920px;margin:0 auto}
.bc{font-size:13px;color:var(--muted);margin-bottom:6px}
.bc button{all:unset;cursor:pointer;color:var(--g-d);text-decoration:underline;text-underline-offset:2px}
.ititle{font-size:clamp(22px,2.6vw,30px);font-weight:900;margin:2px 0 6px}
.itype{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:18px;flex-wrap:wrap}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.navtoggle{display:none}
@media (max-width:960px){
  .lv{grid-template-columns:1fr}
  .nav{position:fixed;left:0;top:60px;bottom:0;width:min(88vw,360px);height:auto;z-index:25;transform:translateX(-102%);transition:transform .2s;box-shadow:4px 0 24px rgba(0,0,0,.15)}
  .lv.open .nav{transform:none}
  .navtoggle{display:inline-flex}
}
/* Video */
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:10px;background:#0E2A1B;overflow:hidden;color:#fff;display:grid;place-items:center}
.player img.seb{position:absolute;left:6%;bottom:0;height:82%;border-radius:50% 50% 0 0}
.player .pl{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.92);border:0;display:grid;place-items:center}
.player .pl::after{content:"";border-left:24px solid var(--g-d);border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:6px}
.player .tag{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.55);border-radius:6px;padding:3px 9px;font-size:12.5px}
.player .hook{position:absolute;right:16px;bottom:16px;left:44%;font-size:15px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.player .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)}
.player video{position:absolute;inset:0;width:100%;height:100%;background:#000}
@media (max-width:640px){.player .hook{display:none}}
.ptabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:20px 0 14px}
.ptabs button{all:unset;cursor:pointer;padding:10px 0;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.ptabs button[aria-selected=true]{color:var(--ink);border-color:var(--g)}
.tr .seg{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:8px 0;font-size:15.5px}
.tr .tc{font-variant-numeric:tabular-nums;color:var(--g-d);font-weight:700;font-size:13.5px;padding-top:2px}
.tr .sc{display:block;margin-top:3px;font-size:12.5px;color:var(--muted);font-style:italic}
.tr.noprod .sc{display:none}
/* Quiz */
.qintro{background:var(--sunk);border-radius:10px;padding:14px 16px;margin-bottom:18px;display:flex;gap:18px;flex-wrap:wrap}
.qintro div{font-size:14px}.qintro b{display:block;font-size:16px}
.q{margin-bottom:22px}
.qt{font-weight:700;font-size:17px;margin-bottom:10px}
.qn{color:var(--muted);font-weight:400;font-size:14px;display:block;margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:11px 14px;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--g);background:var(--g-t)}
.opt .dot{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:2px solid #9AA49F;margin-top:2px;display:grid;place-items:center}
.opt[aria-checked=true]{border-color:var(--g);background:var(--g-t)}
.opt[aria-checked=true] .dot{border-color:var(--g)}
.opt[aria-checked=true] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--g)}
.opt.ok{border-color:var(--ok);background:var(--ok-s)}.opt.ko{border-color:var(--ko);background:var(--ko-s)}
.opt[disabled]{cursor:default}
.why{display:block;font-size:14px;margin-top:4px;color:var(--muted)}
.opt.ok .why{color:#14552F}.opt.ko .why{color:#7A1A14}
.fb{margin-top:10px;border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:15px}
.fb.ok{background:var(--ok-s)}.fb.ko{background:var(--ko-s)}
.fb .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px}
.fb.ok .ic{background:var(--ok)}.fb.ko .ic{background:var(--ko)}
.result{border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.big{font-size:44px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.pbar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:var(--ok)}
.pbar.low i{background:var(--ko)}
/* Reading */
.doc{max-width:820px}
.doc .intro{font-size:17px;color:#33403A}
.doc h3{font-size:19px;font-weight:900;margin:24px 0 10px}
.doc ul,.doc ol{margin:0 0 10px;padding-left:22px}
.doc li{margin:5px 0}
.doc ul.ck{list-style:none;padding-left:0}
.doc ul.ck li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:6px}
.doc ul.ck li::before{content:"";width:16px;height:16px;border:2px solid var(--g);border-radius:4px;margin-top:4px}
.tw{overflow-x:auto;margin:8px 0 12px;border:1px solid var(--line);border-radius:8px}
.doc table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:520px}
.doc th{background:var(--sunk);text-align:left;padding:9px 11px;font-size:13px}
.doc td{border-top:1px solid var(--line);padding:9px 11px;vertical-align:top}
.doc .fx{background:var(--sunk);border-radius:8px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap}
.doc .dfoot{margin-top:18px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.fict{display:inline-block;background:var(--warn-s);color:var(--warn);border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:700;margin-bottom:10px}
.dl{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:20px}
.dl .ico{width:42px;height:42px;border-radius:8px;background:var(--ko-s);color:var(--ko);display:grid;place-items:center;font-weight:900;font-size:12px}
/* Exercise */
.box{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.box h3{font-size:16px;margin-bottom:8px}
.ctx{background:var(--sunk);border-radius:10px;padding:14px 16px;margin-bottom:16px}
ol.st{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
ol.st li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
ol.st li::before{content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--g-s);color:var(--g-d);font-weight:900;font-size:13px}
.prompt{background:#13241A;color:#E6F2EA;border-radius:8px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;white-space:pre-wrap;max-height:380px;overflow:auto}
.iab{border:1px solid var(--o);border-radius:10px;padding:16px;background:#FFFAF3;margin-top:16px}
.doclink{border:1px solid var(--g);background:var(--paper);color:var(--g-d);border-radius:6px;padding:1px 8px;font-weight:700;font-size:13px}
.reveal{margin-top:14px;border-left:4px solid var(--g);border-radius:6px;padding:12px 16px;background:var(--g-t);white-space:pre-line}
/* Assignment */
.asg{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
@media (max-width:860px){.asg{grid-template-columns:1fr}}
.asg aside{border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px}
.asg aside dt{color:var(--muted);font-size:12.5px;margin-top:8px}.asg aside dd{margin:0;font-weight:700}
.crit{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.crit label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14.5px}
.crit input{width:18px;height:18px;margin-top:2px;accent-color:var(--g)}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper)}
input[type=file]{max-width:100%}
/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,15,.55);display:grid;place-items:center;padding:16px}
.modal .mbox{background:var(--paper);border-radius:12px;max-width:960px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal .x{float:right}
.preview{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));background:var(--g-d);color:#fff;font-size:12px;border-radius:6px;padding:4px 10px;opacity:.9;pointer-events:none;z-index:40}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
table.res{border-collapse:collapse;width:100%;font-size:14.5px}
table.res td,table.res th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{min-width:44px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;font-weight:700}
.scale button[aria-pressed=true]{border-color:var(--g);background:var(--g-t)}
.att{background:var(--paper);border:1px solid var(--line);outline:6px solid var(--g-s);border-radius:6px;padding:34px;max-width:820px;text-align:center}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid3{grid-template-columns:1fr}}
.dcard{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:14px}
.dcard:hover{border-color:var(--g)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* complements */
.btn.big{padding:13px 24px;font-size:16px}
.incl{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:14.5px}
.incl li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start}.incl svg{color:var(--g)}
.sec h2.mt{margin-top:30px}
.mk{display:block;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.sm{font-size:13.5px}
