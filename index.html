ur écrit. Vous décidez ensuite. »", "delta": 25, "next": "end", "why": ""}, {"text": "« Signez un mandat exclusif aujourd'hui, on verra le reste après. »", "delta": -15, "next": "end", "why": ""}, {"text": "« Je vous rappelle dans un mois pour faire le point. »", "delta": -5, "next": "end", "why": ""}]}}, "ends": [{"min": 80, "no_negative": true, "him": "« Jeudi, c'est parfait. Vous êtes le premier à me parler de ça. »", "verdict": "Rendez-vous obtenu", "feedback": "Vous avez vérifié avant d'affirmer, relié l'étiquette à une méthode écrite et proposé une suite datée. Cet enchaînement (vérifier le DPE, avis de valeur, plan de vente) est détaillé dans la séquence 4."}, {"min": 50, "him": "« Je vais réfléchir. Envoyez-moi quelque chose par écrit. »", "verdict": "Porte entrouverte", "feedback": "Une de vos réponses promettait une classe, un pourcentage ou une signature immédiate : la note est plafonnée à 60. Le bon ordre : 1) partir du DPE et proposer la vérification gratuite, 2) ne jamais annoncer une classe ou un pourcentage, 3) proposer un avis de valeur écrit, 4) fixer une prochaine étape datée."}, {"min": 0, "him": "« Je crois que je vais voir avec une autre agence. »", "verdict": "Occasion manquée", "feedback": "Une de vos réponses promettait une classe, un pourcentage ou une signature immédiate : la note est plafonnée à 60. Le bon ordre : 1) partir du DPE et proposer la vérification gratuite, 2) ne jamais annoncer une classe ou un pourcentage, 3) proposer un avis de valeur écrit, 4) fixer une prochaine étape datée."}]}}, {"type": "two_cols", "eyebrow": "Limites de l'interprétation commerciale", "title": "La réforme est un argument. Pas une promesse", "left_title": "Vous pouvez dire", "left_items": ["« Votre DPE a été calculé avec l'ancien coefficient. Votre étiquette a peut-être changé. »", "« L'attestation actualisée est gratuite sur le site de l'ADEME. On la télécharge ensemble ? »", "« Je tiendrai compte de l'étiquette à jour dans mon avis de valeur écrit. »"], "right_title": "Vous ne dites pas", "right_items": ["« Votre maison passe en E. » Seul le document officiel l'établit.", "« Une classe de plus, c'est 15 % de plus. » L'effet sur le prix dépend du marché local.", "« Mettez classe E dans l'annonce. » L'annonce reprend l'étiquette de l'attestation ou du DPE en vigueur."], "footer_title": "Et les données personnelles ?", "footer_text": "Le numéro ADEME suffit pour télécharger l'attestation. Ne saisissez ni le nom ni l'adresse du propriétaire dans un outil d'IA grand public pour faire ce calcul.", "notes": "Écran limits. Narration : « La réforme vous donne une bonne raison d'appeler et une vraie information à apporter. Elle ne vous autorise pas à annoncer une classe ou un pourcentage de hausse. Parlez de vérification, proposez l'attestation gratuite, et intégrez l'étiquette à jour dans un avis de valeur écrit. »"}, {"type": "recap", "eyebrow": "Synthèse des acquis", "title": "Trois réflexes avant de parler prix", "cards": [{"title": "1 · Repérer", "text": "Logement chauffé à l'électricité + DPE établi avant la date du coefficient en vigueur = étiquette peut-être dépassée."}, {"title": "2 · Orienter", "text": "DPE depuis le 1er juillet 2021 et logement inchangé : attestation ADEME gratuite. DPE plus ancien : nouveau DPE obligatoire ; travaux depuis : nouveau DPE recommandé."}, {"title": "3 · Valoriser", "text": "Intégrer l'étiquette à jour dans un avis de valeur 360° écrit, sans promettre ni classe ni pourcentage."}], "banner_label": "Rappel programmé", "banner_text": "Trois questions de rappel vous seront proposées dans 2 jours, puis dans 7 jours, depuis votre tableau de bord.", "notes": "Écran recap. xAPI scheduled-review « review-u23 » (délais 2 et 7 jours) au premier affichage."}, {"type": "resource", "eyebrow": "Ressource pratique", "title": "Fiche réflexe à garder sur votre téléphone", "items": ["Vérifier l'énergie de chauffage et la date d'établissement du DPE.", "DPE établi avant le 01/07/2021 → nouveau DPE obligatoire avant la vente.", "DPE depuis le 01/07/2021, logement inchangé → attestation actualisée gratuite (observatoire DPE-Audit ADEME, numéro à 13 caractères).", "Travaux réalisés depuis le DPE → nouveau DPE recommandé.", "Calcul de repérage (40 m² et plus) : énergie finale électricité × coefficient (2,3 jusqu'au 31/12/2025 · 1,9 en 2026 · 1,7 dès le 01/01/2027).", "Classe = la moins bonne entre énergie primaire et émissions.", "Ne jamais annoncer une classe ou un pourcentage de hausse avant le document officiel.", "Intégrer l'étiquette à jour dans l'avis de valeur 360° écrit."], "example_title": "Exemple d'utilisation", "example_text": "Avant de rappeler un propriétaire qui a donné son accord, ouvrez la fiche, repérez la date et l'énergie de son DPE, et préparez la phrase : « Vérifions que votre étiquette reflète bien votre maison. »", "pdf_label": "Version PDF aux couleurs Éco-Consultant : onglet Ressources du module", "sources": "Arrêté du 13/08/2025 ; arrêté du 19/08/2026 (NOR VLOL2617030A) ; observatoire DPE-Audit ADEME. À revalider avant chaque session.", "notes": "Écran resource. Titre de la fiche : « FICHE RÉFLEXE — Étiquette d'un logement chauffé à l'électricité ». Bouton « Copier la fiche » (xAPI downloaded « fiche-reflexe-u23 »). Écran suivant de l'unité d'origine (résultat) : score /100 pondéré (vérification 15, analyse 15, calcul 25, classement 25, dialogue 20), seuil 70 ; badge si validé ; sinon « Refaire les activités sous 70 % » (les autres résultats sont conservés). Prochaine unité : 2.4."}, {"type": "divider", "kicker": "Unité 2.4", "title": "Expliquer l'étiquette au vendeur et à l'acheteur", "notes": "Séparateur d'unité 2.4 (9 min). Activités notées : QCM (poids 30) + dialogue ramifié (poids 70). Seuil 70 %."}, {"type": "persona", "eyebrow": "Unité 2.4 · Accroche · Cas fictif", "title": "Un acheteur veut −15 % à cause de l'étiquette", "initials": "JD", "name": "M. Dumas (fictif)", "role": "Acheteur, visite la maison de M. Bernard", "facts": ["Maison de M. Bernard : 112 m², électricité, affichée 260 000 € (fictif)", "Attestation ADEME 2026 : classe E, climat C (suite fictive du cas)", "A reçu l'audit énergétique dès la première visite", "Audit : 1re étape de travaux estimée à 28 000 € (montant fictif)"], "quote": "« Classe E, 28 000 € de travaux : je propose 15 % de moins, c'est le marché. »", "right_paras": ["Vous êtes le mandataire de M. Bernard. L'acheteur, lui, utilise l'étiquette pour négocier : c'est son droit.", "Votre rôle : expliquer l'étiquette et l'audit avec exactitude, à l'un comme à l'autre, sans promettre ni dramatiser."], "question": "Comment ramener la demande de −15 % à des faits vérifiables ?", "notes": "Accroche. Suite fictive du fil rouge : l'attestation 2026 de M. Bernard affiche E (165 × 1,9 = 313,5) ; maison classée E → audit obligatoire depuis le 1/01/2025. Narration : « La maison de M. Bernard est en vente. Son attestation affiche E. M. Dumas a visité, il a reçu l'audit énergétique, et il propose quinze pour cent de moins à cause de l'étiquette. Comment lui répondre sans nier, sans céder et sans promettre ? »"}, {"type": "objectives", "eyebrow": "Unité 2.4 · Objectif opérationnel", "title": "Ce que vous saurez faire", "items": ["Expliquer ce que l'étiquette dit et ne dit pas, au vendeur comme à l'acheteur", "Présenter l'audit énergétique obligatoire à la vente des maisons classées E, F et G", "Présenter des travaux chiffrés et des aides sans les garantir", "Recadrer une demande de baisse fondée sur l'étiquette, sans promettre ni céder"], "side_title": "Votre position", "side_note": "Mandataire du vendeur, exact avec l'acheteur.", "footer": "Vous défendez le vendeur, mais vous devez une information exacte à l'acheteur.", "notes": "Objectifs. Narration : « Dans cette unité, vous apprenez à expliquer l'étiquette des deux côtés de la table, à présenter l'audit, les travaux et les aides sans rien garantir, et à recadrer une négociation fondée sur l'étiquette. » Principe déontologique (proposition pédagogique, à faire relire par le juriste) : loyauté envers le mandant, information exacte de l'acquéreur."}, {"type": "explain", "eyebrow": "Unité 2.4 · Explication", "title": "Ce que l'étiquette dit… et ne dit pas", "paras": ["L'étiquette compare des logements entre eux avec une méthode commune. Elle ne prédit ni les factures du futur occupant ni le prix de vente : c'est une donnée de la valeur, pas la valeur.", "Pour l'acheteur, c'est un levier de négociation légitime : il anticipe des travaux et, s'il veut louer, un calendrier (G interdits depuis 2025, F en 2028, E en 2034 en métropole). Le nier vous décrédibilise.", "Pour le vendeur, c'est un fait à intégrer dès l'avis de valeur, en le comparant aux ventes locales, plutôt qu'une décote forfaitaire subie en négociation."], "cards": [{"value": "Fait", "label": "la classe et ses deux notes"}, {"value": "Coût", "label": "travaux chiffrés par l'audit, puis des devis"}, {"value": "Marché", "label": "ventes comparables du secteur"}], "caption": "Location : Service-Public F16096 (calendrier vérifié le 20/10/2026). Aucune règle ne convertit une classe en pourcentage de prix.", "notes": "Explication. Apparition des 3 cartes avec la narration. Narration : « L'étiquette compare, elle ne prédit pas. Pour l'acheteur, c'est un levier légitime : des travaux à prévoir, et un calendrier d'interdiction à la location. Pour le vendeur, c'est un fait à intégrer dès l'avis de valeur, plutôt qu'une décote subie. Trois mots : le fait, le coût, le marché. »\nSources : Service-Public F16096 (https://www.service-public.gouv.fr/particuliers/vosdroits/F16096) (G interdits à la location depuis le 1/01/2025, F en 2028, E en 2034). Rappel brief : ne pas citer de décote moyenne nationale ; toujours région et année (Notaires, valeur verte)."}, {"type": "timeline", "eyebrow": "Unité 2.4 · Réglementation", "title": "L'audit énergétique obligatoire à la vente", "events": [{"date": "1er avril 2023", "title": "Classes F et G", "text": "Audit obligatoire pour vendre une maison individuelle ou un immeuble en monopropriété classé F ou G."}, {"date": "1er janvier 2025", "title": "Extension à la classe E", "text": "Les maisons et immeubles en monopropriété classés E sont concernés à leur tour. C'est le cas de M. Bernard."}, {"date": "1er janvier 2034", "title": "Extension prévue à D", "text": "L'obligation doit s'étendre aux logements classés D (métropole)."}], "cards": [{"title": "Quand le remettre", "text": "Dès la première visite, puis annexé au DDT avec la promesse ou l'acte. Valable 5 ans. Appartements en copropriété : non concernés."}, {"title": "Ce qu'il contient", "text": "Deux scénarios de travaux, dont un par étapes (1re étape : gain d'au moins 2 classes ; fin : classe B), leurs coûts, l'effet sur les factures et les aides."}], "notes": "Frise. Clic sur chaque date → calque. Narration : « L'audit énergétique est obligatoire pour vendre une maison ou un immeuble en monopropriété classé F ou G depuis avril 2023, E depuis janvier 2025, et D en 2034. Il se remet dès la première visite, il vaut cinq ans, et il propose un parcours de travaux chiffré avec les aides possibles. »\nSources : Service-Public F37110 (https://www.service-public.gouv.fr/particuliers/vosdroits/F37110, vérifié le 14/09/2026) ; INC (https://www.inc-conso.fr/content/lobligation-de-realiser-un-audit-energetique-lors-de-la-vente-de-certaines-maisons) ; CCH art. L. 126-28-1 et L. 271-4 ; décret n° 2022-780. Outre-mer : F et G, puis E au 1/01/2028 (Service-Public F37110)."}, {"type": "steps_key", "eyebrow": "Unité 2.4 · Méthode", "title": "Présenter travaux et aides sans les garantir", "principle": "Vous transmettez des chiffres issus de documents ; vous ne garantissez ni un coût, ni une aide, ni une classe future.", "steps": ["Partez du document : « D'après l'audit remis à la visite… », jamais de mémoire.", "Donnez les coûts comme des estimations, à confirmer par des devis d'artisans.", "Citez les aides comme possibles, sous conditions d'éligibilité, à vérifier avec France Rénov'.", "Ramenez au projet global : prix, travaux, financement, mensualité.", "Tracez par écrit ce que vous avez remis : DPE, attestation, audit."], "key_phrase": "« L'audit estime cette étape à 28 000 €. Faites-la chiffrer et vérifiez vos aides avant d'en tirer un prix. »", "stage_label": "Étape du parcours", "stage_value": "Défauts transformés en budget", "notes": "Méthode. Apparition étape par étape. Montant fictif. France Rénov' = service public d'information sur la rénovation (france-renov.gouv.fr). Ne citer aucun montant ni taux d'aide : règles variables, à vérifier à la date de la vente. Narration : « Cinq gestes : partir du document, parler d'estimations, présenter les aides comme possibles, ramener au projet global, et tracer ce que vous avez remis. »"}, {"type": "two_cols", "eyebrow": "Unité 2.4 · Deux interlocuteurs", "title": "Mêmes faits, deux discours", "left_title": "Au vendeur", "left_items": ["« Les acheteurs verront votre étiquette dès l'annonce : intégrons-la dans le prix plutôt que de la subir. »", "« L'audit sera remis dès la première visite : préparons les réponses aux questions travaux. »", "« Une baisse fondée sur l'étiquette se discute avec des devis, pas avec un pourcentage. »"], "right_title": "À l'acheteur", "right_items": ["« Voici le DPE, l'attestation et l'audit : vous avez tous les éléments. »", "« Les montants de l'audit sont des estimations : faites-les confirmer par des artisans. »", "« Les aides dépendent de votre situation : vérifiez-les avec France Rénov' avant de vous engager. »"], "footer_title": "Une seule vérité", "footer_text": "Vous défendez les intérêts du vendeur, mais vous donnez la même information exacte aux deux parties.", "tone": "neutral", "notes": "Deux colonnes neutres. Clic sur chaque phrase → écoute (narration ElevenLabs, voix SEB). Narration : « Au vendeur, on parle d'anticiper. À l'acheteur, on donne les documents et on renvoie vers les bons interlocuteurs. Mêmes faits, deux discours. »"}, {"type": "qcm", "eyebrow": "Unité 2.4 · Vérification", "title": "La question des aides", "question_label": "Question notée", "question": "M. Dumas : « Avec les aides, les travaux me coûteront combien au final ? » Que répondez-vous ?", "options": ["« Avec les aides, comptez la moitié. C'est garanti. »", "« L'audit liste les aides mobilisables. Leur montant dépend de votre situation : France Rénov' peut le calculer avec vous. »", "« Je ne m'occupe pas des travaux, voyez avec votre banque. »"], "answer": "B", "feedbacks": ["Non. Le montant d'une aide dépend des revenus, du projet et des règles en vigueur. Un pourcentage présenté comme garanti engage votre responsabilité et peut se révéler faux.", "Exact. Vous partez du document remis (l'audit), vous ne garantissez rien, et vous orientez vers le service public compétent.", "Non. Vous n'avez pas à calculer l'aide, mais l'audit est un document que vous avez remis : orientez l'acheteur vers le bon interlocuteur plutôt que d'esquiver."], "notes": "QCM noté, 1 tentative, poids 30 dans l'unité 2.4. Calque feedback avec avatar SEB."}, {"type": "dialogue", "eyebrow": "Unité 2.4 · Simulation · Activité notée", "title": "M. Dumas veut négocier −15 %", "persona_name": "M. Dumas", "opening": "« Classe E, 28 000 € de travaux d'après l'audit. À 260 000 €, je propose 15 % de moins. Sinon, je regarde ailleurs. »", "options": ["« Le DPE n'a pas tant d'importance, les acheteurs ne regardent que l'emplacement. »", "« L'étiquette compte, vous avez raison. Regardons ce que dit l'audit, étape par étape, et ce que représentent 15 % sur ce prix. »", "« D'accord, je transmets −15 % au vendeur, il acceptera sûrement. »"], "tree": "Départ : confiance 40/100. Score = confiance finale / 100 ; plafonné à 60 si un choix négatif. Prix affiché et montants : fictifs.\n[start] M. Dumas : « Classe E, 28 000 € de travaux d'après l'audit. À 260 000 €, je propose 15 % de moins. Sinon, je regarde ailleurs. »\nA « Le DPE n'a pas tant d'importance, les acheteurs ne regardent que l'emplacement. » −15 → nier (vous niez un levier légitime)\nB « L'étiquette compte, vous avez raison. Regardons ce que dit l'audit, étape par étape, et ce que représentent 15 % sur ce prix. » +20 → faits\nC « D'accord, je transmets −15 % au vendeur, il acceptera sûrement. » −20 → céder (vous préjugez de la décision du vendeur)\n[faits] « 15 %, c'est ce que tout le monde dit pour une classe E. »\nA « 15 % de 260 000 €, c'est 39 000 €, plus que les 28 000 € estimés par l'audit pour la 1re étape. Parlons des travaux, chiffres à l'appui. » +20 → devis\nB « Une classe E, c'est −15 %, c'est la règle. » −15 → céder (aucune règle ne fixe ce lien)\nC « Et puis avec la réforme 2027, elle passera en D. » −20 → promesse (165 × 1,7 = 280,5 : toujours E)\n[nier] « Donc l'audit ne sert à rien ? »\nA « Je me suis mal exprimé : l'étiquette compte. Regardons l'audit ensemble. » +10 → faits\nB « C'est surtout de la paperasse. » −15 → fin\n[céder] « Parfait, je fais l'offre à −15 % dès ce soir. »\nA « Avant, regardons l'audit : votre offre sera plus solide avec des chiffres. Je la transmettrai, quelle qu'elle soit. » +10 → faits\nB « Très bien, je préviens M. Bernard que c'est réglé. » −10 → fin\n[promesse] « En D ? Vous me l'écrivez ? »\nA « Non, je me suis avancé : avec le coefficient 2027, le calcul donne toujours E. Restons sur l'audit. » +5 → devis\nB « Oui, c'est quasi certain. » −25 → fin\n[devis] « Et si les devis sont plus chers que l'audit ? »\nA « Faites chiffrer par deux artisans et vérifiez vos aides avec France Rénov'. Je transmets votre offre écrite au vendeur avec les devis : c'est lui qui décide. » +20 → fin\nB « Les aides couvriront la différence, ne vous inquiétez pas. » −15 → fin\nC « Les devis sont toujours moins chers que l'audit. » −10 → fin\nVerdicts : ≥ 80 sans choix négatif = « Je fais chiffrer et je vous envoie une offre écrite avec les devis. » (négociation recadrée) ; ≥ 50 = « Je vais réfléchir à mon offre. » (à suivre) ; < 50 = « Je vais voir d'autres maisons. » (acheteur perdu ou vendeur desservi).", "notes": "Dialogue ramifié noté, poids 70 dans l'unité 2.4. Jauge de confiance (départ 40, bornée 0-100) ; commentaire affiché sous chaque réponse. Bouton « Rejouer (non noté) ». Feedback SEB : réussite = « Vous avez reconnu le levier, comparé le pourcentage aux chiffres de l'audit, renvoyé vers des devis et transmis l'offre au vendeur. » ; sinon : « Le bon ordre : 1) reconnaître que l'étiquette compte, 2) revenir aux chiffres de l'audit, 3) ne promettre ni classe ni aide, 4) transmettre toute offre écrite au vendeur, qui décide. » Montants et prix fictifs.", "graph": {"start": "start", "initial": 40, "nodes": {"start": {"him": "« Classe E, 28 000 € de travaux d'après l'audit. À 260 000 €, je propose 15 % de moins. Sinon, je regarde ailleurs. »", "opts": [{"text": "« Le DPE n'a pas tant d'importance, les acheteurs ne regardent que l'emplacement. »", "delta": -15, "next": "nier", "why": "Vous niez un levier légitime."}, {"text": "« L'étiquette compte, vous avez raison. Regardons ce que dit l'audit, étape par étape, et ce que représentent 15 % sur ce prix. »", "delta": 20, "next": "faits", "why": "Vous reconnaissez le levier et revenez aux chiffres de l'audit."}, {"text": "« D'accord, je transmets −15 % au vendeur, il acceptera sûrement. »", "delta": -20, "next": "ceder", "why": "Vous préjugez de la décision du vendeur."}]}, "faits": {"him": "« 15 %, c'est ce que tout le monde dit pour une classe E. »", "opts": [{"text": "« 15 % de 260 000 €, c'est 39 000 €, plus que les 28 000 € estimés par l'audit pour la 1re étape. Parlons des travaux, chiffres à l'appui. »", "delta": 20, "next": "devis", "why": ""}, {"text": "« Une classe E, c'est −15 %, c'est la règle. »", "delta": -15, "next": "ceder2", "why": "Aucune règle ne fixe ce lien."}, {"text": "« Et puis avec la réforme 2027, elle passera en D. »", "delta": -20, "next": "promesse", "why": "165 × 1,7 = 280,5 : toujours E."}]}, "nier ffre écrite avec les devis. »", "verdict": "Négociation recadrée", "feedback": "Vous avez reconnu le levier, comparé le pourcentage aux chiffres de l'audit, renvoyé vers des devis et transmis l'offre au vendeur."}, {"min": 50, "him": "« Je vais réfléchir à mon offre. »", "verdict": "À suivre", "feedback": "Le bon ordre : 1) reconnaître que l'étiquette compte, 2) revenir aux chiffres de l'audit, 3) ne promettre ni classe ni aide, 4) transmettre toute offre écrite au vendeur, qui décide."}, {"min": 0, "him": "« Je vais voir d'autres maisons. »", "verdict": "Acheteur perdu ou vendeur desservi", "feedback": "Le bon ordre : 1) reconnaître que l'étiquette compte, 2) revenir aux chiffres de l'audit, 3) ne promettre ni classe ni aide, 4) transmettre toute offre écrite au vendeur, qui décide."}]}}, {"type": "two_cols", "eyebrow": "Unité 2.4 · Limites", "title": "Argumenter sans promettre", "left_title": "Vous pouvez dire", "left_items": ["« L'audit estime cette étape à 28 000 € : faisons-la chiffrer. »", "« Des aides existent ; leur montant dépend de votre situation. »", "« Je transmets votre offre écrite au vendeur, avec vos justificatifs. »"], "right_title": "Vous ne dites pas", "right_items": ["« Une classe E, c'est −15 %. » Aucune règle ne fixe ce lien.", "« Les aides couvriront tout. » Vous ne pouvez pas le garantir.", "« Elle passera en D. » Seul un DPE ou une attestation l'établit."], "footer_title": "Rappel conformité", "footer_text": "Votre mandat vous oblige à rendre compte au vendeur : transmettez chaque offre écrite, même basse. C'est lui qui décide.", "notes": "Limites. Narration : « Vous pouvez citer l'audit, parler d'aides possibles et transmettre l'offre. Vous ne promettez ni pourcentage, ni aide, ni classe future. » [À VALIDER] relecture juridique de la formulation « obligation de transmettre chaque offre » (devoir de rendre compte du mandataire)."}, {"type": "recap", "eyebrow": "Unité 2.4 · Synthèse", "title": "Expliquer sans promettre", "cards": [{"title": "Reconnaître", "text": "L'étiquette est un levier légitime pour l'acheteur. La nier vous décrédibilise ; la dramatiser dessert votre vendeur."}, {"title": "Chiffrer", "text": "Maisons E, F, G : audit dès la 1re visite. Coûts en estimation, à confirmer par devis ; aides possibles, jamais garanties."}, {"title": "Ramener aux faits", "text": "Remplacez le pourcentage forfaitaire par une comparaison : coût des travaux, ventes comparables, offre écrite transmise au vendeur."}], "banner_label": "Et M. Bernard ?", "banner_text": "Vous lui transmettez l'offre de M. Dumas avec l'audit et les ventes comparables : il décide en connaissance de cause.", "notes": "Synthèse unité 2.4. Rappel espacé J+2."}, {"type": "divider", "kicker": "Unité 2.5", "title": "Cas concrets : quatre dossiers", "notes": "Séparateur d'unité 2.5 (7 min). Activité notée = bilan de séquence : dossier 1 (QCM, poids 20), dossier 2 (cas, poids 20), dossier 3 (QCM, poids 20), dossier 4 (document, poids 20), discours (classement, poids 20). Seuil 70 % pour débloquer la séquence 3."}, {"type": "objectives", "eyebrow": "Unité 2.5 · Bilan de séquence", "title": "Quatre dossiers, une méthode", "intro_label": "Activité notée : pour chaque dossier", "items": ["Dossier 1 · Mme Roux : un appartement classé F à cause du gaz", "Dossier 2 · M. Petit : un studio et un vieux DPE", "Dossier 3 · M. Lambert : une maison au fioul et un audit refusé", "Dossier 4 · M. Bernard : l'annonce à corriger avant publication"], "stats": [{"value": "70 %", "label": "seuil pour débloquer la séquence 3"}, {"value": "1", "label": "tentative par dossier"}], "side_title": "Règles de l'activité", "footer": "Tous les cas et montants sont fictifs.", "notes": "Consignes. Narration : « Quatre dossiers. Pour chacun : la bonne démarche, puis le bon discours. Une seule tentative par dossier. Il vous faut soixante-dix pour cent pour passer à la séquence 3. »"}, {"type": "table", "eyebrow": "Unité 2.5 · Les dossiers", "title": "Les quatre dossiers du jour", "headers": ["Dossier", "Bien", "DPE", "Ce que veut le vendeur"], "rows": [["1 · Mme Roux", "T3 de 62 m², gaz, en copropriété", "Mai 2024 · énergie E, climat F → F", "« Avec la réforme, je passe en E ? »"], ["2 · M. Petit", "Studio de 22 m², électricité", "Juin 2020 · classe G", "« Mon DPE est valable jusqu'en 2030, on publie. »"], ["3 · M. Lambert", "Maison de 120 m², fioul", "Nouveau DPE 2026 · classe F", "« Pas d'audit : l'acheteur fera le sien. »"], ["4 · M. Bernard", "Maison de 112 m², électricité", "Attestation 2026 · énergie E, climat C", "« Faites vérifier l'annonce avant publication. »"]], "intro": "Lisez les quatre dossiers. Pour chacun, posez-vous deux questions : quelle démarche ? quel discours ?", "caption": "Cas fictifs construits à partir des unités 2.1 à 2.4.", "notes": "Tableau d'ouverture, non noté. Bouton « Commencer par le dossier 1 ». Narration : « Voici vos quatre dossiers. Mme Roux, M. Petit, M. Lambert, et M. Bernard. »"}, {"type": "qcm", "eyebrow": "Unité 2.5 · Dossier 1 · Noté", "title": "Mme Roux espère passer en E", "question_label": "Dossier 1", "question": "Mme Roux : « Avec la réforme de l'électricité, mon appartement au gaz passe en E, non ? » Quelle démarche et quel discours ?", "options": ["« Oui : téléchargez l'attestation ADEME, elle affichera E. »", "« Non : votre classe vient des émissions du gaz. On affiche F avec la mention obligatoire, et on chiffre les pistes de travaux sans promettre de classe. »", "« Non, mais il faut un audit énergétique avant toute visite. »", "« Refaisons un DPE chez un autre diagnostiqueur pour obtenir D. »"], "answer": "B", "feedbacks": ["Non. Le coefficient ne concerne que l'électricité. Sa classe F vient des émissions (73 kg CO₂), que la réforme ne change pas.", "Exact. La note climat F décide. L'annonce affiche F avec « logement à consommation énergétique excessive ». En copropriété, pas d'audit obligatoire : des pistes chiffrées par un professionnel aident l'acheteur à se projeter.", "Non. L'audit obligatoire à la vente vise les maisons et les immeubles en monopropriété. Un appartement en copropriété n'est pas concerné.", "Non. Un DPE de 2024 est valable. Changer de diagnostiqueur pour « obtenir » une classe est à proscrire : le résultat dépend du logement."], "notes": "QCM noté, 1 tentative, poids 20 dans l'unité 2.5. Sources : Service-Public F37110 (https://www.service-public.gouv.fr/particuliers/vosdroits/F37110, vérifié le 14/09/2026) ; INC (https://www.inc-conso.fr/content/lobligation-de-realiser-un-audit-energetique-lors-de-la-vente-de-certaines-maisons) ; CCH art. L. 126-28-1 et L. 271-4 ; décret n° 2022-780 ; Service-Public F32061 (https://www.service-public.gouv.fr/particuliers/vosdroits/F32061) ; CCH art. R. 126-21 à R. 126-25"}, {"type": "case_form", "eyebrow": "Unité 2.5 · Dossier 2 · Noté", "title": "Le studio de M. Petit", "case_title": "M. Petit (cas fictif)", "case_paras": ["M. Petit vend un studio de 22 m² chauffé à l'électricité. Son DPE, établi en juin 2020, le classe G.", "Il veut publier l'annonce cette semaine : « Mon DPE est valable jusqu'en 2030, c'est écrit dessus. »", "Choisissez vos trois réponses dans les listes."], "inputs": ["1. Ce DPE est-il valable ? (oui / non, avec le motif)", "2. Quelle démarche avant l'annonce ? (attestation ADEME / nouveau DPE / aucune)", "3. Que dire sur la classe à venir ? (« au moins E » / « on attend le résultat » / « toujours G »)"], "answer": "1) Non : les DPE établis du 1/01/2018 au 30/06/2021 ne sont plus valables depuis le 1/01/2025. 2) Nouveau DPE par un diagnostiqueur certifié avant toute annonce (attestation impossible). 3) « On attend le résultat » : le nouveau DPE appliquera le coefficient en vigueur et les seuils des moins de 40 m².", "feedbacks": ["« Oui, valable jusqu'en 2030 » : la date de fin imprimée ne compte plus. La validité de ces DPE a pris fin le 1er janvier 2025.", "« Attestation ADEME » : impossible, elle ne concerne que les DPE établis depuis le 1er juillet 2021.", "« Aucune démarche » : sans DPE valable, l'annonce ne peut pas afficher les mentions obligatoires.", "« Au moins E » : rien ne le garantit. Le coefficient et les seuils des petites surfaces jouent en sa faveur, mais seul le nouveau DPE établira la classe.", "« Toujours G » : rien ne permet de l'affirmer. Ne promettez ni amélioration ni statu quo : attendez le DPE.", "Trois bonnes réponses : vous avez vérifié la date avant la classe, et vous n'avez rien promis."], "button": "Valider le dossier", "notes": "Cas noté, 1 tentative, poids 20 dans l'unité 2.5. Trois listes déroulantes (options indiquées dans les libellés) ; score = bonnes réponses / 3. Sources : Service-Public F16096 (https://www.service-public.gouv.fr/particuliers/vosdroits/F16096)"}, {"type": "qcm", "eyebrow": "Unité 2.5 · Dossier 3 · Noté", "title": "M. Lambert refuse l'audit", "question_label": "Dossier 3", "question": "M. Lambert a fait refaire son DPE : maison au fioul classée F. Il refuse l'audit énergétique : « L'acheteur fera le sien. » Que lui répondez-vous ?", "options": ["« D'accord, on le précisera dans l'annonce. »", "« L'audit est obligatoire pour vendre une maison classée F. Il doit être remis dès la première visite : programmons-le avant les visites. »", "« Il suffit de le fournir chez le notaire, à la signature de l'acte. »", "« Faites quelques travaux pour passer en E : l'audit ne sera plus nécessaire. »"], "answer": "B", "feedbacks": ["Non. Pour une maison classée F, l'audit est obligatoire depuis le 1er avril 2023. Le mentionner dans l'annonce ne dispense pas de le réaliser.", "Exact. Il est à la charge du vendeur, valable 5 ans, et il donne à l'acheteur un parcours de travaux chiffré : mieux vaut que ce soit vous qui le présentiez.", "Non. L'audit doit être remis dès la première visite, puis annexé à la promesse ou, à défaut, à l'acte. Attendre la signature prive l'acheteur d'une information due.", "Non. Depuis le 1er janvier 2025, les maisons classées E sont aussi concernées. Et on ne décide pas des travaux pour contourner une obligation."], "notes": "QCM noté, 1 tentative, poids 20 dans l'unité 2.5. Sources : Service-Public F37110 (https://www.service-public.gouv.fr/particuliers/vosdroits/F37110, vérifié le 14/09/2026) ; INC (https://www.inc-conso.fr/content/lobligation-de-realiser-un-audit-energetique-lors-de-la-vente-de-certaines-maisons) ; CCH art. L. 126-28-1 et L. 271-4 ; décret n° 2022-780"}, {"type": "document", "eyebrow": "Unité 2.5 · Dossier 4 · Noté · Document fictif", "title": "Corrigez l'annonce de M. Bernard", "doc_title": "Projet d'annonce · Maison 112 m² · M. Bernard (fictif)", "fields": [{"label": "Accroche :", "value": "« Maison rénovée, bientôt classe C ! »", "useful": true, "feedback": "À corriger. Promesse de classe sans fondement : seule l'étiquette officielle peut être annoncée. Une telle accroche peut constituer une information trompeuse."}, {"label": "Prix :", "value": "260 000 €, honoraires à la charge du vendeur", "useful": false, "feedback": "Conforme dans ce projet : rien à corriger ici."}, {"label": "Chauffage :", "value": "électrique (convecteurs + PAC séjour)", "useful": false, "feedback": "Conforme : information exacte, reprise du DPE."}, {"label": "Classe énergie :", "value": "D (réforme 2027)", "useful": true, "feedback": "À corriger. L'annonce affiche l'étiquette officielle : E (attestation 2026). Même en 2027, 165 × 1,7 = 280,5 kWh/m²/an : toujours E."}, {"label": "Classe climat :", "value": "non renseignée", "useful": true, "feedback": "À corriger. La classe climat est obligatoire : ici C (13 kg CO₂/m²/an)."}, {"label": "Dépenses annuelles :", "value": "« nous consulter »", "useful": true, "feedback": "À corriger. Le montant estimé des dépenses annuelles d'énergie pour un usage standard doit figurer, avec l'année de référence des prix."}, {"label": "Audit énergétique :", "value": "« remis à la signature »", "useful": true, "feedback": "À corriger. Maison classée E : audit obligatoire depuis le 1er janvier 2025, à remettre dès la première visite."}, {"label": "Surface :", "value": "112 m² · 5 pièces", "useful": false, "feedback": "Conforme : rien à corriger ici."}], "instruction": "Ce projet d'annonce a été rédigé par un collègue. Cliquez sur les 5 éléments à corriger avant publication. Un clic sur un élément conforme compte comme une erreur.", "side_note": "Rappel : attestation 2026 = énergie E (313,5 kWh/m²/an), climat C.", "counter": "À corriger : 0 / 5", "notes": "Analyse documentaire notée, poids 20 dans l'unité 2.5. Score = max(0 ; 1 − 0,2 × erreurs). Prix fictif (aucune valeur réelle). Sources : Service-Public F32061 (https://www.service-public.gouv.fr/particuliers/vosdroits/F32061) ; CCH art. R. 126-21 à R. 126-25 ; Service-Public F37110 (https://www.service-public.gouv.fr/particuliers/vosdroits/F37110, vérifié le 14/09/2026) ; INC (https://www.inc-conso.fr/content/lobligation-de-realiser-un-audit-energetique-lors-de-la-vente-de-certaines-maisons) ; CCH art. L. 126-28-1 et L. 271-4 ; décret n° 2022-780"}, {"type": "sort", "eyebrow": "Unité 2.5 · Le bon discours · Noté", "title": "Le bon discours, dossier par dossier", "items": ["Mme Roux : « Votre classe vient du gaz ; changer de chauffage est la piste à chiffrer. »", "M. Petit : « Avec le nouveau DPE, vous serez au moins en E. »", "M. Petit : « Votre DPE de 2020 reste valable jusqu'en 2030. »", "M. Lambert : « L'audit sera remis dès la première visite : c'est vous qui présenterez les travaux. »", "À M. Dumas : « Les aides couvriront vos 28 000 € de travaux. »", "À M. Bernard : « Une classe E, c'est −15 % : c'est mécanique. »"], "categories": ["Conforme et utile", "Promesse à éviter", "Information inexacte"], "answers": [0, 1, 2, 0, 1, 2], "whys": ["Conforme : vous expliquez la note qui décide et orientez vers un chiffrage, sans promettre de classe.", "Promesse : rien ne le garantit. Seul le nouveau DPE établira la classe.", "Inexact : les DPE de 2018 à juin 2021 ne sont plus valables depuis le 1er janvier 2025.", "Conforme : vous rappelez l'obligation et faites de l'audit un outil de vente.", "Promesse : le montant des aides dépend de la situation de l'acheteur. Vous ne pouvez pas le garantir.", "Inexact : aucune règle ne convertit une classe en pourcentage de prix ; l'effet dépend du marché local."], "notes": "Classement noté, 1 tentative, poids 20 dans l'unité 2.5. Score = bonnes / 6."}, {"type": "recap", "eyebrow": "Unité 2.5 · Synthèse de la séquence", "title": "Votre méthode DPE en trois temps", "cards": [{"title": "Dater", "text": "Avant toute classe, la date : avant le 1/07/2021, nouveau DPE ; depuis, attestation ADEME si le logement est inchangé (utile surtout en électrique)."}, {"title": "Lire", "text": "Deux notes, la moins bonne l'emporte. Repérez celle qui décide : elle oriente les travaux et votre discours."}, {"title": "Afficher, remettre", "text": "Annonce : deux classes, dépenses estimées, mention F-G. Maisons E, F, G : audit dès la 1re visite. Jamais de classe ni de % promis."}], "banner_label": "Prochaine séquence", "banner_text": "Séquence 3 : prospecter dans le respect du consentement, avec M. Bernard toujours en fil rouge.", "notes": "Synthèse de séquence. Rappel espacé J+2 et J+7 (5 questions, une par unité)."}, {"type": "bilan", "title": "Séquence validée", "text": "Vous savez vérifier, lire et expliquer un DPE sans rien promettre. Rendez-vous en séquence 3.", "notes": "Bilan de séquence. Score séquence = moyenne des unités pondérée par leur durée (2.1 : 8, 2.2 : 8, 2.3 : 18, 2.4 : 9, 2.5 : 7). Seuil 70 % : déblocage de la séquence 3. En dessous : renvoi vers les unités < 70 %. xAPI passed/failed + completed « M1-S2 ». Narration : « Séquence validée. Vous savez vérifier, lire et expliquer un DPE sans rien promettre. »", "badge": "Expert|DPE"}, {"type": "divider", "kicker": "Séquence 3", "title": "Prospecter dans un cadre conforme", "notes": "Écran d'ouverture de la séquence 3 (45 min). Déblocage : 70 % à la séquence 2. Bouton Commencer → unité 3.1. Narration : « Depuis le 11 août 2026, on ne prospecte plus comme avant. Dans cette séquence, vous apprenez à contacter un propriétaire en restant dans les règles : consentement, canaux, RGPD et mandat. »"}, {"type": "divider", "kicker": "Unité 3.1", "title": "Fin de Bloctel, place à l'accord préalable", "notes": "Séparateur unité 3.1 (≈ 7 min). Pas d'interaction. Transition automatique après 2 s ou bouton Suivant. RELECTURE JURIDIQUE OBLIGATOIRE avant publication (juriste ou avocat en droit de la consommation / immobilier)."}, {"type": "persona", "eyebrow": "Unité 3.1 · Accroche", "title": "Lundi matin, votre fichier de 300 propriétaires", "initials": "MP", "name": "M. Petit (fictif)", "role": "Négociateur, agence de quartier", "facts": ["Fichier de 300 propriétaires constitué en 2024", "Numéros relevés sur des annonces et dans l'annuaire", "Habitué à appeler le lundi de 10 h à 12 h", "N'a jamais recueilli d'accord écrit"], "quote": "« Je vérifiais Bloctel avant d'appeler. Je suis tranquille, non ? »", "right_paras": ["Personnage fictif. Jusqu'au 10 août 2026, il suffisait d'écarter les numéros inscrits sur Bloctel.", "Depuis le 11 août 2026, la logique est inversée : sans accord préalable, pas d'appel."], "question": "Combien de numéros de son fichier M. Petit peut-il encore appeler à froid ?", "notes": "Accroche. Calque « Réponse » au clic sur Suivant : « Aucun, sauf ceux qui ont donné un accord préalable valable ou avec qui il a un contrat en cours. » Narration : « M. Petit pense être en règle. Il ne l'est plus. » Sources : loi n° 2025-594 du 30/06/2025 ; décret n° 2026-662 du 23/07/2026 ; economie.gouv.fr/entreprises/bloctel-professionnels-reglementation ; anil.org. RELECTURE JURIDIQUE OBLIGATOIRE avant publication (juriste ou avocat en droit de la consommation / immobilier)."}, {"type": "objectives", "eyebrow": "Unité 3.1 · Objectif", "title": "Ce que vous saurez faire", "items": ["Situer les trois dates de la réforme du démarchage téléphonique", "Expliquer la différence entre opposition (Bloctel) et accord préalable", "Citer les sanctions encourues par l'agent et l'agence", "Identifier l'exception utile pour un agent : le contrat en cours"], "stats": [{"value": "11/08/2026", "label": "entrée en vigueur du consentement préalable"}, {"value": "375 000 €", "label": "amende maximale pour une personne morale"}], "footer": "Sources : loi n° 2025-594 ; décret n° 2026-662 ; economie.gouv.fr", "notes": "Objectifs. Affichage progressif des items (0,5 s). Sources : loi n° 2025-594 du 30/06/2025 ; décret n° 2026-662 du 23/07/2026 ; economie.gouv.fr/entreprises/bloctel-professionnels-reglementation ; anil.org. RELECTURE JURIDIQUE OBLIGATOIRE avant publication (juriste ou avocat en droit de la consommation / immobilier)."}, {"type": "video", "title": "Sébastien : « Désormais, on demande la permission »", "label": "Emplacement de la capsule HeyGen (45 s) · avatar SEB", "notes": "Capsule HeyGen 45 s, avatar SEB, fond agence. Script : « Pendant dix ans, la règle était simple : vous pouviez appeler, sauf si la personne s'était inscrite sur Bloctel. Depuis le 11 août 2026, c'est fini. Bloctel est supprimé, et c'est l'inverse : vous n'appelez que les personnes qui vous ont dit oui avant. Un oui clair, pour votre agence, pour un sujet précis, et pour un an maximum. Vous allez me dire : je perds mon fichier. Oui. Mais vous gagnez autre chose : des propriétaires qui attendent votre appel. Un vendeur qui a coché “j'accepte d'être recontacté au sujet de mon DPE” décroche, écoute, et prend rendez-vous. Dans cette séquence, on construit ensemble ce réflexe : obtenir l'accord, le prouver, et l'utiliser à bon escient. » Déblocage du bouton Suivant à la fin de la vidéo. RELECTURE JURIDIQUE OBLIGATOIRE avant publication (juriste ou avocat en droit de la consommation / immobilier)."}, {"type": "timeline", "eyebrow": "Unité 3.1 · Explication", "title": "Trois dates à connaître", "events": [{"date": "30 juin 2025", "title": "Loi n° 2025-594", "text": "Loi con  · La frise des cinq techniques", "title": "Ce que le vendeur obtient à chaque technique", "principle": "Chaque technique donne au vendeur un bénéfice concret avant de lui demander un engagement.", "steps_label": "Les cinq techniques", "steps": ["1. Contact consenti — une information utile, sans être sollicité.", "2. Vérification du DPE — une étiquette fiable avant la vente.", "3. Avis de valeur 360° — un prix justifié et défendable.", "4. Plan de vente — une stratégie claire et un calendrier.", "5. Exclusivité contre services — des engagements écrits, un suivi régulier."], "key_phrase": "« Je ne vous demande rien avant de vous avoir apporté quelque chose d'utile. »", "stage_label": "Durée de la séquence", "stage_value": "60 min · ouverture + 6 unités", "notes": "Frise animée : les 5 étapes apparaissent une à une (entrée « Fondu », 1,5 s d'intervalle), synchronisées avec la narration. Clic sur chaque étape → info-bulle avec l'unité correspondante (4.1 à 4.5). Narration : « Cinq techniques, toujours dans le même ordre : d'abord donner, ensuite demander. » Proposition pédagogique Éco-Consultant (pas une règle juridique)."}, {"type": "table", "eyebrow": "Unité 4.0 · Lien avec les 13 étapes", "title": "Où se placent les techniques dans le parcours Éco-Consultant", "headers": ["Technique", "Étape(s) du parcours", "Ce que le vendeur obtient"], "rows": [["1. Contact consenti", "1 · Projet vendeur", "Une information utile sur son DPE, sans démarchage"], ["2. Vérification du DPE", "2 · Audit du bien à 360° (et 3 · copropriété si besoin)", "Une étiquette fiable avant la vente"], ["3. Avis de valeur 360°", "4 · Valeur réelle", "Un prix justifié et défendable"], ["4. Plan de vente", "5 · Plan Éco-staging · 6 · Arbitrer travaux ou vente en l'état", "Une stratégie claire et un calendrier"], ["5. Exclusivité contre services", "7 · Mandat et exclusivité", "Des engagements écrits, un suivi régulier"]], "intro": "Les cinq techniques couvrent les sept premières étapes du parcours. Les étapes 8 à 13 (produit commercial → acte) sont traitées dans les modules suivants.", "caption": "Parcours Éco-Consultant en 13 étapes (référentiel de la formation).", "notes": "Tableau statique. Survol d'une ligne → surbrillance orange de l'étape. Narration : « Les cinq techniques couvrent les sept premières étapes du parcours. Le reste, de l'annonce à l'acte, viendra dans les modules suivants. » Bouton « Continuer »."}, {"type": "objectives", "eyebrow": "Unité 4.0 · Objectifs", "title": "À la fin de la séquence, vous saurez", "items": ["Recontacter un propriétaire dans le cadre exact de son consentement", "Vérifier un DPE et choisir : attestation actualisée, nouveau DPE ou statu quo", "Construire un avis de valeur 360° à partir des ventes DVF et des 8 familles de valeur", "Présenter un plan de vente daté qui arbitre travaux et vente en l'état", "Obtenir une exclusivité en échange d'engagements écrits et traiter 8 objections"], "stats": [{"value": "5", "label": "techniques, chacune avec un outil prêt à l'emploi"}, {"value": "8", "label": "objections fréquentes à l'entraînement (unité 4.6)"}], "side_title": "Fil rouge", "side_note": "M. Bernard, maison de 112 m², DPE F (mars 2023)", "footer": "Validation : 70 % aux activités notées pour débloquer la séquence 5.", "notes": "Écran d'objectifs. Les items apparaissent un à un. Narration : « Cinq savoir-faire, cinq outils. Et M. Bernard pour vous entraîner. » Bouton « Commencer l'unité 4.1 »."}, {"type": "divider", "kicker": "Unité 4.1", "title": "Technique 1 · Le contact consenti", "notes": "Séparateur unité 4.1 (9 min). Rappel : les règles du consentement ont été vues en séquence 3 ; ici, on les met en œuvre."}, {"type": "persona", "eyebrow": "Unité 4.1 · Accroche", "title": "M. Bernard a coché une case, puis plus rien", "initials": "MB", "name": "M. Bernard (fictif)", "role": "Propriétaire d'une maison de 112 m²", "facts": ["Chauffage électrique, DPE F de mars 2023", "Deux agences lui annoncent −15 % à cause du DPE", "A coché : « J'accepte d'être recontacté par [votre agence] au sujet de mon DPE et de l'estimation… »", "Ne décroche plus aux numéros inconnus"], "quote": "« J'ai rempli votre formulaire pour mon DPE. Depuis, on m'appelle de partout. »", "right_paras": ["Son accord vous concerne, vous, et un objet précis : son DPE et l'estimation.", "Votre premier contact doit tenir dans ce cadre, et lui apporter quelque chose."], "question": "Que lui dites-vous dans le premier message, et par quel canal ?", "notes": "Persona fictif (fil rouge). Clic sur la question → champ de réflexion libre non noté, puis bouton « Voir la méthode ». Narration : « M. Bernard vous a donné son accord. Il ne vous attend pas pour autant. Le premier message doit lui prouver qu'il a eu raison. »"}, {"type": "steps_key", "eyebrow": "Unité 4.1 · Explication", "title": "Le contact consenti en quatre temps", "principle": "Le propriétaire a donné un accord préalable, nominatif et précis : vous le recontactez sur cet objet, avec une information utile.", "steps_label": "Méthode", "steps": ["Vérifier la preuve : date, nom de votre agence, objet, durée, modalités de retrait.", "Préparer la contrepartie : une première lecture de son DPE (date, énergie, coefficient).", "Rappeler vite, dans l'objet du consentement : DPE et estimation, rien d'autre.", "Proposer une étape simple : un rendez-vous de 30 min ou l'envoi d'une analyse écrite."], "key_phrase": "« Vous m'avez autorisé à vous rappeler au sujet de votre DPE : j'ai les résultats. »", "stage_label": "Étape du parcours", "stage_value": "1 · Projet vendeur", "notes": "Étapes révélées au clic. Sources (règles du consentement, en vigueur au 11/08/2026) : loi n° 2025-594 du 30/06/2025, décret n° 2026-662 du 23/07/2026, art. R. 223-1 à R. 223-3 C. consom. — accord libre, spécifique, éclairé, univoque, par acte positif ; nominatif ; objet, durée (1 an max, sans reconduction tacite), retrait ; preuve conservée 3 ans. https://www.legifrance.gouv.fr. Narration : « Un consentement n'est pas un ticket pour tout dire. C'est un cadre : votre agence, son DPE, son estimation. »"}, {"type": "explain", "eyebrow": "Unité 4.1 · Démonstration (exemple fictif)", "title": "Le premier contact avec M. Bernard", "paras": ["SMS (si le formulaire couvre ce canal) : « Bonjour M. Bernard, ici Julie Martin, agence [nom]. Suite à votre demande du 3/10 sur votre DPE, j'ai une première lecture. Je vous appelle demain à 18 h depuis le 06 12 34 56 78 ? Répondez STOP pour ne plus être contacté. »", "Appel : « Vous m'avez autorisé à vous rappeler au sujet de votre DPE : j'ai les résultats. Votre DPE date de mars 2023, chauffage électrique. Le calcul a changé au 1er janvier 2026. Cela peut modifier votre étiquette. Je vous montre en 30 minutes ? »"], "cards": [{"value": "1", "label": "objet : DPE et estimation, rien d'autre"}, {"value": "1 an", "label": "durée maximale d'un consentement"}, {"value": "3 ans", "label": "conservation minimale de la preuve"}], "caption": "Exemple fictif. Le SMS de prospection exige un consentement préalable (art. L. 34-5 CPCE) : vérifiez que votre formulaire nomme ce canal.", "notes": "Démonstration : bulles de conversation animées (SMS puis appel). Option audio : faire lire le dialogue par deux voix ElevenLabs (conseillère / M. Bernard). On annonce le numéro d'appel dans le SMS car M. Bernard ne décroche plus aux numéros inconnus. Ne jamais promettre une classe : « peut modifier », pas « va améliorer ». Sources : décret n° 2026-662 ; CNIL, prospection par SMS (art. L. 34-5 CPCE)."}, {"type": "two_cols", "eyebrow": "Unité 4.1 · Objections fréquentes", "title": "Ce que le propriétaire répond, et ce que vous dites", "tone": "neutral", "left_title": "Il dit", "left_items": ["« Je n'ai jamais donné mon accord. »", "« Vous allez me harceler comme les autres. »", "« Je ne veux pas vendre tout de suite. »", "« Effacez mes coordonnées. »"], "right_title": "Vous répondez", "right_items": ["« Voici la date, le formulaire et la case cochée. Si vous ne le souhaitez plus, je retire vos données. »", "« Un appel, à l'heure qui vous va, sur votre DPE. Vous pouvez arrêter à tout moment. »", "« Mon appel porte sur votre DPE. Vous saurez où vous en êtes le jour où vous déciderez. »", "« C'est noté, je le fais aujourd'hui et je vous le confirme par écrit. »"], "footer_title": "Règle", "footer_text": "Le retrait du consentement est possible à tout moment, y compris à l'oral (R. 223-3) : on l'enregistre, on ne négocie pas.", "notes": "Deux colonnes, révélation ligne par ligne au clic. Narration : « Une objection sur le consentement se traite par la preuve, ou par le retrait. Jamais par l'insistance. » Source : art. R. 223-3 C. consom. (décret n° 2026-662)."}, {"type": "document", "eyebrow": "Unité 4.1 · Mise en pratique", "title": "La preuve de consentement de M. Bernard tient-elle ?", "doc_title": "Extrait du registre des consentements (fictif)", "fields": [{"label": "Date et heure :", "value": "03/10/2026 · 21 h 14 · formulaire du site", "useful": true, "feedback": "Indispensable : la date fait courir la durée de l'accord (1 an max) ; la preuve se conserve au moins 3 ans."}, {"label": "Case :", "value": "cochée par l'internaute (non pré-cochée)", "useful": true, "feedback": "Essentiel : l'accord doit résulter d'un acte positif clair. Une case pré-cochée ne vaut pas consentement."}, {"label": "Professionnel :", "value": "Agence [votre agence], nommée", "useful": true, "feedback": "L'accord est nominatif : il ne vaut que pour votre agence, pas pour un partenaire ou un réseau."}, {"label": "Objet :", "value": "DPE et estimation du bien", "useful": true, "feedback": "L'objet borne la conversation : vous parlez DPE et estimation, pas crédit ni défiscalisation."}, {"label": "Durée et retrait :", "value": "12 mois · lien de retrait et « STOP »", "useful": true, "feedback": "Mentions obligatoires de la demande : durée (1 an max, sans reconduction tacite) et modalités de retrait."}, {"label": "Navigateur :", "value": "Chrome 129", "useful": false, "feedback": "Donnée technique sans valeur de preuve sur le contenu de l'accord. Inutile ici."}, {"label": "Source de trafic :", "value": "campagne « DPE 2026 »", "useful": false, "feedback": "Utile au marketing, pas à la preuve du consentement."}, {"label": "Couleur du bouton :", "value": "orange", "useful": false, "feedback": "Sans incidence juridique : seul compte le texte présenté et l'acte positif."}], "instruction": "Cliquez sur les éléments qui prouvent un consentement valable au sens du décret du 23 juillet 2026.", "side_note": "Exemple fictif. Une preuve incomplète = pas d'appel : recueillez un nouvel accord.", "counter": "5 éléments à trouver", "notes": "Activité notée (poids 1). 5 zones utiles, 3 pièges. Réussite : 5 utiles sans piège, 2 tentatives. Calque « Correction » après validation. Sources : art. R. 223-1 et R. 223-2 C. consom. (décret n° 2026-662)."}, {"type": "two_cols", "eyebrow": "Unité 4.1 · Erreurs courantes", "title": "Les quatre erreurs qui ruinent un contact consenti", "left_title": "À faire", "left_items": ["Rappeler dans les jours qui suivent, sur l'objet indiqué", "Annoncer qui vous êtes, d'où vient l'accord et l'objet de l'appel", "Proposer une seule étape suivante, simple", "Enregistrer tout retrait le jour même"], "right_title": "À éviter", "right_items": ["Appeler avec un accord donné à un autre réseau ou à un partenaire", "Élargir : crédit, placement, travaux d'une entreprise tierce", "Promettre une meilleure classe DPE ou un prix", "Garder un accord expiré (plus d'un an) ou sans preuve"], "footer_title": "Sanction", "footer_text": "Jusqu'à 75 000 € (personne physique) ou 375 000 € (personne morale), et nullité du contrat conclu après un démarchage illicite.", "notes": "Deux colonnes do/don't. Narration : « Ce qui vous protège, c'est la preuve. Ce qui vous expose, c'est l'élargissement. » Sources : art. L. 242-16 et L. 223-1 C. consom."}, {"type": "resource", "eyebrow": "Unité 4.1 · Outil", "title": "Modèle de formulaire et SMS de recontact conformes", "items": ["Case non pré-cochée : « J'accepte d'être recontacté(e) par [raison sociale, carte T n°…] »", "Objet précis : « au sujet de mon DPE et de l'estimation de mon bien »", "Canaux : « par téléphone et par SMS » (cochez ceux qui s'appliquent)", "Durée : « pendant 12 mois maximum, sans reconduction tacite »", "Retrait : « à tout moment, par le lien reçu, par “STOP” ou par simple appel »", "Registre : date, heure, texte affiché, canal, conservé 3 ans minimum", "SMS : nom + agence + rappel de la demande + créneau proposé + « STOP »"], "example_title": "SMS de recontact (modèle)", "example_text": "« Bonjour [Prénom Nom], ici [Prénom], agence [nom]. Suite à votre demande du [date] sur votre DPE, j'ai une première lecture. Je vous appelle [jour] à [heure] depuis le [numéro] ? STOP pour ne plus être contacté. »", "pdf_label": "Télécharger le modèle (PDF) · Unité 4.1", "sources": "Décret n° 2026-662 (R. 223-1 à R. 223-3 C. consom.) ; CNIL, art. L. 34-5 CPCE. Faire relire le texte par votre conseil juridique.", "notes": "Ressource téléchargeable (PDF à produire à partir de cette slide). Bouton « Télécharger ». [À VALIDER] relecture juridique du libellé type avant diffusion aux apprenants."}, {"type": "recap", "eyebrow": "Unité 4.1 · Synthèse", "title": "Technique 1 en trois réflexes", "cards": [{"title": "Prouver", "text": "Avant d'appeler : date, case cochée, votre nom, l'objet, la durée et le retrait. Pas de preuve, pas d'appel."}, {"title": "Apporter", "text": "Le premier contact donne une information utile sur le DPE. Pas d'argumentaire, pas de promesse."}, {"title": "Respecter", "text": "Rester dans l'objet, enregistrer tout retrait le jour même, ne jamais dépasser un an."}], "banner_label": "Phrase clé", "banner_text": "« Vous m'avez autorisé à vous rappeler au sujet de votre DPE : j'ai les résultats. »", "notes": "Synthèse, cartes révélées au clic. Narration : « Prouver, apporter, respecter. » Bouton « Unité 4.2 »."}, {"type": "divider", "kicker": "Unité 4.2", "title": "Technique 2 · La vérification du DPE", "notes": "Séparateur unité 4.2 (9 min). Contenu DPE vu en séquence 2 ; ici, la conduite à tenir avant la vente."}, {"type": "steps_key", "eyebrow": "Unité 4.2 · Explication", "title": "Vérifier le DPE avant de parler prix", "principle": "Un prix construit sur une étiquette périmée ou sous-évaluée se défend mal. On vérifie la date, l'énergie et les travaux.", "steps_label": "Fiche réflexe", "steps": ["Date : DPE établi avant le 1/07/2021 → plus valable, nouveau DPE obligatoire pour vendre.", "Énergie : DPE depuis le 1/07/2021, électricité, logement inchangé → attestation actualisée gratuite (ADEME).", "Travaux depuis le DPE (isolation, chauffage, fenêtres) → nouveau DPE recommandé.", "Maison classée E, F ou G après vérification → audit énergétique obligatoire à la vente.", "Ne jamais annoncer une classe : seul le document officiel fait foi."], "key_phrase": "« Avant de parler prix, vérifions que votre étiquette reflète bien votre maison. »", "stage_label": "Étape du parcours", "stage_value": "2 · Audit du bien à 360°", "notes": "Étapes révélées au clic. Sources : coefficient électricité 2,3 → 1,9 au 1/01/2026 (arrêté du 13/08/2025), 1,7 au 1/01/2027 (arrêté du 19/08/2026, NOR VLOL2617030A) ; attestation actualisée gratuite sur l'observatoire DPE-Audit de l'ADEME (https://observatoire-dpe-audit.ademe.fr) pour les DPE établis depuis le 1/07/2021, sans nouvelle visite, valable jusqu'à la fin de validité du DPE d'origine ; DPE 1/01/2018-30/06/2021 plus valables depuis le 1/01/2025, DPE 2013-2017 depuis le 1/01/2023 ; audit à la vente des maisons/monopropriétés F-G depuis 1/04/2023, E depuis 1/01/2025. Narration : « Trois questions : quand, quelle énergie, quels travaux depuis. »"}, {"type": "explain", "eyebrow": "Unité 4.2 · Démonstration (exemple fictif)", "title": "La vérification du DPE de M. Bernard", "paras": ["Date : mars 2023, donc après le 1/07/2021. Énergie : chauffage électrique. Travaux depuis : aucun, selon M. Bernard. Conclusion : attestation actualisée gratuite.", "« Votre DPE a été calculé avec un coefficient de 2,3 pour l'électricité. Depuis janvier 2026, c'est 1,9. Avec votre numéro ADEME, on télécharge l'attestation actualisée, gratuitement et sans nouvelle visite. »", "Si la maison reste en E, F ou G, l'audit énergétique reste obligatoire pour la vente. On le prévoit dans le plan."], "cards": [{"value": "2,3 → 1,9", "label": "coefficient électricité au 1/01/2026"}, {"value": "1,7", "label": "coefficient prévu au 1/01/2027"}, {"value": "13", "label": "caractères du numéro ADEME du DPE"}], "caption": "Exemple fictif. Le résultat de l'attestation n'est connu qu'après téléchargement : aucune classe n'est promise.", "notes": "Démonstration : M. Bernard tend son DPE (image), zones date / énergie / n° ADEME en surbrillance successive. Narration fidèle aux paragraphes. Sources : arrêtés du 13/08/2025 et du 19/08/2026 ; ADEME, observatoire DPE-Audit."}, {"type": "two_cols", "eyebrow": "Unité 4.2 · Objections fréquentes", "title": "« Mon DPE n'est pas un problème »… vraiment ?", "tone": "neutral", "left_title": "Il dit", "left_items": ["« Mon DPE est valable dix ans, on n'y touche pas. »", "« Un nouveau DPE pourrait être pire. »", "« Les acheteurs ne regardent pas ça. »", "« L'agence d'à côté ne m'en a pas parlé. »"], "right_title": "Vous répondez", "right_items": ["« Valable, oui. Mais calculé avec l'ancien coefficient : l'attestation actualisée est gratuite. »", "« L'attestation ne refait pas de visite : elle recalcule avec la règle de 2026. On la regarde avant de décider. »", "« L'étiquette figure obligatoirement dans l'annonce. Elle pèse sur le budget travaux et le financement. »", "« Je préfère que l'acheteur ne découvre rien que vous n'ayez vu avant lui. »"], "footer_title": "Limite", "footer_text": "Si le logement a changé (travaux), l'attestation ne reflète pas la réalité : on recommande un nouveau DPE.", "notes": "Deux colonnes, révélation au clic. Narration : « L'objectif n'est pas de faire peur. C'est d'éviter la mauvaise surprise en visite. » Source affichage DPE dans les annonces : art. L. 126-33 CCH [À VALIDER référence exacte]."}, {"type": "sort", "eyebrow": "Unité 4.2 · Mise en pratique", "title": "Quelle conduite pour chaque DPE ?", "items": ["M. Bernard : DPE de mars 2023, chauffage électrique, pas de travaux depuis", "Mme Leroy : DPE de mai 2019", "M. Petit : DPE de 2022, électrique, combles isolés en 2025", "Mme Roux : DPE de juin 2021 (le 15)", "Appartement : DPE de 2024, électrique, rien n'a changé", "Maison : DPE de 2023, pompe à chaleur installée en 2026"], "categories": ["Attestation actualisée", "Nouveau DPE obligatoire", "Nouveau DPE recommandé"], "answers": [0, 1, 2, 1, 0, 2], "whys": ["Établi après le 1/07/2021, électrique, logement inchangé : l'attestation actualisée gratuite s'applique.", "Les DPE établis entre le 1/01/2018 et le 30/06/2021 ne sont plus valables depuis le 1/01/2025.", "Le DPE reste valable, mais l'isolation a changé le logement : l'attestation ne le reflète pas. Nouveau DPE recommandé.", "Le 15 juin 2021 est avant le 1/07/2021 : ce DPE n'est plus valable depuis le 1/01/2025.", "DPE récent, électrique, rien n'a changé : l'attestation actualisée suffit.", "Changer de système de chauffage modifie le calcul : un nouveau DPE est recommandé pour refléter la maison réelle."], "notes": "Activité notée (poids 1) : glisser chaque situation dans une colonne. Réussite : 5/6. 2 tentatives. Personnages fictifs. Sources : ADEME ; Service-Public, validité du DPE (https://www.service-public.fr/particuliers/vosdroits/F16096)."}, {"type": "two_cols", "eyebrow": "Unité 4.2 · Erreurs courantes", "title": "Ce qui fragilise votre vérification du DPE", "left_title": "À faire", "left_items": ["Demander le DPE complet et son numéro ADEME", "Noter la date d'établissement, pas la date de visite seule", "Demander la liste des travaux réalisés depuis", "Écrire au vendeur ce que vous avez vérifié"], "right_title": "À éviter", "right_items": ["« Avec le nouveau calcul, vous passez en D » : promesse de classe", "Oublier l'audit énergétique d'une maison E, F ou G", "Faire refaire un DPE sans regarder d'abord l'attestation gratuite", "Appliquer le raisonnement électrique à une maison chauffée au gaz"], "footer_title": "À retenir", "footer_text": "Le coefficient ne touche que les consommations électriques. Chauffage au gaz ou au fioul : l'attestation change peu, ne la présentez pas comme une solution.", "notes": "Deux colonnes do/don't. Narration : « Vérifier, écrire, ne rien promettre. » Le changement de coefficient concerne l'énergie primaire de l'électricité (arrêté du 13/08/2025)."}, {"type": "resource", "eyebrow": "Unité 4.2 · Outil", "title": "Fiche réflexe « Vérification du DPE »", "items": ["1. Date d'établissement : avant le 1/07/2021 → nouveau DPE obligatoire", "2. Depuis le 1/07/2021 + électricité + logement inchangé → attestation actualisée gratuite", "3. Numéro ADEME (13 caractères) relevé sur le DPE", "4. Travaux depuis le DPE ? Oui → nouveau DPE recommandé", "5. Maison ou monopropriété en E, F ou G → audit énergétique à commander", "6. Validité : 10 ans ; l'attestation vaut jusqu'à la fin du DPE d'origine", "7. Compte rendu écrit au vendeur, sans promesse de classe"], "example_title": "Compte rendu type à M. Bernard", "example_text": "« DPE du 03/2023, n° ADEME relevé, chauffage électrique, pas de travaux déclarés. Nous téléchargeons l'attestation actualisée (gratuite). Si la classe reste E, F ou G, l'audit énergétique sera commandé avant la mise en vente. »", "pdf_label": "Télécharger la fiche réflexe (PDF) · Unité 4.2", "sources": "ADEME, observatoire DPE-Audit ; arrêtés du 13/08/2025 et du 19/08/2026 ; Service-Public F16096.", "notes": "Ressource téléchargeable. Bouton « Télécharger ». Lien cliquable vers https://observatoire-dpe-audit.ademe.fr."}, {"type": "recap", "eyebrow": "Unité 4.2 · Synthèse", "title": "Technique 2 en trois réflexes", "cards": [{"title": "Dater", "text": "Avant le 1/07/2021 : nouveau DPE obligatoire. Depuis : il reste valable jusqu'à ses 10 ans."}, {"title": "Actualiser", "text": "Électricité et logement inchangé : attestation actualisée gratuite via l'ADEME. Travaux depuis : nouveau DPE recommandé."}, {"title": "Anticiper", "text": "Maison en E, F ou G : audit énergétique obligatoire. On le prévoit dans le plan de vente."}], "banner_label": "Phrase clé", "banner_text": "« Avant de parler prix, vérifions que votre étiquette reflète bien votre maison. »", "notes": "Synthèse. Narration : « Dater, actualiser, anticiper. » Bouton « Unité 4.3 »."}, {"type": "divider", "kicker": "Unité 4.3", "title": "Technique 3 · L'avis de valeur 360°", "notes": "Séparateur unité 4.3 (10 min)."}, {"type": "steps_key", "eyebrow": "Unité 4.3 · Explication", "title": "Construire un prix que vous saurez défendre", "principle": "Un avis de valeur 360° part des ventes réelles, puis justifie chaque écart par une des 8 familles de valeur.", "steps_label": "Méthode", "steps": ["Sélectionner 3 à 6 ventes comparables récentes dans DVF (même secteur, même type, surface proche).", "Calculer le prix au m² de référence (médiane) et la valeur de départ.", "Ajuster par famille de valeur : technique, énergétique, copropriété, perçue…", "Donner une fourchette, puis le prix de présentation et sa justification écrite.", "Préparer la réponse aux 3 objections qu'un acheteur fera sur ce prix."], "key_phrase": "« Voici la valeur de votre bien, et voici comment je la défends face à un acheteur. »", "stage_label": "Étape du parcours", "stage_value": "4 · Valeur réelle", "notes": "Étapes révélées au clic. DVF (Demandes de valeurs foncières) : données publiques des ventes des 5 dernières années, mises à jour en avril et octobre, hors Alsace, Moselle et Mayotte (https://www.data.gouv.fr/datasets/demandes-de-valeurs-foncieres, consulté le 20/10/2026). Dans les départements exclus, utiliser le livre foncier et les références notariales. Le nombre de comparables (3 à 6) est une proposition pédagogique. Narration : « Partir des ventes réelles, puis justifier chaque écart. »"}, {"type": "explain", "eyebrow": "Unité 4.3 · Les 8 familles de valeur", "title": "Chaque ajustement se rattache à une famille", "paras": ["Un écart de prix sans famille de valeur est une opinion. Avec une famille, c'est un argument.", "Pour M. Bernard, la famille énergétique pèse, mais elle n'est pas la seule : terrain, état, quartier, financement des acheteurs comptent aussi."], "table": {"headers": ["Famille", "Question à se poser"], "rows": [["Intrinsèque", "Surface, terrain, plan, exposition ?"], ["Marché", "Ventes DVF, délai, concurrence ?"], ["Technique", "État, toiture, réseaux, travaux ?"], ["Énergétique", "Classe, audit, budget de rénovation ?"], ["Copropriété", "Charges, travaux votés, PPPT ?"], ["Perçue", "Première impression, photos, voisinage ?"], ["Financière", "Mensualité de l'acheteur, aides ?"], ["Transactionnelle", "Délai, conditions, exclusivité ?"]]}, "caption": "8 familles de valeur : référentiel de la formation Éco-Consultant (proposition pédagogique).", "notes": "Tableau : survol d'une famille → exemple chiffré fictif en info-bulle. Narration : « Huit familles. Un écart, une famille, une preuve. » La famille copropriété ne s'applique pas à la maison de M. Bernard (sauf lotissement avec ASL)."}, {"type": "explain", "eyebrow": "Unité 4.3 · Démonstration (exemple fictif)", "title": "Répondre au « −15 % » des deux agences", "paras": ["« Les deux agences ont appliqué −15 % pour le DPE. Moi, je pars des ventes réelles : trois maisons comparables vendues dans votre secteur ces douze derniers mois. »", "« Ensuite, je justifie chaque écart : l'énergie, oui, avec le budget de l'audit ; mais aussi votre terrain et l'état de la toiture. Voici la fourchette, et voici ce que je réponds à l'acheteur qui dira “DPE F”. »"], "cards": [{"value": "112 m²", "label": "surface de la maison de M. Bernard"}, {"value": "3", "label": "ventes DVF comparables de moins de 12 mois"}, {"value": "8", "label": "familles de valeur pour justifier les écarts"}], "caption": "Chiffres fictifs. Aucun pourcentage national ne remplace les ventes locales et l'audit.", "notes": "Démonstration audio (ElevenLabs, voix conseillère). Rappel séquence 1 : l'écart de prix selon la classe DPE varie selon les régions (Notaires, valeur verte, transactions 2024) : ne jamais opposer un « −15 % » à un autre pourcentage, mais aux ventes locales."}, {"type": "case_form", "eyebrow": "Unité 4.3 · Mise en pratique", "title": "Calculez la valeur de départ de M. Bernard", "case_title": "Comparables DVF (fictifs)", "case_paras": ["Vente 1 : maison 105 m², 252 000 €, il y a 8 mois.", "Vente 2 : maison 120 m², 300 000 €, il y a 5 mois.", "Vente 3 : maison 110 m², 264 000 €, il y a 11 mois.", "M. Bernard : 112 m². Calculez le prix au m² de chaque vente, la médiane, puis la valeur de départ."], "inputs": ["Prix au m² médian (€/m²)", "Valeur de départ pour 112 m² (€)", "Famille de valeur à ajuster en premier, et pourquoi"], "answer": "Vente 1 : 2 400 €/m² ; vente 2 : 2 500 €/m² ; vente 3 : 2 400 €/m². Médiane : 2 400 €/m². Valeur de départ : 112 × 2 400 = 268 800 €. Ajustement prioritaire : famille énergétique (DPE F à vérifier, audit et budget travaux), puis technique (état réel).", "feedbacks": ["Juste : 2 400 €/m² et 268 800 €. Vous partez des ventes réelles, pas d'un pourcentage.", "Si vous trouvez 2 433 €/m², vous avez pris la moyenne : la médiane résiste mieux à une vente atypique.", "Si vous avez appliqué −15 % d'emblée : vous reproduisez l'erreur des deux agences. L'ajustement vient après, justifié.", "Famille énergétique : oui, mais seulement après l'attestation actualisée et l'audit. Sans ces documents, l'ajustement est une supposition."], "button": "Valider mon calcul", "notes": "Activité notée (poids 1) : champs 1 et 2 vérifiés numériquement (tolérance ± 1 %), champ 3 auto-évalué via la correction. Chiffres fictifs. Calque « Correction » après validation."}, {"type": "two_cols", "eyebrow": "Unité 4.3 · Objections et erreurs", "title": "Ce qui rend un avis de valeur indéfendable", "left_title": "À faire", "left_items": ["Citer les ventes DVF utilisées (date, surface, prix)", "Rattacher chaque ajustement à une famille de valeur", "Donner une fourchette, puis un prix de présentation", "Préparer la réponse à « DPE F » côté acheteur"], "right_title": "À éviter", "right_items": ["Annoncer le prix le plus haut pour gagner le mandat", "Appliquer un pourcentage national « pour le DPE »", "Utiliser des annonces en cours comme références de prix", "Confondre avis de valeur et expertise : ce n'est pas un rapport d'expert"], "footer_title": "« Une autre agence m'estime plus haut »", "footer_text": "« Comparons les références. Si son prix s'appuie sur des ventes, je l'intègre. Sinon, c'est le prix que l'acheteur refusera. »", "notes": "Deux colonnes do/don't. Narration : « Un prix surévalué gagne un mandat et perd une vente. » Les annonces en cours sont des prix demandés, pas des prix de vente."}, {"type": "resource", "eyebrow": "Unité 4.3 · Outil", "title": "Trame d'avis de valeur 360°", "items": ["1. Le bien : surface, terrain, année, chauffage, DPE (date, classe, n° ADEME)", "2. Ventes DVF retenues : 3 à 6, avec date, adresse approximative, surface, prix, €/m²", "3. Valeur de départ : médiane €/m² × surface", "4. Ajustements par famille (8 familles) : + / −, montant et preuve", "5. Fourchette et prix de présentation recommandé", "6. Arguments face à l'acheteur : 3 objections, 3 réponses", "7. Limites : avis de valeur non opposable, données au [date]"], "example_title": "Ligne d'ajustement type", "example_text": "« Famille énergétique : −[montant] €, correspondant au budget du scénario 1 de l'audit énergétique (devis à l'appui). Famille intrinsèque : +[montant] €, terrain de 900 m² contre 500 m² en moyenne dans les comparables. »", "pdf_label": "Télécharger la trame (PDF / tableur) · Unité 4.3", "sources": "DVF, data.gouv.fr (5 ans, MAJ avril/octobre, hors Alsace-Moselle et Mayotte) ; 8 familles : référentiel Éco-Consultant.", "notes": "Ressource téléchargeable (gabarit tableur avec calcul de médiane). Bouton « Télécharger »."}, {"type": "recap", "eyebrow": "Unité 4.3 · Synthèse", "title": "Technique 3 en trois réflexes", "cards": [{"title": "Partir du réel", "text": "Ventes DVF comparables, prix au m² médian, valeur de départ. Pas d'annonces, pas de pourcentage national."}, {"title": "Justifier", "text": "Chaque écart se rattache à une des 8 familles de valeur, avec une preuve : audit, devis, plan, surface."}, {"title": "Défendre", "text": "Le vendeur repart avec une fourchette, un prix de présentation et les réponses à donner à l'acheteur."}], "banner_label": "Phrase clé", "banner_text": "« Voici la valeur de votre bien, et voici comment je la défends face à un acheteur. »", "notes": "Synthèse. Narration : « Partir du réel, justifier, défendre. » Bouton « Unité 4.4 »."}, {"type": "divider", "kicker": "Unité 4.4", "title": "Technique 4 · Le plan de vente", "notes": "Séparateur unité 4.4 (9 min)."}, {"type": "steps_key", "eyebrow": "Unité 4.4 · Explication", "title": "Arbitrer avant de mettre en vente", "principle": "Le plan de vente dit ce que l'on fait avant la mise en vente, ce que l'on chiffre pour l'acheteur, et à quelle date.", "steps_label": "Méthode", "steps": ["Lister les points faibles relevés à l'audit 360° (technique, énergie, présentation).", "Classer : petit coût et fort effet → à faire avant ; gros travaux → chiffrer et vendre en l'état.", "Préparer l'Éco-staging : désencombrer, réparer, éclairer, photos.", "Fixer un calendrier daté, avec un point d'étape écrit chaque semaine.", "Prévoir un rendez-vous de révision du prix à une date convenue, sur des faits."], "key_phrase": "« Voici notre plan : ce que l'on fait avant, ce que l'on chiffre pour l'acheteur, et à quelle date. »", "stage_label": "Étapes du parcours", "stage_value": "5 · Plan Éco-staging · 6 · Travaux ou vente en l'état", "notes": "Étapes révélées au clic. Phrase clé réécrite : l'ancienne version citait « neuf ventes sur dix », chiffre non sourcé, retiré. L'arbitrage « petit coût / fort effet » est une proposition pédagogique. Narration : « Un plan de vente, c'est trois listes et un calendrier. »"}, {"type": "explain", "eyebrow": "Unité 4.4 · Démonstration (exemple fictif)", "title": "Le plan de vente de M. Bernard", "paras": ["« On ne refait pas votre chauffage avant de vendre : c'est un chantier long et l'acheteur voudra choisir. On le chiffre avec l'audit et on le présente comme un budget. »", "« Avant la mise en vente : attestation DPE actualisée, audit énergétique si la classe reste E à G, petites réparations, désencombrement, photos. Mise en ligne prévue en semaine 4. Un compte rendu écrit chaque vendredi. »"], "cards": [{"value": "S1-S2", "label": "attestation DPE, audit, devis"}, {"value": "S3", "label": "Éco-staging et photos"}, {"value": "S4", "label": "mise en vente"}, {"value": "S10", "label": "point prix sur faits (visites, retours)"}], "caption": "Calendrier fictif à adapter. Les délais d'audit et de devis dépendent des professionnels disponibles.", "notes": "Démonstration : frise de calendrier animée. Narration fidèle aux paragraphes. Les durées sont indicatives, pas des engagements de résultat."}, {"type": "two_cols", "eyebrow": "Unité 4.4 · Objections fréquentes", "title": "« Je ne suis pas pressé » et autres réticences", "tone": "neutral", "left_title": "Il dit", "left_items": ["« Je ne suis pas pressé. »", "« Je préfère faire les travaux d'abord. »", "« Pourquoi refaire des photos ? »", "« Baisser le prix dans 10 semaines ? Jamais. »"], "right_title": "Vous répondez", "right_items": ["« Le plan suit votre rythme. Il évite seulement qu'on découvre un problème en visite. »", "« Regardons l'audit : si les travaux coûtent plus qu'ils ne rapportent, on les chiffre pour l'acheteur. »", "« L'acheteur décide de visiter sur les photos. Elles sont la vitrine du bien. »", "« On ne baisse rien d'avance : on fait le point sur les visites et les retours, et vous décidez. »"], "footer_title": "À retenir", "footer_text": "Le plan engage aussi l'agent : dates, actions et comptes rendus. C'est ce qui prépare la technique 5.", "notes": "Deux colonnes, révélation au clic. Narration : « Un plan ne presse pas le vendeur : il lui évite les surprises. »"}, {"type": "sort", "eyebrow": "Unité 4.4 · Mise en pratique", "title": "Avant la mise en vente, ou budget pour l'acheteur ?", "items": ["Télécharger l'attestation DPE actualisée", "Remplacer tout le système de chauffage", "Réparer la fuite du robinet et les joints", "Faire réaliser l'audit énergétique (maison en F)", "Isoler les murs par l'extérieur", "Désencombrer le garage et les chambres"], "categories": ["Avant la mise en vente", "Chiffré pour l'acheteur"], "answers": [0, 1, 0, 0, 1, 0], "whys": ["Gratuite et rapide : l'attestation fixe l'étiquette affichée dans l'annonce.", "Chantier lourd ; l'acheteur voudra choisir sa solution. On le chiffre grâce à l'audit et on le présente comme budget.", "Petit coût, fort effet en visite : un défaut visible fait douter de tout le reste.", "Obligatoire à la vente d'une maison en F : il doit être disponible dès la mise en vente.", "Investissement important au retour incertain avant la vente : chiffré dans l'audit, présenté à l'acheteur.", "Sans coût, il agrandit visuellement les pièces : c'est le cœur de l'Éco-staging."], "notes": "Activité notée (poids 1). Réussite : 5/6, 2 tentatives. Source audit obligatoire : art. L. 126-28-1 CCH ; Service-Public (https://www.service-public.fr/particuliers/vosdroits/F36925) [À VALIDER URL exacte]."}, {"type": "two_cols", "eyebrow": "Unité 4.4 · Erreurs courantes", "title": "Les plans de vente qui ne tiennent pas", "left_title": "À faire", "left_items": ["Écrire le plan et le remettre au vendeur", "Dater chaque action et nommer qui la fait", "Rattacher s promettre un prix, un délai ou une classe.", "notes": "Tableau consultable, téléchargeable en PDF (bouton « Fiche objections »). Narration : « Huit objections, huit craintes. Répondez à la crainte, pas à la phrase. »"}, {"type": "sort", "eyebrow": "Unité 4.6 · Entraînement 1", "title": "Objections 1 à 4 : quelle réponse retenir ?", "items": ["« Plusieurs agences » → « Un seul prix, une diffusion écrite, et vous me jugez dans 3 mois. »", "« Honoraires trop chers » → « Je baisse de moitié si vous signez aujourd'hui. »", "« Plus haut ailleurs » → « Comparons les ventes DVF qui justifient chaque prix. »", "« Plus haut ailleurs » → « Ils mentent, ils veulent juste le mandat. »", "« Je vends moi-même » → « Gardez la trame ; voici ce que je fais que vous ne pourrez pas faire seul. »", "« Honoraires trop chers » → « Voici ce qu'ils couvrent, ligne par ligne. »"], "categories": ["Réponse efficace", "Réponse à proscrire"], "answers": [0, 1, 0, 1, 0, 0], "whys": ["Elle répond à la crainte (manquer des acheteurs) par un engagement écrit et une échéance.", "Brader sous pression dévalorise votre service et n'apporte aucun fait.", "Elle ramène la discussion sur les ventes réelles, que le vendeur peut vérifier.", "Dénigrer un confrère braque le vendeur et n'apporte aucune preuve.", "Elle respecte son choix et montre la valeur concrète de votre accompagnement.", "Elle transforme un prix en services identifiables : le vendeur compare ce qui est comparable."], "notes": "Activité notée (poids 1). Réussite : 5/6, 2 tentatives. Glisser-déposer."}, {"type": "sort", "eyebrow": "Unité 4.6 · Entraînement 2", "title": "Objections 5 à 8 : quelle réponse retenir ?", "items": ["« Pas pressé » → « Préparons le dossier maintenant, vous choisirez la date. »", "« DPE pas un problème » → « Avec le nouveau calcul, vous passez en D, c'est sûr. »", "« DPE pas un problème » → « L'attestation actualisée est gratuite : regardons-la. »", "« L'exclusivité m'enferme » → « Résiliable après 3 mois, préavis de 15 jours, engagements écrits. »", "« L'exclusivité m'enferme » → « C'est 91 jours garantis au lieu de 142. »", "« Pas de visites inutiles » → « Seuls les acheteurs au financement vérifié visitent. »"], "categories": ["Réponse efficace", "Réponse à proscrire"], "answers": [0, 1, 0, 0, 1, 0], "whys": ["Elle respecte son rythme et transforme l'attente en préparation utile.", "Promesse de classe : interdite. Seul le document officiel fait foi.", "Un fait gratuit et vérifiable, puis une étape simple.", "Elle rappelle la règle Hoguet et l'engagement réciproque.", "Chiffres déclaratifs présentés comme une garantie : c'est une promesse trompeuse.", "Elle répond à la crainte précise et renvoie à un engagement écrit de la charte."], "notes": "Activité notée (poids 1). Réussite : 5/6, 2 tentatives. Glisser-déposer."}, {"type": "dialogue", "eyebrow": "Unité 4.6 · Simulation finale", "title": "M. Bernard enchaîne les objections", "persona_name": "M. Bernard", "opening": "« Votre analyse est bien. Mais une autre agence m'estime 20 000 € plus haut, et je veux garder plusieurs agences. »", "options": ["« Comparons leurs références et les miennes : si leur prix tient sur des ventes, je l'intègre. »", "« Je m'aligne sur leur prix si vous signez avec moi en exclusif. »", "« Faites comme vous voulez, mais ne venez pas vous plaindre. »"], "tree": "Jauge de confiance initiale : 40/100. Réussite si jauge ≥ 75 à la fin.\nNŒUD 1 (prix plus haut + plusieurs agences).\n- A → +20. M. Bernard : « Ils ne m'ont donné aucune référence, juste un chiffre. » → NŒUD 2.\n- B → −20 (prix acheté, indéfendable). M. Bernard : « Donc votre estimation ne valait rien ? » → NŒUD 2.\n- C → −30 → FIN ÉCHEC.\nNŒUD 2 (« Plusieurs agences, c'est plus de chances, non ? »). Options : A2 « Plusieurs agences, c'est souvent plusieurs prix affichés pour le même bien : l'acheteur attend la baisse. Ma charte écrit ma diffusion. » (+15 → NŒUD 3) ; B2 « En exclusif, ça se vend en 91 jours, c'est prouvé. » (−20, chiffre décl
