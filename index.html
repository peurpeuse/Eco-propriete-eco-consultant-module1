aratif présenté comme preuve → NŒUD 3).\nNŒUD 3 (« Et vos honoraires sont plus chers que les leurs. »). Options : A3 « Voici ce qu'ils couvrent : vérification du DPE, audit organisé, plan daté, compte rendu chaque vendredi. » (+15 → NŒUD 4) ; B3 « Je vous fais 1 % de remise si vous signez ce soir. » (−10 → NŒUD 4).\nNŒUD 4 (« Et si je ne suis pas satisfait ? »). Options : A4 « Après 3 mois, vous résiliez avec 15 jours de préavis par recommandé. Et mes engagements sont écrits. » (+15 → FIN) ; B4 « Vous ne pourrez pas, le mandat est de 12 mois. » (−25, faux au regard de la loi Hoguet → FIN).\nFIN : ≥ 75 → « M. Bernard signe un mandat exclusif avec la charte annexée. » ; 55-74 → « Il demande la charte par écrit et un nouveau rendez-vous. » ; < 55 → « Il signe en mandat simple chez le confrère. » Calque de débriefing : rappel de la méthode ARFE pour chaque nœud.", "meter_label": "Confiance de M. Bernard", "notes": "Activité notée (poids 2). Jauge animée ; calque de réplique à chaque choix. Une reprise autorisée. Personnage fictif. Narration d'introduction : « Dernier entraînement : M. Bernard enchaîne quatre objections. À vous. »", "graph": {"start": "n1", "initial": 40, "nodes": {"n1": {"him": "« Votre analyse est bien. Mais une autre agence m'estime 20 000 € plus haut, et je veux garder plusieurs agences. »", "opts": [{"text": "« Comparons leurs références et les miennes : si leur prix tient sur des ventes, je l'intègre. »", "delta": 20, "next": "n2", "why": "Vous comparez sur des ventes réelles plutôt que sur un chiffre."}, {"text": "« Je m'aligne sur leur prix si vous signez avec moi en exclusif. »", "delta": -20, "next": "n2b", "why": "Prix acheté, indéfendable."}, {"text": "« Faites comme vous voulez, mais ne venez pas vous plaindre. »", "delta": -30, "next": "end", "why": "Vous rompez le dialogue.", "force_verdict": "bad"}]}, "n2": {"him": "« Ils ne m'ont donné aucune référence, juste un chiffre. » « Plusieurs agences, c'est plus de chances, non ? »", "opts": [{"text": "« Plusieurs agences, c'est souvent plusieurs prix affichés pour le même bien : l'acheteur attend la baisse. Ma charte écrit ma diffusion. »", "delta": 15, "next": "n3", "why": ""}, {"text": "« En exclusif, ça se vend en 91 jours, c'est prouvé. »", "delta": -20, "next": "n3", "why": "Chiffre déclaratif présenté comme preuve."}]}, "n2b": {"him": "« Donc votre estimation ne valait rien ? » « Plusieurs agences, c'est plus de chances, non ? »", "opts": [{"text": "« Plusieurs agences, c'est souvent plusieurs prix affichés pour le même bien : l'acheteur attend la baisse. Ma charte écrit ma diffusion. »", "delta": 15, "next": "n3", "why": ""}, {"text": "« En exclusif, ça se vend en 91 jours, c'est prouvé. »", "delta": -20, "next": "n3", "why": "Chiffre déclaratif présenté comme preuve."}]}, "n3": {"him": "« Et vos honoraires sont plus chers que les leurs. »", "opts": [{"text": "« Voici ce qu'ils couvrent : vérification du DPE, audit organisé, plan daté, compte rendu chaque vendredi. »", "delta": 15, "next": "n4", "why": ""}, {"text": "« Je vous fais 1 % de remise si vous signez ce soir. »", "delta": -10, "next": "n4", "why": ""}]}, "n4": {"him": "« Et si je ne suis pas satisfait ? »", "opts": [{"text": "« Après 3 mois, vous résiliez avec 15 jours de préavis par recommandé. Et mes engagements sont écrits. »", "delta": 15, "next": "end", "why": ""}, {"text": "« Vous ne pourrez pas, le mandat est de 12 mois. »", "delta": -25, "next": "end", "why": "Faux au regard de la loi Hoguet."}]}}, "ends": [{"min": 75, "no_negative": false, "him": "« Bon. Je signe en exclusif, avec la charte en annexe. »", "verdict": "Mandat exclusif signé", "feedback": "M. Bernard signe un mandat exclusif avec la charte annexée. Vous avez traité chaque objection avec la méthode ARFE : des références plutôt qu'un chiffre, une diffusion écrite, des honoraires justifiés par un contenu, une sortie conforme à la loi Hoguet."}, {"min": 55, "him": "« Envoyez-moi la charte par écrit, et on se revoit. »", "verdict": "Porte entrouverte", "feedback": "Il demande la charte par écrit et un nouveau rendez-vous. Reprenez la méthode ARFE à chaque objection : pas de prix acheté, pas de chiffre déclaratif présenté comme preuve, pas de remise de dernière minute."}, {"min": 0, "him": "« Je crois que je vais signer en mandat simple chez votre confrère. »", "verdict": "Occasion manquée", "feedback": "Il signe en mandat simple chez le confrère. Rappel de la méthode ARFE : comparez sur des ventes réelles, écrivez votre diffusion, justifiez vos honoraires par leur contenu et rappelez la résiliation après 3 mois (loi Hoguet)."}]}}, {"type": "qcm", "eyebrow": "Unité 4.6 · Vérification", "title": "La bonne réponse à « je ne veux pas de visites inutiles »", "question_label": "Question notée", "question": "M. Bernard : « Je ne veux pas que des curieux défilent chez moi. » Quelle réponse applique la méthode ARFE ?", "options": ["« Ne vous inquiétez pas, ça n'arrivera pas. »", "« Vous avez raison d'y penser : vous voulez des visites utiles. Je ne fais visiter que des acheteurs au financement vérifié, c'est écrit dans la charte. On la relit ? »", "« Les visites, c'est le jeu : plus il y en a, mieux c'est. »", "« Alors vendez sans visites, sur photos. »"], "answer": "B", "feedbacks": ["Rassurer sans fait ni engagement ne convainc pas : il n'y a ni reformulation, ni preuve, ni étape.", "Exact : accueil, reformulation, fait (engagement écrit de qualification) et étape (relire la charte).", "Elle contredit sa crainte au lieu de l'accueillir, et le volume de visites n'est pas un objectif en soi.", "Réponse irréaliste et désinvolte : elle ne traite pas la crainte et dessert la vente."], "notes": "QCM noté (poids 1). Une tentative, calque de feedback par option."}, {"type": "recap", "eyebrow": "Unité 4.6 · Synthèse de la séquence", "title": "Cinq techniques, un fil conducteur", "cards": [{"title": "Donner d'abord", "text": "Contact consenti, DPE vérifié, avis de valeur justifié : le vendeur reçoit avant qu'on lui demande."}, {"title": "Écrire", "text": "Preuve du consentement, compte rendu DPE, trame de valeur, plan daté, charte : tout est écrit."}, {"title": "Ne rien promettre", "text": "Ni classe, ni prix, ni délai. Des faits sourcés, des engagements de moyens, la loi Hoguet respectée."}], "banner_label": "Votre boîte à outils", "banner_text": "5 outils téléchargeables : formulaire et SMS, fiche réflexe DPE, trame d'avis de valeur, plan de vente, charte d'engagements.", "notes": "Synthèse de séquence. Narration : « Donner d'abord, écrire, ne rien promettre. Vos cinq outils sont dans la boîte à outils. » Bouton « Terminer la séquence »."}, {"type": "bilan", "title": "Séquence validée", "text": "Vous maîtrisez les cinq techniques de prise de mandat et savez traiter les huit objections fréquentes.", "notes": "Écran de fin. Affichage du score (variable Storyline). Score ≥ 70 % : déblocage de la séquence 5 (IA). Sinon : bouton « Reprendre les activités non réussies ». Narration : « Bravo. Prochaine étape : préparer vos rendez-vous avec l'IA. »", "badge": "Expert|Prise de mandat"}, {"type": "divider", "kicker": "Séquence 5", "title": "L'IA au service de l'agent immobilier", "notes": "Écran d'ouverture de la séquence 5 (durée totale : 30 min). Déverrouillage : séquence 4 validée à 70 %. Bouton « Commencer » → slide suivante. Narration : « Séquence 5. L'intelligence artificielle peut vous faire gagner une heure sur chaque rendez-vous. À une condition : que ce soit vous qui gardiez la main. »"}, {"type": "divider", "kicker": "Unité 5.1", "title": "Préparer un rendez-vous avec l'IA", "notes": "Séparateur de l'unité 5.1 (≈ 11 min). Animation d'entrée standard. Bouton « Suivant » actif immédiatement."}, {"type": "video", "title": "Sébastien : « L'IA prépare, vous décidez »", "label": "Emplacement de la capsule HeyGen (70 s) · avatar SEB", "notes": "Capsule HeyGen, avatar SEB, 70 s environ. Bouton « Suivant » débloqué à la fin de la vidéo (variable VideoVue = vrai). Script complet : « Bonjour. Je vais être franc avec vous : l'IA ne vous trouvera pas de mandat. Elle ne connaît pas M. Bernard, elle ne connaît pas votre quartier, et elle peut inventer un chiffre avec un aplomb parfait. En revanche, bien utilisée, elle vous fait gagner un temps précieux avant le rendez-vous. Elle met en forme un export de ventes, elle vous propose un argumentaire adapté au profil du vendeur, elle rédige un premier jet de message, elle vous aide à anticiper les objections. Mon conseil de terrain tient en trois règles. Un : chaque chiffre qu'elle vous donne, vous le vérifiez à la source. Deux : vous ne lui confiez jamais le nom, le téléphone ou l'adresse d'un client dans un outil grand public. Trois : c'est vous qui relisez, qui corrigez et qui signez. Le vendeur ne signe pas avec une machine, il signe avec vous. Dans cette séquence, on va apprendre à lui parler, à la vérifier et à protéger vos clients. On y va. »"}, {"type": "persona", "eyebrow": "Unité 5.1 · Accroche", "title": "Rendez-vous demain à 10 h chez M. Bernard", "initials": "MB", "name": "M. Bernard", "role": "Vendeur potentiel · fil rouge (fictif)", "facts": ["Maison de 112 m² chauffée à l'électricité", "DPE F réalisé en mars 2023", "Deux agences lui annoncent −15 %", "A accepté par formulaire d'être recontacté au sujet de son DPE et de l'estimation"], "quote": "« Si c'est pour me dire comme les autres que ma maison ne vaut plus rien, ce n'est pas la peine. »", "right_paras": ["Il vous a enfin rappelé. Le rendez-vous est fixé à demain, 10 h.", "Il vous reste 30 minutes ce soir pour préparer les chiffres du secteur, votre argumentaire et les objections probables."], "question": "Comment l'IA peut-elle vous aider à préparer ce rendez-vous, sans prendre de risque ?", "notes": "Accroche de l'unité 5.1. Personnage fictif (fil rouge M. Bernard). Narration : « M. Bernard vous a rappelé. Demain, 10 heures, vous êtes chez lui. Ce soir, vous avez trente minutes. Voyons comment l'IA peut travailler pour vous. » Bouton « Suivant » débloqué à la fin de la narration."}, {"type": "objectives", "eyebrow": "Unité 5.1 · Objectifs", "title": "Ce que vous saurez faire", "items": ["Choisir les usages de l'IA utiles avant un rendez-vous vendeur", "Rédiger une consigne efficace en 4 éléments : rôle, contexte, tâche, format", "Réutiliser une bibliothèque de consignes sans y mettre de données personnelles"], "side_title": "Durée", "side_note": "≈ 11 minutes · 1 question, 1 atelier", "footer": "Proposition pédagogique ÉCO-CONSULTANT : l'IA prépare, l'agent vérifie et décide.", "notes": "Écran d'objectifs. Apparition des items un par un (0,5 s). Narration : « À la fin de cette unité, vous saurez quand utiliser l'IA, comment lui parler, et vous repartirez avec une bibliothèque de consignes prêtes à l'emploi. »"}, {"type": "table", "eyebrow": "Unité 5.1 · Explication", "title": "Six usages réalistes avant et après le rendez-vous", "headers": ["Usage", "Ce que l'IA fait pour vous", "Ce que vous gardez"], "rows": [["Préparer le rendez-vous", "Liste de questions, déroulé, points à vérifier sur place", "Le choix des questions et l'écoute du vendeur"], ["Structurer des informations publiques", "Synthèse d'un export DVF du secteur : médiane, fourchette, tendance", "Le contrôle des chiffres et le choix des références"], ["Analyser un document", "Résumé d'un DPE ou d'un règlement de copropriété anonymisé", "La lecture du document original"], ["Préparer l'argumentaire", "Arguments adaptés au profil du vendeur (prudent, pressé, attaché…)", "Le ton, la sincérité, la conformité"], ["Comparer des scénarios", "Tableau « vendre en l'état / après travaux » à partir de vos hypothèses", "Les hypothèses et les montants réels (devis, audit)"], ["Rédiger un compte rendu", "Mise au propre de vos notes de rendez-vous anonymisées", "La relecture et l'envoi"]], "intro": "Pour M. Bernard, quatre usages servent avant le rendez-vous : synthèse DVF, argumentaire, message de recontact, objections probables.", "caption": "Proposition pédagogique. Le message de recontact ne se rédige que pour un contact consenti, en rappelant l'objet de son accord.", "notes": "Tableau statique. Apparition ligne par ligne au clic ou en automatique (1 s). Narration : « Voici six usages réalistes. Remarquez la colonne de droite : à chaque fois, quelque chose reste entre vos mains. Pour M. Bernard, l'IA peut synthétiser l'export DVF de son secteur, préparer trois arguments, rédiger le message de confirmation du rendez-vous en rappelant ce qu'il a accepté, et lister ses objections probables. » Rappel conformité : le recontact de M. Bernard est possible car il a coché un accord nominatif (objet : DPE et estimation) — séquence 3."}, {"type": "steps_key", "eyebrow": "Unité 5.1 · Méthode", "title": "La consigne efficace en 4 éléments", "principle": "Une consigne vague donne une réponse vague. Quatre éléments suffisent pour obtenir un premier jet exploitable.", "steps_label": "Les 4 éléments", "steps": ["Rôle : « Tu es un conseiller immobilier spécialisé en valeur verte. »", "Contexte : « Maison chauffée à l'électricité, DPE F réalisé en 2023, secteur périurbain. »", "Tâche : « Rédige 3 arguments pour convaincre le vendeur de vérifier son étiquette DPE. »", "Format : « Ton simple et professionnel, 3 puces de 2 lignes maximum. »"], "key_phrase": "Le contexte décrit le bien, jamais la personne : ni nom, ni téléphone, ni adresse précise.", "stage_label": "Étape du parcours", "stage_value": "Projet vendeur · préparation du rendez-vous", "notes": "Méthode. Les 4 étapes apparaissent une par une, synchronisées avec la narration. Narration : « Une bonne consigne tient en quatre éléments. Le rôle : qui doit parler. Le contexte : le bien, sans jamais identifier la personne. La tâche : ce que vous attendez, avec un verbe d'action et une quantité. Le format : la longueur, le ton, la mise en forme. Avec ces quatre éléments, vous obtenez un premier jet, que vous retravaillez ensuite. »"}, {"type": "qcm", "eyebrow": "Unité 5.1 · Vérification", "title": "Quel élément manque à cette consigne ?", "question_label": "Question 1", "question": "Consigne : « Tu es un conseiller immobilier. Maison de 112 m², chauffage électrique, DPE F de 2023. Donne-moi des arguments. » Quel élément manque surtout ?", "options": ["Le rôle", "Le contexte", "Une tâche précise et un format", "Le nom du vendeur"], "answer": "C", "feedbacks": ["Le rôle est présent : « Tu es un conseiller immobilier. » On pourrait le préciser (valeur verte), mais ce n'est pas le manque principal.", "Le contexte est bien décrit : surface, chauffage, classe et année du DPE. C'est même la partie la plus complète.", "Exact. « Donne-moi des arguments » ne dit ni pour quoi faire, ni combien, ni sous quelle forme. Précisez : « 3 arguments pour qu'il vérifie son étiquette, 3 puces de 2 lignes. »", "Surtout pas : le nom du vendeur est une donnée personnelle. Il n'apporte rien à la réponse et ne doit pas être saisi dans un outil grand public."], "notes": "QCM noté, 1 point (poids 1). Une seule tentative, feedback sur calque après validation. Bouton « Suivant » débloqué après réponse."}, {"type": "case_form", "eyebrow": "Unité 5.1 · Atelier de consigne", "title": "Transformez une consigne vague en consigne efficace", "case_title": "Atelier : la consigne de votre collègue", "case_paras": ["Votre collègue a écrit : « Donne-moi des arguments pour un vendeur. »", "Vous préparez M. Bernard : maison de 112 m² chauffée à l'électricité, DPE F de mars 2023, secteur périurbain, deux agences annoncent −15 %.", "Réécrivez la consigne en 4 éléments. Le rôle est donné : « Tu es un conseiller immobilier spécialisé en valeur verte. »"], "inputs": ["Contexte (le bien, sans donnée personnelle)", "Tâche (verbe d'action + quantité + objectif)", "Format (ton, longueur, mise en forme)"], "answer": "Exemple de réponse : Contexte : « Maison de 112 m², chauffage électrique, DPE F réalisé en 2023, secteur périurbain ; le vendeur a reçu deux estimations en baisse de 15 %. » Tâche : « Rédige 3 arguments pour l'inviter à vérifier son étiquette DPE avant de fixer un prix. » Format : « Ton simple et professionnel, 3 puces de 2 lignes maximum, sans chiffre non sourcé. »", "feedbacks": ["Contexte : vous décrivez le bien (surface, énergie, classe, année, type de secteur) et la situation commerciale. Aucun nom, téléphone ni adresse précise.", "Tâche : un verbe d'action (rédige, liste, compare), une quantité (3 arguments) et un objectif (vérifier l'étiquette avant de fixer le prix).", "Format : ton, longueur et forme. Ajouter « sans chiffre non sourcé » limite le risque d'invention.", "Si vous avez écrit « M. Bernard » ou son adresse : retirez-les. L'IA n'en a pas besoin pour produire de bons arguments."], "button": "Comparer avec le modèle", "notes": "Atelier en saisie libre, non noté automatiquement (évaluation formative). Déclencheur : clic sur « Comparer avec le modèle » → calque Modèle avec la réponse et les feedbacks. Variable AtelierFait = vrai si au moins un champ est rempli ; bouton « Suivant » débloqué ensuite. Narration : « À vous. Votre collègue a écrit une consigne en une ligne. Complétez-la avec le contexte, la tâche et le format, puis comparez avec notre modèle. »"}, {"type": "recap", "eyebrow": "Unité 5.1 · Synthèse", "title": "Trois réflexes pour préparer avec l'IA", "cards": [{"title": "Choisir l'usage", "text": "Synthèse de marché, argumentaire, message de recontact, objections : l'IA prépare un premier jet, pas une décision."}, {"title": "Écrire en 4 éléments", "text": "Rôle, contexte, tâche, format. Le contexte décrit le bien, jamais la personne."}, {"title": "Retravailler", "text": "Vous relisez, adaptez au vendeur et à votre secteur, puis vous signez. Le recontact reste limité à l'objet de l'accord."}], "banner_label": "Rappel", "banner_text": "Avant le rendez-vous de M. Bernard : 4 consignes, 30 minutes, et chaque chiffre vérifié.", "notes": "Synthèse de l'unité 5.1. Apparition des cartes une par une. Narration : « Retenez trois réflexes : choisir le bon usage, écrire en quatre éléments, et retravailler avant de signer. »"}, {"type": "resource", "eyebrow": "Unité 5.1 · Ressource", "title": "Bibliothèque de consignes réutilisables", "items": ["Marché : « Tu es analyste immobilier. Voici un export DVF du secteur. Calcule médiane et fourchette au m² des maisons, en tableau. »", "Argumentaire : « Tu es conseiller en valeur verte. Vendeur [profil]. Propose 3 arguments adaptés, 3 puces courtes. »", "Recontact : « Rédige un message de 4 lignes rappelant que la personne a accepté d'être recontactée au sujet de [objet]. »", "Objections : « Liste les 5 objections probables d'un vendeur de maison classée F, avec une réponse de 2 lignes. »", "Rendez-vous : « Propose un déroulé de 45 min et 8 questions ouvertes pour découvrir le projet d'un vendeur. »", "Scénarios : « Compare vendre en l'état et vendre après travaux avec ces hypothèses : [montants]. Tableau 3 colonnes. »", "Compte rendu : « Mets au propre ces notes anonymisées en compte rendu de 10 lignes, ton professionnel. »"], "example_title": "Règle d'usage", "example_text": "Les crochets [ ] se remplacent par des informations sur le bien ou des hypothèses, jamais par un nom, un téléphone, une adresse précise ou un numéro de DPE rattaché à une personne. Chaque réponse est un premier jet à vérifier.", "pdf_label": "Télécharger la bibliothèque de consignes (PDF)", "sources": "Proposition pédagogique ÉCO-CONSULTANT. Données DVF : data.gouv.fr (DGFiP).", "notes": "Ressource téléchargeable : bouton PDF → fichier « Bibliotheque_consignes_IA.pdf » (à produire à partir de cet écran). Écran non noté. Narration : « Voici sept consignes prêtes à copier. Remplacez les crochets par les caractéristiques du bien, jamais par l'identité de votre client. » Source : DVF, données publiques de la DGFiP sur data.gouv.fr ; ne pas chercher à réidentifier les personnes à partir de DVF."}, {"type": "divider", "kicker": "Unité 5.2", "title": "Vérifier ce que produit l'IA", "notes": "Séparateur de l'unité 5.2 (≈ 9 min). Débloqué après l'unité 5.1. Animation d'entrée standard."}, {"type": "explain", "eyebrow": "Unité 5.2 · Explication", "title": "Pourquoi l'IA peut inventer avec aplomb", "paras": ["Un outil d'IA générative prédit la suite la plus probable d'un texte. Il ne consulte pas forcément une source officielle et ne sait pas toujours qu'il se trompe.", "Résultat : des « hallucinations », c'est-à-dire des chiffres, des dates ou des règles plausibles mais faux, présentés sans aucune hésitation.", "Les zones à risque pour un agent : coefficients et seuils DPE, dates réglementaires, statistiques de prix, références de textes."], "cards": [{"value": "Chiffre", "label": "toujours remonter à la source"}, {"value": "Date", "label": "vérifier la version en vigueur"}, {"value": "Règle", "label": "contrôler sur Légifrance"}, {"value": "Prévision", "label": "jamais présentée comme certaine"}], "caption": "Proposition pédagogique. Les réformes récentes (coefficient 2026, loi de 2025 sur le démarchage) sont souvent mal connues des outils.", "notes": "Explication. Les cartes apparaissent au clic. Narration : « L'IA ne ment pas volontairement : elle prédit des mots. Mais sur un coefficient, une date ou un pourcentage, une erreur dite avec assurance peut vous coûter votre crédibilité devant un vendeur. Plus la règle est récente, plus le risque est grand. »"}, {"type": "document", "eyebrow": "Unité 5.2 · Exercice", "title": "Trouvez les 3 erreurs dans cette réponse d'IA", "doc_title": "Réponse d'IA fictive · dossier M. Bernard (exemple)", "fields": [{"label": "Validité du DPE :", "value": "DPE de mars 2023, valable jusqu'en mars 2033", "useful": false, "feedback": "Correct : un DPE est valable 10 ans. Celui de mars 2023 reste valable jusqu'en mars 2033."}, {"label": "Coefficient électricité :", "value": "2,58 depuis le 1er janvier 2026", "useful": true, "feedback": "Erreur. Le coefficient est passé de 2,3 à 1,9 au 1er janvier 2026 (arrêté du 13 août 2025), puis 1,7 au 1er janvier 2027. 2,58 est une ancienne valeur, abandonnée depuis la réforme de 2021."}, {"label": "Nouvelle classe :", "value": "Votre maison passe en E, c'est certain", "useful": true, "feedback": "Erreur. Rien n'est certain sans recalcul : la classe dépend aussi du seuil d'émissions (double seuil). Seule l'attestation actualisée de l'ADEME, obtenue avec le numéro du DPE, le confirme."}, {"label": "Attestation :", "value": "Attestation actualisée gratuite sur l'observatoire ADEME", "useful": false, "feedback": "Correct : pour un DPE établi depuis le 1er juillet 2021, l'attestation est gratuite et sans nouvelle visite."}, {"label": "Décote nationale :", "value": "Une maison F se vend 25 % moins cher en France", "useful": true, "feedback": "Erreur. Ce chiffre national n'est pas sourcé. Les Notaires montrent un écart très variable selon les régions : citez toujours une région et une année."}, {"label": "Marché :", "value": "Prix −0,8 % sur un an au T2 2026 (Insee)", "useful": false, "feedback": "Correct : Insee, Informations rapides n° 216 du 8 septembre 2026. Les maisons sont à −1,3 %."}, {"label": "Audit énergétique :", "value": "Obligatoire à la vente d'une maison classée F", "useful": false, "feedback": "Correct : obligatoire pour les maisons classées F ou G depuis le 1er avril 2023, et E depuis le 1er janvier 2025."}], "instruction": "Cette réponse d'IA (fictive) prépare le rendez-vous de M. Bernard. Cliquez sur les 3 passages faux. Les autres sont exacts.", "side_note": "Exemple fictif construit pour l'exercice.", "counter": "Erreurs trouvées : 0 / 3", "notes": "Exercice noté : 3 zones utiles (erreurs), 4 zones pièges (passages exacts). Clic sur une zone → calque de feedback. Score : 1 point par erreur trouvée, −0,5 par passage exact cliqué (plancher 0), poids 3. Bouton « Suivant » débloqué quand les 3 erreurs sont trouvées ou après 2 tentatives. Narration : « Voici la réponse qu'un outil d'IA a donnée pour préparer le rendez-vous de M. Bernard. Trois passages sont faux. Trouvez-les. » Sources : arrêtés du 13/08/2025 et du 19/08/2026 (Légifrance) ; Insee IR n° 216 (8/09/2026) ; Notaires de France, étude valeur verte (transactions 2024, janv. 2026) ; ADEME, observatoire DPE-Audit."}, {"type": "table", "eyebrow": "Unité 5.2 · Explication", "title": "Les sources à utiliser pour vérifier", "headers": ["Source", "Ce que vous y vérifiez", "Exemple pour M. Bernard"], "rows": [["Insee", "Prix et volumes nationaux, indices trimestriels", "Prix −0,8 % sur un an au T2 2026, maisons −1,3 %"], ["Notaires de France", "Prix par secteur, études valeur verte par région et par année", "Écart de prix F-G dans sa région, transactions 2024"], ["DVF (data.gouv.fr)", "Ventes réelles du secteur : prix, surface, date", "Ventes de maisons comparables sur 24 mois"], ["ADEME (observatoire DPE-Audit)", "Existence du DPE, attestation actualisée", "Nouvelle étiquette avec le coefficient 1,9"], ["Légifrance", "Texte en vigueur : lois, décrets, arrêtés", "Arrêté du 13 août 2025 sur le coefficient"]], "intro": "Quand l'IA donne un chiffre, une date ou une règle, vous remontez à l'une de ces sources avant de le répéter.", "caption": "Sources officielles : insee.fr, notaires.fr, data.gouv.fr (DVF), observatoire-dpe-audit.ademe.fr, legifrance.gouv.fr.", "notes": "Tableau de référence, non noté. Narration : « Cinq sources suffisent pour vérifier presque tout ce que l'IA vous dira sur le marché et le DPE. Notez-les : l'Insee, les Notaires, DVF, l'ADEME et Légifrance. » Vérifier les URL lors de l'intégration."}, {"type": "steps_key", "eyebrow": "Unité 5.2 · Méthode", "title": "Vérifier une réponse d'IA en 4 gestes", "principle": "Tout chiffre, toute date et toute règle sortis d'une IA sont des hypothèses tant que vous ne les avez pas retrouvés à la source.", "steps_label": "Les 4 gestes", "steps": ["Surligner chaque chiffre, date, pourcentage et référence de texte.", "Retrouver chacun dans une source officielle (Insee, Notaires, DVF, ADEME, Légifrance).", "Vérifier la date et le périmètre : national ou local, année, type de bien.", "Corriger, citer la source, ou supprimer ce qui reste invérifiable."], "key_phrase": "« Ce chiffre vient de l'Insee, publication de septembre 2026 : je vous montre la source. »", "stage_label": "Règle de prudence n° 1", "stage_value": "Vérifier chaque chiffre", "notes": "Méthode. Étapes révélées une à une. Narration : « Quatre gestes. Surligner, retrouver, vérifier la date et le périmètre, puis corriger ou supprimer. Et devant le vendeur, citez la source : c'est ce qui vous distingue de ceux qui récitent. »"}, {"type": "dialogue", "eyebrow": "Unité 5.2 · Simulation", "title": "M. Bernard a, lui aussi, interrogé une IA", "persona_name": "M. Bernard", "opening": "« J'ai demandé à une intelligence artificielle. Elle dit qu'avec la réforme, ma maison passe en E. Donc je peux afficher le prix d'une maison classée E, non ? »", "options": ["« Oui, l'IA a raison : vous êtes en E, on affiche le prix d'une maison E. »", "« C'est possible, mais pas certain. On vérifie maintenant avec le numéro de votre DPE sur le site de l'ADEME : c'est gratuit. »", "« Ces outils racontent n'importe quoi, oubliez ça. »"], "tree": "Nœud 1 (ouverture).\nA → M. Bernard : « Parfait, alors je mets le prix d'une maison E. » Confiance −15. Nœud 2A : un acquéreur demande le DPE, la classe officielle reste F tant que rien n'a été actualisé. M. Bernard : « Vous m'aviez dit E ! » Confiance −20. Verdict : échec — vous avez repris une affirmation non vérifiée et engagé votre crédibilité.\nB → M. Bernard : « D'accord, et comment on fait ? » Confiance +20. Nœud 2B, deux réponses :\n  B1 « On saisit ensemble le numéro ADEME à 13 caractères de votre DPE ; si l'attestation actualisée confirme E, elle remplace l'étiquette jusqu'en mars 2033. » Confiance +15. Verdict : réussite — vérification, source et méthode.\n  B2 « Je vous promets que ce sera E. » Confiance −10. Verdict : partiel — bonne intention, mais une promesse de classe n'est jamais permise.\nC → M. Bernard : « Vous me prenez pour un idiot ? » Confiance −10. Nœud 2C : vous pouvez rattraper avec « Votre question est bonne, vérifions ensemble » (+10, verdict partiel) ou insister (−10, verdict échec).\nScore : réussite = 2 points, partiel = 1 point, échec = 0 (poids 2).", "meter_label": "Confiance de M. Bernard", "notes": "Dialogue ramifié noté (voir arbre). Jauge de confiance initialisée à 50, bornée 0-100. Chaque choix → calque réplique + mise à jour de la jauge. Bouton « Recommencer » disponible en cas d'échec. Narration (ouverture) : voix de M. Bernard (voix ElevenLabs « homme 60 ans, posé »). Fait vérifié : attestation actualisée gratuite pour les DPE établis depuis le 1/07/2021, valable jusqu'à la fin de validité du DPE d'origine (ADEME).", "graph": {"start": "n1", "initial": 50, "nodes": {"n1": {"him": "« J'ai demandé à une intelligence artificielle. Elle dit qu'avec la réforme, ma maison passe en E. Donc je peux afficher le prix d'une maison classée E, non ? »", "opts": [{"text": "« Oui, l'IA a raison : vous êtes en E, on affiche le prix d'une maison E. »", "delta": -15, "next": "end", "why": "Vous avez repris une affirmation non vérifiée et engagé votre crédibilité : un acquéreur demande le DPE, la classe officielle reste F tant que rien n'a été actualisé.", "end_him": "« Parfait, alors je mets le prix d'une maison E. » … Plus tard, un acquéreur demande le DPE : la classe officielle reste F. « Vous m'aviez dit E ! »", "force_verdict": "bad"}, {"text": "« C'est possible, mais pas certain. On vérifie maintenant avec le numéro de votre DPE sur le site de l'ADEME : c'est gratuit. »", "delta": 20, "next": "n2b", "why": "Vous ne confirmez ni n'infirmez : vous proposez une vérification gratuite à la source."}, {"text": "« Ces outils racontent n'importe quoi, oubliez ça. »", "delta": -10, "next": "n2c", "why": ""}]}, "n2b": {"him": "« D'accord, et comment on fait ? »", "opts": [{"text": "« On saisit ensemble le numéro ADEME à 13 caractères de votre DPE ; si l'attestation actualisée confirme E, elle remplace l'étiquette jusqu'en mars 2033. »", "delta": 15, "next": "end", "why": "Vérification, source et méthode."}, {"text": "« Je vous promets que ce sera E. »", "delta": -10, "next": "end", "why": "Bonne intention, mais une promesse de classe n'est jamais permise."}]}, "n2c": {"him": "« Vous me prenez pour un idiot ? »", "opts": [{"text": "« Votre question est bonne, vérifions ensemble. »", "delta": 10, "next": "end", "why": "Rattrapage : vous revenez à la vérification."}, {"text": "« Je maintiens : ces outils racontent n'importe quoi. »", "delta": -10, "next": "end", "why": "Vous insistez au lieu de vérifier."}]}}, "ends": [{"min": 80, "no_negative": true, "him": "« Très bien, on vérifie ça ensemble. »", "verdict": "Réussite", "feedback": "Vérification, source et méthode : vous n'avez ni repris ni balayé l'affirmation de l'IA, vous avez proposé l'attestation actualisée ADEME, gratuite."}, {"min": 50, "him": "« Bon… on verra ce que dit l'attestation. »", "verdict": "Partiel", "feedback": "Bonne intention, mais une promesse de classe n'est jamais permise, et balayer la question braque votre interlocuteur. Proposez simplement de vérifier ensemble avec le numéro ADEME du DPE."}, {"min": 0, "him": "« Je vais demander à quelqu'un d'autre. »", "verdict": "Échec", "feedback": "Ne reprenez jamais une affirmation non vérifiée, et ne la balayez pas non plus : vérifiez avec l'attestation actualisée ADEME avant toute annonce."}]}}, {"type": "two_cols", "eyebrow": "Unité 5.2 · Limites", "title": "Ce que vous reprenez d'une IA, ce que vous n'en reprenez pas", "left_title": "Vous pouvez reprendre", "left_items": ["Une structure de rendez-vous ou de compte rendu", "Une formulation que vous avez relue et adaptée", "Un chiffre retrouvé à la source, cité avec sa date"], "right_title": "Vous ne reprenez pas", "right_items": ["Une classe DPE « certaine » sans attestation ni recalcul", "Une décote nationale sans source, région ni année", "Une règle juridique non vérifiée sur Légifrance", "Une prévision de prix présentée comme acquise"], "footer_title": "Règle de prudence n° 3", "footer_text": "Garder la main : vous relisez, corrigez et signez. Vous restez responsable de ce que vous dites et écrivez, même si une IA l'a rédigé.", "notes": "Écran Limites. Colonne gauche puis droite au clic. Narration : « Ce que l'IA vous donne est un brouillon. Une classe certaine, une décote nationale, une règle non vérifiée : vous ne les reprenez jamais tels quels. Vous restez responsable de chaque mot. »"}, {"type": "recap", "eyebrow": "Unité 5.2 · Synthèse", "title": "Vérifier avant de parler", "cards": [{"title": "Se méfier", "text": "L'IA peut inventer un chiffre, une date ou une règle avec aplomb, surtout sur les réformes récentes."}, {"title": "Remonter", "text": "Insee, Notaires, DVF, ADEME, Légifrance : chaque information retrouvée et datée."}, {"title": "Citer", "text": "Devant le vendeur, vous citez la source. Ce qui reste invérifiable, vous le supprimez."}], "banner_label": "M. Bernard", "banner_text": "Sa nouvelle classe se vérifie avec le numéro de son DPE sur l'observatoire de l'ADEME, jamais avec une IA.", "notes": "Synthèse de l'unité 5.2. Cartes une par une. Narration : « Se méfier, remonter à la source, citer. Trois réflexes qui font de vous un professionnel fiable. »"}, {"type": "divider", "kicker": "Unité 5.3", "title": "Données personnelles et IA", "notes": "Séparateur de l'unité 5.3 (≈ 10 min). Débloqué après l'unité 5.2. Animation d'entrée standard."}, {"type": "persona", "eyebrow": "Unité 5.3 · Accroche", "title": "Mme Leroy a collé tout le dossier dans un chatbot", "initials": "ML", "name": "Mme Leroy", "role": "Négociatrice · personnage fictif", "facts": ["Utilise une IA grand public sur son téléphone, compte personnel", "A collé les notes de rendez-vous de M. Bernard", "Avec nom, téléphone, adresse et numéro du DPE", "N'a jamais ouvert les paramètres de l'outil"], "quote": "« Je voulais juste un compte rendu propre. Ce n'est pas grave, si ? »", "right_paras": ["Le compte rendu est réussi. Mais des données personnelles d'un client sont parties vers un service dont elle ne maîtrise ni la conservation, ni la réutilisation.", "Ce réflexe est fréquent. Il se corrige en deux minutes."], "question": "Qu'aurait-elle dû faire pour obtenir le même compte rendu sans exposer M. Bernard ?", "notes": "Accroche de l'unité 5.3. Personnage fictif (Mme Leroy) ; M. Bernard reste le fil rouge. Narration : « Mme Leroy voulait gagner du temps. Elle a collé tout le dossier de M. Bernard dans un chatbot grand public. Le résultat est bon. Le problème, c'est ce qu'elle a donné pour l'obtenir. »"}, {"type": "objectives", "eyebrow": "Unité 5.3 · Objectifs", "title": "Ce que vous saurez faire", "items": ["Repérer les données personnelles à ne pas saisir dans un outil grand public", "Anonymiser une information avant de la confier à une IA", "Choisir des paramètres et des outils qui protègent vos clients", "Situer les obligations de transparence de l'AI Act en 2026"], "side_title": "Durée", "side_note": "≈ 10 minutes · 1 classement, 1 question", "footer": "Cadre : RGPD (règlement UE 2016/679) et règlement UE 2024/1689 sur l'IA (AI Act).", "notes": "Écran d'objectifs. Items un par un. Narration : « Dans cette unité : ce que vous pouvez saisir, comment anonymiser, comment régler vos outils, et ce que l'AI Act change en 2026. »"}, {"type": "explain", "eyebrow": "Unité 5.3 · Explication", "title": "Vos clients vous confient leurs données, pas à l'IA", "paras": ["Le RGPD s'applique à toute information qui identifie une personne, directement ou indirectement : nom, téléphone, e-mail, adresse précise, mais aussi un numéro de DPE ou une référence cadastrale rattachés à un propriétaire.", "Dans un outil grand public, ce que vous saisissez peut être conservé, voire servir à entraîner le modèle selon les paramètres. Désactivez cette option et lisez les conditions.", "Pour traiter des données clients, privilégiez un outil professionnel avec engagements contractuels : pas d'entraînement sur vos données, conservation limitée, hébergement connu."], "cards": [{"value": "Décrire", "label": "le bien, pas la personne"}, {"value": "Anonymiser", "label": "avant de coller un texte"}, {"value": "Régler", "label": "désactiver l'entraînement"}, {"value": "Choisir", "label": "un outil pro avec garanties"}], "caption": "Règle de prudence n° 2. Sources : RGPD, art. 4 et 28 ; CNIL, recommandations sur l'IA (cnil.fr). Paramètres variables selon les outils : vérifier les conditions.", "notes": "Explication. Cartes au clic. Narration : « Vos clients vous confient leurs données à vous, pas à un outil gratuit. Décrivez le bien sans décrire la personne, anonymisez ce que vous collez, réglez vos paramètres, et pour les dossiers clients, utilisez un outil professionnel qui s'engage par contrat. » Sources : RGPD art. 4 (définition de la donnée personnelle), art. 28 (sous-traitant) ; CNIL, dossier IA (cnil.fr/fr/intelligence-artificielle). [À VALIDER] : formulation juridique sur l'outil professionnel (relecture DPO)."}, {"type": "two_cols", "eyebrow": "Unité 5.3 · Méthode", "title": "Anonymiser avant de saisir", "tone": "neutral", "left_title": "Avant (à ne pas coller)", "left_items": ["« M. Bernard, 06 xx xx xx xx, 12 rue des Lilas »", "« DPE n° 2369E0123456X, réalisé en mars 2023 »", "« Il divorce et doit vendre vite »"], "right_title": "Après (saisissable)", "right_items": ["« Vendeur, maison de 112 m² en secteur périurbain »", "« DPE F réalisé en 2023, chauffage électrique »", "« Vendeur qui souhaite un délai de vente court »"], "footer_title": "Réflexe", "footer_text": "Remplacez l'identité par un rôle, l'adresse par un type de secteur, le numéro par une classe et une année. La situation personnelle ne sort pas de votre dossier.", "notes": "Avant / après en mode neutre. Exemple fictif : nom, numéro de téléphone masqué, adresse et numéro de DPE inventés. Narration : « Anonymiser, c'est simple : un rôle à la place du nom, un type de secteur à la place de l'adresse, une classe et une année à la place du numéro de DPE. Et la vie privée du vendeur reste dans votre dossier. »"}, {"type": "sort", "eyebrow": "Unité 5.3 · Exercice", "title": "Quelles données puis-je saisir dans un outil grand public ?", "items": ["Maison de 112 m², chauffage électrique, DPE F de 2023, secteur périurbain", "Prix médian au m² des maisons du secteur, calculé à partir de DVF", "Nom et numéro de téléphone de M. Bernard", "Notes de rendez-vous avec le nom du vendeur et sa situation familiale", "Numéro ADEME du DPE de M. Bernard", "Compte rendu de visite où l'acquéreur est cité par son nom"], "categories": ["Oui, tel quel", "Oui, après anonymisation", "Non"], "answers": [0, 0, 2, 1, 2, 1], "whys": ["Ces caractéristiques décrivent le bien sans identifier la personne : elles se saisissent telles quelles.", "Une statistique agrégée de secteur ne vise personne. Restez sur des médianes et ne cherchez pas à réidentifier les vendeurs à partir de DVF.", "Données directement identifiantes : elles ne vont jamais dans un outil grand public, et l'IA n'en a pas besoin.", "Retirez le nom et la situation familiale, qui relève de la vie privée. Le reste (attentes, calendrier) peut être saisi sous forme anonyme.", "Un numéro de DPE est rattaché à un logement et donc à son propriétaire. Il se saisit sur l'observatoire de l'ADEME, pas dans un chatbot.", "Remplacez le nom par « l'acquéreur » et retirez tout détail identifiant : le compte rendu devient saisissable."], "notes": "Classement noté : 1 point par item bien placé, poids 2 (seuil de réussite 5/6). Glisser-déposer vers 3 zones ; validation par bouton « Valider » ; 2 tentatives. Narration : « Classez ces six informations : saisissables telles quelles, saisissables après anonymisation, ou à ne jamais saisir dans un outil grand public. »"}, {"type": "timeline", "eyebrow": "Unité 5.3 · Réglementation", "title": "L'AI Act : les dates qui vous concernent", "events": [{"date": "2 février 2025", "title": "Maîtrise de l'IA (art. 4)", "text": "Les entreprises qui utilisent l'IA prennent des mesures pour former leurs équipes. Obligation assouplie mais maintenue en 2026."}, {"date": "27 juillet 2026", "title": "Omnibus numérique IA", "text": "Entrée en vigueur d'un règlement modificatif : report des obligations « haut risque », transparence maintenue."}, {"date": "2 août 2026", "title": "Transparence (art. 50)", "text": "Chatbots signalés comme IA ; hypertrucages et textes d'intérêt public générés par IA signalés par celui qui les publie."}, {"date": "2 décembre 2026", "title": "Marquage technique", "text": "Fin du délai pour le marquage lisible par machine des contenus, pour les outils déjà sur le marché (obligation des éditeurs)."}], "cards": [{"title": "Pour l'agent", "text": "Prudence : signalez toute photo retouchée ou générée par IA et ne montrez jamais un état du bien qui n'existe pas."}, {"title": "Chatbot sur votre site", "text": "Le visiteur doit savoir qu'il parle à une IA. Vérifiez-le avec votre prestataire."}], "notes": "Frise statique, événements au clic. Narration : « L'AI Act s'applique par étapes. Depuis le 2 août 2026, les obligations de transparence sont en vigueur : un chatbot doit se présenter comme une IA, et un contenu truqué doit être signalé. Pour vous, l'essentiel : ne jamais laisser croire qu'une image générée est une photo réelle du bien, et assumer chaque texte que vous publiez. » Sources : règlement (UE) 2024/1689, art. 4 et 50 ; Digital Omnibus on AI, entré en vigueur le 27/07/2026 (JO L 2026/1744 selon ki-campus.org) ; houthoff.com et dpocentre.com (analyses, 2026). [À VALIDER] relecture juridique : l'art. 50(4) vise les hypertrucages et les textes publiés pour informer le public sur des questions d'intérêt public, sauf relecture humaine avec responsabilité éditoriale ; une annonce immobilière relue par l'agent n'est pas clairement visée. La carte « Pour l'agent » est une recommandation de prudence (aussi au titre des pratiques commerciales trompeuses), pas une citation de l'AI Act."}, {"type": "qcm", "eyebrow": "Unité 5.3 · Vérification", "title": "Rédiger le recontact de M. Bernard avec une IA", "question_label": "Question 2", "question": "Vous voulez qu'un outil d'IA grand public rédige le message de recontact de M. Bernard. Que saisissez-vous ?", "options": ["Son nom, son téléphone et son adresse, pour un message personnalisé", "L'objet de son accord (DPE et estimation) et le type de bien, puis vous ajoutez son nom vous-même", "Rien : il est interdit d'utiliser une IA pour un message client", "Le numéro de son DPE, pour que l'IA calcule sa nouvelle classe"], "answer": "B", "feedbacks": ["Non : ces données identifiantes n'ont rien à faire dans un outil grand public. La personnalisation se fait après, par vous.", "Exact. L'IA rédige un modèle qui rappelle l'objet précis de son accord ; vous ajoutez le nom, relisez et envoyez. Données protégées, consentement respecté.", "Non : l'IA est un outil de rédaction comme un autre. Ce qui compte, c'est ce que vous y saisissez et le fait que vous relisez et signez.", "Non : le numéro de DPE est rattaché à son logement, et la nouvelle classe se vérifie sur l'observatoire de l'ADEME, pas par une IA."], "notes": "QCM noté, 1 point (poids 1). Une tentative, feedback sur calque. Rappel conformité : le recontact est couvert par l'accord nominatif de M. Bernard, limité à son objet (DPE et estimation), révocable à tout moment (séquence 3)."}, {"type": "recap", "eyebrow": "Unité 5.3 · Synthèse", "title": "Protéger vos clients quand vous utilisez l'IA", "cards": [{"title": "Ne pas saisir", "text": "Nom, téléphone, adresse précise, numéro de DPE lié à une personne, situation personnelle : jamais dans un outil grand public."}, {"title": "Anonymiser et régler", "text": "Un rôle à la place du nom, un secteur à la place de l'adresse. Entraînement désactivé, outil pro pour les dossiers clients."}, {"title": "Être transparent", "text": "Chatbot présenté comme IA, image générée signalée, texte publié relu et assumé par vous."}], "banner_label": "Mme Leroy", "banner_text": "Avec des notes anonymisées, elle aurait obtenu le même compte rendu, sans exposer M. Bernard.", "notes": "Synthèse de l'unité 5.3. Cartes une par une. Narration : « Ne pas saisir, anonymiser et régler, être transparent. Mme Leroy aurait eu le même résultat, sans risque pour son client. »"}, {"type": "resource", "eyebrow": "Unité 5.3 · Ressource", "title": "Votre charte IA en 3 règles de prudence", "items": ["1. Vérifier chaque chiffre : source officielle, date et périmètre, ou suppression.", "2. Protéger les données personnelles : décrire le bien, jamais la personne ; anonymiser ; outil pro pour les dossiers clients.", "3. Garder la main : vous relisez, corrigez et signez. Vous restez responsable de ce que vous dites et publiez.", "Paramètres : désactiver l'entraînement sur vos conversations dans les outils grand public.", "Transparence : signaler un visuel généré ou retouché par IA ; un chatbot se présente comme une IA.", "Consentement : un message de recontact rappelle l'objet précis de l'accord, que l'IA l'ait rédigé ou non."], "example_title": "À afficher près de votre poste", "example_text": "« L'IA prépare, je vérifie, je décide. » Avant chaque rendez-vous : 4 consignes en rôle, contexte, tâche, format ; 5 sources pour vérifier (Insee, Notaires, DVF, ADEME, Légifrance) ; zéro donnée identifiante dans un outil grand public.", "pdf_label": "Télécharger la charte IA de l'Éco-Consultant (PDF)", "sources": "RGPD (UE 2016/679) ; règlement (UE) 2024/1689 (AI Act), art. 4 et 50 ; CNIL. Proposition pédagogique ÉCO-CONSULTANT.", "notes": "Ressource téléchargeable : bouton PDF → « Charte_IA_Eco-Consultant.pdf ». Écran non noté. Narration : « Voici votre charte : trois règles de prudence et trois réflexes. Imprimez-la, affichez-la. » [À VALIDER] : formulation transparence (relecture juridique AI Act)."}, {"type": "bilan", "title": "Séquence validée", "text": "Vous savez préparer un rendez-vous avec l'IA, vérifier ce qu'elle produit et protéger vos clients.", "notes": "Fin de séquence 5. Score global = QCM 1 (1) + document (3) + dialogue (2) + classement (2) + QCM 2 (1) = 9 points ; seuil 70 % pour débloquer la séquence 6 (cas fil rouge M. Bernard). Envoi du score au LMS (SCORM). Narration : « Séquence validée. Prochaine étape : le cas complet de M. Bernard, du premier contact à l'acte. »", "badge": "Expert|IA immobilière"}, {"type": "divider", "kicker": "Séquence 6", "title": "Cas fil rouge : M. Bernard", "notes": "Écran d'ouverture de la séquence 6 (35 min). Bouton « Commencer » → slide 2. Séquence débloquée à 70 % de la séquence 5. Initialiser les variables Storyline : Confiance = 40 (numérique, bornée 0-100), Alerte = Faux (booléen, passe à Vrai en cas de promesse de classe ou de prix, de contact hors accord ou de pression à la signature), ScoreEtapes = 0, Etape = 0, E2_Prepa = Faux, E3_Choix = « », E4_Ok = Faux, Verdict = « ». Narration : « Séquence 6. Le cas de M. Bernard, du premier regard sur son dossier jusqu'à la fin du rendez-vous. »"}, {"type": "divider", "kicker": "Unité 6.1", "title": "Simulation complète en 9 étapes", "notes": "Séparateur de l'unité 6.1 (unique unité de la séquence). Durée cible : 35 min. Navigation libre en arrière, verrouillée en avant : chaque étape se débloque quand son activité est validée (bouton Suivant masqué jusqu'à l'état « Validé »). Narration : « Neuf étapes, une seule visite. Vos choix modifient la suite. »"}, {"type": "video", "title": "Sébastien : « Neuf étapes, une seule chance »", "label": "Emplacement de la capsule HeyGen (75 s) · avatar SEB", "notes": "Capsule HeyGen d'ouverture, avatar SEB, plan poitrine, fond bureau agence, environ 75 s. Sous-titres activés. Bouton Suivant débloqué à la fin de la vidéo (déclencheur : quand la vidéo se termine). Script complet : « Bonjour, c'est Sébastien. M. Bernard, vous le connaissez depuis le début de cette formation : sa maison de 112 mètres carrés chauffée à l'électricité, son DPE F de 2023, et ces deux agences qui lui ont annoncé moins 15 %. Aujourd'hui, vous allez l'accompagner pour de bon, du premier regard sur son dossier jusqu'à la fin du rendez-vous. Neuf étapes, dans l'ordre où vous les vivrez sur le terrain : analyser la situation, préparer vos questions, le rappeler dans les règles, lui expliquer son DPE, construire la valeur, préparer la stratégie de vente, répondre à ses objections, présenter vos engagements, et conclure. Attention : chaque choix compte. En haut de l'écran, une jauge mesure la confiance de M. Bernard. Une classe promise, un prix lancé sans méthode, un appel en dehors de son accord, et la jauge chute. Et comme dans la vraie vie, certaines erreurs se paient plus tard dans le rendez-vous. Mon conseil : ralentissez. Vérifiez avant d'affirmer, écrivez ce que vous promettez, et donnez-lui toujours une prochaine étape claire. On y va. »"}, {"type": "persona", "eyebrow": "Le cas · Janvier 2027", "title": "M. Bernard veut une estimation crédible", "initials": "MB", "name": "M. Bernard (fictif)", "role": "Propriétaire d'une maison individuelle", "facts": ["Maison de 112 m², chauffage tout électrique", "DPE F de mars 2023 : 165 kWh/m²/an en énergie finale, 13 kgCO₂/m²/an", "Deux agences annoncent une décote de −15 % « à cause du F »", "Le 03/10/2026, a coché : « J'accepte d'être recontacté par [votre agence] au sujet de mon DPE… »", "Méfiant envers la prospection : ne décroche plus aux numéros inconnus"], "quote": "« Avant de signer avec qui que ce soit, je veux savoir ce que vaut vraiment ma maison. Et je ne veux pas être harcelé. »", "right_paras": ["Nous sommes en janvier 2027 : le coefficient de l'électricité du DPE est de 1,7 depuis le 1er janvier.", "Il a accepté d'être recontacté au sujet de son DPE et de l'estimation de son bien. Cet accord vous autorise à l'appeler. Il ne vous garantit pas sa confiance."], "question": "Comment transformer cet accord en rendez-vous, puis en mandat, sans rien promettre que vous ne pouvez pas prouver ?", "notes": "Accroche du cas. Personnage fictif : mention « (fictif) » visible à l'écran. Texte complet de la case cochée affiché au survol de la 4e ligne (calque « Accord ») : « J'accepte d'être recontacté par [votre agence] au sujet de mon DPE et de l'estimation de mon bien », coché le 03/10/2026, horodaté, avec durée de 12 mois et modalités de retrait indiquées sur le formulaire. Narration : « Voici M. Bernard. Il a coché une case, il a deux estimations à moins 15 %, et il ne fait plus confiance aux agents. Votre mission : l'accompagner jusqu'au bout, dans les règles. » Sources : arrêté du 19/08/2026 (NOR VLOL2617030A) pour le coefficient 1,7 ; décret n° 2026-662 du 23/07/2026 pour le consentement."}, {"type": "objectives", "eyebrow": "Objectif", "title": "Ce que vous saurez faire à la fin du cas", "items": ["Analyser une situation vendeur et en repérer l'enjeu réel", "Préparer et conduire un contact conforme à l'accord du propriétaire", "Expliquer le DPE et l'attestation ADEME sans promettre de classe", "Construire une valeur et un plan de vente défendables par écrit", "Traiter les objections et conclure sur une étape datée et conforme"], "intro_label": "À la fin de la simulation, vous saurez :", "stats": [{"value": "9", "label": "étapes, chacune avec un écran de décision"}, {"value": "40 / 100", "label": "confiance de M. Bernard au départ"}, {"value": "70 %", "label": "score requis pour débloquer la séquence 7"}], "footer": "Simulation ramifiée : vos choix modifient la suite du rendez-vous.", "notes": "Écran d'objectifs. La jauge « Confiance de M. Bernard » (variable Confiance, départ 40) est affichée en haut à droite sur toutes les slides d'étape (calque maître). Narration : « Neuf étapes, une jauge de confiance qui part de 40 sur 100, et un objectif : 70 % pour valider. Les règles de calcul sont sur l'écran suivant. »"}, {"type": "table", "eyebrow": "Règles du jeu", "title": "Comment votre score est calculé", "intro": "Chaque étape est notée. Chaque choix fait aussi monter ou baisser la confiance de M. Bernard, qui conditionne la fin du rendez-vous.", "headers": ["Étape", "Poids", "Effet sur la confiance"], "rows": [["1-2 · Analyser, préparer", "10 + 10", "+5 / +10 ; −5 si préparation incomplète"], ["3 · Contact conforme", "15", "+10 ; −20 et alerte si contact hors accord"], ["4 · Expliquer le DPE", "10", "+15 ; −15 et alerte si une classe est promise"], ["5 · Éléments de valeur", "10", "+10 ; −5 si une décote forfaitaire est retenue"], ["6 · Stratégie de vente", "10", "+10 si 5/6 au moins ; +5 si 4/6"], ["7 · Objections", "15", "de −30 à +30 selon le dialogue"], ["8-9 · Engagements, conclusion", "10 + 10", "+10 / +10 ; −15 à −20 et alerte si promesse ou pression"]], "caption": "Score final = 60 % notes des étapes + 40 % confiance finale. Une alerte plafonne le score à 60 %. Validation à 70 %. Proposition pédagogique.", "notes": "Règles de score global (à implémenter dans Storyline). ScoreEtapes = somme pondérée des 9 activités (poids 10/10/15/10/10/10/15/10/10 = 100). ScoreFinal = 0,6 × ScoreEtapes + 0,4 × Confiance (bornée 0-100). Si Alerte = Vrai, ScoreFinal = min(ScoreFinal ; 60). Verdict en fin de parcours : Confiance ≥ 80 et Alerte = Faux → « Mandat exclusif signé » ; Confiance 50 à 79 → « M. Bernard réfléchit » ; Confiance < 50 → « Il choisit une autre agence ». Rapport SCORM : score.scaled = ScoreFinal / 100 ; statut « passed » si ScoreFinal ≥ 70. Les tentatives suivantes sont autorisées (meilleur score conservé) ; le dialogue de l'étape 7 peut être rejoué hors notation. Narration : « Trois règles : chaque étape compte, la confiance compte, et une seule promesse intenable plafonne votre score à 60 %. »"}, {"type": "qcm", "eyebrow": "Étape 1/9 · Analyser la situation", "title": "Quel est le vrai enjeu du dossier ?", "question_label": "Étape 1", "question": "Vous ouvrez le dossier de M. Bernard. Avant tout appel, quel est l'enjeu réel de sa situation ?", "options": ["Le prix : il faut s'aligner sur les −15 % des autres agences pour ne pas perdre le mandat.", "La fiabilité de l'étiquette et de l'estimation : son DPE date de 2023, le coefficient a changé deux fois, et il veut une valeur qu'il peut vérifier.", "L'exclusivité : il faut la décrocher dès le premier rendez-vous, avant les autres agences.", "Sa méfiance : mieux vaut éviter de parler du DPE, un sujet qui fâche."], "answer": "B", "feedbacks": ["Vous reprenez une décote construite sur une étiquette de 2023 peut-être dépassée. Vous devenez la troisième agence interchangeable. Confiance +0.", "Oui. Le DPE de 2023 a été calculé avec un coefficient de 2,3 ; il est de 1,7 en janvier 2027. Son étiquette, donc la décote des autres agences, est peut-être dépassée. Et il veut une estimation qu'il peut vérifier. Confiance +5.", "L'exclusivité se mérite par des preuves et des engagements. La demander d'entrée, à un vendeur méfiant, la rend suspecte. Confiance −5.", "Le DPE est justement votre levier : c'est l'objet de son accord de recontact. L'éviter, c'est renoncer à ce qui vous distingue. Confiance +0."], "notes": "Étape 1, activité notée (poids 10). Une seule tentative notée ; bouton « Valider » puis calque de feedback avec avatar Sébastien. Déclencheurs : B → Confiance + 5 ; C → Confiance − 5 ; A et D → 0. Branche : si C est choisi, la réplique d'accueil de M. Bernard à l'étape 3 devient plus froide (« Encore un qui veut mon exclusivité ? »). Narration : « Première étape : regardez le dossier comme un professionnel. Qu'est-ce qui se joue vraiment ? » Source coefficients : arrêtés du 13/08/2025 et du 19/08/2026."}, {"type": "sort", "eyebrow": "Étape 2/9 · Informations manquantes", "title": "Ce qu'il vous manque avant le rendez-vous", "items": ["Copie du DPE avec son numéro ADEME (13 caractères)", "Surface habitable, année de construction, copropriété ou lotissement ou non", "Travaux réalisés depuis mars 2023, avec factures", "Projet de M. Bernard : motif, délai, prochain logement", "Ventes réelles de maisons comparables du secteur (DVF)", "Revenus, épargne et crédits en cours de M. Bernard"], "categories": ["Demander à M. Bernard", "Rechercher vous-même", "Ne pas collecter"], "answers": [0, 0, 0, 0, 1, 2], "whys": ["Le numéro ADEME permet de télécharger l'attestation actualisée gratuite. Il figure sur son DPE : demandez-lui une copie.", "Ces données fixent la valeur intrinsèque et les obligations (statut de copropriété, règlement de lotissement). Demandez-les puis recoupez avec le DPE et le titre.", "Des travaux depuis 2023 peuvent rendre le DPE obsolète : un nouveau DPE est alors recommandé plutôt que l'attestation.", "Sans projet ni délai, pas de stratégie de vente. C'est aussi ce qui dira si un mandat est pertinent.", "DVF publie les ventes réelles (prix, date, surface). C'est à vous de les relever avant la visite, pas au vendeur.", "Ces données ne sont pas nécessaires pour estimer et vendre son bien. Principe de minimisation du RGPD : vous ne les collectez pas."], "notes": "Étape 2, activité notée (poids 10) : 1 point par item bien classé, score sur 6. Glisser-déposer, bouton « Valider ». Déclencheurs : 6/6 ou 5/6 → Confiance + 10 et E2_Prepa = Vrai ; 4/6 → Confiance + 5 ; 3/6 ou moins → Confiance − 5 et E2_Prepa = Faux. Branche : si E2_Prepa = Faux, à l'étape 4 un calque s'ouvre avant le cas (« Vous n'avez pas le numéro ADEME : il faut le lui demander pendant le rendez-vous, il soupire. » Confiance − 5 supplémentaire). Narration : « Avant d'appeler, faites la liste de ce qu'il vous manque. Et de ce que vous n'avez pas à demander. » Sources : observatoire DPE-Audit ADEME (numéro à 13 caractères) ; DVF, data.gouv.fr (https://www.data.gouv.fr/fr/datasets/demandes-de-valeurs-foncieres/) ; RGPD art. 5.1.c (minimisation)."}, {"type": "qcm", "eyebrow": "Étape 3/9 · Approche conforme", "title": "Comment reprenez-vous contact ?", "question_label": "Étape 3", "question": "Lundi 4 janvier 2027. Son accord date du 03/10/2026 et porte sur son DPE et l'estimation de son bien. Comment le contactez-vous ?", "options": ["Appel identifié : vous vous présentez, rappelez la date et l'objet de son accord, proposez la vérification de son DPE et un rendez-vous, et rappelez qu'il peut retirer son accord.", "SMS « Estimation offerte, frais réduits ce mois-ci » à lui et à ses voisins du lotissement.", "Appel depuis un numéro masqué, puisqu'il ne décroche plus aux numéros inconnus.", "Rien : s'il est vraiment vendeur, il reprendra contact de lui-même."], "answer": "A", "feedbacks": ["Oui. Son accord a moins de 12 mois, il vous nomme et porte sur le DPE et l'estimation : vous restez dans son objet. Vous rappelez qu'il peut le retirer à tout moment, même oralement. S'il ne décroche pas, laissez un message identifié. Confiance +10.", "Ses voisins n'ont donné aucun accord : SMS de prospection interdit sans consentement préalable. Et une offre promotionnelle sort de l'objet de son accord. Confiance −20, alerte conformité.", "Masquer son numéro pour forcer la réponse d'un vendeur méfiant détruit la confiance que son accord vous donnait. Confiance −10.", "Son accord vaut au plus un an. Attendre, c'est laisser les deux autres agences décider à votre place. Confiance +0, rendez-vous repoussé."], "notes": "Étape 3, activité notée (poids 15, conformité). Déclencheurs : A → Confiance + 10, E3_Choix = « A » ; B → Confiance − 20, Alerte = Vrai, E3_Choix = « B » ; C → Confiance − 10 ; D → 0. Branches : A → rendez-vous fixé au mardi 12 janvier 2027, scène Runway « porte ouverte » ; B → M. Bernard rappelle furieux (« Comment mes voisins ont-ils eu ce SMS ? »), rendez-vous obtenu de justesse, scène « porte entrebâillée » ; C → il décroche puis raccroche, deuxième appel identifié nécessaire ; D → rendez-vous au 26 janvier, plan de vente décalé de 2 semaines à l'étape 6. Rappel à afficher dans le calque « En savoir plus » : preuve de l'accord conservée au moins 3 ans (R. 223-2), durée max 1 an sans reconduction tacite (R. 223-1), retrait à tout moment (R. 223-3) ; sanctions jusqu'à 75 000 € / 375 000 € (L. 242-16) ; SMS de prospection : consentement préalable (L. 34-5 CPCE). Narration : « Il a donné son accord. À vous de vous en montrer digne. » Sources : loi n° 2025-594 du 30/06/2025 ; décret n° 2026-662 du 23/07/2026 ; CNIL."}, {"type": "recap", "eyebrow": "Bilan intermédiaire · Étapes 1 à 3", "title": "Avant de sonner chez M. Bernard", "cards": [{"title": "Situation", "text": "L'enjeu n'est pas de s'aligner sur −15 %. C'est une étiquette de 2023 peut-être dépassée et une estimation à prouver."}, {"title": "Préparation", "text": "Demandés : DPE et numéro ADEME, surface, année, statut, travaux, projet et délai. Relevées : les ventes DVF. Non collectés : ses revenus."}, {"title": "Contact", "text": "Appel identifié, dans l'objet de son accord du 03/10/2026 (12 mois au plus), droit de retrait rappelé. Rendez-vous le 12 janvier."}], "banner_label": "Votre jauge", "banner_text": "Confiance de M. Bernard : %Confiance% / 100. Selon vos choix, il vous ouvre la porte… ou l'entrebâille.", "notes": "Bilan intermédiaire 1 (non noté). La variable %Confiance% est insérée dans le texte. Calque conditionnel : si Alerte = Vrai, bandeau rouge « Alerte conformité : votre score sera plafonné à 60 %. Relisez l'étape 3. » avec bouton « Revoir l'étape 3 » (rejouable, mais l'alerte reste comptée pour cette tentative). Narration : « Point d'étape. Vous avez compris l'enjeu, préparé vos questions et obtenu un rendez-vous dans les règles. Regardez votre jauge avant d'entrer. »"}, {"type": "video", "title": "Scène : arrivée chez M. Bernard", "label": "Scène Runway (8 s, optionnelle) · mention à l'écran « Scène générée par IA »", "notes": "Scène Runway optionnelle (bouton « Passer la scène » visible dès le début). Mention obligatoire incrustée en bas à gauche pendant toute la durée : « Scène générée par IA ». Aucun visage réel ni marque réelle. Prompt Runway (Gen-4, 16:9, 8 s) : « Plan de suivi à hauteur d'épaule, fin de matinée d'hiver, lumière grise et douce. Un agent immobilier en manteau sombre, dossier sous le bras, remonte l'allée d'une maison individuelle des années 1970 en crépi beige, volets bois, petit jardin. La porte s'ouvre ; un homme d'une soixantaine d'années, pull gris, l'accueille avec une poignée de main réservée. Réalisme cinématographique, couleurs naturelles, aucun texte, aucun logo. » Variante si E3_Choix = « B » ou Confiance < 45 : « … la porte ne s'ouvre qu'à moitié, l'homme garde la main sur la poignée, visage fermé. » Narration (sur la fin du plan) : « Mardi 12 janvier, 10 heures. M. Bernard vous attend. »"}, {"type": "case_form", "eyebrow": "Étape 4/9 · Expliquer le DPE", "title": "« Alors, je suis F ou pas ? »", "case_title": "Le DPE de M. Bernard", "case_paras": ["DPE de mars 2023 : 165 kWh/m²/an d'énergie finale, tout électrique ; 13 kgCO₂/m²/an.", "Janvier 2027 : coefficient de l'électricité = 1,7. Seuils (≥ 40 m²) : D ≤ 250, E ≤ 330, F ≤ 420 kWhEP/m²/an ; GES : B ≤ 11, C ≤ 30.", "Il vous tend son DPE : « Alors, je suis F ou pas ? »"], "inputs": ["Énergie primaire recalculée (kWhEP/m²/an)", "Classe probable (énergie et GES)", "Votre phrase à M. Bernard, avec la démarche proposée"], "answer": "165 × 1,7 = 280,5 kWhEP/m²/an, entre 250 et 330 : E. GES 13 : C. La classe retenue est la moins bonne des deux : E probable. Phrase : « Votre maison serait probablement en E aujourd'hui. Ce n'est pas moi qui le décide : téléchargeons ensemble l'attestation ADEME gratuite avec votre numéro de DPE. C'est elle qui fera foi. »", "feedbacks": ["Vous trouvez 379,5 ? Vous avez gardé le coefficient 2,3 du DPE de 2023 : c'est la classe F que les autres agences ont reprise sans vérifier.", "Vous trouvez 313,5 ? C'est le coefficient 1,9 de 2026. Même classe E, mais en janvier 2027 c'est 1,7 qui s'applique.", "Vous écrivez « E, c'est certain » ? Seule l'attestation ADEME établit la classe. Confiance −15 et alerte « classe promise ».", "Calcul juste, classe présentée comme probable, attestation proposée : confiance +15.", "Pensez à la suite : en E, l'audit énergétique reste obligatoire pour vendre une maison (depuis le 1er janvier 2025)."], "notes": "Étape 4, activité notée (poids 10). Champ 1 : réponse numérique acceptée 280,5 ou 280.5 (tolérance ± 1). Champ 2 : liste déroulante (A à G pour l'énergie, A à G pour le GES, puis classe retenue) attendu E / C / E. Champ 3 : saisie libre, auto-évaluation par case à cocher (« J'ai dit probable », « J'ai proposé l'attestation », « Je n'ai promis aucun prix ») + comparaison avec la réponse modèle. Note : 4 points calcul, 3 points classe, 3 points phrase (auto-évaluée). Déclencheurs : classe E + case « probable » cochée → Confiance + 15, E4_Ok = Vrai ; case « probable » non cochée ou phrase contenant « certain/garanti » (contrôle par mots-clés) → Confiance − 15, Alerte = Vrai. Branche : E4_Ok = Faux → le dialogue de l'étape 7 démarre au nœud « F » (« Donc je peux écrire E dans l'annonce ? ») au lieu du nœud « start ». Si E2_Prepa = Faux : calque préalable (numéro ADEME à demander sur place, Confiance − 5). Hypothèse pédagogique : toute l'énergie finale est électrique ; calcul simplifié sur l'énergie finale du DPE. Narration : « Il vous tend son DPE. Faites le calcul, puis dites-lui ce que vous savez, et seulement ce que vous savez. » Sources : arrêtés du 13/08/2025 et du 19/08/2026 (JORFTEXT000054747079) ; seuils DPE (arrêté du 31/03/2021 modifié)."}, {"type": "explain", "eyebrow": "Étape 4/9 · Correction", "title": "Ce que vous montrez à M. Bernard", "paras": ["L'attestation actualisée est gratuite, sans nouvelle visite, sur l'observatoire DPE-Audit de l'ADEME, avec le numéro à 13 caractères. Elle remplace l'étiquette jusqu'en mars 2033, fin de validité de son DPE.", "En E, la vente reste soumise à l'audit énergétique (maisons, depuis le 1er janvier 2025). Il est remis à l'acquéreur dès la première visite : un atout à préparer, pas un obstacle.", "S'il a fait des travaux depuis 2023, l'attestation ne les prend pas en compte : un nouveau DPE est alors recommandé."], "table": {"headers": ["Période", "Énergie primaire", "Classe probable"], "rows": [["2023 · coef. 2,3", "379,5", "F"], ["2026 · coef. 1,9", "313,5", "E"], ["2027 · coef. 1,7", "280,5", "E (à confirmer)"]]}, "caption": "Calcul pédagogique sur l'énergie finale du DPE (tout électrique). Seule l'attestation ADEME fait foi. Sources : arrêtés du 13/08/2025 et du 19/08/2026 ; INC.", "notes": "Écran de correction de l'étape 4 (non noté). Animation : les trois lignes du tableau apparaissent une à une, la pastille de classe passe de F (orange) à E (jaune orangé). Bouton « Voir l'attestation » → calque montrant une attestation fictive floutée avec mention « Exemple fictif ». Narration : « En 2023, le calcul donnait F. En 2027, il donne probablement E. Mais c'est l'attestation qui tranche. Et en E, l'audit énergétique reste obligatoire pour vendre : il doit être remis dès la première visite. » Sources : arrêté du 19/08/2026 (NOR VLOL2617030A) ; observatoire DPE-Audit ADEME ; INC, audit énergétique à la vente (https://www.inc-conso.fr/content/lobligation-de-realiser-un-audit-energetique-lors-de-la-vente-de-certaines-maisons)."}, {"type": "table", "eyebrow": "Étape 5/9 · Éléments de valeur", "title": "Quatre ventes comparables (exemple fictif)", "intro": "Exemple fictif. Quatre ventes de maisons du secteur relevées dans DVF sur 18 mois. DVF ne contient pas la classe DPE : elle vient d'annonces archivées.", "headers": ["Réf.", "Maison", "Vente (DVF)", "Prix / m²", "Remarque"], "rows": [["C1", "108 m², 1978", "03/2026 · 236 000 €", "≈ 2 185 €", "DPE D, bon état"], ["C2", "118 m², 1982", "09/2025 · 232 000 €", "≈ 1 966 €", "DPE F, travaux à prévoir"], ["C3", "105 m², 1975", "06/2026 · 219 000 €", "≈ 2 086 €", "DPE E, état d'usage"], ["C4", "115 m², 1980", "01/2026 · 248 000 €", "≈ 2 157 €", "DPE D, cuisine refaite"]], "caption": "Exemple fictif : ventes, prix et classes inventés pour l'exercice. Une fourchette se construit par comparaison et ajustements, jamais par une décote forfaitaire.", "notes": "Écran d'appui de l'étape 5 (non noté). Mention « Exemple fictif » affichée en bandeau. Survol de chaque ligne → calque d'ajustement (ex. C2 : « plus grande, classe F, travaux : à pondérer à la baisse par rapport à M. Bernard »). Bouton « Calculer la fourchette » → calque : maison de M. Bernard, 112 m², E probable, état d'usage → ≈ 2 030 à 2 130 €/m² → ≈ 227 000 à 239 000 € (exemple fictif). Les deux autres agences : −15 % appliqués à 240 000 €, soit ≈ 204 000 €. Narration : « Voici des ventes réelles, pas des prix affichés. Comparez, ajustez, puis seulement chiffrez. » Source DVF : https://www.data.gouv.fr/fr/datasets/demandes-de-valeurs-foncieres/ (Etalab, DGFiP)."}, {"type": "document", "eyebrow": "Étape 5/9 · Éléments de valeur", "title": "Que gardez-vous dans l'avis de valeur ?", "doc_title": "Brouillon d'avis de valeur 360° · M. Bernard (fictif)", "fields": [{"label": "Comparables DVF :", "value": "4 ventes de maisons de 105 à 118 m², 18 derniers mois", "useful": true, "feedback": "Valeur de marché : des ventes réelles, datées, vérifiables par M. Bernard."}, {"label": "Étiquette :", "value": "E probable en 2027, à confirmer par l'attestation ADEME", "useful": true, "feedback": "Valeur énergétique : l'étiquette recalculée et confirmée par l'attestation officielle, pas celle de 2023."}, {"label": "État et travaux :", "value": "Toiture refaite en 2019, menuiseries d'origine", "useful": true, "feedback": "Valeur technique : ce que vous avez demandé à l'étape 2, factures à l'appui."}, {"label": "Décote énergétique :", "value": "−15 % forfaitaire « à cause du F »", "useful": false, "feedback": "Piège : aucune règle ne fixe une décote nationale par classe. Et le F de 2023 est probablement dépassé. Confiance −5."}, {"label": "Annonces en ligne :", "value": "« Prix affichés = prix de vente du secteur »", "useful": false, "feedback": "Piège : un prix affiché n'est pas un prix de vente. Les annonces montrent la concurrence, pas la valeur."}, {"label": "Estimation en ligne :", "value": "Simulateur gratuit : 262 000 €", "useful": false, "feedback": "Piège : un résultat d'algorithme sans visite ni méthode ne prouve rien. Il ne doit pas guider votre fourchette."}, {"label": "Audit énergétique :", "value": "À commander : obligatoire pour vendre en E", "useful": true, "feedback": "Valeur transactionnelle : un acquéreur rassuré par un audit et ses scénarios de travaux négocie moins à l'aveugle."}, {"label": "Marché local :", "value": "Délai de vente et volume de ventes du secteur", "useful": true, "feedback": "Valeur de marché : le rythme local dit si la fourchette est tenable et en combien de temps."}, {"label": "Avis du vendeur :", "value": "« Ma déco vaut au moins 10 000 € »", "useful": false, "feedback": "Piège : c'est son attachement, pas la valeur perçue par les acquéreurs. À écouter, pas à chiffrer."}, {"label": "Fourchette :", "value": "≈ 227 000 à 239 000 € (exemple fictif), justifiée", "useful": true, "feedback": "Une fourchette argumentée par comparables et ajustements, présentée par écrit : c'est ce qu'il attend."}], "instruction": "Cliquez sur les éléments que vous gardez dans l'avis de valeur : ceux qui reposent sur une preuve. Évitez les pièges, chaque erreur compte.", "side_note": "8 familles de valeur : intrinsèque, marché, technique, énergétique, copropriété, perçue, financière, transactionnelle.", "counter": "Éléments retenus : 0 / 6", "notes": "Étape 5, activité notée (poids 10). Score = (bons clics − mauvais clics) / 6, plancher 0. Bouton « Valider » actif après au moins 4 clics. Déclencheurs : score ≥ 0,8 → Confiance + 10 ; clic sur « Décote énergétique » → Confiance − 5 (cumulable). Branche : si la décote forfaitaire est retenue, à l'étape 7 M. Bernard ajoute la réplique « Vous aussi, vous partez sur −15 % ? ». Rappel : la famille « copropriété » est sans objet ici si l'étape 2 a confirmé une maison hors copropriété et hors lotissement (à vérifier). Narration : « Votre brouillon mélange des preuves et des impressions. Gardez seulement ce que M. Bernard pourra vérifier. » Sources : programme Éco-Consultant (8 familles) ; DVF (data.gouv.fr) ; INC (audit)."}, {"type": "stats", "eyebrow": "Bilan intermédiaire · Étapes 4 et 5", "title": "Ce que M. Bernard a maintenant entre les mains", "cards": [{"label": "Étiquette", "value": "E probable", "detail": "280,5 kWhEP/m²/an en 2027, à confirmer par l'attestation ADEME", "phrase": "« C'est l'attestation qui fera foi, pas moi. »"}, {"label": "Valeur", "value": "≈ 227-239 k€", "detail": "Exemple fictif, 4 comparables DVF ajustés", "phrase": "« Voici les ventes réelles, pas des annonces. »"}, {"label": "Votre jauge", "value": "%Confiance%", "detail": "Confiance de M. Bernard sur 100 après l'étape 5", "phrase": "« Vous êtes le premier à me montrer vos calculs. »"}], "source": "Valeurs fictives pour l'exercice. Coefficient 1,7 : arrêté du 19/08/2026 (NOR VLOL2617030A).", "notes": "Bilan intermédiaire 2 (non noté). La 3e carte affiche la variable Confiance. Phrase de la 3e carte conditionnelle : Confiance ≥ 70 → « Vous êtes le premier à me montrer vos calculs. » ; 50-69 → « C'est intéressant, mais je reste prudent. » ; < 50 → « Les autres m'ont dit autre chose… ». Calque si Alerte = Vrai (rappel du plafonnement). Narration : « Il a une étiquette expliquée et une fourchette justifiée. Il vous reste à lui montrer comment vous allez vendre. »"}, {"type": "sort", "eyebrow": "Étape 6/9 · Stratégie de vente", "title": "Construisez le plan de vente", "items": ["Faire commander l'audit énergétique et télécharger l'attestation ADEME", "Éco-staging : désencombrer, petites réparations, mettre en valeur le chauffage", "Photos et annonce avec l'étiquette officielle et la fourchette justifiée", "Visites qualifiées, audit remis dès la première visite", "Compte rendu écrit à M. Bernard chaque semaine", "Revoir le positionnement avec lui à 4 semaines, visites à l'appui"], "categories": ["Avant la mise en vente", "Lancement (sem. 1-2)", "Suivi (dès sem. 3)"], "answers": [0, 0, 1, 1, 2, 2], "whys": ["L'audit doit être prêt dès la première visite : il se commande avant la mise en vente. L'attestation fixe l'étiquette de l'annonce.", "L'Éco-staging prépare le produit avant les photos : on ne rattrape pas une première impression.", "L'annonce part avec l'étiquette officielle (attestation), jamais avec une classe supposée.", "Visites dès le lancement, avec l'audit remis à chaque acquéreur dès la première visite.", "Le compte rendu hebdomadaire est l'engagement qui rassure un vendeur méfiant : il voit le travail.", "À 4 semaines, on décide ensemble avec des faits (visites, retours), pas une baisse réflexe."], "notes": "Étape 6, activité notée (poids 10), 1 point par item, score sur 6. Déclencheurs : ≥ 5/6 → Confiance + 10 ; 4/6 → + 5 ; ≤ 3/6 → 0. Branche : si E3_Choix = « D », le calendrier de l'écran suivant est décalé de 2 semaines (variable de date). Le résultat de cet écran alimente l'objection « Et si ça ne se vend pas ? » au dialogue de l'étape 7 (option bonus débloquée si ≥ 5/6). Narration : « Un plan de vente, c'est un ordre. Que fait-on avant, pendant, après le lancement ? » Sources : INC (audit remis dès la première visite) ; programme Éco-Consultant (plan Éco-staging)."}, {"type": "steps_key", "eyebrow": "Étape 6/9 · Correction", "title": "Le plan de vente remis à M. Bernard", "principle": "Un plan écrit et daté que M. Bernard peut contrôler : chaque engagement a une date et une preuve.", "steps_label": "Calendrier proposé (exemple)", "steps": ["12-19 janvier : attestation ADEME, devis d'audit, liste Éco-staging de 10 actions.", "Après le mandat (et la fin du délai de rétractation s'il est signé à domicile) : audit, Éco-staging, photos.", "Lancement : annonce avec l'étiquette officielle, visites qualifiées, audit remis dès la 1re visite.", "Chaque vendredi : compte rendu écrit. À 4 semaines : bilan et décision prise ensemble."], "key_phrase": "« Vous ne signez pas une promesse : vous signez un calendrier que vous pourrez vérifier. »", "stage_label": "Étapes du parcours", "stage_value": "Plan Éco-staging → produit commercial", "notes": "Écran de correction de l'étape 6 (non noté). Les 4 étapes apparaissent au clic (déclencheur sur chaque pastille). Calque « Pourquoi attendre la fin de la rétractation ? » : un mandat signé hors établissement n'est pas exécuté avant la fin du délai de 14 jours, sauf demande expresse du vendeur sur papier ou support durable (art. L. 221-25 C. consom.) ; même alors, il garde son droit de rétractation. Sous l'ancien régime (7 jours), les offres recueillies pendant le délai ont été jugées sans effet (Cass. 1re civ., 1/07/2015, n° 14-15753, analyse ANIL). Narration : « Voici le plan que vous lui laissez. Daté, concret, vérifiable. » Sources : ANIL (https://www.anil.org/documentation-experte/analyses-juridiques-jurisprudence/jurisprudence/jurisprudence-2015/mandat-de-vente-soumis-a-la-reglementation-sur-le-demarchage-a-domicile-non-execution-possible-du-mandat-pendant-le-delai-de-retractation/) ; INC."}, {"type": "dialogue", "eyebrow": "Étape 7/9 · Répondre aux objections", "title": "M. Bernard vous teste", "persona_name": "M. Bernard", "opening": "« Les deux autres m'ont dit −15 % à cause du F. Vous, vous voulez l'exclusivité. Pourquoi je vous ferais plus confiance ? »", "options": ["« Parce que je vous promets un meilleur prix qu'eux. »", "« Ne me croyez pas sur parole : voici l'attestation ADEME, les ventes réelles du secteur et mon plan écrit. Vous jugerez sur pièces. »", "« Les autres se trompent, le F c'est fini pour vous. »"], "tree": "Départ : confiance cumulée des étapes 1 à 6 (variable Confiance). Si E4_Ok = Faux, départ au nœud F.\nSTART → A : −15 → PRIX | B : +20 → EXCLU | C : −10 → F.\nPRIX — M. B. : « Combien de plus, alors ? » → A1 « Je ne promets aucun chiffre : je vous montre la fourchette tirée des ventes réelles et comment je l'ai construite. » +15 → EXCLU | A2 « 10 % au moins. » −20, alerte → FIN.\nF — M. B. : « Donc je peux écrire E dans l'annonce dès demain ? » → F1 « Pas avant l'attestation : on la télécharge ensemble et c'est elle qui s'affiche. » +10 → EXCLU | F2 « Oui, allez-y. » −20, alerte → FIN.\nEXCLU — M. B. : « L'exclusivité, ça m'enferme. Je veux pouvoir vendre moi-même. » → E1 « En contrepartie, je m'engage par écrit : audit, Éco-staging, compte rendu chaque vendredi. Et le mandat est résiliable après 3 mois, préavis de 15 jours. » +20 → APPELS | E2 « Sans exclusivité, je ne travaille pas. » −10 → APPELS | E3 « Certains mandats prévoient une clause qui vous laisse vendre vous-même : regardons ce qu'elle change pour vous. » +10 → APPELS.\n(Bonus si étape 6 ≥ 5/6) VENTE — M. B. : « Et si ça ne se vend pas ? » → V1 « Bilan à 4 semaines, visites et retours à l'appui, et on décide ensemble. » +10 → APPELS | V2 « On baissera de 10 %. » −10 → APPELS.\nAPPELS — M. B. : « Et vous n'allez pas me harceler au téléphone ? » → P1 « Je vous appelle dans le cadre de votre accord, aux créneaux que vous choisissez. Vous pouvez le retirer à tout moment, même oralement. » +15 → FIN | P2 « On est obligés de relancer, c'est le métier. » −10 → FIN.\nFIN — Confiance ≥ 80 sans alerte : « D'accord. Montrez-moi ce mandat. » ; 50 à 79 : « Je vais réfléchir. Envoyez-moi tout par écrit. » ; < 50 : « Je crois que je vais rester avec les autres. »\nNote de l'étape (sur 15) : 15 × (somme des points gagnés / points max du chemin), plafonnée à 9 si une réplique négative a été choisie.", "meter_label": "Confiance de M. Bernard", "notes": "Étape 7, activité notée (poids 15). Jauge reprise de la variable Confiance (cumulée), bornée 0-100. Chaque réplique ajoute son delta à Confiance. Si E5 a retenu la décote forfaitaire, insérer avant EXCLU la réplique « Vous aussi, vous partez sur −15 % ? » (réponse unique pr
