oposée : « Non : je pars des ventes réelles, je vous les ai montrées. » +5). Bouton « Rejouer (non noté) » après la fin. Narration d'entrée : « Il a écouté. Maintenant, il vous teste. » Sources : Hoguet, mandat exclusif résiliable après 3 mois, préavis 15 jours par LRAR (loi n° 70-9 et décret n° 72-678) ; décret n° 2026-662 (retrait du consentement, R. 223-3).", "graph": {"start": "start", "initial": 40, "nodes": {"start": {"him": "« Les deux autres m'ont dit −15 % à cause du F. Vous, vous voulez l'exclusivité. Pourquoi je vous ferais plus confiance ? »", "opts": [{"text": "« Parce que je vous promets un meilleur prix qu'eux. »", "delta": -15, "next": "prix", "why": "Promesse de meilleur prix sans preuve."}, {"text": "« Ne me croyez pas sur parole : voici l'attestation ADEME, les ventes réelles du secteur et mon plan écrit. Vous jugerez sur pièces. »", "delta": 20, "next": "exclu", "why": "Vous apportez des pièces vérifiables plutôt qu'une promesse."}, {"text": "« Les autres se trompent, le F c'est fini pour vous. »", "delta": -10, "next": "f", "why": "Affirmation sur la classe sans attestation."}]}, "prix": {"him": "« Combien de plus, alors ? »", "opts": [{"text": "« Je ne promets aucun chiffre : je vous montre la fourchette tirée des ventes réelles et comment je l'ai construite. »", "delta": 15, "next": "exclu", "why": ""}, {"text": "« 10 % au moins. »", "delta": -20, "next": "end", "why": "Alerte : promesse de pourcentage."}]}, "f": {"him": "« Donc je peux écrire E dans l'annonce dès demain ? »", "opts": [{"text": "« Pas avant l'attestation : on la télécharge ensemble et c'est elle qui s'affiche. »", "delta": 10, "next": "exclu", "why": ""}, {"text": "« Oui, allez-y. »", "delta": -20, "next": "end", "why": "Alerte : classe affichée sans attestation."}]}, "exclu": {"him": "« L'exclusivité, ça m'enferme. Je veux pouvoir vendre moi-même. »", "opts": [{"text": "« En contrepartie, je m'engage par écrit : audit, Éco-staging, compte rendu chaque vendredi. Et le mandat est résiliable après 3 mois, préavis de 15 jours. »", "delta": 20, "next": "appels", "why": "Engagements écrits et résiliation après 3 mois (loi Hoguet)."}, {"text": "« Sans exclusivité, je ne travaille pas. »", "delta": -10, "next": "appels", "why": ""}, {"text": "« Certains mandats prévoient une clause qui vous laisse vendre vous-même : regardons ce qu'elle change pour vous. »", "delta": 10, "next": "appels", "why": ""}]}, "appels": {"him": "« Et vous n'allez pas me harceler au téléphone ? »", "opts": [{"text": "« Je vous appelle dans le cadre de votre accord, aux créneaux que vous choisissez. Vous pouvez le retirer à tout moment, même oralement. »", "delta": 15, "next": "end", "why": "Décret n° 2026-662 : retrait du consentement possible à tout moment."}, {"text": "« On est obligés de relancer, c'est le métier. »", "delta": -10, "next": "end", "why": ""}]}}, "ends": [{"min": 80, "no_negative": true, "him": "« D'accord. Montrez-moi ce mandat. »", "verdict": "Rendez-vous obtenu", "feedback": "Il vous a testé et vous avez tenu : des pièces plutôt que des promesses, des engagements écrits en contrepartie de l'exclusivité, un mandat résiliable après 3 mois et des appels dans le cadre de son accord."}, {"min": 50, "him": "« Je vais réfléchir. Envoyez-moi tout par écrit. »", "verdict": "Porte entrouverte", "feedback": "Une de vos réponses promettait un chiffre, une classe ou forçait la main. Appuyez-vous sur l'attestation, les ventes réelles et des engagements écrits ; rappelez qu'il peut retirer son accord à tout moment."}, {"min": 0, "him": "« Je crois que je vais rester avec les autres. »", "verdict": "Occasion manquée", "feedback": "Ne promettez ni prix, ni pourcentage, ni classe : montrez l'attestation ADEME et les ventes réelles, écrivez vos engagements, rappelez la résiliation après 3 mois et le droit de retirer son accord."}]}}, {"type": "two_cols", "eyebrow": "Bilan intermédiaire · Étapes 6 et 7", "title": "Ce qui a fait bouger la jauge", "left_title": "Ce qui fait monter la confiance", "left_items": ["Montrer des pièces : attestation ADEME, ventes DVF, plan écrit", "Dire « probable » et laisser l'attestation trancher", "Proposer l'exclusivité contre des engagements écrits et datés", "Rappeler qu'il peut retirer son accord à tout moment"], "right_title": "Ce qui la fait chuter", "right_items": ["Promettre un prix ou un pourcentage de plus que les autres", "Annoncer une classe avant l'attestation", "Exiger l'exclusivité sans contrepartie", "Laisser entendre qu'on le relancera quoi qu'il dise"], "footer_title": "Votre jauge", "footer_text": "Confiance de M. Bernard : %Confiance% / 100. Il vous reste deux étapes pour la consolider : vos engagements et la conclusion.", "notes": "Bilan intermédiaire 3 (non noté). Les items cochés par l'apprenant pendant le dialogue s'allument (calques conditionnels selon le chemin suivi). Si Confiance < 50 : calque « M. Bernard hésite : il ne signera pas aujourd'hui, mais vous pouvez encore obtenir une prochaine étape à l'étape 9. » Narration : « Regardez ce qui a fait bouger sa confiance. Ce ne sont jamais les promesses : ce sont les preuves. »"}, {"type": "document", "eyebrow": "Étape 8/9 · Présenter ses engagements", "title": "Le mandat exclusif et vos engagements", "doc_title": "Projet de mandat exclusif et charte d'engagements (fictif)", "fields": [{"label": "N° au registre :", "value": "2027-0018, reporté du registre des mandats", "useful": true, "feedback": "Obligatoire (Hoguet) : tout mandat est inscrit au registre avec un numéro d'ordre reporté sur l'exemplaire du vendeur."}, {"label": "Prix de vente :", "value": "235 000 € (exemple fictif)", "useful": true, "feedback": "Mention obligatoire. Il est issu de la fourchette justifiée, pas d'une promesse."}, {"label": "Durée :", "value": "3 mois, puis résiliable : préavis 15 j par LRAR", "useful": true, "feedback": "Conforme : le mandat exclusif est résiliable après 3 mois avec 15 jours de préavis par lettre recommandée avec AR."}, {"label": "Rémunération :", "value": "5 % TTC du prix, à la charge de l'acquéreur (fictif)", "useful": true, "feedback": "Mention obligatoire : le montant et la partie qui la paie."}, {"label": "Clause d'exclusivité :", "value": "En caractères très apparents, expliquée", "useful": true, "feedback": "Obligatoire : la clause d'exclusivité figure en caractères très apparents. Expliquez-la à voix haute."}, {"label": "Engagements écrits :", "value": "Audit, Éco-staging, compte rendu chaque vendredi", "useful": true, "feedback": "C'est la contrepartie de l'exclusivité : des services précis, datés, vérifiables."}, {"label": "Rétractation :", "value": "Formulaire joint, 14 jours si signé à domicile", "useful": true, "feedback": "Obligatoire pour un mandat signé hors établissement : formulaire de rétractation et délai de 14 jours."}, {"label": "Garantie :", "value": "« Vente garantie en 60 jours au prix affiché »", "useful": false, "feedback": "Piège : promesse intenable. Vous ne maîtrisez ni le marché ni les acquéreurs. Confiance −15, alerte."}, {"label": "Résiliation :", "value": "Impossible avant 12 mois", "useful": false, "feedback": "Piège : contraire à la règle des 3 mois. Une telle clause expose le mandat et votre réputation."}, {"label": "Promesse de prix :", "value": "« 10 % au-dessus des autres agences »", "useful": false, "feedback": "Piège : un pourcentage sans méthode. Il a précisément quitté les autres pour ça."}], "instruction": "Cliquez sur les clauses que vous pouvez présenter : mentions obligatoires (loi Hoguet) ou engagements tenables. Évitez les pièges.", "side_note": "Exclusivité contre services : chaque engagement écrit doit pouvoir être contrôlé par le vendeur.", "counter": "Clauses retenues : 0 / 7", "notes": "Étape 8, activité notée (poids 10). Score = (bons clics − mauvais clics) / 7, plancher 0. Déclencheurs : score ≥ 0,8 → Confiance + 10 ; clic sur « Garantie » ou « Promesse de prix » → Confiance − 15 et Alerte = Vrai ; clic sur « Résiliation » → Confiance − 5. Calque « Chiffre utile » (optionnel) : enquête leboncoin Immo auprès de 419 professionnels (sept.-oct. 2025, déclaratif) : 91 jours de délai de vente en exclusif contre 142 en mandat simple ; 62 % des vendeurs veulent garder la possibilité de vendre eux-mêmes. Narration : « L'exclusivité, il vous la donnera contre des engagements. Montrez-lui lesquels, et seulement ceux que vous tiendrez. » Sources : loi n° 70-9 du 2/01/1970 et décret n° 72-678 ; Code de la consommation (contrats hors établissement)."}, {"type": "qcm", "eyebrow": "Étape 9/9 · Conclure le rendez-vous", "title": "« C'est clair. On fait comment maintenant ? »", "question_label": "Étape 9", "question": "Mardi 12 janvier 2027, fin du rendez-vous chez M. Bernard. Il relit votre plan et demande : « On fait comment maintenant ? » Que répondez-vous ?", "options": ["« Je vous remets l'avis de valeur écrit jeudi 14 à 18 h. Vous relisez le mandat d'ici là. Si vous le signez ici, vous aurez 14 jours pour vous rétracter. »", "« Signez ce soir, je mets l'annonce en ligne demain matin. »", "« Réfléchissez tranquillement, je vous rappelle un de ces jours. »", "« Signez maintenant : un point de commission en moins si c'est avant ce soir. »"], "answer": "A", "feedbacks": ["Oui. Une prochaine étape datée, un document écrit, le mandat à relire et son droit de rétractation rappelé : il garde la main, et vous gardez l'avance. Confiance +10.", "Un mandat signé à domicile ne peut pas être exécuté avant la fin du délai de rétractation de 14 jours, sauf demande expresse et écrite du vendeur. Et la précipitation contredit tout ce que vous avez construit. Confiance −20, alerte.", "Sans date, vous perdez l'avance prise. Son accord porte sur le DPE et l'estimation : finissez le travail promis. Confiance −5.", "La pression commerciale sur un vendeur méfiant ruine la confiance gagnée. Un mandat se signe parce qu'il est compris. Confiance −20, alerte."], "notes": "Étape 9, activité notée (poids 10). Déclencheurs : A → Confiance + 10 ; B ou D → Confiance − 20, Alerte = Vrai ; C → Confiance − 5. Puis calcul de Verdict : Confiance ≥ 80 et Alerte = Faux → « Mandat exclusif signé le 14 janvier, à l'agence » ; 50-79 → « M. Bernard réfléchit : avis de valeur remis, relance datée » ; < 50 → « Il choisit une autre agence ». Calque Verdict affiché avant l'écran de synthèse, avec réplique finale de M. Bernard. Narration : « Dernière étape. Ce que vous dites maintenant décide de la suite. » Sources : Code de la consommation, contrats hors établissement (14 jours) ; Cass. 1re civ., 1/07/2015, n° 14-15753 (ANIL)."}, {"type": "recap", "eyebrow": "Synthèse", "title": "Les trois réflexes du cas M. Bernard", "cards": [{"title": "Vérifier", "text": "Un DPE de 2023 se revérifie : en 2027, 165 × 1,7 = 280,5, E probable. L'attestation ADEME tranche. Son accord se vérifie aussi : date, objet, durée."}, {"title": "Prouver", "text": "Ventes DVF, ajustements, fourchette écrite. Jamais de décote forfaitaire, jamais de pourcentage promis. Les 8 familles de valeur structurent l'avis."}, {"title": "Engager", "text": "Exclusivité contre services écrits et datés, mandat Hoguet complet, rétractation de 14 jours à domicile, prochaine étape fixée avant de partir."}], "banner_label": "Votre résultat", "banner_text": "Score : %ScoreFinal% % · Confiance finale : %Confiance% / 100 · Verdict : %Verdict%. Rappel des 3 réflexes dans 2 jours puis dans 7 jours.", "notes": "Synthèse finale (non notée). Variables affichées : ScoreFinal, Confiance, Verdict. Si ScoreFinal < 70 : bouton « Rejouer la simulation » (variables réinitialisées, meilleur score conservé) et liste des étapes sous 70 % mises en évidence. Narration : « Vérifier, prouver, engager. Trois réflexes qui valent pour M. Bernard et pour tous vos prochains vendeurs. »"}, {"type": "video", "title": "Sébastien : votre débrief du cas", "label": "Emplacement de la capsule HeyGen (70 s) · avatar SEB · 3 variantes", "notes": "Capsule HeyGen de feedback final, avatar SEB, environ 70 s, sous-titres. Trois variantes tournées, affichées selon Verdict (déclencheur à l'ouverture de la slide). Tronc commun (début) : « Vous venez de mener le cas de M. Bernard de bout en bout. Prenons deux minutes pour regarder ce qui s'est joué. » Variante 1, mandat signé : « Bravo. Vous avez fait ce que les deux autres agences n'ont pas fait : vous avez vérifié son étiquette au lieu de la recopier, vous avez montré des ventes réelles au lieu d'un pourcentage, et vous avez échangé l'exclusivité contre des engagements qu'il peut contrôler. Gardez ce réflexe : chaque fois qu'un vendeur vous demande un chiffre, montrez-lui d'abord comment vous l'obtenez. » Variante 2, il réfléchit : « La porte est ouverte, mais elle n'est pas franchie. Regardez votre jauge : à quel moment a-t-elle baissé ? Le plus souvent, c'est une phrase de trop : une classe annoncée trop tôt, un chiffre lancé sans méthode, une exclusivité demandée sans contrepartie. Rejouez l'étape concernée : c'est là que vous gagnerez vos prochains mandats. » Variante 3, autre agence : « Cette fois, M. Bernard est parti. Ce n'est pas grave ici, c'est fait pour ça. Mais sur le terrain, ce serait un mandat perdu, et peut-être une sanction si le contact n'était pas dans les règles. Reprenez dans l'ordre : son accord, son DPE, ses comparables, vos engagements. Une étape à la fois. » Tronc commun (fin) : « Dernière chose : tout ce que vous avez fait aujourd'hui, vous le retrouverez dans la boîte à outils de la séquence 7. À tout de suite. »"}, {"type": "bilan", "title": "Séquence validée", "text": "Vous avez mené le cas de M. Bernard de l'analyse au mandat, en restant vérifiable et conforme.", "notes": "Écran de fin de séquence. Affiché si ScoreFinal ≥ 70 ; sinon titre remplacé par « Séquence à reprendre » et texte : « Seules les étapes sous 70 % sont à rejouer ; vos autres résultats sont conservés. » Déverrouille la séquence 7 (Évaluation finale et boîte à outils). Envoi SCORM : completion = completed, success = passed/failed, score.scaled = ScoreFinal / 100. Narration : « Séquence validée. Direction l'évaluation finale. »", "badge": "Cas réussi|M. Bernard"}, {"type": "divider", "kicker": "Séquence 7", "title": "Évaluation finale et boîte à outils", "notes": "Écran d'accueil de la séquence 7 (30 min). Déclencheur : bouton « Commencer » → divider 7.1. Séquence débloquée à 70 % de la séquence 6. Narration : « Dernière étape du module 1 : vous validez vos acquis, puis vous repartez avec vos outils et un plan d'action de sept jours. »"}, {"type": "divider", "kicker": "Unité 7.1", "title": "Évaluation finale", "notes": "Séparateur d'unité 7.1 (≈ 20 min). Déblocage automatique à la fin de la narration de la couverture."}, {"type": "video", "title": "Sébastien : « Ce que l'on vérifie aujourd'hui »", "label": "Emplacement de la capsule HeyGen (60 s) · avatar SEB", "notes": "Capsule HeyGen, avatar SEB, ≈ 60 s. Bouton « Suivant » débloqué à la fin de la vidéo.\nScript : « Bonjour. Vous voilà à la dernière étape du module. Ici, on ne vérifie pas si vous avez retenu des chiffres par cœur. On vérifie si vous savez les utiliser face à un vendeur. Lire le marché sans dramatiser. Lire un DPE et savoir ce que la réforme change. Contacter un propriétaire seulement quand il l'a accepté, et le prouver. Prendre un mandat propre. Dérouler les cinq techniques. Et utiliser l'IA sans lui confier ni vos décisions ni les données de vos clients. Vous aurez quinze questions, puis un cas écrit avec Mme Garnier, puis une courte simulation. Prenez votre temps. Chaque réponse est corrigée et expliquée : même une erreur vous fera progresser. Et si vous n'atteignez pas soixante-dix pour cent du premier coup, vous avez une deuxième tentative. Allez, c'est parti. »"}, {"type": "objectives", "eyebrow": "Unité 7.1 · Règles de l'évaluation", "title": "Comment se déroule l'évaluation finale", "intro_label": "Vous allez démontrer que vous savez", "items": ["Situer le marché 2026 avec des chiffres sourcés", "Lire un DPE et expliquer la réforme du coefficient électrique", "Contacter un propriétaire uniquement avec un consentement prouvé", "Prendre un mandat conforme à la loi Hoguet", "Appliquer les 5 techniques et utiliser l'IA en gardant la main"], "stats": [{"value": "70 %", "label": "seuil de réussite pour obtenir le badge du module 1"}, {"value": "2", "label": "tentatives possibles, la meilleure note est retenue"}, {"value": "15 + 2", "label": "15 questions, 1 étude de cas écrite, 1 simulation"}], "side_title": "Correction détaillée", "side_note": "Chaque réponse est expliquée, juste ou fausse.", "footer": "Durée indicative : 20 min. Notation détaillée (proposition pédagogique) dans les notes.", "notes": "Écran de règles. Narration : « L'évaluation compte quinze questions, une étude de cas écrite et une simulation. Le seuil est de soixante-dix pour cent. Vous avez deux tentatives et chaque réponse est corrigée. »\nNotation (proposition pédagogique à valider par le responsable de formation) : quiz 15 pts (1 pt par question) + simulation 5 pts (verdict final du dialogue : 5 / 3 / 0) = 20 pts ; seuil 14/20 (70 %) → variable Storyline EvalScore, résultat envoyé au LMS (SCORM, statut passed/failed). Étude de cas écrite : 9 pts évalués par le formateur avec la grille (notes de la slide case_form) ; condition de délivrance du badge : ≥ 6/9.\nTentatives : variable Attempt (max 2) ; à la 2e tentative, ordre des questions et des options mélangé (banque de 15 questions). Pas de retour arrière pendant le quiz ; correction détaillée affichée après chaque validation (calque feedback)."}, {"type": "qcm", "eyebrow": "Évaluation · Marché 2026", "title": "Le vendeur pense que le marché est à l'arrêt", "question_label": "Question 1 sur 15", "question": "Un vendeur vous dit : « Plus personne n'achète en 2026. » Quelle réponse est fondée sur les données de l'Insee ?", "options": ["« Vous avez raison, le marché est bloqué depuis 2023. »", "« 958 000 ventes dans l'ancien sur 12 mois à fin juin 2026, et des prix à −0,8 % sur un an : les acheteurs sont là, au bon prix. »", "« Les prix remontent de 10 % cette année, c'est le moment. »", "« Le volume n'a aucun lien avec votre vente. »"], "answer": "B", "feedbacks": ["Non. Les données contredisent ce discours : 958 000 ventes sur 12 mois à fin juin 2026 (Insee). Confirmer une idée fausse vous fait perdre en crédibilité et pousse le vendeur à attendre.", "Exact. Vous citez un volume et une évolution de prix sourcés (Insee, données à fin juin 2026), sans dramatiser ni promettre. Ensuite, vous ramenez la discussion au marché local de son bien.", "Non. Aucune source ne donne +10 % : au T2 2026, les prix sont à −0,8 % sur un an. Promettre une hausse est une faute de conseil et vous expose si le prix n'est pas atteint.", "Non. Le volume indique s'il y a des acheteurs actifs : c'est un argument utile. Mais il se complète toujours par une lecture locale des prix."], "notes": "Question 1 · compétence Marché 2026 · 1 pt. Calque feedback après validation, bouton « Suivant » ensuite. Source : Insee, Informations rapides n° 216, 8/09/2026."}, {"type": "qcm", "eyebrow": "Évaluation · Marché 2026", "title": "Le taux d'usure et l'acquéreur", "question_label": "Question 2 sur 15", "question": "Du 1er octobre au 31 décembre 2026, le taux d'usure des prêts immobiliers de 20 ans et plus est de 5,40 %. Que signifie ce chiffre pour votre acquéreur ?", "options": ["C'est le taux moyen que les banques proposent aujourd'hui sur 20 ans.", "C'est le TAEG maximal légal : au-delà, la banque ne peut pas prêter, assurance et frais compris.", "C'est le taux minimal en dessous duquel la banque refuse de prêter.", "C'est le taux fixé par le notaire pour l'acte de vente."], "answer": "B", "feedbacks": ["Non. Le taux moyen 20 ans tourne autour de 3,50-3,55 % en octobre 2026 (Meilleurtaux). Le taux d'usure est un plafond légal, pas une moyenne.", "Exact. Le taux d'usure plafonne le TAEG (intérêts, assurance, frais). Un dossier dont le TAEG dépasse 5,40 % ne peut pas être financé : surveillez-le pour les profils avec une assurance chère.", "Non. Il n'existe pas de taux minimal légal. Le taux d'usure est un maximum, fixé chaque trimestre par la Banque de France.", "Non. Le notaire ne fixe aucun taux de crédit. Le taux d'usure est publié par la Banque de France chaque trimestre."], "notes": "Question 2 · compétence Marché 2026 · 1 pt. Sources : Banque de France, taux d'usure applicables du 1/10 au 31/12/2026 (20 ans et plus 5,40 %) ; Meilleurtaux, baromètre du 19/10/2026."}, {"type": "qcm", "eyebrow": "Évaluation · Marché 2026", "title": "Les règles du HCSF", "question_label": "Question 3 sur 15", "question": "Un couple d'acquéreurs veut emprunter sur 28 ans pour un appartement ancien, avec un taux d'effort de 38 %. Que dit la norme du HCSF ?", "options": ["Rien : le HCSF ne fixe que des recommandations facultatives.", "Taux d'effort maximal 35 % assurance comprise, durée 25 ans maximum : le dossier sort de la norme et ne peut passer que dans la marge de flexibilité de la banque.", "Le dossier est conforme car seule la durée compte.", "Le taux d'effort maximal est de 33 % hors assurance."], "answer": "B", "feedbacks": ["Non. Depuis le 1er janvier 2022, la décision du HCSF est juridiquement contraignante pour les banques. Ce n'est plus une simple recommandation.", "Exact. 35 % maximum assurance comprise et 25 ans maximum (27 ans dans certains cas de différé pour le neuf ou les travaux). Hors norme, le dossier dépend de la marge de flexibilité limitée de la banque : orientez vers un courtier.", "Non. Les deux critères s'appliquent ensemble. Ici, la durée (28 ans) et le taux d'effort (38 %) dépassent la norme.", "Non. Le seuil de 33 % est une ancienne règle d'usage. La norme actuelle est 35 %, assurance emprunteur comprise."], "notes": "Question 3 · compétence Marché 2026 / financement · 1 pt. Source : HCSF, décision D-HCSF-2021-7 (contraignante depuis le 1/01/2022), maintenue en 2026 (voir communiqués HCSF ; synthèse : https://www.magnolia.fr/actualites/immobilier/credit-immobilier-fin-2026-taux-endettement-duree-emprunt-hcsf). Marge de flexibilité : 20 % de la production trimestrielle [À VALIDER : vérifier le dernier communiqué HCSF avant diffusion]."}, {"type": "qcm", "eyebrow": "Évaluation · DPE", "title": "Le double seuil du DPE", "question_label": "Question 4 sur 15", "question": "Un logement de 90 m² affiche 260 kWhEP/m²/an en énergie primaire et 40 kgCO₂/m²/an d'émissions. Quelle est sa classe DPE ?", "options": ["D, car les émissions sont en D.", "E, car la classe retenue est la moins bonne des deux indicateurs.", "La moyenne des deux : entre D et E.", "On ne peut pas savoir sans les factures."], "answer": "B", "feedbacks": ["Non. 40 kgCO₂ correspond bien à D (≤ 50), mais 260 kWhEP correspond à E (≤ 330). On ne retient pas la meilleure des deux classes.", "Exact. C'est le double seuil : énergie primaire en E (de 251 à 330), émissions en D (de 31 à 50). La classe retenue est la moins bonne : E.", "Non. Il n'y a pas de moyenne dans la méthode 3CL. La classe affichée est la plus défavorable des deux indicateurs.", "Non. Le DPE estime une consommation conventionnelle, indépendante des factures. Les deux valeurs suffisent pour lire la classe."], "notes": "Question 4 · compétence DPE · 1 pt. Seuils ≥ 40 m² : D ≤ 250/50, E ≤ 330/70. Source : arrêté du 31/03/2021 modifié (méthode 3CL) ; ADEME."}, {"type": "qcm", "eyebrow": "Évaluation · DPE", "title": "Coefficient électrique et attestation", "question_label": "Question 5 sur 15", "question": "M. Bernard (fictif) a un DPE F de mars 2023, chauffage électrique. Que lui dites-vous sur la réforme du coefficient de l'électricité ?", "options": ["« Le coefficient est passé de 2,3 à 1,9 au 1er janvier 2026, puis passe à 1,7 au 1er janvier 2027. Téléchargeons votre attestation actualisée gratuite sur l'observatoire de l'ADEME. »", "« Votre maison passe automatiquement en C. »", "« Il faut refaire un DPE complet avec une nouvelle visite. »", "« La réforme ne concerne que les logements neufs. »"], "answer": "A", "feedbacks": ["Exact. Le DPE date d'après le 1er juillet 2021 : l'attestation actualisée est gratuite, sans nouvelle visite, avec le numéro ADEME à 13 caractères. Vous vérifiez la nouvelle classe sans la promettre à l'avance.", "Non. Aucune classe n'est garantie : le gain dépend de la part d'électricité dans la consommation. Annoncer une classe avant vérification est une promesse que vous ne pouvez pas tenir.", "Non. Pour un DPE établi depuis le 1er juillet 2021, l'attestation actualisée suffit et remplace l'étiquette jusqu'à la fin de validité du DPE d'origine.", "Non. La réforme s'applique aux DPE des logements existants chauffés à l'électricité. Environ 850 000 logements sont sortis des classes F-G en 2026 selon le Gouvernement."], "notes": "Question 5 · compétence DPE · 1 pt. Sources : arrêté du 13/08/2025 (1,9 au 1/01/2026) ; arrêté du 19/08/2026, NOR VLOL2617030A (1,7 au 1/01/2027) ; observatoire DPE-Audit de l'ADEME (attestation actualisée)."}, {"type": "qcm", "eyebrow": "Évaluation · DPE", "title": "La validité d'un DPE", "question_label": "Question 6 sur 15", "question": "Un vendeur vous présente un DPE établi en novembre 2019. Peut-il l'utiliser pour vendre en 2026 ?", "options": ["Oui, un DPE est valable 10 ans, donc jusqu'en 2029.", "Non : les DPE établis du 1er janvier 2018 au 30 juin 2021 ne sont plus valables depuis le 1er janvier 2025. Il faut un nouveau DPE.", "Oui, à condition de télécharger l'attestation actualisée.", "Oui, s'il ajoute ses factures d'électricité."], "answer": "B", "feedbacks": ["Non. La durée de 10 ans a été raccourcie pour les anciens DPE : ceux de 2018 à mi-2021 ont expiré au 1er janvier 2025, ceux de 2013 à 2017 au 1er janvier 2023.", "Exact. Ce DPE n'est plus valable. Le vendeur doit commander un nouveau DPE avant la mise en vente : c'est une pièce obligatoire de l'annonce et du dossier de diagnostic technique.", "Non. L'attestation actualisée n'existe que pour les DPE établis depuis le 1er juillet 2021, selon la méthode actuelle. Un DPE de 2019 ne peut pas être actualisé.", "Non. Les factures ne remplacent pas le DPE. Depuis le 1er juillet 2021, le DPE repose sur la méthode 3CL et il est opposable."], "notes": "Question 6 · compétence DPE · 1 pt. Source : décret n° 2020-1610 du 17/12/2020 (validité des DPE) ; Service-Public.fr, fiche DPE."}, {"type": "qcm", "eyebrow": "Évaluation · Prospection conforme", "title": "Le consentement au démarchage", "question_label": "Question 7 sur 15", "question": "Depuis le 11 août 2026, un propriétaire a accepté d'être appelé par votre agence. Combien de temps vaut cet accord et combien de temps gardez-vous sa preuve ?", "options": ["L'accord vaut sans limite tant qu'il ne s'y oppose pas ; preuve 1 an.", "L'accord vaut 1 an maximum, sans reconduction tacite ; preuve conservée au moins 3 ans.", "L'accord vaut 3 ans ; aucune preuve n'est exigée.", "L'accord vaut 6 mois ; preuve conservée 5 ans."], "answer": "B", "feedbacks": ["Non. Le consentement n'est pas illimité : il dure 1 an au plus, sans reconduction tacite. Et il peut être retiré à tout moment, même oralement.", "Exact. 1 an maximum (art. R. 223-1 du Code de la consommation) et preuve conservée au moins 3 ans (R. 223-2). Notez la date de fin dans votre registre et redemandez l'accord avant échéance.", "Non. La durée maximale est 1 an et la charge de la preuve pèse sur le professionnel. Sans preuve, vous ne pouvez pas démontrer que l'appel était autorisé.", "Non. Ces durées ne correspondent pas au décret : 1 an maximum pour l'accord, au moins 3 ans pour la conservation de la preuve."], "notes": "Question 7 · compétence Prospection · 1 pt. Sources : loi n° 2025-594 du 30/06/2025 ; décret n° 2026-662 du 23/07/2026, art. R. 223-1 à R. 223-3 du Code de la consommation (Légifrance)."}, {"type": "qcm", "eyebrow": "Évaluation · Prospection conforme", "title": "Fin de Bloctel et sanctions", "question_label": "Question 8 sur 15", "question": "Un collaborateur appelle un propriétaire trouvé sur une annonce, sans accord préalable, et signe ensuite un mandat avec lui. Quel est le risque ?", "options": ["Aucun, puisque le propriétaire n'était pas inscrit sur Bloctel.", "Un simple rappel à l'ordre de la DGCCRF.", "Une amende jusqu'à 75 000 € (personne physique) ou 375 000 € (personne morale), et la nullité du contrat conclu à la suite de cet appel.", "Seulement une amende si le propriétaire porte plainte."], "answer": "C", "feedbacks": ["Non. Bloctel a été supprimé : depuis le 11 août 2026, il ne suffit plus de vérifier une liste d'opposition. Il faut un accord préalable, prouvé.", "Non. Le texte prévoit des sanctions administratives lourdes, pas un simple avertissement.", "Exact. Amende administrative (art. L. 242-16) et nullité du contrat conclu à la suite d'un démarchage illicite (art. L. 223-1). Un mandat obtenu ainsi peut tomber, avec votre honoraire.", "Non. La DGCCRF peut sanctionner sans plainte. Et la nullité du contrat peut être invoquée par le propriétaire."], "notes": "Question 8 · compétence Prospection · 1 pt. Sources : Code de la consommation, art. L. 223-1 et L. 242-16 modifiés par la loi n° 2025-594 (Légifrance)."}, {"type": "qcm", "eyebrow": "Évaluation · Prospection conforme", "title": "Canal par canal", "question_label": "Question 9 sur 15", "question": "Lequel de ces contacts avec un particulier reste possible sans consentement préalable ?", "options": ["Un SMS de prospection : « Estimation offerte cette semaine ! »", "Un e-mail de prospection envoyé à une adresse trouvée sur un annuaire", "Un appel téléphonique à froid si vous vous présentez poliment", "Un prospectus proposant un avis de valeur, déposé en boîte aux lettres, hors boîtes portant un « Stop Pub »"], "answer": "D", "feedbacks": ["Non. Le SMS de prospection vers un particulier exige un consentement préalable (art. L. 34-5 du CPCE, règle CNIL déjà en vigueur avant la loi de 2025).", "Non. L'e-mail de prospection vers un particulier exige aussi un consentement préalable (L. 34-5 CPCE), quelle que soit la source de l'adresse.", "Non. La politesse ne remplace pas l'accord. Depuis le 11 août 2026, l'appel de prospection exige un consentement préalable, sauf contrat en cours en lien avec l'objet de l'appel.", "Exact. Le boîtage n'est pas du démarchage téléphonique ni électronique. Respectez les mentions « Stop Pub » et proposez un moyen de vous contacter : c'est le propriétaire qui fait la démarche."], "notes": "Question 9 · compétence Prospection · 1 pt. Sources : CPCE art. L. 34-5 ; CNIL, fiche prospection commerciale par SMS et e-mail ; Code de la consommation art. L. 223-1. Boîtage : respect du « Stop Pub » (art. L. 541-15-15 C. env.) ; l'expérimentation « Oui Pub » a pris fin, une proposition de loi envisage de la relancer [À VALIDER avant diffusion]."}, {"type": "qcm", "eyebrow": "Évaluation · Loi Hoguet", "title": "Les conditions du mandat", "question_label": "Question 10 sur 15", "question": "Un vendeur vous dit au téléphone : « Allez-y, faites visiter, on signera plus tard. » Que faites-vous ?", "options": ["Vous organisez les visites : l'accord oral suffit entre gens de confiance.", "Vous faites signer d'abord un mandat écrit, inscrit au registre des mandats avec son numéro d'ordre, avant toute visite.", "Vous faites visiter et vous faites signer le mandat le jour de l'offre.", "Vous publiez l'annonce sans prix en attendant le mandat."], "answer": "B", "feedbacks": ["Non. La loi Hoguet impose un mandat écrit préalable à toute négociation. Sans lui, vous ne pouvez prétendre à aucune rémunération.", "Exact. Mandat écrit préalable, numéro d'ordre du registre reporté sur l'exemplaire du client, avec prix, durée, rémunération et partie qui la paie. C'est la condition de votre honoraire.", "Non. Un mandat signé après les visites ne régularise pas une négociation menée sans mandat : votre droit à rémunération est fragilisé.", "Non. Diffuser une annonce, c'est déjà commercialiser le bien : il faut un mandat écrit avant."], "notes": "Question 10 · compétence Hoguet · 1 pt. Sources : loi n° 70-9 du 2/01/1970, art. 6 ; décret n° 72-678 du 20/07/1972, art. 72 (Légifrance)."}, {"type": "qcm", "eyebrow": "Évaluation · Loi Hoguet", "title": "Mandat exclusif signé au domicile", "question_label": "Question 11 sur 15", "question": "Vous faites signer un mandat exclusif au domicile du vendeur. Quelles règles s'appliquent ?", "options": ["Aucune rétractation possible : le mandat est définitif dès la signature.", "Rétractation de 14 jours avec formulaire ; exclusivité en caractères très apparents ; résiliation possible après 3 mois avec un préavis de 15 jours par LRAR.", "Rétractation de 7 jours ; résiliation impossible avant la fin du mandat.", "Résiliation par simple appel téléphonique à tout moment."], "answer": "B", "feedbacks": ["Non. Un mandat signé hors établissement ouvre un délai de rétractation de 14 jours. Oublier le formulaire allonge ce délai et fragilise le mandat.", "Exact. Ce sont les trois points à vérifier sur votre modèle : formulaire de rétractation (14 jours), clause d'exclusivité très apparente, résiliation après 3 mois par lettre recommandée avec un préavis de 15 jours.", "Non. Le délai est de 14 jours. Et un mandat exclusif peut être résilié après 3 mois, avec un préavis de 15 jours.", "Non. La résiliation se fait par lettre recommandée avec avis de réception, après 3 mois, avec un préavis de 15 jours."], "notes": "Question 11 · compétence Hoguet · 1 pt. Sources : décret n° 72-678, art. 78 ; Code de la consommation, art. L. 221-18 (rétractation 14 jours hors établissement)."}, {"type": "qcm", "eyebrow": "Évaluation · Les 5 techniques", "title": "Choisir la bonne technique", "question_label": "Question 12 sur 15", "question": "Mme Lambert (fictive) vous a autorisé à la rappeler. Sa maison, chauffée à l'électricité, a un DPE E de 2022. Avant de parler de prix, quelle technique appliquez-vous ?", "options": ["L'exclusivité contre services : vous proposez tout de suite le mandat exclusif.", "La vérification du DPE : attestation actualisée, cohérence des surfaces et des équipements, avant tout avis de valeur.", "Le plan de vente : vous fixez la date de mise en ligne.", "Aucune : vous donnez une fourchette de prix de mémoire."], "answer": "B", "feedbacks": ["Non. Demander l'exclusivité avant d'avoir apporté de la valeur ressemble à une pression. Elle vient après l'avis de valeur et le plan de vente.", "Exact. Après le contact consenti vient la vérification du DPE. Elle nourrit l'avis de valeur 360°, puis le plan de vente, puis l'exclusivité contre services.", "Non. Le plan de vente suppose un avis de valeur, qui suppose un DPE vérifié. Vous sautez deux étapes.", "Non. Un prix de mémoire, sans DPE vérifié ni analyse, n'est pas un avis de valeur. Il vous expose à un mandat mal positionné."], "notes": "Question 12 · compétence 5 techniques · 1 pt. Ordre : 1 contact consenti, 2 vérification du DPE, 3 avis de valeur 360°, 4 plan de vente, 5 exclusivité contre services (séquence 4). Proposition pédagogique du programme Éco-Consultant."}, {"type": "qcm", "eyebrow": "Évaluation · Les 5 techniques", "title": "L'exclusivité contre services", "question_label": "Question 13 sur 15", "question": "Un vendeur dit : « Je veux garder la possibilité de vendre moi-même. » Quelle réponse respecte la technique de l'exclusivité contre services ?", "options": ["« Les ventes en exclusivité sont 9 fois sur 10 mieux négociées. »", "« Alors je ne peux rien faire pour vous. »", "« Je comprends. Voici ce que je m'engage à faire en contrepartie : plan de vente écrit, compte rendu chaque semaine. Et le mandat reste résiliable après 3 mois. »", "« Signez en simple, on passera en exclusif plus tard. »"], "answer": "C", "feedbacks": ["Non. Ce chiffre n'est pas sourcé : ne l'utilisez jamais. Une enquête déclarative leboncoin Immo (2025) donne 91 jours en exclusif contre 142 en simple, à présenter comme telle.", "Non. Vous fermez la porte. Selon les pros interrogés, 62 % des vendeurs veulent garder cette possibilité (leboncoin Immo, 2025, déclaratif) : c'est une objection normale, à traiter.", "Exact. Vous reconnaissez l'objection, vous listez des services concrets et vous rappelez une garantie légale réelle : la résiliation après 3 mois avec préavis de 15 jours.", "Non. Vous évitez le sujet sans répondre. Le vendeur doit comprendre ce qu'il gagne en échange de l'exclusivité dès maintenant."], "notes": "Question 13 · compétence 5 techniques · 1 pt. Source : enquête leboncoin Immo auprès de 419 professionnels, sept.-oct. 2025 (déclaratif)."}, {"type": "qcm", "eyebrow": "Évaluation · IA", "title": "Données personnelles et IA", "question_label": "Question 14 sur 15", "question": "Pour préparer un rendez-vous, vous voulez demander à un assistant d'IA grand public d'analyser une situation vendeur. Que faites-vous ?", "options": ["Vous copiez le nom, le téléphone, l'adresse et la situation familiale du vendeur pour une réponse précise.", "Vous anonymisez : pas de nom, pas de coordonnées, pas d'adresse exacte, seulement les caractéristiques utiles du bien.", "Vous collez le DPE complet avec le nom du propriétaire.", "Vous demandez au vendeur l'autorisation par SMS, puis vous collez tout."], "answer": "B", "feedbacks": ["Non. Vous transmettez des données personnelles à un service tiers sans base légale ni information du vendeur. C'est contraire au RGPD et inutile pour l'analyse.", "Exact. Minimisation des données (RGPD) : « maison de 112 m², électrique, DPE F 2023, commune X » suffit. L'IA n'a pas besoin de savoir qui est le vendeur.", "Non. Le DPE comporte le nom et l'adresse du propriétaire. Retirez ces mentions, ou ne gardez que les valeurs utiles.", "Non. Même avec un accord, transmettre des données inutiles à l'analyse reste contraire au principe de minimisation. Anonymisez."], "notes": "Question 14 · compétence IA · 1 pt. Sources : RGPD, art. 5.1.c (minimisation) ; CNIL, recommandations IA et données personnelles (cnil.fr)."}, {"type": "qcm", "eyebrow": "Évaluation · IA", "title": "Vérifier ce que produit l'IA", "question_label": "Question 15 sur 15", "question": "L'IA vous propose : « Les biens classés F perdent en moyenne 25 % de valeur en France. » Que faites-vous avant le rendez-vous ?", "options": ["Vous l'utilisez tel quel : l'IA cite souvent des études fiables.", "Vous cherchez la source primaire. À défaut, vous ne l'utilisez pas. Ici, les Notaires donnent des écarts par région et par année, pas de moyenne nationale.", "Vous arrondissez à 20 % pour rester prudent.", "Vous l'utilisez en précisant « selon l'IA »."], "answer": "B", "feedbacks": ["Non. L'IA peut inventer un chiffre plausible. Un chiffre non sourcé devant un vendeur, c'est votre crédibilité qui est en jeu, pas celle de l'outil.", "Exact. Vérifier, puis garder la main : la source primaire (Notaires, étude valeur verte, publiée en janvier 2026) donne des écarts qui varient fortement selon les régions. Citez la région et l'année.", "Non. Modifier un chiffre non sourcé ne le rend pas fiable. Vous créez une deuxième erreur.", "Non. « Selon l'IA » n'est pas une source. Le vendeur attend un professionnel qui a vérifié ses informations."], "notes": "Question 15 · compétence IA · 1 pt. Fin du quiz : calcul de QuizScore (sur 15), affichage du score intermédiaire puis passage à l'étude de cas. Source : Notaires de France, étude valeur verte (transactions 2024, publiée en janvier 2026)."}, {"type": "case_form", "eyebrow": "Évaluation · Étude de cas écrite", "title": "Mme Garnier veut vendre en mars 2027", "case_title": "Mme Garnier (cas fictif)", "case_paras": ["Mme Garnier possède un appartement de 58 m² chauffé à l'électricité, dans une copropriété de 30 lots. Son DPE, classé G, a été établi en juin 2022.", "Elle envisage de vendre en mars 2027. Elle a rempli votre formulaire « Être recontactée au sujet de mon DPE » sur votre site, avec une case non pré-cochée.", "Elle vous confie : « Une autre agence m'a téléphoné la semaine dernière. Je ne leur ai jamais donné mon numéro. Et on m'a dit qu'il me fallait un audit énergétique. »", "Rédigez vos réponses. Elles seront évaluées par le formateur avec une grille sur 9 points."], "inputs": ["1. Que dites-vous de son DPE G de 2022 (validité, coefficient, attestation, audit) ?", "2. Que lui répondez-vous au sujet de l'appel de l'autre agence ?", "3. Quelles prochaines étapes conformes lui proposez-vous, jusqu'au mandat ?"], "answer": "Réponse type. 1 : DPE valable jusqu'en 2032 ; attestation ADEME gratuite (coef. 1,9, puis 1,7 au 1/01/2027) sans visite ; aucune classe promise ; pas d'audit pour un lot de copropriété. 2 : appel sans accord illicite depuis le 11/08/2026 ; elle peut le signaler ; un contrat qui en découle serait nul. 3 : registre du consentement ; rendez-vous ; avis de valeur 360° ; plan de vente ; mandat Hoguet.", "feedbacks": ["Champ 1 (3 pts) : 1 pt validité (DPE de 2022, méthode actuelle, valable 10 ans) ; 1 pt attestation ADEME gratuite avec le numéro à 13 caractères, à refaire après le 1er janvier 2027 (coefficient 1,7), sans promettre de classe ; 1 pt audit : non obligatoire pour un appartement en copropriété.", "Champ 2 (3 pts) : 1 pt appel sans consentement préalable interdit depuis le 11 août 2026 (Bloctel supprimé) ; 1 pt droit de signaler (SignalConso) et nullité d'un contrat conclu à la suite ; 1 pt posture : vous ne dénigrez pas le confrère, vous montrez votre propre preuve de consentement.", "Champ 3 (3 pts) : 1 pt consentement tracé (date, objet, durée 1 an, preuve 3 ans, retrait possible) ; 1 pt démarche : rendez-vous, documents de copropriété, avis de valeur 360°, plan de vente ; 1 pt mandat écrit inscrit au registre, rétractation 14 jours s'il est signé chez elle.", "Erreurs éliminatoires (0 au champ concerné) : promettre une classe ou un prix ; affirmer que l'audit est obligatoire ; conseiller de rappeler l'autre agence pour négocier ; proposer de visiter sans mandat écrit."], "notes": "Étude de cas écrite · 9 pts · correction par le formateur (zone de saisie Storyline : 3 champs texte, variables CasRep1 à CasRep3, envoyées au LMS par interaction « fill-in » ou export xAPI). Après envoi : affichage de la réponse type et de la grille (calque correction) pour auto-positionnement immédiat.\nPoints de vigilance pour le correcteur : (1) l'attestation actualisée vaut jusqu'à la fin de validité du DPE d'origine (juin 2032) ; la date de mise à jour effective du calcul à 1,7 dans l'observatoire début 2027 [À VALIDER auprès de l'ADEME] ; (2) l'audit énergétique réglementaire ne concerne que les maisons et immeubles en monopropriété (F-G depuis 2023, E depuis 2025) ; (3) R. 223-4 (réponse à une demande d'information) ne couvre que la rénovation énergétique et l'adaptation du logement : il ne fonde pas un appel d'agence immobilière.\nSources : ADEME observatoire DPE-Audit ; arrêté du 19/08/2026 ; loi n° 2025-594 et décret n° 2026-662 ; loi Hoguet ; Service-Public.fr (audit énergétique)."}, {"type": "dialogue", "eyebrow": "Évaluation · Simulation", "title": "Le premier appel à Mme Garnier", "persona_name": "Mme Garnier (fictive)", "opening": "« Bonjour… Encore une agence ? La semaine dernière, on m'a appelée sans que je l'aie demandé. Pourquoi est-ce que je vous ferais confiance ? »", "options": ["« Vous avez rempli notre formulaire le 12 octobre pour être recontactée au sujet de votre DPE. Je vous appelle pour cela, et vous pouvez retirer cet accord à tout moment. »", "« Toutes les agences font pareil, ne vous inquiétez pas. »", "« Votre appartement passera en E avec la réforme, je vous le garantis. »"], "tree": "Jauge de confiance : départ 40/100.\nNŒUD 1 (ouverture)\n- A (+25 → 65) : Mme Garnier : « Ah oui, c'est vrai, j'ai rempli ce formulaire. Alors, mon DPE G, il est bon à jeter ? » → NŒUD 2.\n- B (−20 → 20) : Mme Garnier : « Justement, c'est bien ça le problème. » → NŒUD 2B.\n- C (−25 → 15) : Mme Garnier : « Vous ne l'avez même pas vu. Comment pouvez-vous garantir ça ? » → NŒUD 2B.\nNŒUD 2 (DPE)\n- A2 « Non. Il date de 2022, il reste valable jusqu'en 2032. Avec votre numéro ADEME, on télécharge ensemble l'attestation actualisée, gratuite, sans nouvelle visite. On verra la classe réelle, je ne vous en promets aucune. » (+25 → 90) → NŒUD 3.\n- B2 « Il faudra faire un audit énergétique avant de vendre. » (−20 → 45) : erreur, l'audit ne concerne pas un appartement en copropriété → NŒUD 3.\nNŒUD 2B (rattrapage)\n- A2b « Vous avez raison d'être prudente. Vous avez rempli notre formulaire le 12 octobre : voici l'objet de mon appel, et vous pouvez retirer cet accord quand vous voulez. » (+25) → NŒUD 2.\n- B2b « Bon, je vous rappellerai. » (−10) → fin, verdict D.\nNŒUD 3 (suite)\n- A3 « Je vous propose un rendez-vous chez vous pour l'avis de valeur 360°. Je vous montrerai notre mandat avant toute mise en vente ; si vous le signez chez vous, vous aurez 14 jours pour vous rétracter. » (+10) → fin.\n- B3 « Signons tout de suite un mandat par e-mail, on verra le prix ensuite. » (−35 : le prix est une mention obligatoire du mandat, loi Hoguet) → fin.\nVERDICTS\n- ≥ 85 : verdict A « Confiance gagnée » → 5 pts.\n- 60 à 84 : verdict B « Rendez-vous obtenu, à consolider » → 3 pts.\n- < 60 : verdict D « Contact perdu » → 0 pt.\nCorrection affichée à la fin : rappel des 3 réflexes (preuve du consentement, attestation sans promesse, mandat écrit avant mise en vente).", "notes": "Simulation notée 5 pts (variable SimScore selon le verdict). Jauge de confiance visible à l'écran. Chaque réplique de Mme Garnier en narration ElevenLabs (voix féminine, 60-70 ans, ton méfiant puis détendu). Le score final EvalScore = QuizScore + SimScore (sur 20) est calculé à la sortie de la slide, puis envoyé au LMS. Si EvalScore < 14 et Attempt = 1 : calque « Deuxième tentative » proposé après la correction. Sources : Code de la consommation R. 223-1 à R. 223-3 ; ADEME ; loi Hoguet.", "graph": {"start": "n1", "initial": 40, "nodes": {"n1": {"him": "« ion détaillée", "title": "Les points qui font la différence", "paras": ["Les erreurs les plus fréquentes ne portent pas sur les chiffres, mais sur les promesses : promettre une classe DPE, un prix, ou appeler sans preuve d'accord.", "Pour chaque erreur, revoyez la séquence indiquée dans le tableau avant votre deuxième tentative. Vos réponses écrites sont relues par le formateur sous 5 jours ouvrés."], "table": {"headers": ["Compétence", "Point clé", "À revoir"], "rows": [["Marché 2026", "958 000 ventes, −0,8 %, usure 5,40 %", "Séquence 1"], ["Financement", "HCSF : 35 %, 25 ans", "Unité 1.2"], ["DPE", "Double seuil, 1,9 puis 1,7, attestation", "Séquence 2"], ["Prospection", "Accord 1 an, preuve 3 ans, nullité", "Séquence 3"], ["Loi Hoguet", "Écrit, registre, 3 mois / 15 jours", "Unité 3.5"], ["5 techniques", "Contact, DPE, valeur, plan, exclusivité", "Séquence 4"], ["IA", "Vérifier, anonymiser, garder la main", "Séquence 5"]]}, "caption": "Score affiché : quiz /15, simulation /5, total /20 (seuil 14). Étude de cas : /9, corrigée par le formateur.", "notes": "Écran de correction globale. Affichage dynamique : variables QuizScore, SimScore, EvalScore ; calque « Réussi » (EvalScore ≥ 14 : badge en attente de la correction du cas) ou calque « Deuxième tentative » (bouton « Recommencer » si Attempt = 1 ; sinon message d'orientation vers le formateur). Chaque ligne du tableau est cliquable : lien vers la séquence à revoir. Narration : « Voici votre score. Les points clés de chaque compétence sont résumés ici. Si une ligne vous a posé problème, revoyez la séquence indiquée. » Délai de correction de 5 jours ouvrés : proposition pédagogique [À VALIDER par l'organisme]."}, {"type": "divider", "kicker": "Unité 7.2", "title": "Plan d'action 7 jours et boîte à outils", "notes": "Séparateur d'unité 7.2 (≈ 10 min). Accessible après la fin de l'évaluation (quel que soit le score), pour que l'apprenant récupère ses outils."}, {"type": "table", "eyebrow": "Unité 7.2 · Plan d'action", rce", "eyebrow": "Unité 7.2 · Boîte à outils (1/2)", "title": "Vos outils pour préparer et mener le rendez-vous", "items": ["Checklist de rendez-vous vendeur : ne rien oublier avant, pendant et après le rendez-vous.", "Grille d'analyse du DPE : validité, double seuil, cohérence des surfaces et des équipements.", "Fiche réflexe étiquette électrique : coefficient 2,3 → 1,9 (2026) → 1,7 (2027) et attestation ADEME.", "Modèle d'argumentaire valeur énergétique : expliquer la classe sans promettre ni dramatiser.", "Fiche objections : réponses sourcées aux objections fréquentes (prix, exclusivité, DPE, attente).", "Modèle de plan de vente : calendrier, diffusion, comptes rendus, points d'étape avec le vendeur."], "example_title": "Exemple d'usage avec M. Bernard", "example_text": "Avant le rendez-vous, la grille d'analyse du DPE montre un DPE F de mars 2023, donc actualisable. La fiche réflexe vous donne la phrase : « On télécharge ensemble votre attestation, sans nouvelle visite. » Le modèle de plan de vente prépare ensuite la discussion sur l'exclusivité.", "pdf_label": "Télécharger la boîte à outils 1/2 (PDF)", "sources": "Sources : ADEME ; arrêtés du 13/08/2025 et du 19/08/2026 ; Insee ; Notaires de France ; leboncoin Immo (2025).", "notes": "Ressource téléchargeable (6 fiches regroupées dans un PDF, lien LMS). Chaque item est cliquable : aperçu de la fiche dans un calque. Fiches conçues dans les séquences 1, 2 et 4. Narration : « Voici vos six outils pour le rendez-vous. Gardez-les à portée de main, ils sont faits pour être utilisés sur le terrain. »"}, {"type": "resource", "eyebrow": "Unité 7.2 · Boîte à outils (2/2)", "title": "Vos outils de conformité, d'IA et de pilotage", "items": ["Checklist de prise de mandat : écrit, registre, prix, durée, rémunération, exclusivité, rétractation 14 jours.", "Guide de vérification des consentements + modèle de registre : date, texte, canal, durée 1 an, preuve 3 ans.", "Trame de rendez-vous : déroulé en étapes, questions de découverte, conclusion vers le mandat.", "Bibliothèque de prompts IA : préparer, résumer, reformuler, avec données anonymisées et vérification.", "Synthèse réglementaire : DPE, démarchage, RGPD, Hoguet, avec les références des textes.", "Plan d'action 7 jours : une action et une preuve de conformité par jour."], "example_title": "Documents à portée juridique", "example_text": "Le modèle de registre, le guide des consentements, la checklist de mandat et la synthèse réglementaire sont des supports pédagogiques. Faites-les valider par votre juriste, votre réseau ou votre syndicat professionnel avant tout usage professionnel. Les textes évoluent : vérifiez la date de mise à jour.", "pdf_label": "Télécharger la boîte à outils 2/2 (PDF)", "sources": "Sources : loi n° 70-9 et décret n° 72-678 (Hoguet) ; loi n° 2025-594 ; décret n° 2026-662 ; CPCE L. 34-5 ; RGPD ; CNIL.", "notes": "Ressource téléchargeable (6 fiches, PDF, lien LMS). Avertissement juridique affiché en encadré permanent (example_text). Date de mise à jour des fiches : 20/10/2026, à afficher en pied de chaque PDF. Fiches conçues dans les séquences 3, 4 et 5."}, {"type": "sort", "eyebrow": "Unité 7.2 · Entraînement", "title": "Quel outil pour quelle situation ?", "items": ["Un ancien client vous demande de le rappeler : vous vérifiez la date de son accord", "Un vendeur présente un DPE de 2022 classé F", "Le vendeur dit : « Je veux garder la possibilité de vendre seul »", "Vous signez un mandat exclusif au domicile du vendeur", "Vous demandez à l'IA une synthèse anonymisée des ventes DVF de votre secteur", "Vous rédigez le compte rendu hebdomadaire au vendeur"], "categories": ["Conformité", "Analyse du bien", "Relation vendeur"], "answers": [0, 1, 2, 0, 1, 2], "whys": ["Guide de vérification des consentements et registre : l'accord vaut 1 an au plus, et vous devez pouvoir le prouver pendant 3 ans.", "Grille d'analyse du DPE et fiche réflexe électrique : un DPE de 2022 est valable et peut être actualisé gratuitement  sera délivré dès que votre étude de cas aura été corrigée. Mais un badge ne signe pas de mandat. Ce qui compte, c'est la semaine qui vient. Prenez votre plan de sept jours, commencez demain par vos fichiers, et appliquez les cinq techniques sur un premier vendeur. Dans le sous-module 1.2, on va plus loin : vous apprendrez à attirer les propriétaires vers vous, par les réseaux sociaux et par votre fiche Google Business. Autrement dit : faire en sorte que ce soit eux qui vous demandent de les rappeler. À très vite. »"}, {"type": "explain", "eyebrow": "Badge et suite du parcours", "title": "Votre badge et le sous-module 1.2", "paras": ["Badge « Éco-Consultant · Module 1 » : délivré avec un score d'au moins 14/20 à l'évaluation et au moins 6/9 à l'étude de cas corrigée par le formateur.", "Suite du parcours : sous-module 1.2 « Attirer les propriétaires par les réseaux sociaux et Google Business ». Objectif : que les vendeurs vous contactent d'eux-mêmes, avec un consentement clair dès le premier échange."], "cards": [{"value": "≥ 14/20", "label": "évaluation : quiz + simulation"}, {"value": "≥ 6/9", "label": "étude de cas écrite"}, {"value": "1.2", "label": "réseaux sociaux et Google Business"}], "caption": "Conditions de délivrance du badge : proposition pédagogique, à valider par l'organisme de formation.", "notes": "Écran badge et suite. Calque « Badge obtenu » si EvalScore ≥ 14 et CasScore ≥ 6 (CasScore renseigné après correction, côté LMS) ; sinon calque « Badge en attente ». Bouton « Accéder au sous-module 1.2 » (lien LMS, déblocage à 70 % de la séquence 7). Narration : « Votre badge vous attend. Prochaine étape : faire venir les propriétaires à vous. »"}, {"type": "bilan", "title": "Module 1 validé", "text": "Vous savez lire, prouver et convaincre. Votre boîte à outils et votre plan 7 jours vous attendent.", "notes": "Écran de fin de séquence et de module. Envoi du statut SCORM (completed + passed/failed selon EvalScore). Boutons « Télécharger ma boîte à outils » const C=JSON.parse(document.getElementById("course").textContent);
const SL=C.slides;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DPEC={A:"#009C6D",B:"#52B153",C:"#78BD76",D:"#F4E70F",E:"#F0B50F",F:"#EB8235",G:"#D7221F"};

/* ---------- structure : séquences > unités > écrans ---------- */
const SEQS=[]; let cur=null, unit=null;
SL.forEach((s,i)=>{
  if(i===0) return;
  const isSeqStart = s.type==="divider" && /^Séquence/i.test(s.kicker);
  if(isSeqStart){ cur={title:s.title,kicker:s.kicker,start:i,units:[],idx:[]}; SEQS.push(cur); unit={title:"Ouverture",start:i,idx:[]}; cur.units.push(unit); }
  else if(s.type==="divider"){ unit={title:s.kicker+" · "+s.title,start:i,idx:[]}; cur.units.push(unit); }
  if(cur){ cur.idx.push(i); unit.idx.push(i); s._seq=SEQS.length-1; }
});
SEQS.forEach(q=>{ q.units=q.units.filter(u=>u.idx.length>1 || u.title!=="Ouverture"); });

/* ---------- état (navigateur seulement) ---------- */
const KEY="ec-m1-player-v1";
let st={i:0,seen:{},res:{}};
try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.res) st=s; }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} };
function isScored(s){
  const txt=((s.eyebrow||"")+" "+(s.question_label||"")+" "+(s.title||"")).toUpperCase();
  if(/NON NOT|DIAGNOSTIC|OPINION/.test(txt)) return false;
  return ["qcm","sort","document","case_form","dialogue"].includes(s.type);
}
function seqScore(q){ let tot=0,n=0; q.idx.forEach(i=>{ if(isScored(SL[i])){ n++; if(st.res[i]!=null) tot+=st.res[i]; } }); return n?{pct:Math.round(tot/n*100),n,done:q.idx.filter(i=>isScored(SL[i])&&st.res[i]!=null).length}:{pct:null,n:0,done:0}; }

/* ---------- rendu ---------- */
const stage=document.getElementById("stage");
let showNotes=false;
function fb(kind,title,body){ return `<div class="fb ${kind} fade"><img src="${SEB}" alt=""><div><strong>${esc(title)}</strong>${esc(body)}</div></div>`; }
function head(s){ return `${s.eyebrow?`<span class="eyebrow">${esc(s.eyebrow)}</span>`:""}${s.title?`<h1>${esc(s.title)}</h1>`:""}`; }
function steps(items,lettres){ return `<ol class="steps">${items.map((t,k)=>`<li data-k="${lettres?"ABCD"[k]:k+1}"><span>${esc(t)}</span></li>`).join("")}</ol>`; }
function table(h,rows){ return `<div class="scroll"><table class="t"><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,ci)=>`<td>${ci===0&&DPEC[c]?`<span class="dpe" style="background:${DPEC[c]};${c==="G"?"color:#fff":""}">${c}</span>`:esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
function record(i,score){ if(st.res[i]==null){ st.res[i]=Math.max(0,Math.min(1,score)); save(); renderRail(); } }

const R={
 cover:(s,el)=>{ el.innerHTML=`<div class="cover"><div style="display:flex;flex-direction:column;gap:16px"><span class="tag">${esc(s.sequence_label)}</span><h1>${esc(s.title)}</h1><p style="font-size:18px;color:var(--ink-2)">Le marché 2026 et les nouvelles techniques de prise de mandat. 8 séquences, 32 unités, environ 5 h 10.</p><div class="row"><button class="btn btn-p" id="go">Commencer</button>${Object.keys(st.seen).length>2?`<button class="btn btn-g" id="resume">Reprendre où j'en étais</button>`:""}</div><p class="small">Version de démonstration : les vidéos de Sébastien et les narrations sont remplacées par leurs scripts. Vos réponses restent dans ce navigateur.</p></div><img src="${ILLUS}" alt="Trois professionnels du bâtiment et de l'immobilier" style="max-width:100%"></div>`;
   el.querySelector("#go").onclick=()=>go(1); const r=el.querySelector("#resume"); if(r) r.onclick=()=>go(st.last||1); },
 divider:(s,el)=>{ el.innerHTML=`<div class="divider fade"><span class="k">${esc(s.kicker)}</span><span class="t">${esc(s.title)}</span></div>`; },
 video:(s,el)=>{
   const script=(s.notes.match(/«([\s\S]+)»/)||[])[1]||s.notes;
   const parts=script.replace(/\[[^\]]*\]/g,"").split(/(?<=[.!?])\s+/).filter(x=>x.trim());
   el.innerHTML=`<h1>${esc(s.title)}</h1><div class="video"><span class="tag todo" style="position:absolute;top:12px;left:12px">Vidéo HeyGen à générer · avatar SEB</span><div class="in"><img src="${SEB}" alt="Sébastien Paumier"><button class="btn btn-p" id="pl">▶ Lire l'aperçu sous-titré</button><span class="small" style="color:#D9CFC4">${esc(s.label)}</span></div><div class="cc" id="cc" hidden></div></div><details class="notes" open><summary>Transcription</summary><pre>${esc(script.trim())}</pre></details>`;
   el.querySelector("#pl").onclick=()=>{ const cc=el.querySelector("#cc"); cc.hidden=false; let k=0; clearInterval(window.__v); cc.textContent=parts[0]||""; window.__v=setInterval(()=>{ k++; if(k>=parts.length){clearInterval(window.__v);cc.hidden=true;return;} cc.textContent=parts[k]; },Math.max(2200,60*(parts[k-1]||"").split(" ").length*6)); };
 },
 persona:(s,el)=>{ el.innerHTML=head(s)+`<div class="g2"><div class="dark"><div class="persona"><div class="av">${esc(s.initials)}</div><div><b style="font-size:20px">${esc(s.name)}</b><br><span style="color:#D9CFC4">${esc(s.role)}</span></div></div><ul>${s.facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul><p class="quote">${esc(s.quote)}</p></div><div style="display:flex;flex-direction:column;gap:14px">${s.right_paras.map((p,k)=>`<p style="font-size:${k?17:19}px;${k?"":"color:var(--ink-2)"}">${esc(p)}</p>`).join("")}<div class="creamb"><span class="lab">La question</span><p style="font-size:19px;font-weight:900">${esc(s.question)}</p></div></div></div>`; },
 objectives:(s,el)=>{ const side=(s.stats&&s.stats.length)||s.side_title;
   el.innerHTML=head(s)+`<div class="${side?"gside":""}"><div><span class="lab">${esc(s.intro_label||"À la fin de cette unité, vous saurez :")}</span>${steps(s.items)}</div>${side?`<div style="display:flex;flex-direction:column;gap:12px"><div class="dark"><span class="lab">${esc(s.side_title||"Pourquoi c'est important")}</span>${(s.stats||[]).map(x=>`<div style="margin-top:10px"><div class="big mono">${esc(x.value)}</div><div style="font-size:14px">${esc(x.label)}</div></div>`).join("")}${s.side_note?`<p style="margin-top:12px;font-weight:700">${esc(s.side_note)}</p>`:""}</div>${s.footer?`<div class="card small" style="border-color:var(--brand)"><b>${esc(s.footer)}</b></div>`:""}</div>`:""}</div>`; },
 explain:(s,el)=>{ const t=s.table;
   el.innerHTML=head(s)+`<div class="${t?"gside":""}"><div style="display:flex;flex-direction:column;gap:12px">${s.paras.map((p,k)=>`<p style="font-size:17px">${esc(p)}</p>${k===0&&s.formula?`<div class="formula">${esc(s.formula)}</div>`:""}`).join("")}${s.paras.length===0&&s.formula?`<div class="formula">${esc(s.formula)}</div>`:""}</div>${t?`<div>${table(t.headers,t.rows)}</div>`:""}</div>${s.cards&&s.cards.length?`<div class="g3 cols" style="--cols:${Math.min(4,s.cards.length)}">${s.cards.map((c,k)=>`<div class="${k===s.cards.length-1?"card":"creamb"}" style="${k===s.cards.length-1?"border-color:var(--brand)":""}"><div class="mono" style="font-size:26px;font-weight:700">${esc(c.value)}</div><div class="small">${esc(c.label)}</div></div>`).join("")}</div>`:""}${s.caption?`<p class="small"><i>${esc(s.caption)}</i></p>`:""}`; },
 steps_key:(s,el)=>{ el.innerHTML=head(s)+`<div class="gside"><div style="display:flex;flex-direction:column;gap:12px"><div class="creamb"><b style="color:var(--brand-deep)">Principe </b>${esc(s.principle)}</div><span class="lab">${esc(s.steps_label||"Mise en œuvre")}</span>${steps(s.steps)}</div><div style="display:flex;flex-direction:column;gap:12px"><div class="dark"><span class="lab">Phrase clé</span><p style="font-size:22px;font-weight:900;line-height:1.3">${esc(s.key_phrase)}</p></div>${s.stage_value?`<div class="card" style="border-color:var(--brand)"><span class="lab">${esc(s.stage_label||"Étape du parcours")}</span><b>${esc(s.stage_value)}</b></div>`:""}</div></div>`; },
 two_cols:(s,el)=>{ const doTone=(s.tone||"do")==="do";
   el.innerHTML=head(s)+`<div class="g2"><div class="card"><span class="lab" style="color:${doTone?"var(--ok)":"var(--brand-deep)"}">${esc(s.left_title)}</span><div style="display:flex;flex-direction:column;gap:10px">${s.left_items.map(t=>`<p>${esc(t)}</p>`).join("")}</div></div><div class="dark"><span class="lab" style="color:${doTone?"#FF8A7D":"var(--brand-soft)"}">${esc(s.right_title)}</span><div style="display:flex;flex-direction:column;gap:10px">${s.right_items.map(t=>`<p>${esc(t)}</p>`).join("")}</div></div></div>${s.footer_text?`<div class="creamb">${s.footer_title?`<b style="color:var(--brand-deep)">${esc(s.footer_title)} </b>`:""}${esc(s.footer_text)}</div>`:""}`; },
 recap:(s,el)=>{ el.innerHTML=head(s)+`<div class="g3">${s.cards.map((c,k)=>`<div class="card"><span class="tag" style="background:var(--ink);color:#fff">${k+1}</span><h3 style="font-size:22px;margin:10px 0 6px">${esc(c.title)}</h3><p>${esc(c.text)}</p></div>`).join("")}</div>${s.banner_text?`<div class="dark">${s.banner_label?`<span class="lab">${esc(s.banner_label)}</span>`:""}<p>${esc(s.banner_text)}</p></div>`:""}`; },
 resource:(s,el)=>{ el.innerHTML=head(s)+`<div class="gside"><div>${steps(s.items)}</div><div style="display:flex;flex-direction:column;gap:12px">${s.example_text?`<div class="creamb"><span class="lab">${esc(s.example_title||"Exemple d'utilisation")}</span><p>${esc(s.example_text)}</p></div>`:""}<div class="card" style="border-color:var(--brand)"><b>${esc(s.pdf_label||"Version PDF : onglet Ressources du module")}</b></div>${s.sources?`<p class="small">${esc(s.sources)}</p>`:""}<button class="btn btn-g" id="cp">Copier la liste</button><span class="small" id="cpm" aria-live="polite"></span></div></div>`;
   el.querySelector("#cp").onclick=()=>{ const t=s.title+"\n"+s.items.map((x,k)=>`${k+1}. ${x}`).join("\n"); try{ navigator.clipboard.writeText(t).then(()=>el.querySelector("#cpm").textContent="Copié.",()=>el.querySelector("#cpm").textContent="Copie refusée par le navigateur."); }catch(e){ el.querySelector("#cpm").textContent="Copie indisponible."; } }; },
 stats:(s,el)=>{ el.innerHTML=head(s)+`<div class="g3">${s.cards.map(c=>`<div class="card" style="display:flex;flex-direction:column;gap:6px"><span class="lab">${esc(c.label)}</span><div class="mono" style="font-size:30px;font-weight:700">${esc(c.value)}</div>${c.detail?`<p class="small">${esc(c.detail)}</p>`:""}${c.phrase?`<p class="creamb" style="padding:10px 12px;font-style:italic;font-size:14px">${esc(c.phrase)}</p>`:""}</div>`).join("")}</div>${s.source?`<p class="small"><i>${esc(s.source)}</i></p>`:""}`; },
 timeline:(s,el)=>{ el.innerHTML=head(s)+`<div class="g3 cols" style="--cols:${s.events.length}">${s.events.map((e,k)=>`<div style="border-top:4px solid ${k===s.events.length-1?"var(--brand)":"var(--peach)"};padding-top:10px"><div style="font-size:20px;font-weight:900">${esc(e.date)}</div><div style="color:var(--brand-deep);font-weight:700">${esc(e.title)}</div><p class="small">${esc(e.text)}</p></div>`).join("")}</div>${s.cards&&s.cards.length?`<div class="g2">${s.cards.map((c,k)=>`<div class="${k?"creamb":"dark"}" style="${k?"background:var(--brand);color:#1A1A1A":""}"><b>${esc(c.title)}</b><p>${esc(c.text)}</p></div>`).join("")}</div>`:""}`; },
 table:(s,el)=>{ el.innerHTML=head(s)+(s.intro?`<p style="font-size:17px">${esc(s.intro)}</p>`:"")+table(s.headers,s.rows)+(s.caption?`<p class="small"><i>${esc(s.caption)}</i></p>`:""); },
 bilan:(s,el,i)=>{ const q=SEQS[s._seq]; const sc=seqScore(q); const top=(s.badge||"Expert|Séquence").split("|");
   el.innerHTML=`<div class="badgewrap fade"><h1>${esc(s.title)}</h1><div class="medal"><div><span style="font-size:14px">${esc(top.length>1?top[0]:"Expert")}</span><b>${esc(top[top.length-1])}</b></div></div><p style="font-size:19px;max-width:60ch">${esc(s.text)}</p>${sc.n?`<div class="card" style="min-width:260px"><span class="lab">Votre score sur cette séquence</span><div class="mono" style="font-size:34px;font-weight:700">${sc.done?sc.pct+" %":"—"}</div><p class="small">${sc.done} activité(s) notée(s) faite(s) sur ${sc.n}. Seuil : 70 %.</p>${sc.done&&sc.pct<70?`<p class="small">Reprenez les activités de la séquence pour atteindre 70 %.</p>`:""}</div>`:""}</div>`; },

 qcm:(s,el,i)=>{ const scored=isScored(s);
   el.innerHTML=head(s)+`<div class="gside" style="grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)"><div class="dark"><span class="lab">${esc(s.question_label||"Question")}${scored?"":" · non notée"}</span><p style="font-size:21px;font-weight:900;line-height:1.35">${esc(s.question)}</p></div><div class="choices" id="ch"></div></div><div id="fbz"></div>`;
   const ch=el.querySelector("#ch"), ans="ABCD".indexOf(s.answer);
   const paint=(k)=>{ ch.querySelectorAll(".choice").forEach((b,j)=>{ b.disabled=true; if(j===ans) b.classList.add("good"); if(j===k&&j!==ans) b.classList.add("bad"); }); el.querySelector("#fbz").innerHTML=fb(k===ans?"good":"bad",k===ans?"Bonne réponse.":"Pas tout à fait.",s.feedbacks[k]); };
   s.options.forEach((o,k)=>{ const b=document.createElement("button"); b.className="choice"; b.innerHTML=`<span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span>`; b.onclick=()=>{ if(st["a"+i]!=null) return; st["a"+i]=k; if(scored) record(i,k===ans?1:0); save(); paint(k); }; ch.appendChild(b); });
   if(st["a"+i]!=null) paint(st["a"+i]);
 },
 sort:(s,el,i)=>{ const pick=st["p"+i]||{};
   el.innerHTML=head(s)+`<div style="display:flex;flex-direction:column;gap:10px" id="it"></div><div class="row"><button class="btn btn-p" id="val">Valider mes choix</button></div><div id="fbz"></div>`;
   const box=el.querySelector("#it");
   s.items.forEach((it,k)=>{ const w=document.createElement("div"); w.className="sortrow"; w.innerHTML=`<p><b class="mono" style="color:var(--brand-deep)">${k+1}.</b> ${esc(it)}</p><div class="seg" role="radiogroup" aria-label="Réponse ${k+1}">${s.categories.map((c,ci)=>`<button role="radio" aria-checked="${pick[k]===ci}" data-c="${ci}">${esc(c)}</button>`).join("")}</div><div class="why"></div>`;
     w.querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(st["v"+i]) return; pick[k]=+b.dataset.c; st["p"+i]=pick; save(); w.querySelectorAll("button").forEach(x=>x.setAttribute("aria-checked",String(x===b))); }); box.appendChild(w); });
   const reveal=()=>{ let ok=0; box.querySelectorAll(".sortrow").forEach((w,k)=>{ const g=pick[k]===s.answers[k]; if(g) ok++; w.querySelectorAll("button").forEach(b=>{ b.disabled=true; const c=+b.dataset.c; if(c===s.answers[k]) b.classList.add("good"); else if(c===pick[k]) b.classList.add("bad"); }); w.querySelector(".why").innerHTML=`<p class="small" style="color:${g?"var(--ok)":"var(--err)"}"><b>${g?"Correct":"À revoir"}</b> · <span style="color:var(--fg)">${esc(s.whys[k])}</span></p>`; }); el.querySelector("#val").disabled=true; return ok; };
   if(st["v"+i]) reveal();
   el.querySelector("#val").onclick=()=>{ const n=Object.keys(pick).length; if(n<s.items.length){ el.querySelector("#fbz").innerHTML=fb("mid","Encore "+(s.items.length-n)+" élément(s).","Choisissez une réponse pour chaque ligne avant de valider."); return; } st["v"+i]=1; const ok=reveal(); record(i,ok/s.items.length); save(); el.querySelector("#fbz").innerHTML=fb(ok/s.items.length>=.7?"good":"bad",ok+" / "+s.items.length+".","Lisez l'explication sous chaque ligne."); };
 },
 document:(s,el,i)=>{ const hit=st["h"+i]||{}; const useful=s.fields.filter(f=>f.useful).length;
   el.innerHTML=head(s)+`<div class="gside"><div class="doc"><span class="wm">FICTIF</span><h3>${esc(s.doc_title)}</h3>${s.fields.map((f,k)=>`<button class="hs" data-k="${k}"><span>${esc(f.label)}</span> <b>${esc(f.value)}</b></button>`).join("")}</div><div style="display:flex;flex-direction:column;gap:12px"><div class="dark"><span class="lab">Consigne</span><p>${esc(s.instruction)}</p><p class="big mono" id="cnt" style="font-size:26px;margin-top:10px"></p>${s.side_note?`<p class="small" style="color:#D9CFC4">${esc(s.side_note)}</p>`:""}</div><div id="fbz"></div></div></div>`;
   const paint=()=>{ let n=0,miss=0; el.querySelectorAll(".hs").forEach(b=>{ const k=+b.dataset.k; if(hit[k]){ const u=s.fields[k].useful; b.classList.add(u?"good":"bad"); if(u) n++; else miss++; } }); el.querySelector("#cnt").textContent=`Trouvées : ${n} / ${useful}`; if(n===useful && st.res[i]==null){ record(i,1-miss*0.2); el.querySelector("#fbz").insertAdjacentHTML("beforeend",fb(miss?"mid":"good","Tout est trouvé.",miss?`Vous avez cliqué ${miss} piège(s) : chacun retire 20 % au score.`:"Aucun piège : analyse complète.")); } };
   el.querySelectorAll(".hs").forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; if(hit[k]) return; hit[k]=1; st["h"+i]=hit; save(); const f=s.fields[k]; el.querySelector("#fbz").innerHTML=fb(f.useful?"good":"bad",f.label.replace(/\s*:$/,"")+(f.useful?" : utile.":" : piège."),f.feedback); paint(); });
   paint();
 },
 case_form:(s,el,i)=>{ const vals=st["f"+i]||{};
   el.innerHTML=head(s)+`<div class="g2"><div class="creamb" style="display:flex;flex-direction:column;gap:10px">${s.case_title?`<b style="color:var(--brand-deep)">${esc(s.case_title)}</b>`:""}${s.case_paras.map(p=>`<p style="font-size:17px">${esc(p)}</p>`).join("")}</div><form class="card" id="cf" style="display:flex;flex-direction:column;gap:14px" novalidate>${s.inputs.map((l,k)=>`<div class="field"><label for="in${i}_${k}">${esc(l)}</label><textarea id="in${i}_${k}" rows="2">${esc(vals[k]||"")}</textarea></div>`).join("")}<button class="btn btn-p" type="submit">${esc(s.button||"Vérifier ma réponse")}</button></form></div><div id="corr"></div>`;
   const show=()=>{ el.querySelector("#corr").innerHTML=`<div class="card fade" style="display:flex;flex-direction:column;gap:10px"><span class="lab">Réponse attendue</span><p>${esc(s.answer)}</p><span class="lab">Points d'attention</span><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">${s.feedbacks.map(f=>`<li>${esc(f)}</li>`).join("")}</ul><span class="lab">Votre auto-évaluation</span><div class="row">${[["J'ai juste",1],["En partie",.5],["À revoir",0]].map(([t,v])=>`<button class="btn btn-g" data-v="${v}" ${st.res[i]!=null?"disabled":""}>${t}</button>`).join("")}</div>${st.res[i]!=null?`<p class="small">Auto-évaluation enregistrée : ${Math.round(st.res[i]*100)} %.</p>`:""}</div>`;
     el.querySelectorAll("#corr [data-v]").forEach(b=>b.onclick=()=>{ record(i,+b.dataset.v); show(); }); };
   el.querySelector("#cf").onsubmit=e=>{ e.preventDefault(); s.inputs.forEach((_,k)=>vals[k]=el.querySelector(`#in${i}_${k}`).value); st["f"+i]=vals; st["c"+i]=1; save(); show(); };
   if(st["c"+i]) show();
 },
 dialogue:(s,el,i)=>{ const g=s.graph;
   if(!g){ el.innerHTML=head(s)+`<div class="chat card"><div class="msg him"><span class="who">${esc(s.persona_name)}</span>${esc(s.opening)}</div></div><div class="choices">${s.options.map((o,k)=>`<div class="choice" style="cursor:default"><span class="k">${"ABC"[k]}</span><span>${esc(o)}</span></div>`).join("")}</div><details class="notes" open><summary>Arbre du dialogue</summary><pre>${esc(s.tree)}</pre></details>`; return; }
   let d=st["d"+i]||{node:g.start,trust:g.initial||40,path:[],end:null};
   el.innerHTML=head(s)+`<div class="meter"><span>${esc(s.meter_label||"Confiance de "+s.persona_name)}</span><div class="tr"><i id="tr"></i></div><span class="mono" id="trn"></span></div><div class="chat card" id="chat"></div><div class="choices" id="op"></div><div id="fbz"></div><div class="row"><button class="btn btn-g" id="re" hidden>Rejouer (non noté)</button></div>`;
   const chat=el.querySelector("#chat"), op=el.querySelector("#op");
   const bub=(c,w,t)=>chat.insertAdjacentHTML("beforeend",`<div class="msg ${c} fade"><span class="who">${esc(w)}</span>${esc(t)}</div>`);
   const meter=()=>{ el.querySelector("#tr").style.width=d.trust+"%"; el.querySelector("#trn").textContent=d.trust+" / 100"; };
   function replay(){ chat.innerHTML=""; let n=g.start; bub("him",s.persona_name,g.nodes[n].him);
     d.path.forEach(p=>{ const o=g.nodes[p.n].opts[p.o]; bub("me","Vous",o.text); chat.insertAdjacentHTML("beforeend",`<p class="small" style="align-self:flex-end">${o.delta>0?"+":""}${o.delta}${o.why?" · "+esc(o.why):""}</p>`); if(o.next!=="end"&&g.nodes[o.next]) bub("him",s.persona_name,g.nodes[o.next].him); else if(o.end_him) bub("him",s.persona_name,o.end_him); }); }
   function end(){ const slip=d.path.some(p=>g.nodes[p.n].opts[p.o].delta<0); const forced=d.path.some(p=>g.nodes[p.n].opts[p.o].force_verdict==="bad");
     let e=(g.ends||[]).find(x=>!forced && d.trust>=x.min && (!x.no_negative||!slip)) || (g.ends||[])[g.ends.length-1] || {verdict:"Fin",feedback:"",him:""};
     if(e.him && !d.path.some(p=>g.nodes[p.n].opts[p.o].end_him)) bub("him",s.persona_name,e.him);
     const score=(slip?Math.min(d.trust,60):d.trust)/100; if(!st["dr"+i]) record(i,score);
     el.querySelector("#fbz").innerHTML=fb(e===g.ends[0]?"good":(e===g.ends[g.ends.length-1]?"bad":"mid"),e.verdict||"Fin du dialogue",(e.feedback||"")+(slip?" Une réponse négative plafonne la note à 60.":""));
     el.querySelector("#re").hidden=false; }
   function step(){ op.innerHTML=""; meter(); if(d.node==="end"){ end(); return; }
     const nd=g.nodes[d.node]; if(!nd){ d.node="end"; return step(); }
     nd.opts.forEach((o,k)=>{ const b=document.createElement("button"); b.className="choice"; b.innerHTML=`<span class="k">${"ABCD"[k]}</span><span>${esc(o.text)}</span>`; b.onclick=()=>{ d.path.push({n:d.node,o:k}); d.trust=Math.max(0,Math.min(100,d.trust+(o.delta||0))); d.node=(o.next&&g.nodes[o.next])?o.next:"end"; st["d"+i]=d; save(); replay(); step(); }; op.appendChild(b); }); }
   el.querySelector("#re").onclick=()=>{ st["dr"+i]=1; d={node:g.start,trust:g.initial||40,path:[]}; st["d"+i]=d; save(); el.querySelector("#fbz").innerHTML=""; el.querySelector("#re").hidden=true; replay(); step(); };
   replay(); step();
 }
};

function go(i){
  if(i<0||i>=SL.length) return;
  clearInterval(window.__v);
  st.i=i; st.seen[i]=1; if(i>0) st.last=i; save();
  const s=SL[i];
  stage.innerHTML=""; const w=document.createElement("div"); w.className="fade"; w.style.cssText="display:flex;flex-direction:column;gap:18px"; stage.appendChild(w);
  try{ (R[s.type]||((s,el)=>el.innerHTML=head(s)))(s,w,i); }catch(e){ w.innerHTML=head(s)+`<p class="small">Écran non affichable (${esc(e.message)}).</p>`; }
  if(showNotes && s.notes && s.type!=="video"){ w.insertAdjacentHTML("beforeend",`<details class="notes" open><summary>Notes formateur · Storyline</summary><pre>${esc(s.notes)}</pre></details>`); }
  const q=SEQS[s._seq];
  document.getElementById("crumb").innerHTML= q?`<b>Module 1</b> · ${esc(q.kicker)} · ${esc(q.title)}`:`<b>Module 1</b> · Accueil`;
  const pct=Math.round(Object.keys(st.seen).length/SL.length*100); const pb=document.getElementById("pbar"); pb.firstElementChild.style.width=pct+"%"; pb.setAttribute("aria-valuenow",pct);
  document.getElementById("prev").disabled=i===0; document.getElementById("next").disabled=i===SL.length-1;
  document.getElementById("hint").textContent=`Écran ${i+1} / ${SL.length}`+(q?` · ${q.kicker}`:"");
  try{ history.replaceState(null,"","#e"+i); }catch(e){}
  renderRail(); stage.focus({preventScroll:true}); window.scrollTo(0,0);
}
const rail=document.getElementById("rail");
function renderRail(){
  const s=SL[st.i], open=s?s._seq:-1;
  rail.innerHTML=`<div class="seq ${st.i===0?"open":""}"><button data-go="0"><span><small>Accueil</small><b>Se différencier pour attirer les propriétaires</b></span></button></div>`+SEQS.map((q,k)=>{ const sc=seqScore(q); const allSeen=q.idx.every(i=>st.seen[i]);
    return `<div class="seq ${k===open?"open":""}"><button data-seq="${k}" aria-expanded="${k===open}"><span><small>${esc(q.kicker)}</small><b>${esc(q.title)}</b></span><span class="sc">${sc.done?sc.pct+" %":(allSeen?"✓":"")}</span></button><ol class="units">${q.units.map(u=>{ const done=u.idx.every(i=>st.seen[i]); const curU=u.idx.includes(st.i); return `<li class="${done?"done":""}"><button data-go="${u.start}" ${curU?'aria-current="true"':""}><span class="dot"></span><span>${esc(u.title)}</span></button></li>`; }).join("")}</ol></div>`; }).join("");
  rail.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ go(+b.dataset.go); rail.classList.remove("open"); });
  rail.querySelectorAll("[data-seq]").forEach(b=>b.onclick=()=>{ const q=SEQS[+b.dataset.seq]; const p=b.parentElement; if(p.classList.contains("open")&&!q.idx.includes(st.i)){ p.classList.remove("open"); } else if(!q.idx.includes(st.i)) go(q.start); else p.classList.toggle("open"); });
}
document.getElementById("prev").onclick=()=>go(st.i-1);
document.getElementById("next").onclick=()=>go(st.i+1);
document.getElementById("planBtn").onclick=e=>{ const o=rail.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded",String(o)); };
document.getElementById("notesBtn").onclick=e=>{ showNotes=!showNotes; e.currentTarget.setAttribute("aria-pressed",String(showNotes)); go(st.i); };
document.addEventListener("keydown",e=>{ if(e.target.closest("input,textarea,select")) return; if(e.key==="ArrowRight"&&e.altKey) go(st.i+1); if(e.key==="ArrowLeft"&&e.altKey) go(st.i-1); });
const h=/^#e(\d+)$/.exec(location.hash||""); go(h?Math.min(+h[1],SL.length-1):st.i||0);
})();
</script>
