}]}, "n2": {"him": "« Ah oui, le formulaire. D'accord. Mais −15 %, c'est vrai ou pas ? »", "opts": [{"text": "« Je ne peux pas vous donner un chiffre sans voir la maison. En France, les prix des maisons anciennes ont reculé de 1,3 % sur un an selon l'Insee. Chez vous, je regarderai les ventes comparables et votre DPE. »", "delta": 25, "next": "n3", "why": "Chiffre sourcé (Insee) et méthode annoncée, sans promesse de prix."}, {"text": "« −15 %, c'est à cause de votre DPE, c'est la règle. »", "delta": -20, "next": "n3", "why": "Aucune décote nationale unique n'existe ; elle varie selon la région et l'année."}]}, "n2c": {"him": "« Tout le monde dit ça. Sur quoi vous vous basez ? »", "opts": [{"text": "« Je ne peux pas vous donner un chiffre sans voir la maison. En France, les prix des maisons anciennes ont reculé de 1,3 % sur un an selon l'Insee. Chez vous, je regarderai les ventes comparables et votre DPE. »", "delta": 25, "next": "n3", "why": "Chiffre sourcé (Insee) et méthode annoncée, sans promesse de prix."}, {"text": "« −15 %, c'est à cause de votre DPE, c'est la règle. »", "delta": -20, "next": "n3", "why": "Aucune décote nationale unique n'existe ; elle varie selon la région et l'année."}]}, "n3": {"him": "« Et mon DPE F, ça joue ? »", "opts": [{"text": "« Il peut jouer, selon votre secteur. Votre DPE date de mars 2023 : on vérifiera d'abord s'il a évolué avec le nouveau calcul de 2026. Je vous propose un rendez-vous pour faire le point, mardi ou jeudi ? »", "delta": 25, "next": "end", "why": "Vous nuancez, proposez de vérifier le DPE et fixez un rendez-vous daté."}, {"text": "« Il faut faire les travaux avant de vendre. »", "delta": -15, "next": "end", "why": "Vous tranchez sans audit ni chiffrage.", "end_him": "« Je vais réfléchir. »"}]}}, "ends": [{"min": 60, "no_negative": false, "him": "« D'accord, jeudi, ça me va. »", "verdict": "Rendez-vous obtenu", "feedback": "Vous avez rappelé l'origine du contact, répondu au −15 % avec une source et une méthode, puis proposé de vérifier le DPE avant de fixer un rendez-vous daté."}, {"min": 20, "him": "« Je vais réfléchir. »", "verdict": "Porte entrouverte", "feedback": "Le contact est maintenu, mais une de vos réponses tranchait sans donnée (décote « automatique » ou travaux imposés). Partez des ventes comparables et de la vérification du DPE, puis proposez un rendez-vous daté."}, {"min": 0, "him": "« Je n'ai pas le temps. Au revoir. »", "verdict": "Occasion manquée", "feedback": "Rappelez toujours d'où vient le contact, évitez le discours anxiogène et les promesses de prix : appuyez-vous sur des données sourcées et proposez une vérification du DPE."}]}}, {"type": "recap", "eyebrow": "Unité 1.3 · Synthèse", "title": "Ce que pensent les vendeurs, ce que vous apportez", "cards": [{"title": "Le vendeur", "text": "Mieux informé, méfiant envers la prospection, attaché à son prix et à sa liberté. Les chiffres d'enquête sont déclaratifs : citez-les comme tels."}, {"title": "Les objections", "text": "Trois familles de réponse : une donnée vérifiable, une preuve de service, le cadre légal."}, {"title": "Le premier contact", "text": "Rappelez l'origine de l'accord, refusez de donner un prix sans visite, proposez un rendez-vous."}], "banner_label": "Pour M. Bernard", "banner_text": "Son accord de recontact est votre point d'entrée. Sa question sur le −15 % sera traitée dans l'unité suivante.", "notes": "Synthèse de l'unité 1.3. Narration : « Un vendeur méfiant n'attend pas un argumentaire : il attend des preuves. »"}, {"type": "divider", "kicker": "Unité 1.4", "title": "Performance énergétique et valeur", "notes": "Séparateur de l'unité 1.4 (8 min environ). Narration : « Unité 1.4. Ce que l'étiquette énergétique change vraiment au prix d'un bien. »"}, {"type": "persona", "eyebrow": "Unité 1.4 · Accroche", "title": "M. Bernard : « −15 %, c'est la règle ? »", "initials": "MB", "name": "M. Bernard (fictif)", "role": "Maison de 112 m², DPE F de mars 2023", "facts": ["Chauffage électrique", "Deux agences : « −15 % à cause du DPE »", "Ni étude ni ventes comparables présentées", "Il envisage de vendre dans l'année"], "quote": "« On m'a dit qu'une maison classée F perd 15 % partout. C'est une règle ou pas ? »", "right_paras": ["Le chiffre de −15 % n'a été justifié ni par une région, ni par une année, ni par une source.", "Votre rôle : lui montrer comment se lit vraiment la « valeur verte », et ce que la loi exige pour vendre une maison F."], "question": "Existe-t-il une décote nationale unique pour un logement classé F ?", "notes": "Accroche. Narration : « M. Bernard a entendu moins 15 % deux fois. Est-ce une règle ? » Personnage fictif."}, {"type": "explain", "eyebrow": "Unité 1.4 · Explication", "title": "La valeur verte se lit par région et par année", "paras": ["Les Notaires de France publient chaque année une étude de la « valeur verte » : l'écart de prix entre classes de DPE, à caractéristiques comparables.", "Cet écart varie fortement selon la région, le type de bien (maison ou appartement) et l'année des ventes. Il n'existe pas de décote nationale unique.", "Citez toujours : région, type de bien, année des transactions et classe de référence. Un « −25 % partout » n'est pas sourcé."], "cards": [{"value": "≈ 15 %", "label": "des ventes de l'ancien classées F-G début 2025"}, {"value": "2024", "label": "année des transactions de la dernière étude"}, {"value": "Région", "label": "l'écart change d'une région à l'autre"}], "caption": "Source : Notaires de France, étude « valeur verte » (transactions 2024, publiée en janvier 2026).", "notes": "Explication. Narration : « La valeur verte, c'est l'écart de prix lié à l'étiquette, à bien comparable. Il dépend de la région, du type de bien et de l'année. Ne citez jamais un pourcentage national unique. » Interdits : décote nationale « −25 % » ; « 40 % de ventes E-F-G » (non sourcés). Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "document", "eyebrow": "Unité 1.4 · Analyse", "title": "Lisez un extrait d'étude de valeur verte", "doc_title": "Extrait d'étude valeur verte (fictif, pour l'exercice)", "fields": [{"label": "Région :", "value": "Grand Est", "useful": true, "feedback": "Utile : l'écart de prix dépend de la région. C'est la première information à vérifier pour le secteur du vendeur."}, {"label": "Type de bien :", "value": "maisons anciennes", "useful": true, "feedback": "Utile : maisons et appartements n'ont pas les mêmes écarts. M. Bernard a une maison."}, {"label": "Année des ventes :", "value": "2024", "useful": true, "feedback": "Utile : l'étude porte sur des ventes passées. Citez l'année pour ne pas présenter un chiffre ancien comme actuel."}, {"label": "Classe de référence :", "value": "D", "useful": true, "feedback": "Utile : l'écart se mesure par rapport à une classe de référence. Sans elle, le pourcentage n'a pas de sens."}, {"label": "Écart F-G / D :", "value": "−X % (valeur masquée pour l'exercice)", "useful": true, "feedback": "Utile, mais seulement avec les 4 informations précédentes. Lisez la valeur dans l'étude réelle de la région."}, {"label": "Titre de presse :", "value": "« Passoires : −25 % partout en France »", "useful": false, "feedback": "À écarter : une décote nationale unique n'est pas sourcée. L'étude des notaires raisonne par région."}, {"label": "Visuel :", "value": "étiquette DPE en couleur", "useful": false, "feedback": "Décoratif : l'étiquette ne dit rien de l'écart de prix observé dans la région."}], "instruction": "Cliquez sur les 5 informations indispensables pour citer correctement une valeur verte. Évitez les 2 pièges.", "side_note": "Document fictif. Valeurs réelles : étude des Notaires, par région.", "counter": "0 / 5 informations utiles", "notes": "Activité notée (poids 1). Même mécanique que l'analyse de l'unité 1.1 (boutons à état, compteur, calques). Le document est fictif : aucune valeur chiffrée d'écart n'est affichée, pour ne pas créer de faux repère. Narration : « Avant de citer un écart de prix, il vous faut cinq informations. Retrouvez-les. »"}, {"type": "table", "eyebrow": "Unité 1.4 · Explication", "title": "Audit énergétique obligatoire à la vente", "intro": "Pour les maisons et les immeubles en monopropriété, le vendeur fournit un audit énergétique selon la classe du DPE.", "headers": ["Classe du DPE", "Audit obligatoire depuis", "Ce que vous dites au vendeur"], "rows": [["F et G", "1er avril 2023", "« L'audit est obligatoire et remis dès la 1re visite : il chiffre les travaux par étapes. »"], ["E", "1er janvier 2025", "« Même en E, l'audit est requis. Il devient un outil de vente. »"], ["D", "prévu au 1er janvier 2034", "« Rien n'est requis aujourd'hui ; le calendrier peut évoluer. »"], ["A, B, C", "non concerné", "« Le DPE suffit. »"]], "caption": "Sources : CCH, art. L. 126-28-1 ; décret n° 2022-780. Audit remis dès la 1re visite, valable 5 ans. Appartements en copropriété non concernés. Calendrier à revérifier avant chaque session.", "notes": "Tableau. Narration : « Pour une maison classée F, comme celle de M. Bernard, l'audit énergétique est obligatoire à la vente. Il est remis à l'acheteur dès la première visite. » Vérifié : art. L. 126-28-1 CCH (loi Climat et résilience du 22/08/2021), décret n° 2022-780 ; remise dès la première visite, par tout moyen ; audit valable 5 ans (source : inc-conso.fr). Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "qcm", "eyebrow": "Unité 1.4 · Vérification", "title": "Appliquer la règle à M. Bernard", "question_label": "Question 3", "question": "Avec le nouveau coefficient de 1,9, l'attestation actualisée de M. Bernard pourrait le faire passer de F à E. L'audit énergétique reste-t-il obligatoire pour vendre sa maison ?", "options": ["Non : seuls les logements F et G sont concernés.", "Oui : l'audit est obligatoire pour les maisons classées E depuis le 1er janvier 2025.", "Non : l'audit ne concerne que les appartements en copropriété."], "answer": "B", "feedbacks": ["Non : c'était la règle entre avril 2023 et fin 2024. Depuis le 1er janvier 2025, la classe E est aussi concernée.", "Exact : en E comme en F, la maison de M. Bernard nécessite un audit à la vente. Seul un passage en D l'en dispenserait aujourd'hui.", "Non : c'est l'inverse. L'audit vise les maisons et les immeubles en monopropriété, pas les lots de copropriété."], "notes": "QCM noté (poids 1). Narration : « Si M. Bernard passe de F à E grâce au nouveau coefficient, l'audit reste-t-il obligatoire ? » Lien avec l'unité 2.3 (réforme du coefficient : 2,3 → 1,9 au 1/01/2026 → 1,7 au 1/01/2027 ; attestation actualisée gratuite sur l'observatoire DPE-Audit de l'ADEME pour les DPE établis depuis le 1/07/2021)."}, {"type": "two_cols", "eyebrow": "Unité 1.4 · Limites", "title": "Parler de valeur verte sans faire peur", "left_title": "Vous pouvez dire", "left_items": ["« Selon l'étude des notaires sur les ventes 2024, dans votre région, l'écart pour les maisons F-G était de… »", "« Environ 15 % des ventes de l'ancien concernaient des logements F-G début 2025 : ces biens se vendent. »", "« Vérifions d'abord votre DPE avec le nouveau calcul, puis l'audit chiffrera les travaux. »"], "right_title": "Vous ne dites pas", "right_items": ["« Une maison F perd 15 % (ou 25 %) partout. »", "« Votre maison va passer en E, c'est sûr. »", "« Faites les travaux, vous vendrez plus cher » sans chiffrage ni comparables."], "footer_title": "À retenir", "footer_text": "Région, type de bien, année, classe de référence : sans ces quatre repères, un chiffre de décote n'est pas une information.", "notes": "Écran de limites. Narration : « On parle de valeur verte avec une source et un contexte, jamais avec un pourcentage unique. Et on ne promet aucune classe. » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "recap", "eyebrow": "Unité 1.4 · Synthèse", "title": "Énergie et valeur : l'essentiel", "cards": [{"title": "Valeur verte", "text": "Un écart de prix par classe, mesuré par les Notaires, qui varie selon la région, le type de bien et l'année. Pas de chiffre national unique."}, {"title": "Marché F-G", "text": "Environ 15 % des ventes de l'ancien début 2025 : les logements F-G se vendent, à un prix qui intègre les travaux."}, {"title": "Audit", "text": "Obligatoire à la vente pour les maisons et monopropriétés F-G (2023) et E (2025) ; D prévu en 2034."}], "banner_label": "Pour M. Bernard", "banner_text": "Pas de « −15 % » : vérifier le DPE (attestation 1,9), préparer l'audit, lire l'étude de sa région.", "notes": "Synthèse de l'unité 1.4. Narration : « Pour M. Bernard : vérifier, auditer, comparer. Et jamais de décote unique. » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "divider", "kicker": "Unité 1.5", "title": "Atelier : un chiffre, une phrase vendeur", "notes": "Séparateur de l'unité 1.5 (7 min environ). Narration : « Unité 1.5. Atelier : transformer un chiffre en une phrase qu'un vendeur comprend. »"}, {"type": "video", "title": "Sébastien : « Un chiffre, une phrase, une question »", "label": "Emplacement de la capsule HeyGen (45 s) · avatar SEB", "notes": "Capsule HeyGen conseil terrain, 45 s environ. Script : « Un chiffre seul ne convainc personne. Ce qui compte, c'est ce que vous en faites. Ma méthode tient en trois temps. Le chiffre, avec sa source et sa date. La phrase, qui dit ce que ce chiffre change pour ce vendeur-là. Et une question, pour qu'il réagisse. Mais attention : on ne parle pas de la même façon à un vendeur pressé, à un vendeur attaché à son prix, ou à un vendeur qui veut tout vérifier. Dans cet atelier, vous allez adapter six chiffres à ces profils. Et vous allez vous corriger vous-même avec une grille. »"}, {"type": "table", "eyebrow": "Unité 1.5 · Explication", "title": "Adapter le chiffre au profil du vendeur", "headers": ["Profil (exemples)", "Ce qu'il attend", "Comment présenter le chiffre"], "rows": [["Le vérificateur", "Des sources et du détail", "Source, date, champ exact ; proposez de lui envoyer la publication."], ["L'attaché à son prix", "Être respecté dans son estimation", "Partez de ses repères, puis des ventes comparables ; jamais de décote brutale."], ["Le pressé", "Un délai et un plan", "Volume et délai de vente ; un plan de vente daté."], ["Le méfiant", "Ne pas être manipulé", "Origine du contact, aucun chiffre sans source, liberté de retirer son accord."]], "caption": "Profils proposés à titre pédagogique : un vendeur peut en cumuler plusieurs.", "notes": "Tableau de profils (proposition pédagogique, non issue d'une étude). Narration : « Quatre profils, quatre façons de présenter le même chiffre. M. Bernard ? Méfiant, et attaché à son prix. »"}, {"type": "stats", "eyebrow": "Unité 1.5 · Grille corrigée", "title": "Le marché de 2026 en 6 chiffres et 6 phrases", "cards": [{"label": "Volumes", "value": "958 000", "detail": "ventes dans l'ancien sur 12 mois à fin juin 2026 (Insee)", "phrase": "« Les acheteurs sont revenus : votre maison sera vue, si son prix est juste. »"}, {"label": "Prix", "value": "−0,8 %", "detail": "sur un an au T2 2026 ; maisons −1,3 % (Insee)", "phrase": "« Les prix sont quasi stables : le bon prix dès le départ évite de baisser ensuite. »"}, {"label": "Taux moyen", "value": "≈ 3,5 %", "detail": "sur 20 ans, octobre 2026 (Meilleurtaux)", "phrase": "« Vos acheteurs raisonnent en mensualité : je présenterai votre maison ainsi. »"}, {"label": "Taux d'usure", "value": "5,40 %", "detail": "prêts de 20 ans et plus, T4 2026 (Banque de France)", "phrase": "« Je vérifie que vos acheteurs peuvent réellement financer. »"}, {"label": "Part F-G", "value": "≈ 15 %", "detail": "des ventes de l'ancien début 2025 (Notaires)", "phrase": "« Les maisons F se vendent : l'audit chiffre les travaux pour l'acheteur. »"}, {"label": "Coefficient", "value": "1,9 → 1,7", "detail": "électricité au 1/01/2026, puis au 1/01/2027", "phrase": "« Votre DPE peut évoluer : vérifions votre attestation actualisée. »"}], "source": "Sources : Insee n° 216 (8/09/2026) ; Meilleurtaux (19/10/2026) ; Banque de France ; Notaires de France ; arrêtés du 13/08/2025 et du 19/08/2026.", "notes": "Grille « 6 chiffres » du support initial, version corrigée (remplace les chiffres non sourcés de la version d'origine). Cartes révélées au clic, phrase sur calque. Narration : « Six chiffres, six phrases. Chaque phrase dit ce que le chiffre change pour le vendeur, sans promesse. » La phrase « Coefficient » ne promet pas de changement de classe : elle invite à vérifier. Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "qcm", "eyebrow": "Unité 1.5 · Vérification", "title": "Choisir la phrase adaptée au profil", "question_label": "Question 4", "question": "M. Bernard est méfiant et attaché à son prix. Quelle phrase utilise le mieux le chiffre des prix ?", "options": ["« Les prix baissent, il faut accepter −15 % pour vendre. »", "« Selon l'Insee, les maisons ont reculé de 1,3 % sur un an en France. Chez vous, regardons ensemble les ventes récentes, vous jugerez sur pièces. »", "« Ne vous inquiétez pas, les prix vont remonter l'an prochain. »", "« Les prix sont stables : votre maison vaut donc le même prix qu'il y a un an. »"], "answer": "B", "feedbacks": ["Non : chiffre faux et non sourcé, qui confirme sa crainte au lieu d'y répondre.", "Exact : chiffre exact, source et période citées, lien avec son bien, et une invitation à vérifier qui respecte sa méfiance.", "Non : c'est une prévision, donc une promesse. Elle détruit votre crédibilité auprès d'un vendeur méfiant.", "Non : une moyenne nationale ne donne pas la valeur d'un bien, et les maisons ont reculé de 1,3 %."], "notes": "QCM noté (poids 1), une tentative. Narration : « Quelle phrase convient le mieux à M. Bernard ? » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "steps_key", "eyebrow": "Unité 1.5 · Méthode", "title": "Un chiffre, une phrase, une question", "principle": "Un chiffre ne parle au vendeur que s'il le relie à son bien, avec sa source et sans promesse.", "steps": ["Le chiffre : valeur exacte, source et date (« selon l'Insee, au 2e trimestre 2026… »).", "La phrase : ce que ce chiffre change pour ce vendeur, adaptée à son profil.", "La question : une question ouverte pour le faire réagir et avancer vers le rendez-vous."], "key_phrase": "« Les maisons ont reculé de 1,3 % sur un an en France, selon l'Insee. Chez vous, on regarde ensemble les ventes récentes ? »", "steps_label": "Méthode en 3 temps", "stage_label": "Étape du parcours", "stage_value": "Valeur réelle", "notes": "Méthode. Narration : « Le chiffre, la phrase, la question. Trois temps, une quinzaine de secondes. » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "case_form", "eyebrow": "Unité 1.5 · Atelier", "title": "Écrivez votre phrase pour M. Bernard", "case_title": "M. Bernard (fictif), méfiant et attaché à son prix", "case_paras": ["M. Bernard pense que sa maison F vaut 15 % de moins « parce que c'est la règle ».", "Choisissez deux chiffres de la grille (par exemple prix des maisons et coefficient 1,9).", "Écrivez une phrase vendeur pour chacun, puis une question ouverte."], "inputs": ["Phrase 1 (chiffre + source + sens pour lui)", "Phrase 2 (chiffre + source + sens pour lui)", "Votre question ouverte"], "answer": "Modèle : « Selon l'Insee, les maisons ont reculé de 1,3 % sur un an en France : c'est une tendance, pas la valeur de votre maison. Regardons vos ventes comparables. » « Depuis janvier 2026, le calcul du DPE a changé pour l'électricité : votre étiquette peut évoluer, on vérifie votre attestation. » « Qu'est-ce qui compte le plus pour vous dans cette vente ? »", "feedbacks": ["Grille 1 : le chiffre est exact et cité avec sa source et sa période (oui / non).", "Grille 2 : la phrase relie le chiffre à la maison de M. Bernard (type de bien, DPE, secteur) (oui / non).", "Grille 3 : aucune promesse de prix ni de classe énergétique (oui / non).", "Grille 4 : le ton respecte son profil méfiant : pas de pression, pas de jargon (oui / non).", "Grille 5 : la question est ouverte et ouvre sur un rendez-vous ou une vérification (oui / non).", "4 « oui » ou plus : objectif atteint. Sinon, reprenez la phrase en corrigeant le critère manquant."], "button": "Comparer au modèle", "notes": "Atelier en saisie libre, auto-évalué (non noté automatiquement ; complétion obligatoire). Les 3 champs doivent contenir au moins 20 caractères pour activer le bouton. Au clic : calque avec le modèle et la grille de 5 critères en cases à cocher ; variable M1_autoeval = nombre de « oui ». Réponses exportées vers le LMS (champ commentaire xAPI) pour relecture par le formateur."}, {"type": "recap", "eyebrow": "Unité 1.5 · Synthèse", "title": "Ce que vous emportez de l'atelier", "cards": [{"title": "Six chiffres", "text": "958 000 ventes, −0,8 % (maisons −1,3 %), taux ≈ 3,5 %, usure 5,40 %, F-G ≈ 15 % des ventes, coefficient 1,9 → 1,7."}, {"title": "Une méthode", "text": "Le chiffre avec sa source, la phrase qui le relie au bien, la question qui fait avancer."}, {"title": "Un réflexe", "text": "Revalider les chiffres avant chaque rendez-vous : une publication plus récente remplace la précédente."}], "banner_label": "Avant votre rendez-vous", "banner_text": "Mettez à jour votre grille de six chiffres et préparez trois ventes comparables du secteur.", "notes": "Synthèse de l'unité 1.5. Narration : « Six chiffres, une méthode, un réflexe : la mise à jour. » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "resource", "eyebrow": "Unité 1.5 · Ressource", "title": "Fiche « Mes 6 chiffres du marché »", "items": ["Volumes : nombre de ventes sur 12 mois (Insee, Notaires) — source et date", "Prix : glissement annuel, maisons et appartements séparés (Insee)", "Taux moyen sur 20 ans (courtiers) et taux d'usure du trimestre (Banque de France)", "Règles du HCSF : 35 % assurance comprise, 25 ans (27 avec différé)", "Part des ventes F-G et valeur verte de votre région (Notaires)", "DPE : coefficient électricité en vigueur et attestation actualisée (ADEME)", "Ventes comparables du secteur (DVF ; hors Alsace-Moselle et Mayotte)"], "example_title": "Exemple de mise à jour", "example_text": "Octobre 2026 : 958 000 ventes (Insee, fin juin) ; −0,8 % sur un an, maisons −1,3 % ; taux ≈ 3,5 % ; usure 5,40 % ; F-G ≈ 15 % ; coefficient 1,9, puis 1,7 au 1/01/2027.", "pdf_label": "Télécharger la fiche (PDF à compléter)", "sources": "Insee ; Notaires de France ; Banque de France ; HCSF ; ADEME ; data.gouv.fr (DVF).", "notes": "Ressource téléchargeable (PDF à compléter, à produire). Bouton de téléchargement (déclencheur « Ouvrir l'URL / le fichier »). Narration : « Cette fiche est à mettre à jour avant chaque session et chaque rendez-vous. » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "bilan", "title": "Séquence validée", "text": "Vous savez lire le marché de 2026, parler mensualité et valeur verte, et transformer un chiffre en phrase vendeur.", "notes": "Fin de séquence. Score = moyenne pondérée des activités notées (documents 1.1 et 1.4, QCM 1 à 4, cas 1.2, tri 1.3, dialogue 1.3). Seuil de déblocage de la séquence 2 : 70 %. Narration : « Bravo. Prochaine étape : la séquence 2, le DPE en détail. » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie.", "badge": "Expert|Marché 2026"}, {"type": "divider", "kicker": "Séquence 2", "title": "Maîtriser le rôle du DPE dans la vente", "notes": "Écran d'ouverture de la séquence 2 (50 min : 2.1 = 8 min ; 2.2 = 8 min ; 2.3 = 18 min ; 2.4 = 9 min ; 2.5 = 7 min). Déblocage : 70 % à la séquence 1. Bouton « Commencer » → unité 2.1. Narration : « Séquence 2. Le DPE : le vérifier, le lire, suivre sa réforme et l'expliquer, au vendeur comme à l'acheteur. »"}, {"type": "divider", "kicker": "Unité 2.1", "title": "Les fondamentaux du DPE", "notes": "Séparateur d'unité 2.1 (8 min). Activités notées : QCM (poids 40) + classement Vrai/Faux (poids 60). Seuil de l'unité : 70 %."}, {"type": "video", "title": "Sébastien : « Le DPE, votre premier outil de vente »", "label": "Emplacement de la capsule HeyGen (60 s) · avatar SEB", "notes": "Capsule HeyGen d'introduction de la séquence (≈ 60 s), avatar SEB, sous-titres FR. Non bloquante : transcription affichée en calque.\nScript : « Bonjour, c'est Sébastien. Dans cette séquence, on parle du document que vos vendeurs sous-estiment le plus : le diagnostic de performance énergétique. Depuis juillet 2021, le DPE n'est plus un simple papier d'information. Il est opposable : l'acheteur peut s'appuyer dessus. Il doit apparaître dès l'annonce, avec ses deux classes et l'estimation des dépenses annuelles. Et pour une maison classée E, F ou G, il déclenche un audit énergétique à remettre dès la première visite. Autrement dit : si vous ne maîtrisez pas le DPE, c'est l'acheteur qui s'en sert contre votre vendeur. Si vous le maîtrisez, il devient un argument. Pendant cinquante minutes, vous allez apprendre à le vérifier, à le lire, à suivre la réforme de 2026 et 2027, et surtout à l'expliquer sans rien promettre. Et vous retrouverez M. Bernard, qui attend toujours votre appel. »\nSources : Service-Public F16096 (https://www.service-public.gouv.fr/particuliers/vosdroits/F16096) ; Service-Public F37110 (https://www.service-public.gouv.fr/particuliers/vosdroits/F37110, vérifié le 14/09/2026) ; INC (https://www.inc-conso.fr/content/lobligation-de-realiser-un-audit-energetique-lors-de-la-vente-de-certaines-maisons) ; CCH art. L. 126-28-1 et L. 271-4 ; décret n° 2022-780"}, {"type": "persona", "eyebrow": "Unité 2.1 · Accroche · Cas fictif", "title": "M. Lambert veut publier son annonce demain", "initials": "ML", "name": "M. Lambert (fictif)", "role": "Vend une maison de 1985, 120 m²", "facts": ["Maison de 120 m² chauffée au fioul", "DPE réalisé en février 2019, classe E", "Veut publier sans étiquette « pour ne pas effrayer les acheteurs »", "Ses factures de fioul sont plus basses que l'estimation du DPE"], "quote": "« Le DPE, c'est indicatif. Je le referai quand j'aurai un acheteur. »", "right_paras": ["M. Lambert a raison sur un point : le DPE est une estimation. Il se trompe sur tout le reste.", "Son DPE n'est plus valable, l'annonce doit afficher l'étiquette, et l'acheteur pourra s'appuyer sur le document."], "question": "Que répondez-vous à M. Lambert avant de prendre la moindre photo ?", "notes": "Accroche. Personnage fictif (mention à l'écran). Bouton « Je réfléchis » → calque question ouverte non notée (zone de saisie libre), puis Suivant. Narration : « M. Lambert veut vendre sa maison au fioul. Il a un DPE de 2019, classé E, et voudrait publier son annonce sans étiquette. Pour lui, le DPE est indicatif. Que lui répondez-vous ? »"}, {"type": "objectives", "eyebrow": "Unité 2.1 · Objectif opérationnel", "title": "Ce que vous saurez faire", "items": ["Expliquer à quoi sert le DPE et pourquoi il est opposable depuis le 1er juillet 2021", "Vérifier en 30 secondes si un DPE est encore valable", "Lister les mentions DPE obligatoires dans une annonce de vente", "Expliquer à un vendeur pourquoi le DPE ne reflète pas ses factures"], "stats": [{"value": "10 ans", "label": "validité d'un DPE établi depuis le 1er juillet 2021"}, {"value": "1/07/2021", "label": "le DPE devient opposable (méthode 3CL)"}], "side_title": "Repères clés", "footer": "Sources : Service-Public F16096 et F32061", "notes": "Objectifs. Apparition séquentielle des 4 objectifs (0,5 s). Narration : « À la fin de cette unité, vous saurez dire à quoi sert le DPE, vérifier s'il est encore valable, lister ce que l'annonce doit afficher, et expliquer pourquoi il ne ressemble pas aux factures. » Sources : Service-Public F16096 (https://www.service-public.gouv.fr/particuliers/vosdroits/F16096) ; Service-Public F32061 (https://www.service-public.gouv.fr/particuliers/vosdroits/F32061) ; CCH art. R. 126-21 à R. 126-25"}, {"type": "explain", "eyebrow": "Unité 2.1 · Explication", "title": "Un document d'information devenu opposable", "paras": ["Le DPE informe l'acheteur sur la performance énergétique et climatique du logement. Commandé par le vendeur, il est obligatoire pour vendre, figure dès l'annonce et fait partie du dossier de diagnostic technique (DDT) annexé à la promesse ou à l'acte.", "Depuis le 1er juillet 2021, il est opposable : l'acheteur peut s'appuyer juridiquement sur ses informations en cas d'erreur. Il est établi par un diagnostiqueur certifié et assuré, qui le transmet à l'ADEME : sans numéro ADEME, le DPE n'est pas valable.", "Il repose sur la méthode 3CL : une consommation conventionnelle, calculée à partir du bâti et des équipements pour un usage standard. Ce n'est pas le reflet des factures, qui dépendent des occupants et de la météo."], "cards": [{"value": "3CL", "label": "méthode de calcul conventionnelle"}, {"value": "10 ans", "label": "validité (DPE établi depuis le 1/07/2021)"}, {"value": "Certifié", "label": "diagnostiqueur obligatoire, sinon amende"}], "caption": "Sources : Service-Public F16096 (DPE) ; ministère de la Transition écologique. Information vérifiée au 20/10/2026.", "notes": "Explication. Apparition paragraphe par paragraphe synchronisée avec la narration. Survol de la carte « Certifié » → infobulle : recours à un diagnostiqueur non certifié = amende jusqu'à 1 500 € (3 000 € en récidive) pour le vendeur (Service-Public F16096). Narration : « Le DPE informe l'acheteur sur la performance énergétique et climatique du logement. Il est obligatoire dès l'annonce et fait partie du dossier de diagnostic technique. Depuis juillet 2021, il est opposable : l'acheteur peut s'appuyer dessus en cas d'erreur. Il est réalisé par un diagnostiqueur certifié, enregistré à l'ADEME, avec la méthode 3CL. Il estime une consommation conventionnelle, pas les factures du vendeur. »\nSources : Service-Public F16096 (https://www.service-public.gouv.fr/particuliers/vosdroits/F16096)"}, {"type": "timeline", "eyebrow": "Unité 2.1 · Validité", "title": "Ce DPE est-il encore valable ?", "events": [{"date": "Depuis le 1/07/2021", "title": "DPE opposable, 10 ans", "text": "Les DPE établis depuis le 1er juillet 2021 (méthode 3CL) sont valables 10 ans et opposables."}, {"date": "1er janvier 2023", "title": "Fin des DPE 2013-2017", "text": "Les DPE établis du 1er janvier 2013 au 31 décembre 2017 ne sont plus valables : nouveau DPE obligatoire pour vendre."}, {"date": "1er janvier 2025", "title": "Fin des DPE 2018 – juin 2021", "text": "Les DPE établis du 1er janvier 2018 au 30 juin 2021 ne sont plus valables, même si leur date de fin imprimée est postérieure."}], "cards": [{"title": "Le réflexe", "text": "Lisez la date d'établissement avant la classe. Avant le 1er juillet 2021 : nouveau DPE obligatoire avant l'annonce."}, {"title": "Le cas de M. Lambert", "text": "DPE de février 2019 : plus valable depuis le 1er janvier 2025. Il faut un nouveau DPE avant toute publication."}], "notes": "Frise. Clic sur chaque date → calque détail. Déblocage du bouton Suivant après ouverture des 3 dates. Narration : « Premier réflexe : la date. Un DPE établi depuis le 1er juillet 2021 vaut dix ans. Ceux de 2013 à 2017 ne sont plus valables depuis 2023, ceux de 2018 à juin 2021 depuis le 1er janvier 2025. Le DPE de M. Lambert, de 2019, doit donc être refait. »\nSources : Service-Public F16096 (https://www.service-public.gouv.fr/particuliers/vosdroits/F16096) ; faits vérifiés du brief (20/10/2026)."}, {"type": "table", "eyebrow": "Unité 2.1 · Annonce de vente", "title": "Ce que l'annonce doit afficher", "headers": ["Mention", "Ce qu'il faut afficher", "Point d'attention"], "rows": [["Classe énergie", "Lettre de A à G sur l'échelle de référence, lisible et en couleur", "Celle du DPE en vigueur ou de l'attestation actualisée"], ["Classe climat (GES)", "Lettre de A à G, lisible et en couleur", "Souvent oubliée : elle est obligatoire"], ["Dépenses annuelles", "« Montant estimé des dépenses annuelles d'énergie pour un usage standard » (fourchette en €)", "Indiquer l'année de référence des prix de l'énergie"], ["Classes F et G", "« Logement à consommation énergétique excessive »", "Mention obligatoire, en plus de l'étiquette"], ["Sanction", "Professionnel : amende administrative jusqu'à 3 000 € (personne physique) ou 15 000 € (personne morale)", "Relisez chaque annonce avant publication"]], "intro": "Ces mentions s'appliquent aux annonces de vente, en vitrine comme en ligne (les règles de présentation diffèrent selon le support).", "caption": "Sources : Service-Public F32061 et F16096 ; CCH art. R. 126-21 à R. 126-25. Formulations à reprendre à l'identique.", "notes": "Tableau. Apparition ligne par ligne. Bouton « Voir un exemple » → calque : bloc DPE d'une annonce conforme (exemple fictif). Narration : « Dans l'annonce, cinq points : la classe énergie, la classe climat, le montant estimé des dépenses annuelles avec l'année de référence des prix, et pour les classes F et G, la mention logement à consommation énergétique excessive. Une annonce non conforme expose à une amende. »\nSources : Service-Public F32061 (https://www.service-public.gouv.fr/particuliers/vosdroits/F32061) ; CCH art. R. 126-21 à R. 126-25 ; Service-Public F16096 (https://www.service-public.gouv.fr/particuliers/vosdroits/F16096) [À VALIDER] montants d'amende 3 000 € / 15 000 € (annonce non conforme par un professionnel) : article exact à confirmer par le juriste, Service-Public F32061 ne les détaille pas."}, {"type": "qcm", "eyebrow": "Unité 2.1 · Vérification", "title": "Le DPE et les factures", "question_label": "Question notée", "question": "M. Lambert : « Mes factures de fioul font 1 900 € par an. Le DPE annonce entre 2 600 € et 3 500 €. Il est donc faux ! » Que lui répondez-vous ?", "options": ["« Vous avez raison : on indiquera vos factures dans l'annonce à la place de l'estimation. »", "« Le DPE calcule une consommation conventionnelle, pour un usage standard. Vos factures dépendent de votre façon de chauffer : les deux ne se comparent pas. »", "« Faites refaire le DPE par un autre diagnostiqueur jusqu'à obtenir un meilleur résultat. »"], "answer": "B", "feedbacks": ["Non. L'annonce doit reprendre l'estimation issue du DPE. Remplacer la mention obligatoire par les factures rendrait l'annonce non conforme.", "Exact. La méthode 3CL estime la consommation d'un occupant type, avec une météo de référence. Un vendeur qui chauffe peu ou partiellement paie moins : cela ne rend pas le DPE faux.", "Non. Un écart avec les factures n'est pas une erreur du DPE. Ce qui compte : un DPE valable, établi par un diagnostiqueur certifié. Ici, le DPE de 2019 doit de toute façon être refait."], "notes": "QCM noté, 1 tentative, poids 40 dans l'unité 2.1. Montants fictifs. Calque feedback avec avatar SEB. Sources : Service-Public F16096 (https://www.service-public.gouv.fr/particuliers/vosdroits/F16096)"}, {"type": "sort", "eyebrow": "Unité 2.1 · Exercice · Activité notée", "title": "Vrai ou faux : ce qu'on entend en agence", "items": ["« Le DPE est indicatif : l'acheteur ne peut rien en faire. »", "« Un DPE réalisé en 2019 reste valable jusqu'en 2029. »", "« L'étiquette doit figurer dès l'annonce, pas seulement au compromis. »", "« Le DPE se calcule à partir des factures des trois dernières années. »", "« Seul un diagnostiqueur certifié peut établir un DPE valable. »", "« Pour un logement classé F ou G, l'annonce doit signaler un logement à consommation énergétique excessive. »"], "categories": ["Exact", "Faux"], "answers": [1, 1, 0, 1, 0, 0], "whys": ["Faux. Depuis le 1er juillet 2021, le DPE est opposable : l'acheteur peut s'appuyer sur ses informations en cas d'erreur.", "Faux. Les DPE établis du 1er janvier 2018 au 30 juin 2021 ne sont plus valables depuis le 1er janvier 2025.", "Exact. Classe énergie, classe climat et dépenses annuelles estimées doivent apparaître dès l'annonce.", "Faux. La méthode 3CL calcule une consommation conventionnelle à partir du bâti et des équipements, pas des factures.", "Exact. Le diagnostiqueur doit être certifié et assuré, et le DPE enregistré à l'ADEME avec son numéro.", "Exact. La mention « logement à consommation énergétique excessive » est obligatoire pour les classes F et G."], "notes": "Classement noté, 1 tentative, poids 60 dans l'unité 2.1. Boutons radio par ligne ; bouton Valider actif quand les 6 lignes sont renseignées. Score = bonnes réponses / 6. Feedback global : ≥ 5/6 « Vous avez les bases » ; sinon renvoi vers la frise de validité. Sources : Service-Public F16096 (https://www.service-public.gouv.fr/particuliers/vosdroits/F16096) ; Service-Public F32061 (https://www.service-public.gouv.fr/particuliers/vosdroits/F32061) ; CCH art. R. 126-21 à R. 126-25"}, {"type": "recap", "eyebrow": "Unité 2.1 · Synthèse", "title": "Trois réflexes sur le DPE", "cards": [{"title": "Vérifier", "text": "La date d'abord : avant le 1er juillet 2021, le DPE n'est plus valable. Depuis, il vaut 10 ans et doit porter un numéro ADEME."}, {"title": "Afficher", "text": "Classe énergie, classe climat, dépenses annuelles estimées avec l'année de référence, et la mention « consommation excessive » pour F et G."}, {"title": "Expliquer", "text": "Le DPE est conventionnel (méthode 3CL) et opposable : il ne reflète pas les factures, mais l'acheteur peut s'appuyer dessus."}], "banner_label": "Réponse à M. Lambert", "banner_text": "Nouveau DPE par un diagnostiqueur certifié, puis une annonce avec ses deux classes. Pas de photo avant.", "notes": "Synthèse unité 2.1. Rappel espacé programmé à J+2 (2 questions). Narration : « Trois réflexes : vérifier la date, afficher les bonnes mentions, expliquer que le DPE est conventionnel mais opposable. »"}, {"type": "divider", "kicker": "Unité 2.2", "title": "Lire une étiquette DPE", "notes": "Séparateur d'unité 2.2 (8 min). Activités notées : QCM (poids 30), analyse documentaire (poids 30), cas de classement (poids 40). Seuil : 70 %."}, {"type": "persona", "eyebrow": "Unité 2.2 · Accroche · Cas fictif", "title": "Mme Roux ne comprend pas son étiquette", "initials": "MR", "name": "Mme Roux (fictive)", "role": "Vend un T3 de 62 m² en copropriété", "facts": ["Appartement de 62 m², chauffage et eau chaude au gaz", "DPE établi en mai 2024", "Énergie primaire : 320 kWh/m²/an", "Émissions : 73 kg CO₂/m²/an"], "quote": "« Ma consommation est en E. Pourquoi l'annonce de l'agence dit F ? Il y a une erreur. »", "right_paras": ["Il n'y a pas d'erreur. L'étiquette a deux notes, et la moins bonne l'emporte.", "Si vous ne savez pas l'expliquer en une minute, Mme Roux doutera de tout le reste."], "question": "Comment lui expliquer, DPE en main, pourquoi son appartement est classé F ?", "notes": "Accroche. Personnage fictif. Question ouverte non notée (saisie libre), réponse reprise en fin d'unité. Narration : « Mme Roux vend son appartement chauffé au gaz. Sa consommation est en E, mais l'annonce affiche F. Elle pense à une erreur. Comment lui expliquer ? »"}, {"type": "objectives", "eyebrow": "Unité 2.2 · Objectif opérationnel", "title": "Ce que vous saurez faire", "items": ["Lire les deux étiquettes : énergie primaire et émissions de gaz à effet de serre", "Appliquer la règle du double seuil pour retrouver la classe", "Repérer les cas où la grille standard ne s'applique pas", "Expliquer une étiquette à un vendeur en une minute"], "side_title": "Le piège fréquent", "side_note": "Ne lire qu'une des deux notes.", "notes": "Objectifs. Narration : « Dans cette unité, vous apprenez à lire les deux notes d'une étiquette, à appliquer le double seuil, à repérer les exceptions, et à l'expliquer simplement. »"}, {"type": "explain", "eyebrow": "Unité 2.2 · Explication · Le double seuil", "title": "Deux étiquettes, une seule classe", "paras": ["Le DPE affiche deux étiquettes. L'étiquette énergie mesure la consommation d'énergie primaire (kWh/m²/an). L'étiquette climat mesure les émissions de gaz à effet de serre (kg CO₂/m²/an).", "Chaque valeur est placée sur sa propre grille. La classe du logement est la moins bonne des deux : c'est la règle du double seuil."], "formula": "classe DPE = la moins bonne des deux classes", "table": {"headers": ["Classe", "EP kWh/m²/an", "GES kg CO₂/m²/an"], "rows": [["A", "≤ 70", "≤ 6"], ["B", "≤ 110", "≤ 11"], ["C", "≤ 180", "≤ 30"], ["D", "≤ 250", "≤ 50"], ["E", "≤ 330", "≤ 70"], ["F", "≤ 420", "≤ 100"], ["G", "> 420", "> 100"]]}, "caption": "Seuils des logements de 40 m² et plus. Source : ministère de la Transition écologique (faits vérifiés au 20/10/2026).", "notes": "Explication. Survol d'une ligne du tableau → surlignage. Animation : Mme Roux, 320 → E sur la grille énergie, 73 → F sur la grille climat, flèche vers F. Narration : « Le DPE donne deux notes : l'énergie primaire consommée et les émissions de gaz à effet de serre. Chacune a sa grille. Le logement prend la moins bonne des deux. Pour Mme Roux : E en énergie, F en émissions. Elle est donc classée F. »\nSources : seuils DPE (logements ≥ 40 m²), faits vérifiés du brief ; Service-Public F16096 (https://www.service-public.gouv.fr/particuliers/vosdroits/F16096)"}, {"type": "steps_key", "eyebrow": "Unité 2.2 · Méthode", "title": "Lire une étiquette en cinq gestes", "principle": "La classe affichée n'est qu'un résultat : lisez les deux valeurs qui la produisent avant d'en parler.", "steps": ["Vérifiez la surface, la date et l'énergie de chauffage en haut du DPE.", "Relevez l'énergie primaire et placez-la sur la grille énergie.", "Relevez les émissions et placez-les sur la grille climat.", "Retenez la moins bonne des deux classes : c'est la classe du logement.", "Repérez la note qui décide : c'est sur elle que portera l'argumentaire travaux."], "key_phrase": "« Votre logement a deux notes : E pour la consommation, F pour les émissions. Le DPE retient la moins bonne. »", "stage_label": "Étape du parcours", "stage_value": "Audit du bien à 360°", "notes": "Méthode. Apparition étape par étape. Clic sur la phrase clé → écoute (narration). Narration : « Cinq gestes : surface, date et énergie ; la note énergie ; la note climat ; la moins bonne des deux ; et la note qui décide, celle sur laquelle porteront les travaux. »"}, {"type": "explain", "eyebrow": "Unité 2.2 · Explication · Cas particuliers", "title": "Deux cas où la grille standard ne suffit pas", "paras": ["Logements de moins de 40 m² : depuis le 1er juillet 2024, les seuils sont ajustés pour ne plus pénaliser les petites surfaces. Ne recalculez jamais leur classe avec la grille des 40 m² et plus : lisez l'étiquette du DPE ou de l'attestation.", "Logements chauffés à l'électricité : l'énergie primaire dépend d'un coefficient de conversion, qui a changé au 1er janvier 2026 et changera au 1er janvier 2027. Une étiquette établie avant 2026 peut être dépassée : c'est l'objet de l'unité 2.3.", "Dans les deux cas, votre rôle n'est pas de recalculer officiellement une classe, mais de repérer qu'une vérification s'impose."], "cards": [{"value": "< 40 m²", "label": "seuils ajustés depuis le 1/07/2024"}, {"value": "Électricité", "label": "coefficient 2,3 → 1,9 → 1,7"}], "caption": "Sources : Service-Public F16096 ; arrêtés du 13/08/2025 et du 19/08/2026. Valeurs des seuils < 40 m² : se référer à l'étiquette.", "notes": "Explication. Deux onglets cliquables (« Petites surfaces », « Électricité ») ; Suivant actif après ouverture des deux. Narration : « Deux exceptions. Les logements de moins de 40 mètres carrés ont des seuils ajustés depuis juillet 2024 : on ne recalcule pas, on lit l'étiquette. Et les logements électriques dépendent d'un coefficient qui a changé en 2026 et changera en 2027. Votre rôle : repérer qu'il faut vérifier. »\nSources : Service-Public F16096 (https://www.service-public.gouv.fr/particuliers/vosdroits/F16096) ; arrêté du 13/08/2025 (coefficient 1,9) ; arrêté du 19/08/2026, NOR VLOL2617030A, JORFTEXT000054747079 (coefficient 1,7) ; communiqué du Gouvernement (≈ 850 000 / ≈ 300 000 logements)"}, {"type": "qcm", "eyebrow": "Unité 2.2 · Vérification", "title": "La classe de Mme Roux", "question_label": "Question notée", "question": "Appartement de Mme Roux (62 m², gaz) : 320 kWh/m²/an d'énergie primaire et 73 kg CO₂/m²/an d'émissions. Quelle est sa classe DPE ?", "options": ["E : c'est la consommation qui compte.", "D : à 62 m², ses seuils sont ajustés.", "F : la classe climat est la moins bonne.", "G : le gaz est pénalisé."], "answer": "C", "feedbacks": ["Non. 320 kWh/m²/an donne bien E sur la grille énergie, mais le DPE retient la moins bonne des deux notes : les émissions (73 kg) sont en F.", "Non. Les seuils ajustés ne concernent que les logements de moins de 40 m². À 62 m², la grille standard s'applique : énergie E, climat F, donc F.", "Exact. Énergie : E (≤ 330). Climat : F (> 70 et ≤ 100). La moins bonne l'emporte : F. L'annonce devra aussi porter la mention « logement à consommation énergétique excessive ».", "Non. G commence au-delà de 420 kWh/m²/an ou de 100 kg CO₂/m²/an. Mme Roux n'atteint aucun des deux seuils."], "notes": "QCM noté, 1 tentative, poids 30 dans l'unité 2.2. Données fictives. Calque feedback avec avatar SEB."}, {"type": "document", "eyebrow": "Unité 2.2 · Analyse documentaire · Document fictif", "title": "Vérifiez la classe affichée sur ce DPE", "doc_title": "DPE (extrait) · maison de M. Garnier, cas fictif", "fields": [{"label": "Surface habitable :", "value": "96 m²", "useful": true, "feedback": "Plus de 40 m² : la grille standard s'applique."}, {"label": "Établi le :", "value": "10/10/2024", "useful": true, "feedback": "Calculé avec le coefficient 2,3. Pour un logement électrique, l'étiquette peut avoir changé : vous le verrez en 2.3."}, {"label": "Chauffage :", "value": "électricité (convecteurs)", "useful": true, "feedback": "Électricité : peu d'émissions, l'énergie primaire décidera presque sûrement de la classe."}, {"label": "Énergie primaire :", "value": "268 kWh/m²/an", "useful": true, "feedback": "Entre 250 et 330 : classe E sur la grille énergie."}, {"label": "Émissions :", "value": "9 kg CO₂/m²/an", "useful": true, "feedback": "Entre 6 et 11 : classe B sur la grille climat. La moins bonne est E : la classe affichée est cohérente."}, {"label": "Diagnostiqueur :", "value": "A. Durand, certifié", "useful": false, "feedback": "Utile pour le dossier, mais il ne permet pas de vérifier la classe."}, {"label": "Coûts annuels estimés :", "value": "1 750 € à 2 400 €", "useful": false, "feedback": "Mention obligatoire de l'annonce, mais sans effet sur le calcul de la classe."}, {"label": "Propriétaire :", "value": "M. Garnier", "useful": false, "feedback": "Donnée personnelle, inutile pour vérifier la classe. À ne jamais saisir dans un outil d'IA grand public."}], "instruction": "Cliquez sur les 5 informations qui permettent de vérifier la classe affichée (E) et de savoir si elle peut évoluer. Chaque clic sur un piège compte comme une erreur.", "side_note": "Classe affichée sur ce DPE : E.", "counter": "Trouvées : 0 / 5", "notes": "Analyse documentaire notée, poids 30 dans l'unité 2.2. Zones cliquables (calques vert/rouge). Score = max(0 ; 1 − 0,2 × erreurs). Fin : calque SEB « Électricité, DPE d'octobre 2024 : gardez ce cas en tête pour l'unité 2.3. » Document fictif."}, {"type": "case_form", "eyebrow": "Unité 2.2 · Exercice d'application · Cas fictifs", "title": "À vous de classer trois logements", "case_title": "Trois logements fictifs de plus de 40 m²", "case_paras": ["Logement 1 · maison de 105 m² au fioul : 230 kWh/m²/an et 62 kg CO₂/m²/an.", "Logement 2 · appartement de 70 m² électrique : 300 kWh/m²/an et 9 kg CO₂/m²/an.", "Logement 3 · maison de 140 m² avec pompe à chaleur : 105 kWh/m²/an et 3 kg CO₂/m²/an.", "Pour chacun, retrouvez la classe DPE avec la règle du double seuil."], "inputs": ["Logement 1 : classe DPE (A à G)", "Logement 2 : classe DPE (A à G)", "Logement 3 : classe DPE (A à G)"], "answer": "Logement 1 : E (énergie D, climat E) · Logement 2 : E (énergie E, climat B) · Logement 3 : B (énergie B, climat A).", "feedbacks": ["Logement 1 noté D : vous n'avez lu que l'énergie. 62 kg CO₂ dépasse 50 : classe climat E, qui l'emporte.", "Logement 2 noté B : vous avez retenu la meilleure note. Le DPE retient la moins bonne : E (300 kWh/m²/an, entre 250 et 330).", "Logement 3 noté A : 105 kWh/m²/an dépasse le seuil A (70). Classe B, même si les émissions sont en A.", "Trois bonnes réponses : vous appliquez le double seuil sans hésiter."], "button": "Vérifier mes classes", "notes": "Cas noté, poids 40 dans l'unité 2.2. Listes déroulantes A à G (pas de saisie libre). 2 tentatives : score = bonnes réponses / 3, × 0,6 à la 2e tentative. Après 2 tentatives, affichage du corrigé. Valeurs fictives."}, {"type": "recap", "eyebrow": "Unité 2.2 · Synthèse", "title": "Lire avant de parler", "cards": [{"title": "Deux notes", "text": "Énergie primaire (kWh/m²/an) et émissions (kg CO₂/m²/an), chacune sur sa grille."}, {"title": "La moins bonne", "text": "La classe du logement est la moins bonne des deux. Repérez celle qui décide : elle oriente les travaux et votre discours."}, {"title": "Les exceptions", "text": "Moins de 40 m² : seuils ajustés, lisez l'étiquette. Électricité : coefficient en baisse, l'étiquette peut être dépassée."}], "banner_label": "Et M. Bernard ?", "banner_text": "Sa maison électrique émet 13 kg CO₂/m²/an (classe C) : c'est l'énergie primaire qui décide. Gardez-le en tête pour l'unité 2.3.", "notes": "Synthèse unité 2.2. Rappel espacé J+2. Narration : « Deux notes, la moins bonne l'emporte, et deux exceptions à repérer. Pour M. Bernard, c'est l'énergie primaire qui décide : on y vient. »"}, {"type": "divider", "kicker": "Unité 2.3", "title": "Réforme du coefficient : vérifier l'étiquette", "notes": "Séparateur d'unité 2.3 (18 min, seuil 70 %). Transcription de l'unité de référence (template.html, CONTENT_VERSION M1-S2-U3@1.0.0-draft). Pondération : vérification 15, analyse du DPE 15, calcul Mme Leroy 25, classement 25, dialogue 20. Seules les activités < 70 % sont à refaire."}, {"type": "persona", "eyebrow": "Accroche · Situation réelle de terrain", "title": "Mardi, 18 h 40. M. Bernard vous a laissé ses coordonnées", "initials": "MB", "name": "M. Bernard", "role": "Vendeur · formulaire « Vérification DPE »", "facts": ["Maison de 112 m² chauffée à l'électricité", "DPE classé F, réalisé en mars 2023", "Deux agences lui ont annoncé une décote de 15 %", "A coché « J'accepte d'être recontacté par [votre agence] au sujet de mon DPE et de l'estimation de mon bien »"], "quote": "« Avant de signer avec qui que ce soit, je veux savoir ce que vaut vraiment ma maison. »", "right_paras": ["Son étiquette a été calculée en 2023. Depuis, la façon dont le DPE compte l'électricité a changé une fois, et elle changera encore au 1er janvier 2027.", "Les deux agences ont repris la classe F telle quelle. Si cette classe n'est plus la bonne, leur décote non plus."], "question": "L'étiquette F de M. Bernard est-elle encore la bonne, et que pouvez-vous lui dire sans vous avancer ?", "notes": "Accroche (écran hook). Rôle complet affiché : « Propriétaire vendeur · formulaire « Vérification DPE gratuite » ». Narration : « Mardi soir. Monsieur Bernard a rempli votre formulaire de vérification de DPE et accepté d'être recontacté. Sa maison est chauffée à l'électricité, son DPE date de 2023 et il est classé F. Deux agences lui ont déjà annoncé moins quinze pour cent. Lui veut une seule chose : savoir ce que vaut vraiment sa maison. Avant de répondre, une question : son étiquette est-elle encore la bonne ? »"}, {"type": "objectives", "eyebrow": "Problème à résoudre · Objectif opérationnel", "title": "Vérifier une étiquette avant de parler prix", "items": ["Expliquer en une phrase pourquoi la classe d'un logement chauffé à l'électricité peut changer sans travaux", "Calculer l'effet du coefficient sur la consommation en énergie primaire et en déduire une classe probable", "Orienter le propriétaire vers la bonne démarche : attestation ADEME gratuite ou nouveau DPE", "En parler au vendeur sans promettre une classe ni un prix"], "stats": [{"value": "≈ 850 000", "label": "logements, surtout électriques, sortis de F et G au 1er janvier 2026"}, {"value": "≈ 300 000", "label": "autres logements annoncés pour le 1er janvier 2027"}], "side_title": "Pourquoi c'est important", "side_note": "Beaucoup de vendeurs ne le savent pas.", "footer": "18 min · 5 activités notées · Bloom : comprendre → appliquer → évaluer", "notes": "Objectif (écran goal). Encadré « Pourquoi c'est important » : « Le gouvernement estime qu'environ 850 000 logements, surtout chauffés à l'électricité, sont sortis des classes F et G au 1er janvier 2026. Environ 300 000 autres sont annoncés pour le 1er janvier 2027. Beaucoup de vendeurs ne le savent pas. » Narration : « Dans cette unité, vous allez apprendre à vérifier une étiquette énergie avant de parler de prix. Quatre choses : comprendre pourquoi une maison électrique peut changer de classe sans travaux, faire le calcul, savoir quelle démarche conseiller, et en parler sans promettre ce que seul le diagnostic peut établir. »\nSources : communiqué du Gouvernement sur l'évolution du calcul du DPE (2025) ; arrêté du 19 août 2026 (NOR VLOL2617030A, JORF du 26 août 2026, JORFTEXT000054747079)."}, {"type": "video", "title": "Sébastien : « Vérifiez avant de parler prix »", "label": "Emplacement de la capsule HeyGen (45 s) · avatar SEB", "notes": "Capsule vidéo 45 s, avatar SEB, sous-titres synchronisés ; non bloquante (la transcription suffit, accessibilité). xAPI : played / completed « video-seb-u23 ».\nScript (timecodes) : [0 s] « Bonjour, c'est Sébastien. » [2,5 s] « Depuis le 1er janvier 2026, le DPE ne compte plus l'électricité de la même façon. Et au 1er janvier 2027, ça bouge encore. » [11 s] « Concrètement : pour une maison chauffée à l'électricité, la même consommation peut donner une meilleure étiquette qu'il y a deux ans, une fois l'attestation ou un nouveau DPE établi. » [19 s] « Beaucoup de vendeurs ne le savent pas. Certaines agences non plus. » [23 s] « Résultat : des maisons sont estimées avec une décote qui ne correspond plus à leur étiquette. » [29 s] « Votre rôle n'est pas de promettre une meilleure classe. Votre rôle, c'est de vérifier, avec le bon document, avant de parler prix. » [37 s] « On va le faire ensemble sur la maison de M. Bernard. À la fin, vous saurez exactement quoi lui dire. » [43 s] fin."}, {"type": "explain", "eyebrow": "Explication · Le mécanisme", "title": "Une classe, deux seuils, un coefficient", "paras": ["Le DPE estime une consommation conventionnelle en énergie finale, calculée à partir des caractéristiques du logement (méthode 3CL), et non à partir des factures. Pour l'électricité, il la convertit en énergie primaire avec un coefficient de conversion.", "La classe retenue est la moins bonne de deux notes : énergie primaire (kWh/m²/an) et émissions de GES (kg CO₂/m²/an).", "Un logement électrique émet peu de CO₂ : c'est donc presque toujours son énergie primaire qui fixe sa classe. Quand le coefficient baisse, la classe peut s'améliorer sans travaux."], "formula": "énergie primaire = énergie finale × coefficient", "cards": [{"value": "2,3", "label": "jusqu'au 31/12/2025"}, {"value": "1,9", "label": "du 01/01/2026 au 31/12/2026"}, {"value": "1,7", "label": "à partir du 01/01/2027"}], "table": {"headers": ["Classe", "EP kWh/m²/an", "GES kg CO₂/m²/an"], "rows": [["A", "≤ 70", "≤ 6"], ["B", "≤ 110", "≤ 11"], ["C", "≤ 180", "≤ 30"], ["D", "≤ 250", "≤ 50"], ["E", "≤ 330", "≤ 70"], ["F", "≤ 420", "≤ 100"], ["G", "> 420", "> 100"]]}, "caption": "Logements de 40 m² et plus. Moins de 40 m² : seuils ajustés depuis le 1/07/2024. Gaz, fioul : seule la part électrique est touchée.", "notes": "Explication (écran explain). Texte intégral de la légende : « Les logements de moins de 40 m² ont des seuils ajustés depuis le 1er juillet 2024. La baisse du coefficient ne concerne que l'électricité : un logement chauffé au gaz ou au fioul n'est touché que pour sa part électrique (eau chaude électrique, éclairage, auxiliaires). » Paragraphe 1 complet : « … Pour l'électricité, il la convertit en énergie primaire, l'énergie qu'il a fallu produire et acheminer. C'est le rôle du coefficient de conversion. » Narration : « Le DPE estime la consommation d'un logement à partir de ses caractéristiques, pas de ses factures. Il le note sur deux critères : l'énergie primaire consommée et les émissions de gaz à effet de serre. La classe retenue est la moins bonne des deux. Pour l'électricité, on passe de l'énergie finale à l'énergie primaire avec un coefficient. Il valait 2,3 jusqu'à fin 2025, 1,9 en 2026, et 1,7 à partir du 1er janvier 2027. Comme un logement électrique émet peu de CO2, c'est sa consommation qui fixe la classe. Si le coefficient baisse, la classe peut s'améliorer sans travaux. »\nSources : arrêté du 13/08/2025 (coefficient 1,9) ; arrêté du 19/08/2026, NOR VLOL2617030A, JORFTEXT000054747079 (coefficient 1,7) ; communiqué du Gouvernement (≈ 850 000 / ≈ 300 000 logements)"}, {"type": "explain", "eyebrow": "Démonstration interactive · Exemple illustratif", "title": "Même maison, même consommation, trois étiquettes", "paras": ["Changez de coefficient et regardez où se place la maison de M. Bernard. Ouvrez les trois périodes pour continuer.", "Exemple fictif : la consommation de M. Bernard est une hypothèse pédagogique. Seul le DPE, ou son attestation actualisée, établit la classe réelle."], "formula": "165 × coefficient = énergie primaire → classe", "cards": [{"value": "379,5 · F", "label": "coefficient 2,3 (avant 2026)"}, {"value": "313,5 · E", "label": "coefficient 1,9 (2026)"}, {"value": "280,5 · E", "label": "coefficient 1,7 (dès 2027)"}, {"value": "13 kg · C", "label": "émissions : l'énergie primaire décide"}], "notes": "Démonstration (écran demo) — simulateur Storyline : 3 boutons de coefficient (2,3 / 1,9 / 1,7) + curseur d'énergie finale 80 à 240 kWh/m²/an, pas de 5, valeur initiale 165. Calcul affiché : EF × coefficient = EP → classe ; émissions = EF × 0,079 (classe GES) ; classe = la moins bonne ; marqueur « M. Bernard · avant 2026 / 2026 / dès 2027 » déplacé sur l'échelle A-G. Déblocage quand les 3 coefficients ont été vus (variable). Calque SEB « Vous avez vu le point clé. » : « Au point de départ (165 kWh/m²/an), la maison passe de F à E dès 2026. Faites glisser la consommation à 180 : la classe reste F en 2026 et ne passe en E qu'en 2027. C'est pour ça qu'on vérifie maison par maison, au lieu de supposer. » xAPI experienced « simulateur-coefficient »."}, {"type": "qcm", "eyebrow": "Vérification · Seule la première réponse compte", "title": "Avez-vous compris le mécanisme ? (1/3)", "question_label": "Question 1/3", "question": "Mme Roux vend un appartement chauffé au gaz, classé F en 2024. Que change la réforme du coefficient électricité pour sa classe ?", "options": ["Elle passe automatiquement en E.", "Peu de chose : seule la part électrique (éclairage, auxiliaires, éventuellement eau chaude) est recalculée.", "Son DPE n'est plus valable."], "answer": "B", "feedbacks": ["Non. Le coefficient ne concerne que l'électricité. Le gaz garde le même calcul.", "Exactement. L'effet est en général faible ; il compte davantage si l'eau chaude est électrique et que le logement est proche d'un seuil.", "Non. Un DPE de 2024 reste valable dix ans. La réforme ne l'annule pas."], "notes": "Écran check, question 1 sur 3 (les 3 questions forment une activité unique, poids 15 ; score = bonnes réponses / 3 ; seule la 1re réponse compte). Pour respecter la règle « jamais deux QCM d'affilée », les questions 2 et 3 sont placées après l'analyse du DPE et après le calcul. Feedback : titre « Bonne réponse. » ou « Pas tout à fait. » + avatar SEB."}, {"type": "document", "eyebrow": "Analyse documentaire · Document fictif", "title": "Trouvez les 5 informations qui décident de la suite", "doc_title": "Diagnostic de performance énergétique (logement)", "fields": [{"label": "N° :", "value": "2367E0412398Z", "useful": true, "feedback": "Numéro ADEME : utile. Ce numéro à 13 caractères permet de télécharger l'attestation sur l'observatoire DPE-Audit."}, {"label": "Établi le :", "value": "14/03/2023", "useful": true, "feedback": "Date d'établissement : utile. Mars 2023 : calculé avec le coefficient 2,3, et établi après le 1er juillet 2021, donc éligible à l'attestation actualisée."}, {"label": "Adresse :", "value": "12 rue des Tilleuls, 67400", "useful": false, "feedback": "Adresse : piège. Donnée personnelle. Inutile ici, et à ne jamais coller dans un outil d'IA grand public."}, {"label": "Diagnostiqueur :", "value": "J. Martin, certifié", "useful": false, "feedback": "Nom du diagnostiqueur : piège. Utile pour le dossier, mais il ne vous dit rien sur l'effet de la réforme."}, {"label": "Énergie de chauffage :", "value": "électricité (convecteurs + PAC air/air séjour)", "useful": true, "feedback": "Énergie de chauffage : utile. Électricité : c'est la condition pour que le coefficient change la classe."}, {"label": "dont énergie finale :", "value": "165 kWh/m²/an", "useful": true, "feedback": "Consommation en énergie finale : utile. 165 kWh/m²/an : c'est le chiffre à multiplier par le coefficient en vigueur."}, {"label": "Émissions :", "value": "13 kg CO₂/m²/an · C", "useful": true, "feedback": "Émissions de GES : utile. 13 kg CO₂/m²/an, classe C : ce critère ne bloque pas une amélioration."}, {"label": "Coûts annuels estimés :", "value": "entre 2 690 € et 3 680 €", "useful": false, "feedback": "Estimation des coûts annuels : piège. Argument intéressant pour l'acheteur, mais sans lien avec le recalcul de la classe."}], "instruction": "Cliquez sur les éléments du DPE qui vous permettent de savoir si la classe peut changer et quelle démarche conseiller. Évitez les pièges : chaque erreur est comptée.", "side_note": "Aussi sur le DPE : valable jusqu'au 13/03/2033 · maison 112 m² · énergie primaire 380 kWh/m²/an, classe F.", "counter": "Trouvées : 0 / 5", "notes": "Écran doc. Document fictif (filigrane FICTIF). Score = max(0 ; 1 − 0,2 × erreurs), poids 15. Jauge « Trouvées n / 5 ». À 5/5 : calque SEB « Dossier complet. » : « Électricité, DPE de 2023 avec un numéro ADEME, GES bas : M. Bernard est le cas typique. Prochaine étape : faire le calcul. »"}, {"type": "qcm", "eyebrow": "Vérification · Seule la première réponse compte", "title": "Avez-vous compris le mécanisme ? (2/3)", "question_label": "Question 2/3", "question": "M. Bernard a un DPE de mars 2023. Comment obtient-il une étiquette calculée avec le coefficient en vigueur ?", "options": ["Il doit payer un nouveau diagnostic.", "Il télécharge gratuitement une attestation actualisée sur l'observatoire DPE-Audit de l'ADEME, avec le numéro à 13 caractères de son DPE.", "L'agent recalcule la classe lui-même et l'indique dans l'annonce."], "answer": "B", "feedbacks": ["Pas forcément. Pour un DPE établi depuis le 1er juillet 2021, une attestation actualisée suffit, sauf si le logement a changé.", "Oui. L'attestation remplace l'étiquette sans nouvelle visite et vaut jusqu'à la fin de validité du DPE d'origine.", "Non. Votre calcul sert à repérer un cas probable. L'étiquette officielle vient de l'attestation ou d'un DPE."], "notes": "Écran check, question 2 sur 3 (même activité, poids 15 au total). Seule la 1re réponse compte. Source : observatoire DPE-Audit ADEME (attestation actualisée gratuite, DPE depuis le 1/07/2021)."}, {"type": "case_form", "eyebrow": "Exercice d'application · Cas fictif · 2 tentatives notées", "title": "La maison de Mme Leroy", "case_title": "Mme Leroy (cas fictif)", "case_paras": ["Mme Leroy vous contacte via votre page Google Business. Sa maison de 96 m² est chauffée à l'électricité.", "Son DPE date de septembre 2022 : classe G, 425 kWh/m²/an en énergie primaire, dont 185 kWh/m²/an en énergie finale. Émissions : 15 kg CO₂/m²/an.", "Le compromis serait signé en février 2027."], "inputs": ["Consommation en énergie primaire avec le coefficient applicable en février 2027 (kWh/m²/an)", "Classe probable de l'attestation actualisée (liste A à G)"], "answer": "185 × 1,7 = 314,5 kWh/m²/an (tolérance ± 1) → classe E probable (seuil E : ≤ 330).", "feedbacks": ["Juste. 185 × 1,7 = 314,5 kWh/m²/an, sous le seuil de 330 : classe E probable. Les émissions (15 kg) ne bloquent pas. Mme Leroy sort du statut de passoire sans travaux, sous réserve de l'attestation. Attention : une attestation téléchargée en 2026 affiche encore F (coefficient 1,9). Conseillez-lui de la télécharger à partir du 1er janvier 2027, avant de fixer le prix.", "Si 351,5 : vous avez pris le coefficient 2026. 185 × 1,9 = 351,5 : c'est la valeur de 2026 (classe F). En février 2027, c'est 1,7 qui s'applique.", "Si 425 ou 425,5 : c'est la valeur de son DPE d'origine. Elle a été calculée avec 2,3. Multipliez l'énergie finale par le coefficient applicable à la date de la vente.", "Si 314,5 avec une autre classe : bon calcul, mauvaise classe. 314,5 kWh/m²/an se situe entre 250 et 330 : c'est la classe E.", "Autre valeur : reprenez la formule. Énergie primaire = énergie finale × coefficient. Partez des 185 kWh/m²/an en énergie finale, pas de l'énergie primaire.", "Champ vide : il manque une réponse. Indiquez la consommation et la classe pour vérifier (tentative non décomptée)."], "button": "Vérifier mon calcul", "notes": "Écran calc. Champ numérique (virgule acceptée) + liste A à G. 2 tentatives notées : score 1 (1re tentative), 0,6 (2e), 0 sinon ; poids 25. Après 2 échecs, affichage du corrigé : « 185 × 1,7 = 314,5 kWh/m²/an → classe E probable (seuil E : ≤ 330) ». Cas fictif."}, {"type": "qcm", "eyebrow": "Vérification · Seule la première réponse compte", "title": "Avez-vous compris le mécanisme ? (3/3)", "question_label": "Question 3/3", "question": "Un vendeur vous montre un DPE réalisé en avril 2021. Que lui conseillez-vous ?", "options": ["Télécharger l'attestation ADEME.", "Garder ce DPE, il est valable dix ans.", "Faire réaliser un nouveau DPE avant la mise en vente."], "answer": "C", "feedbacks": ["Non. L'attestation actualisée ne concerne que les DPE établis depuis le 1er juillet 2021.", "Non. Les DPE réalisés entre le 1er janvier 2018 et le 30 juin 2021 ne sont plus valables depuis le 1er janvier 2025.", "Exact. Ce DPE n'est plus valable : un nouveau diagnostic est obligatoire pour vendre."], "notes": "Écran check, question 3 sur 3. À la 3e réponse : score check = bonnes réponses / 3 (poids 15), xAPI scored « check »."}, {"type": "sort", "eyebrow": "Classement · 5 situations · 1 tentative", "title": "Pour chaque vendeur, quelle démarche ?", "items": ["Maison chauffée à l'électricité, DPE de mars 2023, classe F.", "Appartement chauffé au gaz, DPE de 2024, classe F.", "Maison chauffée à l'électricité, DPE d'avril 2021.", "Maison électrique, DPE de 2022 classé E, mais combles isolés et pompe à chaleur installée en 2025.", "Studio de 22 m² chauffé à l'électricité, DPE de 2024, classe G."], "categories": ["Attestation ADEME gratuite", "Nouveau DPE", "Effet nul ou marginal"], "answers": [0, 2, 1, 1, 0], "whys": ["DPE postérieur au 1er juillet 2021, logement inchangé : l'attestation actualisée suffit.", "Le coefficient ne touche que l'électricité. Pour du gaz, l'effet est marginal.", "Les DPE établis avant le 1er juillet 2021 ne sont plus valables : un nouveau DPE est obligatoire.", "Le DPE reste valable, mais il décrit la maison d'avant travaux : l'attestation recalculerait ces anciennes données. Un nouveau DPE est recommandé pour valoriser les travaux.", "Attestation gratuite. Attention, les petites surfaces ont des seuils ajustés : ne calculez pas avec la grille des 40 m² et plus."], "notes": "Écran sort. 1 tentative ; Valider actif quand les 5 situations sont renseignées (sinon calque « Encore n situation(s). »). Score = bonnes / 5, poids 25. Feedback global : ≥ 4/5 « Vous savez trier les cas. Retenez la règle : DPE depuis juillet 2021 et logement inchangé = attestation ; DPE ancien ou logement modifié = nouveau DPE. » ; sinon « Relisez les explications sous chaque situation : la date du DPE et les travaux réalisés décident presque tout. »"}, {"type": "dialogue", "eyebrow": "Simulation · Chaque réponse change la suite", "title": "Vous rappelez M. Bernard, comme il l'a accepté", "persona_name": "M. Bernard", "opening": "« Alors, votre vérification ? Les autres agences m'ont dit moins 15 %, c'est le marché. »", "options": ["« Bonne nouvelle : avec la réforme, votre maison passe en E. On peut remonter le prix. »", "« Votre DPE de 2023 a été calculé avec un ancien coefficient. Votre étiquette a peut-être changé : on peut le vérifier gratuitement avec le numéro de votre DPE. »", "« Je ne peux rien vous dire sans visite. Les décotes, ça dépend du marché. »"], "tree": "Départ : confiance 40/100. Score = confiance finale / 100 ; plafonné à 60 si un choix négatif.\n[start] M. Bernard : « Alors, votre vérification ? Les autres agences m'ont dit moins 15 %, c'est le marché. »\nA « Bonne nouvelle : avec la réforme, votre maison passe en E. On peut remonter le prix. » −15 → over (classe que personne n'a encore établie)\nB « Votre DPE de 2023 a été calculé avec un ancien coefficient. Votre étiquette a peut-être changé : on peut le vérifier gratuitement avec le numéro de votre DPE. » +25 → value (fait vérifiable + action gratuite)\nC « Je ne peux rien vous dire sans visite. Les décotes, ça dépend du marché. » 0 → vague (prudent, mais rien de plus que les autres)\n[vague] « Les autres sont venus aussi. Vous allez me dire quoi de plus qu'eux ? »\nA « Avant même la visite : votre DPE de 2023 a été calculé avec un ancien coefficient. On peut vérifier gratuitement si votre étiquette a changé, avec le numéro de votre DPE. » +20 → value\nB « La même chose, sans doute. C'est le marché. » −10 → next (troisième agence interchangeable)\n[over] « Ah ! Donc je peux mettre « classe E » dans l'annonce dès demain ? »\nA « Oui, allez-y, c'est la réforme. » −25 → price (sans attestation, information inexacte)\nB « Je me suis avancé. L'étiquette officielle, c'est l'attestation de l'ADEME. On la télécharge ensemble, puis on l'affiche. » +15 → price\n[value] « D'accord. Et si c'est E, ma maison vaut combien de plus ? »\nA « 15 % de plus, c'est mécanique. » −20 → next (aucune règle classe → %)\nB « L'étiquette est une des familles de valeur. Je l'intègre dans un avis de valeur 360° avec les ventes réelles du quartier, et je vous le remets par écrit. » +25 → next\nC « Ça dépend, on verra plus tard. » 0 → next (réponse vague)\n[price] « Bon. Et ma maison, alors, elle vaut combien ? »\nA « Je vous prépare un avis de valeur 360° écrit, en partant des ventes réelles du secteur et de votre étiquette à jour. » +20 → next\nB « Comptez 15 % de plus que ce qu'on vous a dit. » −20 → next\n[next] « Bon. Et concrètement, vous me proposez quoi ? »\nA « On télécharge l'attestation ensemble maintenant. Je reviens jeudi avec l'avis de valeur écrit. Vous décidez ensuite. » +25 → fin\nB « Signez un mandat exclusif aujourd'hui, on verra le reste après. » −15 → fin\nC « Je vous rappelle dans un mois pour faire le point. » −5 → fin\nVerdicts : ≥ 80 sans choix négatif = « Jeudi, c'est parfait. Vous êtes le premier à me parler de ça. » (rendez-vous obtenu) ; ≥ 50 = « Je vais réfléchir. Envoyez-moi quelque chose par écrit. » (porte entrouverte) ; < 50 = « Je crois que je vais voir avec une autre agence. » (occasion manquée).", "notes": "Écran dialog. Jauge de confiance (départ 40, bornée 0-100), commentaire affiché sous chaque réponse (delta + raison). Poids 20. Bouton « Rejouer la conversation (non noté) » en fin. Feedback SEB : rendez-vous obtenu = « Vous avez vérifié avant d'affirmer, relié l'étiquette à une méthode écrite et proposé une suite datée. Cet enchaînement (vérifier le DPE, avis de valeur, plan de vente) est détaillé dans la séquence 4. » ; sinon (si choix négatif : « Une de vos réponses promettait une classe, un pourcentage ou une signature immédiate : la note est plafonnée à 60. ») + « Le bon ordre : 1) partir du DPE et proposer la vérification gratuite, 2) ne jamais annoncer une classe ou un pourcentage, 3) proposer un avis de valeur écrit, 4) fixer une prochaine étape datée. » Conformité : appel fondé sur l'accord de recontact de M. Bernard (objet : DPE et estimation).", "graph": {"start": "start", "initial": 40, "nodes": {"start": {"him": "« Alors, votre vérification ? Les autres agences m'ont dit moins 15 %, c'est le marché. »", "opts": [{"text": "« Bonne nouvelle : avec la réforme, votre maison passe en E. On peut remonter le prix. »", "delta": -15, "next": "over", "why": "Classe que personne n'a encore établie."}, {"text": "« Votre DPE de 2023 a été calculé avec un ancien coefficient. Votre étiquette a peut-être changé : on peut le vérifier gratuitement avec le numéro de votre DPE. »", "delta": 25, "next": "value", "why": "Fait vérifiable + action gratuite."}, {"text": "« Je ne peux rien vous dire sans visite. Les décotes, ça dépend du marché. »", "delta": 0, "ne
