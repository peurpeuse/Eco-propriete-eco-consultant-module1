<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Éco-Consultant Module 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>[hidden]{display:none!important}img{max-width:100%}
/* Layout : lecteur de cours — barre de marque noire, plan du module à gauche (séquences > unités > écrans), écran central, navigation basse.
   Tokens ÉCO-CONSULTANT (support PowerPoint) : orange #FF8D16, noir #1A1A1A, crème #FFF1E0, Lato. */
:root{
  --brand:#FF8D16;--brand-deep:#B35300;--brand-soft:#FFB55B;--peach:#FFD3A3;
  --cream:#FFF1E0;--cream-2:#FFF8F0;--ink:#1A1A1A;--ink-2:#4D4D4D;
  --bg:#FFFBF6;--surface:#FFFFFF;--fg:#1A1A1A;--muted:#5E554C;--line:#F0DCC4;
  --ok:#17703D;--ok-bg:#E5F5EC;--warn:#8A6A00;--warn-bg:#FFF4CC;--err:#C0392B;--err-bg:#FDECEA;--focus:#0B57D0;
  --f:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141210;--surface:#1E1B18;--fg:#F4EEE7;--muted:#B9AEA2;--cream:#2A221A;--cream-2:#231D17;--line:#3A3027;--peach:#5A4430;
  --brand-deep:#FFB55B;--ink-2:#CFC6BC;--ok:#5FD08F;--ok-bg:#16301F;--warn:#F2CF5B;--warn-bg:#332A0C;--err:#FF8A7D;--err-bg:#3A1A16;--focus:#8AB4F8;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141210;--surface:#1E1B18;--fg:#F4EEE7;--muted:#B9AEA2;--cream:#2A221A;--cream-2:#231D17;--line:#3A3027;--peach:#5A4430;
  --brand-deep:#FFB55B;--ink-2:#CFC6BC;--ok:#5FD08F;--ok-bg:#16301F;--warn:#F2CF5B;--warn-bg:#332A0C;--err:#FF8A7D;--err-bg:#3A1A16;--focus:#8AB4F8;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--f);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:14px;max-width:1320px;margin:0 auto}
.top img{height:28px;width:auto;flex:none}
.crumb{flex:1;min-width:0;font-size:13px;color:#D9CFC4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:#fff}
.pill{background:transparent;border:1px solid #4a4a4a;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.pill:hover{border-color:var(--brand)}
.pbar{height:4px;background:#3A3A3A;border-radius:4px;overflow:hidden;max-width:1320px;margin:8px auto 0}
.pbar i{display:block;height:100%;background:var(--brand);width:0;transition:width .4s}
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;padding-block:22px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:80px;align-self:start;max-height:calc(100vh - 190px);overflow-y:auto;padding-right:6px;display:flex;flex-direction:column;gap:6px}
.seq>button{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.seq>button small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-deep);font-weight:900}
.seq>button b{font-size:14px}
.seq .sc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.seq.open>button{border-color:var(--brand)}
.units{list-style:none;margin:4px 0 8px;padding:0 0 0 8px;display:none;flex-direction:column;gap:2px}
.seq.open .units{display:flex}
.units button{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:13.5px;display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;color:var(--fg)}
.units button:hover{background:var(--cream)}
.units button[aria-current="true"]{background:var(--cream);font-weight:700}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-top:3px}
.done .dot{background:var(--brand);border-color:var(--brand)}
.stage{min-width:0;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-deep);font-weight:900}
.stage h1{font-size:clamp(24px,3vw,36px);font-weight:900}
.card{background:var(--surface);border:1px solid var(--peach);border-radius:14px;padding:18px}
.creamb{background:var(--cream);border-radius:14px;padding:18px}
.dark{background:var(--ink);color:#fff;border-radius:14px;padding:20px}
.dark .eyebrow{color:var(--brand-soft)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g3.cols{grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
.stage:focus{outline:none}
.mono{overflow-wrap:anywhere}
.gside{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:var(--brand-deep);margin-bottom:6px;display:block}
.dark .lab{color:var(--brand-soft)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--peach);border-radius:12px;padding:10px 14px}
.steps li::before{content:attr(data-k);width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:#1A1A1A;display:grid;place-items:center;font-weight:900}
.big{font-size:clamp(28px,4vw,40px);font-weight:900;color:var(--brand);line-height:1.1}
.dark .big{color:var(--brand)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.formula{background:var(--ink);color:#fff;border-radius:12px;padding:14px 18px;font-weight:700;font-size:18px;overflow-wrap:anywhere}
.small{font-size:13px;color:var(--muted)}
.quote{background:var(--brand);color:#1A1A1A;border-radius:12px;padding:12px 14px;font-style:italic}
.persona{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;background:var(--brand);color:#1A1A1A;display:grid;place-items:center;font-weight:900}
.dark ul{margin:12px 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
table.t{border-collapse:collapse;width:100%;font-size:14.5px}
table.t th{background:var(--ink);color:#fff;text-align:left;padding:9px 10px;font-size:12.5px;letter-spacing:.04em}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:nth-child(even) td{background:var(--cream-2)}
table.t td:first-child{font-weight:700}
.scroll{overflow-x:auto}
.dpe{display:inline-block;min-width:26px;text-align:center;border-radius:4px;font-weight:900;color:#1A1A1A}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--peach);border-radius:12px;padding:12px 14px;cursor:pointer;width:100%}
.choice:hover:not(:disabled){border-color:var(--brand)}
.choice .k{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:#1A1A1A;display:grid;place-items:center;font-weight:900}
.choice.good{border-color:var(--ok);background:var(--ok-bg)}
.choice.bad{border-color:var(--err);background:var(--err-bg)}
.choice:disabled{cursor:default}
.fb{border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.fb img{width:44px;height:44px;border-radius:50%;background:var(--cream)}
.fb.good{background:var(--ok-bg)}.fb.bad{background:var(--err-bg)}.fb.mid{background:var(--warn-bg)}
.fb strong{display:block;margin-bottom:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 20px;font-weight:700;border:2px solid transparent;cursor:pointer;min-height:44px}
.btn-p{background:var(--brand);color:#1A1A1A}.btn-p:hover{background:#FF7A00}
.btn-g{background:transparent;border-color:var(--line);color:var(--fg)}.btn-g:hover{border-color:var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.doc{background:#fff;color:#1A1A1A;border:1px solid #D9D2C9;border-radius:6px;padding:16px;position:relative;display:flex;flex-direction:column;gap:8px}
.doc .wm{position:absolute;right:12px;top:10px;font-size:11px;font-weight:900;letter-spacing:.12em;color:#B35300;border:1.5px solid #B35300;border-radius:4px;padding:2px 6px}
.doc h3{font-size:16px;padding-right:70px}
.hs{all:unset;cursor:pointer;display:block;border:1.5px solid #FFB55B;background:#FFF8F0;border-radius:6px;padding:7px 10px;font-size:14px}
.hs span{color:#4D4D4D}
.hs:hover{background:#FFF1E0}.hs:focus-visible{outline:3px solid #0B57D0}
.hs.good{background:#E5F5EC;border-color:#17703D}.hs.bad{background:#FDECEA;border-color:#C0392B}
.sortrow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px;border:1.5px solid var(--peach);border-radius:12px;background:var(--surface)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--cream);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer;min-height:40px;font-weight:700}
.seg button[aria-checked="true"]{border-color:var(--brand);background:var(--surface)}
.seg button.good{border-color:var(--ok);background:var(--ok-bg)}.seg button.bad{border-color:var(--err);background:var(--err-bg)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field textarea,.field input{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);min-height:44px;width:100%}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:12px 14px;border-radius:14px}
.msg.him{background:var(--cream);align-self:flex-start;border-top-left-radius:4px}
.msg.me{background:var(--ink);color:#fff;align-self:flex-end;border-top-right-radius:4px}
.msg .who{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.75;display:block}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.meter .tr{flex:1;height:10px;background:var(--line);border-radius:10px;overflow:hidden;min-width:80px}
.meter .tr i{display:block;height:100%;background:var(--brand);transition:width .5s}
.video{position:relative;aspect-ratio:16/9;max-width:100%;background:#1A1A1A;color:#fff;border-radius:14px;display:grid;place-items:center;overflow:hidden}
.video .in{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:20px}
.video img{width:120px;height:120px;border-radius:50%;border:3px solid var(--brand);background:#2a2a2a}
.video .cc{position:absolute;left:5%;right:5%;bottom:14px;text-align:center;background:rgba(0,0,0,.72);border-radius:8px;padding:8px 12px;font-size:clamp(14px,1.8vw,18px)}
.tag{display:inline-flex;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--cream);color:var(--brand-deep)}
.tag.todo{background:var(--warn-bg);color:var(--warn)}
details.notes{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;background:var(--cream-2)}
details.notes summary{cursor:pointer;font-weight:700;font-size:14px}
details.notes pre{white-space:pre-wrap;font:14px/1.55 var(--f);margin:8px 0 0;color:var(--ink-2)}
.divider{background:var(--brand-soft);border-radius:22px;padding:56px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:12px -12px 0 -2px var(--bg),12px -12px 0 0 var(--brand)}
.divider .k{font-size:clamp(36px,6vw,56px);font-weight:900;color:#1A1A1A}
.divider .t{font-size:clamp(18px,2.4vw,24px);color:#1A1A1A}
.cover{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center}
.cover h1{font-size:clamp(30px,4.6vw,52px)!important}
.badgewrap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.medal{width:170px;height:170px;border-radius:50%;background:var(--brand-soft);border:10px solid var(--brand);display:grid;place-items:center;color:#1A1A1A;padding:14px}
.medal b{display:block;font-size:20px;line-height:1.15}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.navbar-in{max-width:1320px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.navbar .hint{flex:1;text-align:center;font-size:13px;color:var(--muted);min-width:0}
.fade{animation:fi .3s ease both}@keyframes fi{from{opacity:.001;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.drawer{display:none}
@media (max-width:920px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none;position:static;max-height:none}
  .rail.open{display:flex}
  .drawer{display:inline-flex}
  .g2,.g3,.g3.cols,.gside,.cover{grid-template-columns:minmax(0,1fr)}
  .navbar .hint{display:none}
  .msg{max-width:95%}
}
</style>
</head><body>

<script type="application/json" id="course">{"file": "Eco-Consultant_M1_Module-complet", "sequence_label": "Module 1 · Parcours complet", "title": "Module 1 complet", "slides": [{"type": "cover", "sequence_label": "Module 1 · Parcours complet", "title": "Se différencier pour attirer les propriétaires", "notes": "Écran d'accueil du module 1 complet (8 séquences, 32 unités, environ 5 h 10). Storyline : bouton « Commencer » vers la séquence 0 ; chaque séquence se débloque à 70 % de la précédente."}, {"type": "divider", "kicker": "Séquence 0", "title": "Immersion : l'agent immobilier en 2026", "notes": "Écran d'accueil de la séquence 0 (durée totale 20 min). Bouton « Commencer » → unité 0.1. Séquence ouverte d'office (aucun prérequis). Narration : « Bienvenue dans le module 1 d'Éco-Consultant. En vingt minutes, vous allez comprendre ce qui a changé pour l'agent immobilier en 2026, rencontrer M. Bernard, mesurer votre point de départ et découvrir votre parcours. »"}, {"type": "divider", "kicker": "Unité 0.1", "title": "Pourquoi certains agents obtiennent les mandats", "notes": "Séparateur de l'unité 0.1 (≈ 5 min). Transition automatique après 3 s ou clic sur « Suivant »."}, {"type": "video", "title": "Sébastien : « Le mandat va à celui qui en sait le plus »", "label": "Emplacement de la capsule HeyGen (75 s) · avatar SEB", "notes": "Capsule HeyGen, avatar SEB, 75 s environ, plan taille, fond bureau Éco Propriété. Le bouton « Suivant » se débloque à la fin de la vidéo (déclencheur : timeline ends). Sous-titres activés.\nSCRIPT COMPLET :\n« Bonjour, je suis Sébastien Paumier. Avant de parler technique, posons une question simple : pourquoi certains agents obtiennent les mandats, et d'autres non ?\nLe vendeur de 2026 n'est plus celui d'il y a cinq ans. Il est mieux informé : il a consulté les prix des ventes passées, testé deux estimateurs en ligne, lu des articles sur le DPE. Il est sollicité de partout : agences, mandataires, plateformes, investisseurs. Pour lui, nous nous ressemblons tous. Et il est protégé : depuis le 11 août 2026, un professionnel ne peut plus l'appeler pour le démarcher sans son accord préalable.\nDans ce contexte, le mandat ne va pas à celui qui appelle le plus. Ni à celui qui promet le prix le plus haut. Il va à celui qui en sait le plus : sur le marché, sur le bien, sur les règles. Et qui sait le montrer au vendeur.\nC'est l'objet de ce module. Vous allez suivre un vendeur fictif, M. Bernard : une maison de 112 mètres carrés chauffée à l'électricité, un DPE F de 2023, et deux agences qui lui annoncent déjà moins quinze pour cent. À la fin du module, vous saurez quoi lui dire, comment le contacter dans les règles, et comment lui proposer une exclusivité qui a du sens pour lui.\nOn commence. »\nSources : loi n° 2025-594 du 30 juin 2025 et décret n° 2026-662 du 23 juillet 2026 (entrée en vigueur le 11 août 2026)."}, {"type": "objectives", "eyebrow": "Unité 0.1 · Promesse pédagogique", "title": "Ce que ce module va changer dans vos rendez-vous vendeurs", "intro_label": "À la fin du module, vous saurez", "items": ["Ouvrir une conversation vendeur sur un fait vérifiable, pas sur une promesse", "Contacter un propriétaire dans un cadre conforme et le prouver", "Proposer un mandat, si possible exclusif, en échange de services concrets"], "stats": [{"value": "≈ 5 h 10", "label": "de formation, en 8 séquences courtes"}, {"value": "70 %", "label": "de réussite pour débloquer la séquence suivante"}], "side_title": "Fil rouge", "side_note": "M. Bernard, vendeur fictif, vous suit jusqu'à la séquence 6", "footer": "Une méthode de travail, pas une garantie de résultat.", "notes": "Écran statique, apparition des 3 objectifs en séquence (0,5 s d'écart). Narration : « Ce module ne vous promet pas des mandats faciles. Il vous donne une méthode : partir d'un fait vérifiable, contacter dans les règles, et proposer des services qui justifient l'exclusivité. » Durée totale du module : 20 + 40 + 50 + 45 + 60 + 30 + 35 + 30 = 310 min."}, {"type": "table", "eyebrow": "Unité 0.1 · Objectifs du module", "title": "Six objectifs opérationnels, six étapes de votre parcours", "intro": "Chaque objectif est travaillé dans une séquence précise et évalué en séquence 7.", "headers": ["Objectif : vous serez capable de…", "Où vous le travaillez"], "rows": [["Citer les indicateurs du marché 2026 et les traduire en argument vendeur", "Séquence 1 · Le marché 2026"], ["Expliquer l'impact de la réforme du DPE sur un bien chauffé à l'électricité", "Séquence 2 · DPE (unité 2.3)"], ["Distinguer les canaux de prospection autorisés et interdits depuis le 11 août 2026", "Séquence 3 · Prospection conforme"], ["Rappeler les règles Hoguet du mandat simple et du mandat exclusif", "Séquence 3 · Unité 3.5"], ["Décrire les 5 techniques de prise de mandat", "Séquence 4 · Cinq techniques"], ["Identifier les usages utiles de l'IA et leurs limites", "Séquence 5 · L'IA de l'agent"]], "caption": "Les 6 objectifs reprennent ceux du support initial du module 1.", "notes": "Tableau statique ; chaque ligne apparaît au clic ou automatiquement (1 s). Narration : « Voici les six objectifs du module. Chacun correspond à une séquence. Gardez-les en tête : l'évaluation finale de la séquence 7 porte exactement sur eux. »"}, {"type": "explain", "eyebrow": "Unité 0.1 · Explication", "title": "Le vendeur de 2026 : informé, sollicité, protégé", "paras": ["Mieux informé : les prix des ventes passées sont publics (base DVF) et les estimateurs en ligne sont gratuits. Le vendeur arrive avec un chiffre en tête.", "Sollicité de partout : agences, mandataires, plateformes. Vu de chez lui, les professionnels se ressemblent.", "Protégé : depuis le 11 août 2026, un professionnel ne peut plus le démarcher par téléphone sans son accord préalable (sauf contrat en cours). Bloctel est supprimé."], "cards": [{"value": "Informé", "label": "prix publics, estimateurs en ligne"}, {"value": "Sollicité", "label": "plusieurs agences pour un même bien"}, {"value": "Protégé", "label": "accord préalable obligatoire depuis le 11/08/2026"}], "caption": "Sources : loi n° 2025-594 du 30/06/2025 ; décret n° 2026-662 du 23/07/2026 ; données DVF : app.dvf.etalab.gouv.fr.", "notes": "Les 3 cartes s'affichent l'une après l'autre, synchronisées avec la narration. Narration : « Trois mots résument le vendeur de 2026. Informé : il a déjà vu des prix. Sollicité : il a déjà reçu d'autres agents. Protégé : on ne l'appelle plus sans son accord. Celui qui obtient le mandat, c'est celui qui lui apporte ce qu'il ne trouve pas seul. » Sources : Légifrance (loi n° 2025-594, décret n° 2026-662) ; DVF (data.gouv.fr / app.dvf.etalab.gouv.fr)."}, {"type": "qcm", "eyebrow": "Unité 0.1 · Vérification", "title": "Qui obtient le mandat en 2026 ?", "question_label": "Question notée", "question": "D'après Sébastien, quel agent a le plus de chances d'obtenir le mandat d'un vendeur en 2026 ?", "options": ["Celui qui appelle le plus de propriétaires dans le secteur", "Celui qui annonce l'estimation la plus haute", "Celui qui en sait le plus sur le marché, le bien et les règles, et le montre au vendeur"], "answer": "C", "feedbacks": ["Le volume d'appels ne suffit plus : depuis le 11 août 2026, appeler un particulier sans son accord préalable est interdit. Et un appel de plus ne vous distingue pas des autres.", "Une estimation haute séduit un jour, puis le bien ne se vend pas et la confiance disparaît. Le vendeur informé compare : il repère vite le chiffre sans justification.", "C'est le cœur du module : le vendeur choisit le professionnel qui lui apporte des faits vérifiables (marché, DPE, règles) qu'il ne trouve pas seul."], "notes": "QCM noté, 1 point, poids 25 % du score de la séquence 0. Une seule tentative ; feedback sur calque dédié à chaque option ; « Suivant » débloqué après validation."}, {"type": "two_cols", "eyebrow": "Unité 0.1 · Deux postures", "title": "L'agent interchangeable face à l'agent qui obtient le mandat", "tone": "neutral", "left_title": "L'agent interchangeable", "left_items": ["Annonce un prix sans avoir lu les documents du bien", "Appelle sans vérifier l'accord du propriétaire", "Répète la tendance nationale", "Promet un prix pour décrocher la signature"], "right_title": "L'agent qui obtient le mandat", "right_items": ["Lit le DPE et vérifie s'il a évolué", "Contacte dans le cadre d'un accord préalable prouvé", "Traduit les chiffres du marché pour le quartier du vendeur", "Propose un plan de vente et des services en échange de l'exclusivité"], "footer_title": "Le fil du module", "footer_text": "Chaque séquence vous donne un de ces réflexes. La séquence 6 les assemble sur le cas de M. Bernard.", "notes": "Écran statique. Les colonnes apparaissent l'une après l'autre. Narration : « À gauche, ce que le vendeur a déjà vu trois fois. À droite, ce qui vous distingue. Chaque séquence du module travaille un de ces réflexes. » Proposition pédagogique (pas une donnée chiffrée)."}, {"type": "recap", "eyebrow": "Unité 0.1 · Synthèse", "title": "Trois idées à retenir", "cards": [{"title": "Le vendeur a changé", "text": "Il est informé, sollicité de partout et protégé par l'accord préalable depuis le 11 août 2026."}, {"title": "Le savoir l'emporte", "text": "Le mandat va à celui qui en sait le plus sur le marché, le bien et les règles, et qui le montre."}, {"title": "Six objectifs", "text": "Marché, DPE, prospection, Hoguet, techniques de prise de mandat, IA : un objectif par étape."}], "banner_label": "Unité suivante", "banner_text": "Votre première phrase à M. Bernard.", "notes": "Synthèse de l'unité 0.1. Variable Storyline U01_vue = true à l'affichage. Rappel espacé de ces 3 cartes à J+2 (proposition pédagogique)."}, {"type": "divider", "kicker": "Unité 0.2", "title": "Que diriez-vous à M. Bernard ?", "notes": "Séparateur de l'unité 0.2 (≈ 5 min). Transition automatique après 3 s ou clic sur « Suivant »."}, {"type": "persona", "eyebrow": "Unité 0.2 · Accroche", "title": "M. Bernard attend votre appel, mais il se méfie", "initials": "MB", "name": "M. Bernard", "role": "Propriétaire vendeur (personnage fictif)", "facts": ["Maison de 112 m² chauffée à l'électricité", "DPE classe F établi en mars 2023", "Deux agences lui annoncent une décote de −15 %", "A coché sur votre site : « J'accepte d'être recontacté… au sujet de mon DPE et de l'estimation »", "Ne décroche plus aux numéros inconnus"], "quote": "« Deux agences m'ont déjà dit moins 15 %. Vous allez me dire la même chose ? »", "right_paras": ["Il a rempli le formulaire de votre agence. Il accepte votre appel, mais il a déjà entendu deux fois le même discours.", "Votre première phrase décidera s'il vous écoute ou s'il raccroche."], "question": "Quelle est votre première phrase au téléphone ?", "notes": "Écran d'accroche. Personnage fictif : mention « personnage fictif » visible à l'écran. Narration : « Voici M. Bernard. Il veut vendre sa maison, il a accepté d'être recontacté par votre agence, mais deux confrères lui ont déjà annoncé moins quinze pour cent. Il ne décroche plus aux numéros inconnus : vous n'aurez pas deux chances. » Le formulaire complet coché : « J'accepte d'être recontacté par [votre agence] au sujet de mon DPE et de l'estimation de mon bien »."}, {"type": "qcm", "eyebrow": "Unité 0.2 · Votre réflexe (non noté)", "title": "Que diriez-vous à M. Bernard ?", "question_label": "Question d'opinion · non notée", "question": "M. Bernard décroche. Quelle première phrase choisissez-vous ?", "options": ["« Je vous confirme la décote de 15 %, c'est le marché. »", "« Je peux vous rappeler demain pour une estimation ? »", "« Votre DPE date de 2023 : avec la réforme, votre classe a peut-être changé. Vérifions-le. »"], "answer": "C", "feedbacks": ["Vous confirmez ce que deux agences ont déjà dit : vous devenez la 3e agence interchangeable. Et rien n'a été vérifié : ni le bien, ni son DPE, ni le marché local.", "Son accord couvre bien ce rappel (DPE et estimation). Mais il a décroché maintenant : reporter, c'est perdre l'occasion. Et proposer une estimation de plus ne vous distingue pas des deux autres agences.", "Vous partez d'un fait vérifiable : un DPE de 2023 sur un bien chauffé à l'électricité. Vous ne promettez aucune classe, vous proposez de vérifier ensemble. C'est l'angle de ce module."], "notes": "QUESTION NON NOTÉE (poids 0, exclue du score). Question d'opinion : toutes les réponses sont acceptées, chaque choix affiche son feedback sur un calque, puis le bouton « Voir la réponse recommandée » met en avant l'option C. Variable S0_opinion enregistrée (A/B/C) pour statistiques formateur uniquement. Narration du calque C : « Vous ne promettez rien : vous proposez de vérifier. C'est exactement ce qui le distingue des deux autres appels. »"}, {"type": "document", "eyebrow": "Unité 0.2 · Analyse", "title": "Préparez votre appel : ce qui compte dans la fiche de M. Bernard", "doc_title": "Fiche contact · M. Bernard (exemple fictif)", "fields": [{"label": "Origine du contact :", "value": "Formulaire du site de votre agence", "useful": true, "feedback": "C'est la base de votre appel : un accord nominatif à votre agence. Conservez-en la preuve (au moins 3 ans)."}, {"label": "Accord donné :", "value": "Recontact au sujet du DPE et de l'estimation", "useful": true, "feedback": "L'accord fixe l'objet de l'appel : DPE et estimation. Restez dans ce cadre."}, {"label": "DPE :", "value": "Classe F, établi en mars 2023", "useful": true, "feedback": "Établi depuis le 1er juillet 2021 : il reste valable (10 ans) et peut bénéficier d'une attestation actualisée gratuite (observatoire DPE de l'ADEME)."}, {"label": "Chauffage :", "value": "Électrique", "useful": true, "feedback": "Un bien chauffé à l'électricité est directement concerné par la baisse du coefficient (2,3, puis 1,9 au 1er janvier 2026 et 1,7 au 1er janvier 2027)."}, {"label": "Avis des confrères :", "value": "Décote de −15 % annoncée par deux agences", "useful": true, "feedback": "C'est son inquiétude. Votre réponse doit partir d'un fait vérifiable, pas d'une contre-promesse."}, {"label": "Couleur des volets :", "value": "Bleu", "useful": false, "feedback": "Utile pour reconnaître la maison, pas pour votre première phrase."}, {"label": "Profession :", "value": "Retraité de l'enseignement", "useful": false, "feedback": "Information personnelle sans lien avec l'objet de l'appel. Ne la collectez pas sans raison (RGPD, principe de minimisation)."}], "instruction": "Cliquez sur les informations qui vous servent à préparer votre premier appel.", "counter": "0 / 5 trouvées", "side_note": "Exemple fictif : toutes les informations sont inventées pour l'exercice.", "notes": "Activité notée : 5 zones utiles, 2 pièges. 1 point par zone utile, −1 par piège (minimum 0) ; score ramené sur 5, poids 50 % du score de la séquence. Compteur mis à jour à chaque bonne zone. Bouton « Valider » actif après au moins 3 clics. Sources : DPE et attestation actualisée (ADEME, observatoire DPE-Audit) ; coefficient 1,9 (arrêté du 13/08/2025) ; preuve du consentement 3 ans (art. R. 223-2 C. consom., décret n° 2026-662)."}, {"type": "two_cols", "eyebrow": "Unité 0.2 · Limites", "title": "Ce que vous pouvez dire à M. Bernard, et ce que vous évitez", "left_title": "Vous pouvez dire", "left_items": ["« Vous m'avez autorisé à vous rappeler au sujet de votre DPE et de votre estimation. »", "« Votre DPE date de 2023 : vérifions s'il a évolué avec la réforme. »", "« Je préfère vérifier avant de vous donner un chiffre. »"], "right_title": "Vous évitez", "right_items": ["« Votre maison va passer en D. » (promesse de classe)", "« J'obtiens 15 % de plus que les autres. » (promesse de prix)", "« C'est le marché, il faut baisser. » (sans aucune vérification)"], "footer_title": "À retenir", "footer_text": "Un fait vérifiable ouvre la conversation. Une promesse la ferme à la première contradiction.", "notes": "Écran statique. Narration : « Personne ne peut promettre une classe avant d'avoir vérifié le DPE, ni un prix avant d'avoir vu le bien. Votre force, c'est de proposer la vérification. » Rappel conformité : l'appel reste dans l'objet de l'accord donné (DPE et estimation)."}, {"type": "recap", "eyebrow": "Unité 0.2 · Synthèse", "title": "Trois réflexes avant de parler à un vendeur", "cards": [{"title": "Vérifier l'accord", "text": "Avant tout appel, vérifiez qu'un accord préalable couvre ce contact. M. Bernard en a donné un : DPE et estimation."}, {"title": "Partir d'un fait", "text": "Un DPE de 2023 sur un bien chauffé à l'électricité : c'est vérifiable, ce n'est pas une opinion."}, {"title": "Ne rien promettre", "text": "Ni classe, ni prix. Vous proposez de vérifier, puis vous montrez le résultat."}], "banner_label": "Unité suivante", "banner_text": "Un test de 8 questions pour situer votre point de départ.", "notes": "Synthèse de l'unité 0.2. Variable U02_vue = true. Rappel espacé à J+2 (proposition pédagogique)."}, {"type": "divider", "kicker": "Unité 0.3", "title": "Test diagnostique : votre point de départ", "notes": "Séparateur de l'unité 0.3 (≈ 6 min). Transition automatique après 3 s ou clic sur « Suivant »."}, {"type": "objectives", "eyebrow": "Unité 0.3 · Mode d'emploi", "title": "Huit questions pour savoir où commencer", "intro_label": "Avant de commencer", "items": ["8 questions courtes, environ 5 minutes", "Non noté : aucun impact sur votre progression", "Chaque erreur vous indique l'unité à travailler en priorité"], "stats": [{"value": "8", "label": "questions"}, {"value": "6", "label": "thèmes : marché, DPE, prospection, Hoguet, techniques, IA"}], "footer": "Répondez sans chercher : le test mesure votre point de départ.", "notes": "Test diagnostique NON NOTÉ (poids 0). Les 8 réponses sont stockées dans des variables D1 à D8 (true/false) pour afficher l'orientation personnalisée (écran « Votre résultat »). Narration : « Ce test ne compte pas. Il sert à vous montrer ce que vous savez déjà, et où concentrer vos efforts. »"}, {"type": "qcm", "eyebrow": "Unité 0.3 · Question 1 sur 8 · Marché", "title": "Les prix de l'ancien en 2026", "question_label": "Diagnostic · non noté", "question": "Selon l'Insee, comment ont évolué les prix des logements anciens sur un an au 2e trimestre 2026 ?", "options": ["Forte baisse, plus de 10 %", "Quasi-stabilité : −0,8 %", "Hausse d'environ 5 %"], "answer": "B", "feedbacks": ["Non : la baisse est faible, −0,8 % sur un an (maisons −1,3 %). Parler d'effondrement inquiète le vendeur à tort. À travailler : unité 1.1.", "Exact : −0,8 % sur un an (maisons −1,3 %, appartements −0,1 %). Un marché stable, pas un effondrement. Approfondissement : unité 1.1.", "Non : les prix reculent légèrement, −0,8 % sur un an. Annoncer une hausse ferait fixer un prix trop haut. À travailler : unité 1.1."], "notes": "Diagnostic non noté. Variable D1 = (réponse B). Source : Insee, Informations rapides n° 216 du 8/09/2026 (indice des prix des logements anciens, T2 2026)."}, {"type": "sort", "eyebrow": "Unité 0.3 · Questions 2 à 4 sur 8", "title": "Vrai ou faux : DPE, prospection, mandat", "items": ["La classe DPE retenue est la moins bonne des deux : énergie primaire et émissions de gaz à effet de serre.", "Depuis le 11 août 2026, vérifier qu'un numéro n'est pas inscrit sur Bloctel suffit pour appeler un particulier.", "Un mandat exclusif peut être résilié après 3 mois, avec un préavis de 15 jours par lettre recommandée avec AR."], "categories": ["Vrai", "Faux"], "answers": [0, 1, 0], "whys": ["Vrai : c'est le double seuil. La classe affichée est la moins bonne des deux indicateurs. À travailler si erreur : unité 2.1.", "Faux : Bloctel est supprimé. Il faut l'accord préalable du particulier, nominatif à votre agence, et en garder la preuve. À travailler si erreur : unité 3.1.", "Vrai : loi Hoguet et décret n° 72-678. Le mandat exclusif est résiliable après 3 mois, préavis de 15 jours par LRAR. À travailler si erreur : unité 3.5."], "notes": "Diagnostic non noté. Glisser-déposer chaque affirmation vers « Vrai » ou « Faux ». Variables D2 (DPE), D3 (prospection), D4 (Hoguet). Sources : arrêté DPE (méthode 3CL, double seuil) ; loi n° 2025-594 et décret n° 2026-662 ; loi n° 70-9 du 2/01/1970 et décret n° 72-678."}, {"type": "qcm", "eyebrow": "Unité 0.3 · Question 5 sur 8 · Techniques", "title": "Les cinq techniques de prise de mandat", "question_label": "Diagnostic · non noté", "question": "Laquelle de ces pratiques ne fait PAS partie des cinq techniques de prise de mandat du module ?", "options": ["L'avis de valeur 360°", "La vérification du DPE", "La garantie d'un prix de vente à la signature", "L'exclusivité contre services"], "answer": "C", "feedbacks": ["L'avis de valeur 360° fait bien partie des cinq techniques : il fonde votre prix sur le bien, le marché et la performance énergétique. À découvrir : unité 4.3.", "La vérification du DPE est la technique 2 : c'est elle qui ouvre la conversation avec M. Bernard. À découvrir : unité 4.2.", "Exact : garantir un prix est une promesse, pas une technique. Les cinq : contact consenti, vérification du DPE, avis de valeur 360°, plan de vente, exclusivité contre services. Voir séquence 4.", "L'exclusivité contre services est la technique 5 : vous justifiez l'exclusivité par des engagements concrets. À découvrir : unité 4.5."], "notes": "Diagnostic non noté. Variable D5 = (réponse C). Les cinq techniques sont celles de la séquence 4 (4.1 à 4.5)."}, {"type": "sort", "eyebrow": "Unité 0.3 · Questions 6 à 8 sur 8", "title": "Vrai ou faux : réforme du DPE, SMS, IA", "items": ["Depuis le 1er janvier 2026, le coefficient de l'électricité dans le DPE est passé de 2,3 à 1,9.", "Envoyer un SMS de prospection à un particulier exige son accord préalable.", "Un texte produit par une IA peut être envoyé au vendeur sans relecture s'il cite une loi."], "categories": ["Vrai", "Faux"], "answers": [0, 0, 1], "whys": ["Vrai : arrêté du 13 août 2025. Il passera à 1,7 au 1er janvier 2027. Les biens chauffés à l'électricité sont les premiers concernés. À travailler si erreur : unité 2.3.", "Vrai : c'est déjà la règle pour les SMS et e-mails de prospection vers les particuliers (art. L. 34-5 du CPCE, CNIL), sauf exception étroite pour un client existant. À travailler si erreur : unité 3.3.", "Faux : une IA peut inventer une référence ou un chiffre. Vous vérifiez chaque source officielle avant tout envoi : vous en êtes responsable. À travailler si erreur : unité 5.2."], "notes": "Diagnostic non noté. Glisser-déposer. Variables D6 (DPE réforme), D7 (prospection SMS), D8 (IA). Sources : arrêtés du 13/08/2025 et du 19/08/2026 (NOR VLOL2617030A) ; art. L. 34-5 CPCE (CNIL)."}, {"type": "table", "eyebrow": "Unité 0.3 · Votre résultat", "title": "Chaque erreur vous oriente vers une unité", "intro": "Les lignes en orange correspondent à vos erreurs : commencez par ces unités.", "headers": ["Question", "Thème", "Unité à travailler"], "rows": [["Q1 · Prix de l'ancien en 2026", "Marché", "1.1 Volumes et prix"], ["Q2 · Double seuil du DPE", "DPE", "2.1 Fondamentaux du DPE"], ["Q3 · Fin de Bloctel", "Prospection", "3.1 Fin de Bloctel, place à l'accord préalable"], ["Q4 · Résiliation de l'exclusif", "Loi Hoguet", "3.5 Le mandat selon la loi Hoguet"], ["Q5 · Les cinq techniques", "Techniques", "Séquence 4 · Cinq techniques"], ["Q6 · Coefficient de l'électricité", "DPE", "2.3 Réforme du coefficient"], ["Q7 · SMS de prospection", "Prospection", "3.3 Canal par canal"], ["Q8 · Relecture de l'IA", "IA", "5.2 Vérifier ce que produit l'IA"]], "caption": "Test non noté : le parcours reste identique, seules les unités prioritaires sont signalées.", "notes": "Écran de restitution dynamique : pour chaque variable D1 à D8 = false, la ligne passe en surbrillance orange (état « erreur ») et un repère « Prioritaire » s'affiche dans le menu sur l'unité correspondante. Message si 8/8 : « Excellent point de départ : vous allez consolider et approfondir. » Aucun score enregistré dans le LMS."}, {"type": "divider", "kicker": "Unité 0.4", "title": "Votre parcours", "notes": "Séparateur de l'unité 0.4 (≈ 4 min). Transition automatique après 3 s ou clic sur « Suivant »."}, {"type": "table", "eyebrow": "Unité 0.4 · Vue d'ensemble", "title": "Huit séquences, environ 5 h 10 de formation", "headers": ["Séquence", "Durée", "Ce que vous y travaillez"], "rows": [["S0 · Immersion", "20 min", "Le vendeur de 2026, M. Bernard, test diagnostique"], ["S1 · Le marché 2026", "40 min", "Volumes, prix, financement, valeur verte : un chiffre, une phrase vendeur"], ["S2 · Le DPE", "50 min", "Fondamentaux, lecture d'étiquette, réforme du coefficient, cas concrets"], ["S3 · Prospection conforme", "45 min", "Accord préalable, canal par canal, RGPD, mandat Hoguet"], ["S4 · Cinq techniques", "60 min", "Les 5 techniques de prise de mandat et les objections"], ["S5 · L'IA de l'agent", "30 min", "Préparer un rendez-vous, vérifier, protéger les données"], ["S6 · Cas M. Bernard", "35 min", "Simulation complète en 9 étapes"], ["S7 · Évaluation et boîte à outils", "30 min", "Évaluation finale, plan d'action 7 jours"]], "caption": "Durée totale : 310 min. Durées indicatives, à votre rythme.", "notes": "Tableau statique, lignes révélées une à une (0,5 s). Narration : « Votre parcours compte huit séquences, d'une vingtaine de minutes à une heure. Vous pouvez faire une séquence par jour : le module tient en une semaine. »"}, {"type": "explain", "eyebrow": "Unité 0.4 · Règles du parcours", "title": "Comment vous progressez dans le module", "paras": ["Chaque séquence se termine par des activités notées. Avec 70 % de réussite, la séquence suivante se débloque.", "Les notions clés reviennent sous forme de rappels espacés, quelques jours après chaque séquence, pour ancrer ce que vous avez appris.", "Les fiches, modèles et simulateurs sont rangés dans votre boîte à outils. La validation du module vous donne un badge."], "cards": [{"value": "70 %", "label": "pour débloquer la séquence suivante"}, {"value": "Badge", "label": "à la validation du module"}, {"value": "J+2, J+7", "label": "rappe sentements (S3)", "Check-list des mentions obligatoires du mandat Hoguet (S3)", "Fiches des 5 techniques et réponses aux objections (S4)", "Prompts de préparation de rendez-vous et grille de vérification de l'IA (S5)", "Plan d'action 7 jours (S7)"], "pdf_label": "Télécharger le sommaire de la boîte à outils (PDF)", "sources": "Contenu définitif de la boîte à outils : séquence 7 [À VALIDER].", "notes": "Écran ressource. Le bouton PDF ouvre le sommaire de la boîte à outils (fichier à produire). Les éléments se déverrouillent dans la boîte à outils au fur et à mesure de la validation des séquences. [À VALIDER] : liste définitive des outils et formats."}, {"type": "recap", "eyebrow": "Unité 0.4 · Synthèse", "title": "Prêt à démarrer", "cards": [{"title": "Avancer", "text": "70 % de réussite à chaque séquence pour débloquer la suivante, jusqu'au badge du module."}, {"title": "Revenir", "text": "Les rappels espacés reprennent les notions clés quelques jours après chaque séquence."}, {"title": "Garder", "text": "Fiches, modèles et simulateurs restent dans votre boîte à outils après la formation."}], "banner_label": "Prochaine étape", "banner_text": "Séquence 1 · Le marché 2026 (40 min). Commencez par les unités signalées par le test.", "notes": "Synthèse de l'unité 0.4. Variable U04_vue = true. Le bouton « Suivant » mène au bilan de la séquence."}, {"type": "bilan", "title": "Séquence validée", "text": "Vous connaissez votre point de départ et votre parcours. Place au marché 2026 avec M. Bernard.", "notes": "Bilan de la séquence 0. Score de la séquence = QCM 0.1 (25 %) + document 0.2 (50 %) + QCM 0.4 (25 %) ; le diagnostic 0.3 et la question d'opinion 0.2 sont exclus du score. Seuil de 70 % → déblocage de la séquence 1. Envoi de la complétion au LMS (SCORM). Narration : « Bravo. Vous savez ce qui a changé pour le vendeur, et ce qui vous attend. Rendez-vous en séquence 1 pour lire le marché 2026. »", "badge": "Séquence 0|Immersion"}, {"type": "divider", "kicker": "Séquence 1", "title": "Comprendre le marché immobilier de 2026", "notes": "Écran d'ouverture de la séquence 1 (40 min). Déblocage : 70 % à la séquence 0. Bouton « Commencer » → capsule HeyGen d'introduction. Fil rouge : M. Bernard (personnage fictif). Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "video", "title": "Sébastien : « Un chiffre juste vaut mieux qu'un avis »", "label": "Emplacement de la capsule HeyGen (70 s) · avatar SEB", "notes": "Capsule HeyGen d'introduction, 70 s environ. Bouton « Suivant » débloqué à la fin de la vidéo.\nScript : « Bonjour, c'est Sébastien. Vous l'avez vu en séquence 0 : M. Bernard a reçu deux agences, et toutes les deux lui ont annoncé moins 15 %. Il n'a reçu aucune explication, seulement un chiffre qui fait peur. Dans cette séquence, on fait l'inverse. Vous allez apprendre à lire une statistique de l'Insee ou des notaires sans la déformer. Vous allez calculer une mensualité, parce qu'un acheteur ne raisonne pas en prix, il raisonne en mensualité. Vous allez comprendre ce que pensent les vendeurs en 2026 : ils sont mieux informés et plus méfiants. Vous verrez aussi ce que la performance énergétique change vraiment à la valeur, région par région. Et on terminera par un atelier : un chiffre, une phrase vendeur. Mon conseil : ne citez jamais un chiffre dont vous ne connaissez pas la source et la date. C'est ce qui fait la différence entre un agent qui récite et un agent qu'on écoute. On y va. »"}, {"type": "divider", "kicker": "Unité 1.1", "title": "Volumes et prix : lire une statistique", "notes": "Séparateur de l'unité 1.1 (8 min environ). Narration : « Unité 1.1. Volumes et prix : apprendre à lire une statistique sans la déformer. »"}, {"type": "persona", "eyebrow": "Unité 1.1 · Accroche", "title": "M. Bernard a lu que « les prix baissent »", "initials": "MB", "name": "M. Bernard (fictif)", "role": "Propriétaire d'une maison de 112 m²", "facts": ["Maison chauffée à l'électricité, DPE F de mars 2023", "Deux agences lui ont annoncé −15 % sur son prix", "Il a lu un titre de presse : « Les prix immobiliers baissent »", "Il a coché un formulaire pour être recontacté par votre agence"], "quote": "« Tout le monde me dit que les prix baissent. De combien, exactement ? Et chez moi ? »", "right_paras": ["M. Bernard ne demande pas une opinion. Il demande un chiffre, et ce que ce chiffre veut dire pour sa maison.", "Votre rôle : lire la statistique correctement, puis la ramener à son secteur."], "question": "Quels chiffres nationaux pouvez-vous lui citer, et quelle limite devez-vous lui donner ?", "notes": "Accroche. Personnage fictif (le préciser à l'écran via la mention « fictif »). Narration : « M. Bernard a lu que les prix baissent. Il veut savoir de combien, et surtout chez lui. Que pouvez-vous lui dire de vérifiable ? » Bouton « Suivant » actif après la narration."}, {"type": "objectives", "eyebrow": "Unité 1.1 · Objectifs", "title": "Ce que vous saurez faire à la fin de l'unité", "items": ["Distinguer un chiffre de volume (nombre de ventes) d'un chiffre de prix", "Lire un glissement annuel et le distinguer d'une variation trimestrielle", "Comparer maisons et appartements dans une même publication", "Passer du niveau national au niveau local avec DVF"], "intro_label": "Les deux chiffres de référence", "stats": [{"value": "958 000", "label": "ventes dans l'ancien sur 12 mois à fin juin 2026"}, {"value": "−0,8 %", "label": "prix des logements anciens sur un an (T2 2026)"}], "footer": "Source : Insee, Informations rapides n° 216 du 8/09/2026", "notes": "Objectifs opérationnels de l'unité 1.1. Narration : « À la fin de cette unité, vous saurez lire un chiffre de volume et un chiffre de prix, et les ramener au secteur de votre vendeur. » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie. Source : Insee, Informations rapides n° 216, 8 septembre 2026."}, {"type": "explain", "eyebrow": "Unité 1.1 · Explication", "title": "Volume et prix ne mesurent pas la même chose", "paras": ["Le volume compte les ventes conclues, cumulées sur 12 mois. Il dit si les acheteurs sont présents.", "Le prix mesure l'évolution de la valeur d'un même type de logement. Il dit si la valeur monte ou baisse.", "Un marché peut repartir en volume avec des prix stables, voire légèrement en baisse : c'est le cas en 2026."], "cards": [{"value": "958 000", "label": "ventes sur 12 mois à fin juin 2026 (Insee)"}, {"value": "949 000", "label": "ventes à fin mai 2026, +5,7 % sur un an (Notaires)"}, {"value": "−0,8 %", "label": "prix sur un an au T2 2026 (Insee)"}], "caption": "Sources : Insee, Informations rapides n° 216 (8/09/2026) ; Notaires de France, note de conjoncture n° 72 (juillet 2026).", "notes": "Explication. Les cartes apparaissent une à une (animation d'entrée, 0,5 s). Narration : « Deux familles de chiffres. Le volume : combien de ventes. Le prix : combien vaut un logement comparable. En 2026, les ventes remontent, autour de 950 000 sur un an, et les prix sont quasi stables. Les deux chiffres Insee et Notaires diffèrent un peu : ils ne s'arrêtent pas au même mois. » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "explain", "eyebrow": "Unité 1.1 · Explication", "title": "Glissement annuel, maisons et appartements", "paras": ["Le glissement annuel compare un trimestre au même trimestre de l'année précédente. −0,8 % au T2 2026 = prix du T2 2026 comparés au T2 2025.", "Ne le confondez pas avec la variation sur un trimestre (T2 2026 comparé au T1 2026), qui porte sur une période plus courte.", "Le chiffre global masque des écarts : en 2026, les maisons reculent plus que les appartements."], "table": {"headers": ["Prix sur un an (T2 2026)", "Variation"], "rows": [["Ensemble des logements anciens", "−0,8 %"], ["Maisons", "−1,3 %"], ["Appartements", "−0,1 %"]]}, "caption": "Source : Insee, Informations rapides n° 216 (8/09/2026), France.", "notes": "Explication. Le tableau s'affiche après le 2e paragraphe. Narration : « Le glissement annuel compare un trimestre au même trimestre un an plus tôt. Et regardez la ligne maisons : moins 1,3 %. Pour M. Bernard, propriétaire d'une maison, c'est ce chiffre-là qui compte au niveau national, pas le moins 0,8 %. » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "document", "eyebrow": "Unité 1.1 · Analyse", "title": "Que retenir de cette note de conjoncture ?", "doc_title": "Note de conjoncture (mise en page fictive, chiffres Insee)", "fields": [{"label": "Publication :", "value": "Insee, Informations rapides n° 216 du 8/09/2026", "useful": true, "feedback": "Utile : la source et la date se citent toujours. Sans elles, votre chiffre n'est qu'un avis."}, {"label": "Période :", "value": "2e trimestre 2026", "useful": true, "feedback": "Utile : un chiffre de prix sans période ne veut rien dire. Ici, T2 2026 comparé au T2 2025."}, {"label": "Prix, sur un an :", "value": "−0,8 %", "useful": true, "feedback": "Utile : c'est le glissement annuel des prix des logements anciens, en France."}, {"label": "Détail :", "value": "maisons −1,3 % ; appartements −0,1 %", "useful": true, "feedback": "Utile : M. Bernard a une maison. Le chiffre « maisons » est plus pertinent pour lui que le global."}, {"label": "Volume :", "value": "958 000 ventes sur 12 mois à fin juin 2026", "useful": true, "feedback": "Utile : il montre que les acheteurs sont présents. C'est un argument de volume, pas de prix."}, {"label": "Encadré presse :", "value": "« Les prix vont rebondir en 2027 »", "useful": false, "feedback": "À écarter : c'est une prévision de presse, pas une statistique. Vous ne promettez aucune évolution de prix."}, {"label": "Illustration :", "value": "photo de façades haussmanniennes", "useful": false, "feedback": "Sans intérêt pour l'analyse : une image ne renseigne ni le secteur, ni le type de bien."}], "instruction": "Cliquez sur les 5 informations que vous pouvez utiliser avec M. Bernard. Évitez les 2 pièges.", "side_note": "Document fictif dans sa présentation ; les chiffres sont ceux de l'Insee.", "counter": "0 / 5 informations utiles", "notes": "Activité notée (poids 1). Chaque zone est un bouton à état « sélectionné » ; un calque de feedback par zone. Compteur incrémenté par variable. Validation quand 5 utiles trouvées ; 2 erreurs max avant affichage de la correction. Narration : « Cette note mélange des chiffres officiels et des éléments sans valeur. Retrouvez les cinq informations utiles. » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "qcm", "eyebrow": "Unité 1.1 · Vérification", "title": "Interpréter un chiffre devant un vendeur", "question_label": "Question 1", "question": "M. Bernard conclut : « Les prix ont baissé de 0,8 %, donc ma maison vaut 0,8 % de moins qu'il y a un an. » Quelle réponse est juste ?", "options": ["Il a raison : le chiffre Insee s'applique à chaque logement.", "C'est une moyenne nationale, tous logements. Pour les maisons, c'est −1,3 %, et seul le marché de son secteur dira ce qu'il en est chez lui.", "Il faut lui répondre que les prix montent puisque les ventes augmentent."], "answer": "B", "feedbacks": ["Non : un indice national mesure une tendance moyenne. Il ne donne jamais la valeur d'un bien précis.", "Exact : vous corrigez le type de bien (maisons, −1,3 %) et vous ramenez la discussion au local, avec des ventes comparables.", "Non : la hausse des volumes ne dit rien des prix. Ce raisonnement confond les deux familles de chiffres."], "notes": "QCM noté (poids 1), une tentative, feedback par option sur calque. Narration : « M. Bernard tire une conclusion de la statistique. Que lui répondez-vous ? »"}, {"type": "explain", "eyebrow": "Unité 1.1 · Explication", "title": "Du national au local : la base DVF", "paras": ["DVF (Demandes de valeurs foncières) recense les ventes publiées par la DGFiP : date, prix, surface, type de bien, adresse.", "Consultation gratuite sur app.dvf.etalab.gouv.fr, sur environ cinq ans. Sélectionnez des ventes comparables : même type, surface proche, même secteur, période récente.", "Attention : l'Alsace, la Moselle et Mayotte ne sont pas couvertes. Utilisez alors les bases notariales ou le livre foncier."], "cards": [{"value": "National", "label": "tendance (Insee, Notaires)"}, {"value": "Local", "label": "ventes comparables (DVF)"}, {"value": "Bien", "label": "visite et analyse à 360°"}], "caption": "Sources : data.gouv.fr / DGFiP, jeu « Demandes de valeurs foncières » ; app.dvf.etalab.gouv.fr. Périmètre et fréquence de mise à jour à revérifier.", "notes": "Explication. Narration : « Le chiffre national donne le climat. Le chiffre local donne la météo de la rue. Pour M. Bernard, vous cherchez des maisons vendues récemment dans son secteur, de surface proche. C'est la base DVF. » Option Storyline : bouton vers app.dvf.etalab.gouv.fr (navigateur). [À VALIDER] délai de mise à jour de DVF (semestriel) avant session. Rappel : DVF ne donne ni l'état du bien ni le DPE ; c'est un point de départ, pas une estimation."}, {"type": "two_cols", "eyebrow": "Unité 1.1 · Limites", "title": "Dire / ne pas dire avec une statistique de prix", "left_title": "Vous pouvez dire", "left_items": ["« Au T2 2026, les prix des maisons anciennes ont reculé de 1,3 % sur un an en France, selon l'Insee. »", "« Les ventes sont reparties : environ 958 000 sur un an. Les acheteurs sont là. »", "« Regardons ensemble les ventes de maisons comparables dans votre secteur. »"], "right_title": "Vous ne dites pas", "right_items": ["« Les prix s'effondrent » ou « les prix vont remonter » : ni l'un ni l'autre n'est sourcé.", "« Votre maison a perdu 0,8 % » : une moyenne nationale n'est pas une valeur.", "Un chiffre sans source ni date, même s'il paraît plausible."], "footer_title": "À retenir", "footer_text": "Une tendance nationale ne fait pas un prix local. Source, date, type de bien, secteur : quatre réflexes avant de citer un chiffre.", "notes": "Écran de limites. Colonnes révélées l'une après l'autre. Narration : « Ce que vous pouvez dire, et ce que vous évitez : pas de prévision, pas de chiffre sans source. »"}, {"type": "recap", "eyebrow": "Unité 1.1 · Synthèse", "title": "Trois réflexes pour lire une statistique", "cards": [{"title": "Distinguer", "text": "Volume = nombre de ventes (958 000 sur 12 mois). Prix = évolution de la valeur (−0,8 % sur un an). Ils ne se déduisent pas l'un de l'autre."}, {"title": "Préciser", "text": "Glissement annuel, type de bien (maisons −1,3 %, appartements −0,1 %), source et date de publication."}, {"title": "Localiser", "text": "Le national donne la tendance. DVF et les ventes comparables donnent le marché du vendeur."}], "banner_label": "Pour M. Bernard", "banner_text": "Citez le chiffre « maisons » de l'Insee, puis proposez-lui de regarder les ventes comparables de son secteur.", "notes": "Synthèse de l'unité 1.1. Narration : « Distinguer, préciser, localiser. Trois réflexes avant de citer un chiffre. » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "divider", "kicker": "Unité 1.2", "title": "Financement et mensualité", "notes": "Séparateur de l'unité 1.2 (9 min environ). Narration : « Unité 1.2. L'acheteur ne paie pas un prix : il paie une mensualité. »"}, {"type": "objectives", "eyebrow": "Unité 1.2 · Objectifs", "title": "Ce que vous saurez faire à la fin de l'unité", "items": ["Situer le taux moyen du moment et le taux d'usure", "Expliquer les deux règles du HCSF : taux d'effort et durée", "Calculer une mensualité hors assurance avec la formule", "Présenter un bien en mensualité « travaux compris »"], "intro_label": "Les repères d'octobre 2026", "stats": [{"value": "≈ 3,5 %", "label": "taux moyen sur 20 ans (Meilleurtaux, 19/10/2026)"}, {"value": "5,40 %", "label": "taux d'usure, prêts de 20 ans et plus (T4 2026)"}], "footer": "Repères de marché, à actualiser avant chaque session", "notes": "Objectifs de l'unité 1.2. Narration : « Taux, usure, règles du HCSF, calcul de mensualité : à la fin de cette unité, vous saurez traduire un prix en effort mensuel. » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "explain", "eyebrow": "Unité 1.2 · Explication", "title": "Taux moyen et taux d'usure", "paras": ["Le taux moyen est un repère de marché : en octobre 2026, environ 3,50 à 3,55 % sur 20 ans. Le taux obtenu dépend du profil de l'acheteur.", "Le taux d'usure est un plafond légal, fixé chaque trimestre par la Banque de France. Il s'applique au TAEG, assurance et frais compris.", "Si le TAEG dépasse l'usure, la banque ne peut pas prêter : c'est un frein pour les profils à assurance chère."], "table": {"headers": ["Durée du prêt", "Taux d'usure (1/10 au 31/12/2026)"], "rows": [["Moins de 10 ans", "4,09 %"], ["10 à 20 ans", "4,68 %"], ["20 ans et plus", "5,40 %"]]}, "caption": "Sources : Meilleurtaux (19/10/2026) ; Banque de France, taux d'usure applicables au 4e trimestre 2026.", "notes": "Explication. Narration : « Deux taux à ne pas confondre. Le taux moyen, c'est le marché. Le taux d'usure, c'est la limite légale, assurance comprise. » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "explain", "eyebrow": "Unité 1.2 · Explication", "title": "Les règles du HCSF : 35 % et 25 ans", "paras": ["Taux d'effort : les charges de crédit, assurance comprise, ne dépassent pas 35 % des revenus nets de l'emprunteur.", "Durée : 25 ans maximum. Jusqu'à 27 ans avec un différé d'amortissement de 2 ans quand l'entrée dans le logement est décalée (neuf, construction, ancien avec travaux d'au moins 10 % du coût total).", "Les banques peuvent déroger pour 20 % de leur production trimestrielle : au moins 70 % de cette marge va à la résidence principale, dont 30 % aux primo-accédants."], "cards": [{"value": "35 %", "label": "taux d'effort max, assurance comprise"}, {"value": "25 ans", "label": "durée maximale"}, {"value": "27 ans", "label": "avec différé (neuf, travaux)"}, {"value": "20 %", "label": "marge de dérogation des banques"}], "caption": "Sources : HCSF, décision D-HCSF-2021-7 modifiée (D-HCSF-2023-2) ; normes maintenues le 15/09/2026. Seuil travaux 10 % [À VALIDER].", "notes": "Explication. Narration : « Deux règles encadrent le crédit immobilier : 35 % de taux d'effort assurance comprise, et 25 ans maximum, 27 ans avec un différé dans le neuf ou en cas de travaux. Ce sont des normes bancaires : elles s'imposent aux banques, pas à vous, mais elles conditionnent vos acheteurs. » Sources : economie.gouv.fr/hcsf/mesures/mesure-relative-loctroi-de-credits-immobiliers ; Magnolia.fr, 28/09/2026 (maintien des normes le 15/09/2026). [À VALIDER] seuil de travaux de 10 % du coût total ouvrant le différé dans l'ancien (abaissé de 25 % à 10 % fin 2023 ; source secondaire : cafpi.fr/credit-immobilier/simulateur/hcsf ; numéro de décision à confirmer) ; répartition de la marge de flexibilité (70 % résidence principale, dont 30 % primo-accédants) : vérifier sur le site du HCSF avant diffusion. Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "explain", "eyebrow": "Unité 1.2 · Démonstration", "title": "Calculer une mensualité hors assurance", "paras": ["C = capital emprunté ; t = taux annuel / 12 ; n = nombre de mensualités (années × 12).", "Exemple : 220 000 € sur 20 ans à 3,5 %. t = 0,035 / 12 ≈ 0,002917 ; n = 240. Mensualité ≈ 1 275,91 €, soit environ 1 276 €.", "Revenus nets nécessaires pour 35 % : 1 276 / 0,35 ≈ 3 646 €, avant assurance. Avec l'assurance, il en faut un peu plus."], "formula": "M = C × t / (1 − (1 + t)^−n)", "cards": [{"value": "1 276 €", "label": "mensualité hors assurance"}, {"value": "240", "label": "mensualités"}, {"value": "≈ 86 200 €", "label": "intérêts sur 20 ans"}], "caption": "Exemple fictif, calcul vérifié. Hors assurance, frais de notaire et frais de garantie.", "notes": "Démonstration. Les étapes du calcul apparaissent une à une. Narration : « La formule paraît technique, mais elle se fait en trente secondes avec un tableur ou une calculatrice. 220 000 euros, 20 ans, 3,5 % : environ 1 276 euros par mois, hors assurance. » Valeurs recalculées : 1 275,91 €/mois ; coût des intérêts 86 218,73 €. Exemple fictif."}, {"type": "case_form", "eyebrow": "Unité 1.2 · Exercice", "title": "Calculez la mensualité d'un acheteur", "case_title": "Mme Leroy (fictive), acheteuse", "case_paras": ["Mme Leroy veut emprunter 200 000 € sur 20 ans, au taux de 3,5 % hors assurance.", "Ses revenus nets sont de 3 400 € par mois. Elle n'a pas d'autre crédit.", "Utilisez la formule M = C × t / (1 − (1 + t)^−n)."], "inputs": ["Mensualité hors assurance (€, arrondie à l'euro)", "Taux d'effort hors assurance (%, arrondi à l'unité)"], "answer": "Mensualité ≈ 1 160 € (1 159,92 €). Taux d'effort ≈ 34 % hors assurance (1 160 / 3 400) : avec l'assurance, Mme Leroy risque de dépasser 35 %.", "feedbacks": ["Juste si vous trouvez 1 159 à 1 161 € : t = 0,035 / 12, n = 240.", "Si vous trouvez environ 833 € : vous avez divisé le capital par 240 sans intérêts. Environ 583 € : c'est seulement l'intérêt du 1er mois (C × t). La formule combine les deux.", "Si vous trouvez un taux d'effort de 34 % : juste. Mais l'assurance s'ajoute ; à 35 % assurance comprise, la marge est quasi nulle.", "Conclusion métier : orientez Mme Leroy vers un courtier ou sa banque. Vous ne faites pas l'étude de financement à leur place."], "button": "Vérifier", "notes": "Exercice noté (poids 2). Champs numériques (variables Storyline M1_mens, M1_effort). Tolérance : mensualité 1 155 à 1 165 ; taux d'effort 33 à 35. Correct si les deux champs sont dans la tolérance ; 2 essais, puis correction. Valeurs recalculées en Python : 1 159,92 €/mois ; 1 159,92 / 3 400 = 34,1 %. Exemple fictif."}, {"type": "qcm", "eyebrow": "Unité 1.2 · Vérification", "title": "Les règles du HCSF", "question_label": "Question 2", "question": "Un acheteur gagne 4 000 € nets par mois. Selon le HCSF, quelle charge de crédit maximale est en principe acceptable ?", "options": ["1 400 € par mois, assurance emprunteur comprise", "1 400 € par mois, hors assurance emprunteur", "1 600 € par mois, si la durée ne dépasse pas 25 ans"], "answer": "A", "feedbacks": ["Exact : 35 % de 4 000 € = 1 400 €, et l'assurance est comprise dans ce plafond.", "Non : l'assurance emprunteur entre dans le taux d'effort. Hors assurance, l'acheteur dépasserait 35 %.", "Non : 1 600 € correspond à 40 %. La durée et le taux d'effort sont deux règles distinctes ; respecter l'une ne permet pas de dépasser l'autre."], "notes": "QCM noté (poids 1), une tentative. Narration : « Un acheteur gagne 4 000 euros nets. Quelle mensualité maximale ? » Rappel : la banque peut déroger dans sa marge de 20 % ; ce n'est pas un droit de l'emprunteur."}, {"type": "steps_key", "eyebrow": "Unité 1.2 · Méthode", "title": "Présenter un bien en mensualité « travaux compris »", "principle": "Un acheteur compare des mensualités. Un bien à rénover se présente avec le coût des travaux intégré, chiffré et sourcé.", "steps": ["Partez d'un chiffrage de travaux sourcé (audit énergétique, devis) : pas d'estimation au doigt mouillé.", "Additionnez prix et travaux, puis calculez la mensualité à taux et durée indiqués (exemple : 220 000 + 35 000 € → ≈ 1 479 €/mois sur 20 ans à 3,5 %).", "Montrez l'écart avec le bien seul (≈ 1 276 €) : environ +203 €/mois pour un logement rénové.", "Précisez : simulation hors assurance, hors frais et hors apport, non contractuelle ; orientez vers un courtier."], "key_phrase": "« Travaux d'isolation compris, cette maison revient à environ 1 480 € par mois sur 20 ans, hors assurance. Indicatif. »", "steps_label": "Méthode en 4 étapes", "stage_label": "Étape du parcours", "stage_value": "Arbitrer travaux ou vente en l'état", "notes": "Méthode. Narration : « Pour la maison de M. Bernard, l'acheteur verra un DPE F. Si vous lui montrez la mensualité travaux compris, il voit un projet, plus un problème. » Exemple fictif : 255 000 € sur 20 ans à 3,5 % = 1 478,90 €/mois (recalculé) ; écart avec 220 000 € = 202,99 €/mois. Conformité : l'agent n'est pas intermédiaire en crédit (statut IOBSP) ; la simulation reste indicative et l'acheteur est orienté vers un professionnel du crédit. Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "two_cols", "eyebrow": "Unité 1.2 · Limites", "title": "Ce que vous faites, ce que vous laissez au courtier", "left_title": "Vous pouvez", "left_items": ["Donner un ordre de grandeur de mensualité, en précisant taux, durée et « hors assurance ».", "Rappeler les règles du HCSF (35 %, 25 ans) pour qualifier un acheteur.", "Orienter l'acheteur vers un courtier ou sa banque avant l'offre."], "right_title": "Vous ne faites pas", "right_items": ["Promettre un taux ou un accord de prêt.", "Présenter une simulation comme une offre de crédit.", "Intermédier un crédit sans le statut d'IOBSP (inscription Orias)."], "footer_title": "À retenir", "footer_text": "La mensualité est un outil de vente et de qualification, pas une offre de financement.", "notes": "Écran de limites et de conformité. Narration : « Vous parlez mensualité pour vendre et qualifier. Le financement lui-même reste l'affaire du banquier ou du courtier. » Statut IOBSP et Orias : vérifier la formulation avec le référent conformité."}, {"type": "recap", "eyebrow": "Unité 1.2 · Synthèse", "title": "Le financement en trois repères", "cards": [{"title": "Les taux", "text": "Taux moyen ≈ 3,5 % sur 20 ans (octobre 2026). Usure 5,40 % au-delà de 20 ans, sur le TAEG assurance comprise."}, {"title": "Le HCSF", "text": "35 % de taux d'effort assurance comprise ; 25 ans, 27 ans avec différé ; 20 % de dérogations possibles."}, {"title": "La mensualité", "text": "220 000 € sur 20 ans à 3,5 % ≈ 1 276 €/mois hors assurance. Un bien à rénover se présente travaux compris."}], "banner_label": "Pour M. Bernard", "banner_text": "Préparez une mensualité « travaux compris » de sa maison pour l'avis de valeur, sur la base d'un chiffrage sourcé.", "notes": "Synthèse de l'unité 1.2. Narration : « Les taux, les règles du HCSF, la mensualité : trois repères pour parler le langage des acheteurs. » Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "divider", "kicker": "Unité 1.3", "title": "Ce que pensent les vendeurs en 2026", "notes": "Séparateur de l'unité 1.3 (8 min environ). Narration : « Unité 1.3. Avant de convaincre un vendeur, comprenez ce qu'il pense. »"}, {"type": "objectives", "eyebrow": "Unité 1.3 · Objectifs", "title": "Ce que vous saurez faire à la fin de l'unité", "items": ["Décrire les attentes des vendeurs de 2026 : information, méfiance, attachement au prix", "Citer les données d'enquête avec leurs limites (déclaratif)", "Associer cinq objections types à la bonne famille de réponse", "Mener un premier échange avec un vendeur méfiant"], "intro_label": "Enquête leboncoin Immo (déclaratif)", "stats": [{"value": "51 %", "label": "des vendeurs pensent que la concurrence entre agences aide à vendre"}, {"value": "62 %", "label": "veulent pouvoir vendre eux-mêmes"}], "footer": "Enquête leboncoin Immo, 419 professionnels, sept.-oct. 2025", "notes": "Objectifs de l'unité 1.3. Narration : « Les vendeurs de 2026 sont mieux informés et plus méfiants. Voyons comment leur répondre. » Les pourcentages sont rapportés par des professionnels interrogés : données déclaratives, à présenter comme telles. Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "explain", "eyebrow": "Unité 1.3 · Explication", "title": "Trois traits du vendeur de 2026", "paras": ["Mieux informé : il a consulté des estimateurs en ligne, des articles, parfois DVF. Il arrive avec un chiffre en tête.", "Méfiant envers la prospection : appels répétés, promesses de prix. Depuis le 11 août 2026, l'appel sans accord préalable est d'ailleurs interdit.", "Attaché à son prix et à sa liberté : il veut garder la main, comparer les agences, pouvoir vendre seul."], "cards": [{"value": "51 %", "label": "croient à la mise en concurrence des agences"}, {"value": "62 %", "label": "veulent garder la possibilité de vendre seuls"}, {"value": "91 j / 142 j", "label": "délai de vente déclaré : exclusif / simple"}], "caption": "Source : enquête leboncoin Immo auprès de 419 professionnels (sept.-oct. 2025), données déclaratives. Loi n° 2025-594 du 30/06/2025.", "notes": "Explication. Narration : « Votre vendeur a déjà un chiffre en tête, il se méfie des appels, et il veut garder sa liberté. Ce n'est pas un obstacle : c'est le point de départ de votre discours. » Préciser que 91 j / 142 j sont des délais déclarés par les professionnels, pas une mesure. Ne pas utiliser « 9 ventes sur 10 négociées » (non sourcé). Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "video", "title": "Sébastien : « La méfiance se gagne par la preuve »", "label": "Emplacement de la capsule HeyGen (50 s) · avatar SEB", "notes": "Capsule HeyGen conseil terrain, 50 s environ. Script : « Un vendeur qui se méfie n'a pas tort. On l'a appelé dix fois, on lui a promis des prix qu'aucune agence n'a tenus. Alors ne cherchez pas à le convaincre avec des mots. Apportez des preuves. Un chiffre avec sa source. Trois ventes comparables de sa rue. Un plan de vente écrit, avec ce que vous ferez chaque semaine. Et rappelez-vous d'où vient le contact : s'il vous a donné son accord, dites-le d'emblée. Avec M. Bernard, c'est simple : il a coché un formulaire pour être recontacté au sujet de son DPE et de son estimation. Commencez par ça. Il saura que vous n'êtes pas un appel de plus. »"}, {"type": "sort", "eyebrow": "Unité 1.3 · Classement", "title": "À chaque objection, sa famille de réponse", "items": ["« Une autre agence m'annonce un prix plus élevé. »", "« Les prix baissent, je préfère attendre. »", "« Je ne signe pas d'exclusivité, je veux plusieurs agences. »", "« Comment avez-vous eu mon numéro ? »", "« Je peux très bien vendre seul sur internet. »", "« Mon DPE F, ce n'est pas grave : l'acheteur fera les travaux. »"], "categories": ["Donnée vérifiable", "Preuve de service", "Cadre légal"], "answers": [0, 0, 1, 2, 1, 2], "whys": ["Donnée : montrez les ventes comparables (DVF) de son secteur. Un prix annoncé n'est pas un prix vendu.", "Donnée : −1,3 % sur un an pour les maisons (Insee, T2 2026), et un marché local à regarder. Attendre a aussi un coût.", "Service : présentez un plan de vente écrit et ce que l'exclusivité apporte en échange, avec le délai déclaré (91 j contre 142 j, enquête leboncoin Immo).", "Cadre légal : vous indiquez l'origine du contact et l'accord qu'il a donné. Sans accord préalable, vous n'appelez pas.", "Service : diffusion, qualification financière des acheteurs, visites, négociation, suivi jusqu'à l'acte. Montrez ce que vous faites qu'il ne fera pas.", "Cadre légal : pour une maison classée F, l'audit énergétique est obligatoire à la vente et l'acheteur intégrera les travaux à son prix."], "notes": "Activité notée (poids 1). Glisser-déposer : 6 étiquettes vers 3 zones. Validation globale, feedback par étiquette (calque). 70 % pour réussir. Narration : « Six objections que vous entendrez cette semaine. Classez chacune selon la réponse qu'elle appelle. » Les objections 1 à 6 sont détaillées dans la ressource de l'unité 4.6."}, {"type": "table", "eyebrow": "Unité 1.3 · Ressource", "title": "Cinq objections types et une réponse vérifiable", "headers": ["Objection", "Réponse proposée", "Appui"], "rows": [["« Une autre agence annonce plus cher. »", "« Regardons les maisons vendues près de chez vous ces derniers mois : ce sont des prix signés. »", "DVF"], ["« Les prix baissent, j'attends. »", "« Pour les maisons, −1,3 % sur un an en France. Chez vous, regardons les ventes récentes. »", "Insee, T2 2026"], ["« Pas d'exclusivité. »", "« Voici mon plan de vente semaine par semaine. Résiliable après 3 mois, avec 15 jours de préavis. »", "Hoguet ; plan de vente"], ["« Comment avez-vous eu mon numéro ? »", "« Vous avez accepté d'être recontacté au sujet de votre DPE. Vous pouvez retirer cet accord à tout moment. »", "Code de la consommation"], ["« Je vends seul. »", "« C'est possible. Je vous montre ce qu'un accompagnement change : acheteurs qualifiés, dossier, négociation. »", "Plan de vente"]], "caption": "Réponses proposées à titre pédagogique, à adapter. Chiffres à revalider avant chaque session.", "notes": "Tableau ressource. Narration : « Cinq objections, cinq réponses appuyées sur une donnée, un service ou la loi. » Sources : Insee n° 216 ; loi Hoguet n° 70-9 et décret n° 72-678 (mandat exclusif résiliable après 3 mois, préavis 15 jours par LRAR) ; art. R. 223-3 C. conso (retrait du consentement à tout moment). Chiffres à revalider avant chaque session (Insee, Notaires, Banque de France, Meilleurtaux) : mettre à jour l'écran et la narration si une nouvelle publication est sortie."}, {"type": "dialogue", "eyebrow": "Unité 1.3 · Simulation", "title": "Premier appel à M. Bernard", "persona_name": "M. Bernard (fictif)", "opening": "« Allô ? Encore une agence... Deux de vos confrères m'ont déjà dit que ma maison valait 15 % de moins. Qu'est-ce que vous voulez ? »", "options": ["« Bonjour M. Bernard, vous avez accepté d'être recontacté par notre agence au sujet de votre DPE et de l'estimation. Je vous appelle pour ça. Vous avez deux minutes ? »", "« Bonjour, je vous appelle parce que les prix baissent beaucoup en ce moment : il faut vendre vite. »", "« Ne les écoutez pas : chez nous, on peut vendre votre maison bien plus cher. »"], "tree": "NŒUD 1 (ouverture)\nA → +25 confiance. M. Bernard : « Ah oui, le formulaire. D'accord. Mais −15 %, c'est vrai ou pas ? » → NŒUD 2.\nB → −20 confiance. M. Bernard : « Vous aussi ? Je n'ai pas le temps. » → FIN ÉCHEC (il raccroche). Feedback : vous n'avez pas dit d'où venait le contact et vous avez repris un discours anxiogène sans source.\nC → −15 confiance. M. Bernard : « Tout le monde dit ça. Sur quoi vous vous basez ? » → NŒUD 2 avec confiance réduite. Feedback : promesse de prix sans visite ni donnée, contraire à l'approche Éco-Consultant.\n\nNŒUD 2 (le −15 %)\nA2 « Je ne peux pas vous donner un chiffre sans voir la maison. En France, les prix des maisons anciennes ont reculé de 1,3 % sur un an selon l'Insee. Chez vous, je regarderai les ventes comparables et votre DPE. » → +25. M. Bernard : « Et mon DPE F, ça joue ? » → NŒUD 3.\nB2 « −15 %, c'est à cause de votre DPE, c'est la règle. » → −20. Feedback : aucune décote nationale unique n'existe ; elle varie selon la région et l'année. → NŒUD 3 avec confiance réduite.\n\nNŒUD 3 (DPE)\nA3 « Il peut jouer, selon votre secteur. Votre DPE date de mars 2023 : on vérifiera d'abord s'il a évolué avec le nouveau calcul de 2026. Je vous propose un rendez-vous pour faire le point, mardi ou jeudi ? » → +25. FIN : rendez-vous obtenu ; verdict selon la jauge (réussite seulement si ≥ 60 points).\nB3 « Il faut faire les travaux avant de vendre. » → −15. Feedback : vous tranchez sans audit ni chiffrage. FIN PARTIELLE : M. Bernard « va réfléchir ».\n\nVERDICTS : ≥ 60 points = réussite (rendez-vous) ; 20 à 59 = partiel ; < 20 = échec. Jauge de confiance affichée en continu.", "notes": "Simulation ramifiée notée (poids 2). Variable de confiance M1_confiance (départ 10, plafond 85) ; jauge animée. Chaque réplique de M. Bernard sur un calque avec voix ElevenLabs (voix masculine, 60 ans, ton fatigué puis plus ouvert). Réussite = rendez-vous obtenu. Rejouable une fois. Conformité : appel possible car M. Bernard a donné un accord préalable nominatif ; l'agent rappelle l'origine du contact.", "graph": {"start": "n1", "initial": 10, "nodes": {"n1": {"him": "« Allô ? Encore une agence... Deux de vos confrères m'ont déjà dit que ma maison valait 15 % de moins. Qu'est-ce que vous voulez ? »", "opts": [{"text": "« Bonjour M. Bernard, vous avez accepté d'être recontacté par notre agence au sujet de votre DPE et de l'estimation. Je vous appelle pour ça. Vous avez deux minutes ? »", "delta": 25, "next": "n2", "why": "Vous rappelez d'où vient le contact (son accord préalable) et demandez la permission de poursuivre."}, {"text": "« Bonjour, je vous appelle parce que les prix baissent beaucoup en ce moment : il faut vendre vite. »", "delta": -20, "next": "end", "why": "Vous n'avez pas dit d'où venait le contact et vous avez repris un discours anxiogène sans source.", "end_him": "« Vous aussi ? Je n'ai pas le temps. »", "force_verdict": "bad"}, {"text": "« Ne les écoutez pas : chez nous, on peut vendre votre maison bien plus cher. »", "delta": -15, "next": "n2c", "why": "Promesse de prix sans visite ni donnée, contraire à l'approche Éco-Consultant."
