<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Éco-Consultant · Module 1</title>
<style>
@font-face{font-family:"Lato";src:url(fonts/lato-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Lato";src:url(fonts/lato-400i.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Lato";src:url(fonts/lato-700.woff2) format("woff2");font-weight:700 900;font-style:normal;font-display:swap}
:root{
  --brand:#FF8D16; --brand-d:#E06F00; --brand-ink:#1A1A1A; --cream:#FFF1E0;
  --ink:#1A1A1A; --muted:#5B5B5B; --line:#E7E2DA; --paper:#FFFFFF; --sunk:#F7F4EF; --page:#2B2B2B;
  --ok:#1F8A4C; --ok-s:#E3F4EA; --ko:#C62828; --ko-s:#FCE6E4; --info:#2F6FA3; --info-s:#E6F0F8;
  --mod:#E2231A; --mod-s:#FDE4E1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:"Lato","Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:3px solid #1A73E8;outline-offset:2px}
.frame{position:relative;background:var(--paper);container-type:inline-size;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;
  width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16))}
@media (max-aspect-ratio:4/3),(max-width:820px){.frame{width:100vw;height:100vh;height:100dvh}}
.band{position:absolute;left:0;top:0;bottom:0;width:clamp(8px,1.1cqw,14px);background:var(--mod)}
.top{display:flex;align-items:center;gap:1.4cqw;padding:clamp(8px,1.1cqw,16px) clamp(14px,2.4cqw,34px) clamp(4px,.6cqw,8px) clamp(22px,3.4cqw,46px);min-width:0}
.crumb{flex:1;min-width:0;font-size:clamp(11px,1cqw,14px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink)}
.prog{flex:0 1 22cqw;height:6px;border-radius:99px;background:var(--line);overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.logo{height:clamp(16px,2cqw,26px);width:auto}
.menu{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:.35em .9em;font-size:clamp(11px,1cqw,14px);font-weight:700;white-space:nowrap}
.menu:hover{background:var(--sunk)}
main{overflow:auto;padding:clamp(6px,1cqw,14px) clamp(16px,3.4cqw,48px) clamp(8px,1cqw,14px) clamp(24px,4.6cqw,64px);font-size:clamp(14px,1.45cqw,19px);line-height:1.45;-webkit-overflow-scrolling:touch}
main:focus,main:focus-visible,main[tabindex]:focus-visible{outline:none}
.nav{display:flex;align-items:center;gap:10px;padding:clamp(8px,1cqw,14px) clamp(14px,2.4cqw,34px) clamp(10px,1.3cqw,18px) clamp(22px,3.4cqw,46px)}
.count{flex:1;font-size:clamp(11px,1cqw,14px);color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:999px;padding:.6em 1.3em;font-weight:700;font-size:clamp(13px,1.2cqw,16px);display:inline-flex;align-items:center;gap:.5em;min-height:40px}
.btn.prim{background:linear-gradient(90deg,var(--brand-d),var(--brand));color:#fff}
.btn.prim:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn[disabled]{opacity:.38;cursor:not-allowed;filter:grayscale(.4)}
.hint{font-size:clamp(11px,1cqw,13px);color:var(--muted);margin-right:6px;text-align:right}
/* Title tab — masque V2 */
.tab{display:inline-block;background:var(--mod-s);border-left:6px solid var(--mod);padding:.35em .9em .4em;border-radius:0 8px 8px 0;margin:0 0 .9em;font-weight:900;font-size:1.32em;line-height:1.2;max-width:100%}
.kick{font-size:.72em;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--mod);margin-bottom:.35em}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0 0 .6em}
.lead{color:var(--muted)}
.grid{display:grid;gap:.9em}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@container (max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}.cover .art{display:none}.cover h1{font-size:1.6em}.hubgrid{grid-template-columns:1fr!important}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:.9em 1em;min-width:0}
.card.s{background:var(--sunk);border-color:transparent}
.card h3{font-size:1em;margin-bottom:.3em}
.lab{display:block;font-size:.72em;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--mod);margin-bottom:.25em}
.callout{border-radius:10px;padding:.7em .9em;margin-top:.9em;font-size:.92em;display:flex;gap:.6em}
.callout.info{background:var(--info-s);color:#173A57}.callout.warning{background:#FFF3D6;color:#5A3D00}.callout.source{background:var(--sunk);color:var(--muted);font-size:.8em}
.callout b{white-space:nowrap}
.withseb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.2em;align-items:end}
.seb{width:clamp(70px,11cqw,150px);height:auto;border-radius:50%;background:var(--cream)}
@container (max-width:760px){.withseb{grid-template-columns:1fr}.withseb .seb{display:none}}
/* Covers */
.cover{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:2em;align-items:center;min-height:100%}
.cover h1{font-size:2.2em;font-weight:900;margin:.15em 0 .45em}
.cover .art img{width:100%;max-width:420px;display:block;margin:auto}
.chips{display:flex;flex-wrap:wrap;gap:.45em;margin:.8em 0 1.2em}
.chip{background:var(--sunk);border-radius:999px;padding:.25em .8em;font-size:.82em;font-weight:700}
.chip.m{background:var(--mod-s);color:var(--ink)}
.obj{background:var(--cream);border-radius:12px;padding:.8em 1em;margin:.4em 0 .2em}
.obj b{display:block;font-size:.75em;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-d);margin-bottom:.2em}
/* Hub */
.hubgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:1.6em;align-items:start}
.seqlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45em}
.seqbtn{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.8em;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:.55em .9em}
.seqbtn:hover:not([disabled]){border-color:var(--brand);background:#FFFBF5}
.seqbtn[disabled]{opacity:.55;cursor:not-allowed}
.seqbtn .n{display:grid;place-items:center;min-width:2.6em;height:2.1em;border-radius:7px;background:var(--mod);color:#fff;font-weight:900;font-size:.85em;clip-path:polygon(0 0,82% 0,100% 50%,82% 100%,0 100%)}
.seqbtn .t{font-weight:700;line-height:1.25}
.seqbtn small{display:block;font-weight:400;color:var(--muted);font-size:.8em}
.st{font-size:.78em;font-weight:700;border-radius:999px;padding:.2em .7em;white-space:nowrap}
.st.done{background:var(--ok-s);color:var(--ok)}.st.open{background:var(--cream);color:var(--brand-d)}.st.lock{background:var(--sunk);color:var(--muted)}
.seqbtn.ev .n{background:#5b45c9}
.side .card{margin-bottom:.8em}
.big{font-size:2em;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
/* Attend */
.attend .card{border-top:5px solid var(--brand)}
.attend .card b{display:block;margin-bottom:.3em}
/* Poll */
.opts{display:flex;flex-direction:column;gap:.5em;margin:.6em 0}
.opt{display:flex;gap:.7em;align-items:flex-start;text-align:left;width:100%;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:.6em .9em;line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt .dot{flex:0 0 auto;width:1.15em;height:1.15em;border-radius:50%;border:2px solid #9a9a9a;margin-top:.12em;display:grid;place-items:center}
.opt[aria-checked=true]{border-color:var(--brand);background:#FFF8EE}
.opt[aria-checked=true] .dot{border-color:var(--brand)}
.opt[aria-checked=true] .dot::after{content:"";width:.55em;height:.55em;border-radius:50%;background:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--ok-s)}.opt.ko{border-color:var(--ko);background:var(--ko-s)}
.opt[disabled]{cursor:default}
.why{display:block;font-size:.84em;color:var(--muted);margin-top:.25em}
.opt.ok .why{color:#14552F}.opt.ko .why{color:#7A1A14}
.row{display:flex;gap:.6em;flex-wrap:wrap;align-items:center;margin-top:.6em}
.pill{display:inline-flex;gap:.5em;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.45em 1.1em;font-weight:700}
.pill[aria-pressed=true]{border-color:var(--brand);background:#FFF8EE}
.reveal{margin-top:.9em;background:var(--cream);border-radius:12px;padding:.9em 1em;border-left:6px solid var(--brand)}
.reveal b{display:block;margin-bottom:.25em}
/* Fiche triptyque */
.fiche .col{border-radius:12px;padding:.9em 1em;min-width:0}
.fiche .c1{background:var(--sunk)}.fiche .c2{background:var(--info-s)}.fiche .c3{background:var(--cream)}
.fiche h3{font-size:.8em;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.45em}
.fiche dl{margin:0;display:flex;flex-direction:column;gap:.5em}
.fiche dt{font-weight:900;font-size:.88em}.fiche dd{margin:0}
/* Steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:.6em}
.steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.8em;align-items:start}
.steps .k{display:grid;place-items:center;width:2em;height:2em;border-radius:50%;background:var(--brand);color:#fff;font-weight:900}
/* Compare */
.cmp .card ul{margin:.3em 0 0;padding-left:1.1em}.cmp li{margin-bottom:.35em}
.cmp .l{border-top:5px solid var(--ko)}.cmp .r{border-top:5px solid var(--ok)}
.cmp.neutral .l,.cmp.neutral .r{border-top-color:var(--mod)}
/* Stats */
.stat .v{font-size:1.9em;font-weight:900;color:var(--brand-d);line-height:1.1;font-variant-numeric:tabular-nums}
/* Video */
.video{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:1.2em;align-items:start}
@container (max-width:760px){.video{grid-template-columns:1fr}}
.poster{position:relative;aspect-ratio:16/9;border-radius:14px;background:linear-gradient(135deg,#2a2a2a,#4a3a2a);display:grid;place-items:center;overflow:hidden;color:#fff}
.poster img{position:absolute;left:6%;bottom:0;height:78%;border-radius:50% 50% 0 0}
.poster .play{position:relative;width:4.2em;height:4.2em;border-radius:50%;background:var(--brand);display:grid;place-items:center;border:0}
.poster .play::after{content:"";border-left:1.2em solid #fff;border-top:.75em solid transparent;border-bottom:.75em solid transparent;margin-left:.3em}
.poster .tag{position:absolute;right:.8em;top:.8em;background:rgba(0,0,0,.55);border-radius:6px;padding:.2em .6em;font-size:.75em}
.poster video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.script{background:var(--sunk);border-radius:12px;padding:.8em 1em;font-size:.9em;max-height:22em;overflow:auto;white-space:pre-line}
/* Quiz break */
.qb{min-height:100%;display:grid;place-items:center;text-align:center;background:var(--mod);color:#fff;border-radius:16px;padding:2em}
.qb .burst{font-size:4.2em;font-weight:900;letter-spacing:.02em;color:#FFE14D;text-shadow:3px 3px 0 #1A1A1A;transform:rotate(-4deg);display:inline-block;padding:.1em .4em;border:4px solid #1A1A1A;border-radius:18px;background:#FF8D16}
.qb p{font-size:1.35em;font-weight:700;margin-top:.8em}
/* Feedback */
.fb{margin-top:.8em;border-radius:12px;padding:.8em 1em;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.7em;align-items:start}
.fb.ok{background:var(--ok-s)}.fb.ko{background:var(--ko-s)}
.fb .ic{width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}
.fb.ok .ic{background:var(--ok)}.fb.ko .ic{background:var(--ko)}
.fb b{display:block;margin-bottom:.2em}
.qhead{font-size:.75em;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:.3em}
.q{font-size:1.18em;font-weight:900;margin-bottom:.4em}
/* Scenario */
.sit{background:var(--sunk);border-radius:12px;padding:.8em 1em;margin-bottom:.7em;border-left:6px solid var(--mod)}
.choice{display:block;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:.6em .9em;margin-bottom:.45em}
.choice:hover:not([disabled]){border-color:var(--brand)}
.choice.sel{border-color:var(--brand);background:#FFF8EE}
.choice .cons{display:block;margin-top:.35em;font-size:.88em}
.sc{display:inline-block;font-size:.72em;font-weight:900;border-radius:999px;padding:.1em .6em;margin-right:.4em;vertical-align:middle}
.sc2{background:var(--ok-s);color:var(--ok)}.sc1{background:#FFF3D6;color:#7A5200}.sc0{background:var(--ko-s);color:var(--ko)}
/* Sort */
.sortrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6em;align-items:center;border:1px solid var(--line);border-radius:12px;padding:.5em .7em;margin-bottom:.45em}
.sortrow.ok{border-color:var(--ok);background:var(--ok-s)}.sortrow.ko{border-color:var(--ko);background:var(--ko-s)}
.seg{display:flex;flex-wrap:wrap;gap:.3em;justify-content:flex-end}
.seg button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:.25em .8em;font-size:.82em;font-weight:700}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
@container (max-width:760px){.sortrow{grid-template-columns:1fr}.seg{justify-content:flex-start}}
/* Recap & end */
.recap .card{border-left:6px solid var(--brand)}
.recap .card .k{font-weight:900;color:var(--brand-d);font-size:1.4em;line-height:1}
.end{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:1.4em;align-items:start}
@container (max-width:760px){.end{grid-template-columns:1fr}}
.res{border:2px dashed var(--brand);border-radius:14px;padding:1em;background:#FFFBF5}
.res ul{margin:.4em 0 .8em;padding-left:1.2em}
.score{display:flex;align-items:baseline;gap:.4em}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:.4em 0}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.low i{background:var(--ko)}
table.br{width:100%;border-collapse:collapse;font-size:.9em}
table.br td,table.br th{padding:.4em .5em;border-bottom:1px solid var(--line);text-align:left}
table.br th{font-size:.75em;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.preview{position:absolute;right:clamp(14px,2.4cqw,34px);bottom:clamp(56px,6cqw,80px);background:#5b45c9;color:#fff;font-size:11px;border-radius:6px;padding:3px 8px;opacity:.85;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fd .25s ease-out}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="band" aria-hidden="true"></div>
  <header class="top">
    <div class="crumb" id="crumb"></div>
    <div class="prog" aria-hidden="true"><i id="progbar"></i></div>
    <button class="menu" id="menuBtn" type="button">Sommaire</button>
    <img class="logo" src="assets/logo-dark.png" alt="Éco-Consultant">
  </header>
  <main id="main" tabindex="-1" aria-live="polite"></main>
  <footer class="nav">
    <span class="count" id="count"></span>
    <span class="hint" id="hint"></span>
    <button class="btn ghost" id="prevBtn" type="button">← Précédent</button>
    <button class="btn prim" id="nextBtn" type="button">Suivant →</button>
  </footer>
  <div class="sr" id="live" aria-live="assertive"></div>
</div>
<script src="scorm.js"></script>
<script src="data.js"></script>
<script src="player.js"></script>
</body>
</html>
